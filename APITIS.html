<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Thi Tiếng Anh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            textMuted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(71, 85, 105, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        
        .option-btn { transition: all 0.2s ease; }
        .option-btn.correct {
            border-color: #10b981 !important;
            background-color: #ecfdf5 !important;
            color: #065f46 !important;
        }
        .dark .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2) !important;
            color: #34d399 !important;
        }
        .option-btn.incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #991b1b !important;
        }
        .dark .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #818cf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-recording { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .criteria-item {
            transition: opacity 0.3s ease, height 0.3s ease, padding 0.3s ease;
            overflow: hidden;
        }
        .criteria-hidden {
            opacity: 0; height: 0; padding-top: 0 !important; padding-bottom: 0 !important; margin: 0 !important; border: none !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-dark-text min-h-screen flex flex-col font-sans transition-colors duration-300" onload="app.init()">

    <nav class="bg-indigo-600 dark:bg-slate-900 text-white shadow-lg sticky top-0 z-50 transition-colors duration-300 border-b border-indigo-700 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer group" onclick="app.navigate('home')">
                    <div class="bg-white/20 p-2 rounded-xl mr-3 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-graduation-cap text-xl"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-xl tracking-tight block leading-none">HỆ THỐNG LUYỆN THI</span>
                        <span class="text-[10px] opacity-80 uppercase tracking-widest font-semibold">Hiện đại & Tối ưu</span>
                    </div>
                </div>
                
                <!-- Main Nav Links -->
                <div class="flex items-center space-x-1 sm:space-x-3 text-sm font-medium">
                    <button onclick="app.navigate('vocab_book')" class="hover:bg-white/10 px-3 py-2 rounded-xl transition-colors flex items-center">
                        <i class="fas fa-book-bookmark mr-1.5 text-yellow-300"></i> <span class="hidden sm:inline">Sổ tay</span>
                    </button>
                    <button onclick="app.navigate('history')" class="hover:bg-white/10 px-3 py-2 rounded-xl transition-colors flex items-center">
                        <i class="fas fa-clock-rotate-left mr-1.5 text-cyan-300"></i> <span class="hidden sm:inline">Lịch sử</span>
                    </button>
                    <button onclick="app.navigate('grading_criteria')" class="hover:bg-white/10 px-3 py-2 rounded-xl transition-colors flex items-center">
                        <i class="fas fa-clipboard-check mr-1.5 text-emerald-300"></i> <span class="hidden md:inline">Tiêu chí</span>
                    </button>
                    <button onclick="app.navigate('admin_dashboard')" class="hover:bg-white/10 px-3 py-2 rounded-xl transition-colors flex items-center text-amber-300 hover:text-amber-100">
                        <i class="fas fa-sliders mr-1.5"></i> <span class="hidden sm:inline">Quản trị</span>
                    </button>
                    
                    <div class="w-px h-6 bg-indigo-400 dark:bg-slate-700 mx-1"></div>
                    
                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle" onclick="app.toggleTheme()" class="hover:bg-white/10 p-2 rounded-full transition-colors w-10 h-10 flex items-center justify-center">
                        <i class="fas fa-moon text-lg" id="theme-icon"></i>
                    </button>
                    
                    <!-- User Status -->
                    <div id="user-status" class="hidden lg:flex text-xs bg-black/20 px-3 py-1.5 rounded-full items-center font-mono">
                        <i class="fas fa-circle-notch fa-spin mr-2"></i> Kết nối...
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic views render here -->
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8AVoyDEpY2U5migHCQ_r7DEOC5QYkqMI",
            authDomain: "luyentap-2f2ab.firebaseapp.com",
            databaseURL: "https://luyentap-2f2ab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luyentap-2f2ab",
            storageBucket: "luyentap-2f2ab.firebasestorage.app",
            messagingSenderId: "646969953114",
            appId: "1:646969953114:web:71dd282afdb53d02924163"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'engtest-pro';
        const sysFirebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;

        const firebaseApp = initializeApp(sysFirebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const CATEGORIES = {
            grammar: { 
                id: 'grammar', name: 'Grammar & Vocabulary', icon: 'fa-spell-check', 
                color: 'bg-blue-600', textClass: 'text-blue-600', timeLimit: 1500,
                desc: 'Phần Trắc nghiệm Ngữ pháp và Ghép từ/Định nghĩa Từ vựng.<br>Thời gian: 25 phút.'
            },
            reading: { 
                id: 'reading', name: 'Reading', icon: 'fa-book-open', 
                color: 'bg-emerald-600', textClass: 'text-emerald-600', timeLimit: 2400,
                desc: 'Đọc hiểu đoạn văn. Một đoạn văn chứa nhiều câu hỏi (mỗi câu 3 đáp án).<br>Thời gian: 40 phút.'
            },
            listening: { 
                id: 'listening', name: 'Listening', icon: 'fa-headphones', 
                color: 'bg-purple-600', textClass: 'text-purple-600', timeLimit: null,
                desc: 'Chỉ được nghe tối đa 2 lần cho mỗi bài nghe.'
            },
            writing: { 
                id: 'writing', name: 'Writing', icon: 'fa-pen-nib', 
                color: 'bg-orange-600', textClass: 'text-orange-600', timeLimit: null,
                desc: 'Part 1: 3 câu hỏi ngắn (1-5 từ hoặc 20-30 từ). Part 2: Viết thư/email (120-150 từ).'
            },
            speaking: { 
                id: 'speaking', name: 'Speaking', icon: 'fa-microphone', 
                color: 'bg-rose-600', textClass: 'text-rose-600', timeLimit: null,
                desc: 'Part 1: 3 câu hỏi đơn. Part 2: 1 ảnh & câu phụ. Part 3: 2 ảnh so sánh. Có ghi âm.'
            }
        };
        
        window.app = {
            state: {
                currentView: 'home',
                activeCategory: 'grammar',
                user: null,
                darkMode: false,
                timerInterval: null,
                remainingSeconds: 0,
                historyRecords: [], 
                adminQuestions: [], 
                
                isTesting: false, // Prevents accidental reloads/navigation

                mediaRecorder: null,
                audioChunks: [],
                isRecording: false,

                test: {
                    questions: [], currentIndex: 0, answers: [], 
                    writingAnswers: [], speakingAudioBlobs: [], listeningPlayCounts: [], 
                    startTime: null, isReviewMode: false
                }
            },
            
            readingQCounter: 0,

            init: async function() {
                this.initTheme();
                this.renderLoading("Đang khởi tạo hệ thống thi...");
                
                // Prevent accidental page reloads while testing
                window.addEventListener('beforeunload', (e) => {
                    if (this.state.isTesting) {
                        e.preventDefault();
                        e.returnValue = 'Bạn đang làm bài thi. Dữ liệu chưa lưu sẽ bị mất.';
                        return e.returnValue;
                    }
                });
                
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        this.state.user = user;
                        const statusEl = document.getElementById('user-status');
                        
                        if (user) {
                            statusEl.innerHTML = `<i class="fas fa-user-check text-emerald-400 mr-1.5"></i> ${user.uid.substring(0, 6)}`;
                            if (this.state.currentView === 'home') this.navigate('home', {}, true);
                        } else {
                            statusEl.innerHTML = `<i class="fas fa-exclamation-circle text-rose-400 mr-1.5"></i> Lỗi Auth`;
                        }
                    });
                } catch (error) {
                    console.error("Auth init error:", error);
                    this.showNotification("Lỗi kết nối tài khoản", "error");
                }
            },

            showModal: function(title, content) {
                const modal = document.getElementById('modal-container');
                modal.innerHTML = `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                        <div class="bg-white dark:bg-dark-bg w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col border border-gray-200 dark:border-dark-border">
                            <div class="px-6 py-4 border-b border-gray-100 dark:border-dark-border flex justify-between items-center bg-gray-50/50 dark:bg-dark-panel/50">
                                <h3 class="font-extrabold text-lg text-gray-900 dark:text-white">${title}</h3>
                                <button onclick="app.closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 transition-colors">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="p-6 overflow-y-auto custom-scrollbar">
                                ${content}
                            </div>
                        </div>
                    </div>
                `;
            },
            closeModal: function() { document.getElementById('modal-container').innerHTML = ''; },
            
            showNotification: function(msg, type = 'info') {
                const colors = { success: 'bg-emerald-500', error: 'bg-rose-500', warning: 'bg-amber-500', info: 'bg-indigo-500' };
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
                
                const notif = document.createElement('div');
                notif.className = `fixed bottom-6 right-6 ${colors[type]} text-white px-5 py-3.5 rounded-xl shadow-xl font-medium flex items-center gap-3 z-[200] transform transition-all duration-300 translate-y-10 opacity-0 border border-white/20`;
                notif.innerHTML = `<i class="fas ${icons[type]} text-lg"></i> ${msg}`;
                document.body.appendChild(notif);
                
                requestAnimationFrame(() => notif.classList.remove('translate-y-10', 'opacity-0'));
                setTimeout(() => {
                    notif.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => notif.remove(), 300);
                }, 3000);
            },
            
            showConfirm: function(title, msg) {
                return new Promise((resolve) => {
                    this.showModal(title, `
                        <div class="text-center py-4">
                            <div class="w-16 h-16 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center mx-auto mb-4 text-2xl">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <p class="text-gray-700 dark:text-gray-300 mb-6 font-medium">${msg}</p>
                            <div class="flex justify-center gap-3">
                                <button id="btn-cancel-confirm" class="px-5 py-2.5 bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-xl font-bold transition-colors">Hủy</button>
                                <button id="btn-ok-confirm" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold shadow-md transition-colors">Đồng ý</button>
                            </div>
                        </div>
                    `);
                    
                    document.getElementById('btn-cancel-confirm').onclick = () => { this.closeModal(); resolve(false); };
                    document.getElementById('btn-ok-confirm').onclick = () => { this.closeModal(); resolve(true); };
                });
            },
            
            renderLoading: function(msg) {
                document.getElementById('app-content').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-[50vh] fade-in">
                        <div class="loader mb-4"></div>
                        <p class="text-gray-500 dark:text-gray-400 font-medium">${msg}</p>
                    </div>
                `;
            },

            initTheme: function() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.state.darkMode = true;
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fas fa-sun text-amber-300';
                } else {
                    this.state.darkMode = false;
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fas fa-moon text-white';
                }
            },

            toggleTheme: function() {
                this.state.darkMode = !this.state.darkMode;
                const icon = document.getElementById('theme-icon');
                if (this.state.darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                    icon.className = 'fas fa-sun text-amber-300';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                    icon.className = 'fas fa-moon text-white';
                }
            },

            getPublicRef: function(colName) { return collection(db, 'artifacts', appId, 'public', 'data', colName); },
            getPrivateRef: function(colName) { 
                if (!this.state.user) throw new Error("Chưa xác thực người dùng");
                return collection(db, 'artifacts', appId, 'users', this.state.user.uid, colName); 
            },

            shuffleArray: function(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            shuffleQuestionOptions: function(q) {
                if (!q.options || q.options.length === 0) return q;
                const originalCorrectText = q.options[q.correctAnswer];
                let shuffledOptions = this.shuffleArray([...q.options]);
                const newCorrectIndex = shuffledOptions.indexOf(originalCorrectText);
                return { ...q, options: shuffledOptions, correctAnswer: newCorrectIndex };
            },

            stopTimer: function() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            },

            startTimer: function(durationSeconds) {
                this.stopTimer();
                this.state.remainingSeconds = durationSeconds;
                
                this.state.timerInterval = setInterval(() => {
                    this.state.remainingSeconds--;
                    const timerEl = document.getElementById('test-timer-display');
                    
                    if (timerEl) {
                        const m = Math.floor(this.state.remainingSeconds / 60);
                        const s = this.state.remainingSeconds % 60;
                        timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        
                        if (this.state.remainingSeconds <= 300) {
                            timerEl.classList.add('text-rose-600', 'animate-pulse');
                        }
                    }

                    if (this.state.remainingSeconds <= 0) {
                        this.stopTimer();
                        this.showNotification("Đã hết thời gian làm bài! Tự động nộp bài...", "warning");
                        setTimeout(() => this.finishTest(), 1500);
                    }
                }, 1000);
            },

            navigate: async function(view, params = {}, force = false) {
                // Check if user is trying to leave an active test
                if (!force && this.state.isTesting && !['test_run', 'test_run_review'].includes(view)) {
                    const confirmLeave = await this.showConfirm("Cảnh báo thoát", "Bạn đang làm bài thi. Tiến trình và dữ liệu sẽ không được lưu nếu bạn rời đi. Bạn có chắc chắn muốn thoát?");
                    if (!confirmLeave) return;
                    this.state.isTesting = false; // Granted permission to leave
                }

                this.stopTimer();
                if (this.state.isRecording) this.stopAudioRecording();
                if (params.category) this.state.activeCategory = params.category;

                this.state.currentView = view;
                const contentArea = document.getElementById('app-content');

                switch(view) {
                    case 'home': contentArea.innerHTML = this.views.home(); break;
                    case 'admin_dashboard': contentArea.innerHTML = this.views.adminDashboard(); break;
                    case 'admin_manage': this.loadAdminQuestions(this.state.activeCategory); break;
                    case 'test_start': contentArea.innerHTML = this.views.testStart(this.state.activeCategory); break;
                    case 'test_run': this.startTestSession(this.state.activeCategory); break;
                    case 'test_run_review': this.renderCurrentQuestion(); break;
                    case 'history': this.loadHistory(); break;
                    case 'vocab_book': this.loadVocabBook(); break;
                    case 'grading_criteria': contentArea.innerHTML = this.views.gradingCriteria(); break;
                }
            },

            startTestSession: async function(categoryId) {
                this.renderLoading("Đang nạp bộ đề thi...");
                
                try {
                    let rawQuestions = [];
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    snapshot.forEach(doc => rawQuestions.push({ id: doc.id, ...doc.data() }));

                    if (rawQuestions.length === 0) {
                        this.showNotification("Chưa có câu hỏi cho phần thi này", "warning");
                        this.navigate('test_start', { category: categoryId });
                        return;
                    }

                    let preparedQuestions = [];

                    if (categoryId === 'grammar') {
                        let grammarPart = rawQuestions.filter(q => q.subType === 'grammar' || !q.subType);
                        let vocabMatch1 = rawQuestions.filter(q => q.subType === 'vocab_matching_p1');
                        let vocabMatch2 = rawQuestions.filter(q => q.subType === 'vocab_matching_p2');

                        grammarPart = this.shuffleArray(grammarPart).map(q => this.shuffleQuestionOptions(q));
                        grammarPart = grammarPart.map(q => ({ ...q, part: 'Grammar' }));

                        const createVocabGroups = (pool, pNum) => {
                            pool = this.shuffleArray(pool);
                            let groups = [];
                            while (pool.length > 0) {
                                let count = Math.min(5, pool.length);
                                let selected = pool.splice(0, count);
                                let targetSubType = pNum === 1 ? 'vocab_matching_p1' : 'vocab_matching_p2';
                                let otherPool = rawQuestions.filter(q => q.subType === targetSubType && !selected.find(s => s.id === q.id));
                                otherPool = this.shuffleArray(otherPool);
                                
                                let dummies = otherPool.slice(0, 10 - count);
                                let allOptions = this.shuffleArray([...selected.map(s => s.target), ...dummies.map(d => d.target)]);
                                
                                groups.push({
                                    isVocabMatching: true, subType: targetSubType, part: pNum === 1 ? 'Vocab Part 1' : 'Vocab Part 2',
                                    pairs: selected.map(s => ({ word: s.word, target: s.target })), options: allOptions
                                });
                            }
                            return groups;
                        };

                        preparedQuestions = [...grammarPart, ...createVocabGroups(vocabMatch1, 1), ...createVocabGroups(vocabMatch2, 2)];
                    } else if (categoryId === 'reading') {
                        rawQuestions.sort((a, b) => (new Date(a.createdAt) - new Date(b.createdAt))); 
                        rawQuestions.forEach(doc => {
                            let subQs = doc.subQuestions || [];
                            if (subQs.length === 0 && doc.text) {
                                subQs = [{ text: doc.text, options: doc.options, correctAnswer: doc.correctAnswer, explanation: doc.explanation }];
                            }
                            subQs.forEach((subQ, idx) => {
                                preparedQuestions.push(this.shuffleQuestionOptions({
                                    id: `${doc.id}_${idx}`, passageId: doc.id, passageTitle: doc.passageTitle, passage: doc.passage,
                                    isReadingGroup: true, subQuestionIndex: idx, totalSubQuestions: subQs.length,
                                    text: subQ.text, options: subQ.options, correctAnswer: subQ.correctAnswer, explanation: subQ.explanation
                                }));
                            });
                        });
                    } else if (categoryId === 'speaking' || categoryId === 'writing') {
                        preparedQuestions = rawQuestions.sort((a, b) => (a.part || 1) - (b.part || 1));
                    } else {
                        preparedQuestions = this.shuffleArray(rawQuestions).map(q => this.shuffleQuestionOptions(q));
                    }

                    this.state.test = {
                        questions: preparedQuestions, currentIndex: 0,
                        answers: new Array(preparedQuestions.length).fill(null),
                        writingAnswers: new Array(preparedQuestions.length).fill(''),
                        speakingAudioBlobs: new Array(preparedQuestions.length).fill(null),
                        listeningPlayCounts: new Array(preparedQuestions.length).fill(0),
                        startTime: new Date(), isReviewMode: false
                    };
                    
                    this.state.isTesting = true;

                    if (CATEGORIES[categoryId].timeLimit) this.startTimer(CATEGORIES[categoryId].timeLimit);
                    this.renderCurrentQuestion();

                } catch (error) {
                    console.error("Test start error:", error);
                    this.showNotification("Không thể khởi tạo bài thi", "error");
                    this.navigate('home', {}, true);
                }
            },

            handleAudioEnded: function(qIndex) {
                const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                const played = this.state.test.listeningPlayCounts[qIndex] || 0;
                if (btnText) btnText.innerText = played >= 2 ? 'Đã Hết Lượt Nghe' : 'Phát Lại Audio';
                
                const btn = document.getElementById(`play-btn-${qIndex}`);
                if (btn && played >= 2) {
                    btn.disabled = true;
                    btn.className = 'px-6 py-3 bg-gray-400 text-white font-bold rounded-2xl cursor-not-allowed opacity-60 flex items-center';
                }
            },
            handleAudioError: function(qIndex) { this.showNotification("Lỗi tải file audio.", "error"); },

            playListeningAudio: function(qIndex) {
                const test = this.state.test;
                const played = test.listeningPlayCounts[qIndex] || 0;
                if (played >= 2) return this.showNotification("Bạn đã hết 2 lượt nghe!", "warning");

                const audioEl = document.getElementById(`audio-player-${qIndex}`);
                if (audioEl && audioEl.paused) {
                    audioEl.currentTime = 0;
                    audioEl.play().then(() => {
                        test.listeningPlayCounts[qIndex] = played + 1;
                        const counterText = document.getElementById(`play-counter-${qIndex}`);
                        const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                        if (counterText) counterText.innerText = `Đã nghe ${test.listeningPlayCounts[qIndex]}/2 lần`;
                        if (btnText) btnText.innerText = 'Đang phát...';
                    }).catch(() => this.showNotification("Không thể phát audio.", "error"));
                }
            },

            toggleAudioRecording: async function() {
                if (this.state.isRecording) this.stopAudioRecording();
                else await this.startAudioRecording();
            },

            startAudioRecording: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.state.audioChunks = [];
                    this.state.mediaRecorder = new MediaRecorder(stream);

                    this.state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) this.state.audioChunks.push(e.data); };
                    this.state.mediaRecorder.onstop = () => {
                        const reader = new FileReader();
                        reader.readAsDataURL(new Blob(this.state.audioChunks, { type: 'audio/webm' }));
                        reader.onloadend = () => {
                            const b64 = reader.result;
                            const idx = this.state.test.currentIndex;
                            this.state.test.speakingAudioBlobs[idx] = b64;
                            this.state.test.answers[idx] = { selected: true, isCorrect: true };
                            
                            const preview = document.getElementById('audio-recording-preview');
                            if (preview) { preview.src = b64; preview.classList.remove('hidden'); }
                            this.showNotification("Đã lưu ghi âm!", "success");
                        };
                    };
                    this.state.mediaRecorder.start();
                    this.state.isRecording = true;

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-stop text-white mr-2"></i> Dừng Ghi Âm';
                        recBtn.className = 'px-6 py-3 bg-rose-600 text-white font-bold rounded-2xl pulse-recording flex items-center shadow-lg';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '🔴 Đang ghi âm...';
                } catch (err) { this.showNotification("Lỗi Micro.", "error"); }
            },

            stopAudioRecording: function() {
                if (this.state.mediaRecorder && this.state.isRecording) {
                    this.state.mediaRecorder.stop();
                    this.state.isRecording = false;
                    this.state.mediaRecorder.stream.getTracks().forEach(t => t.stop());

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-microphone text-white mr-2"></i> Ghi Âm Lại';
                        recBtn.className = 'px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl flex items-center shadow-md hover:bg-indigo-700';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '✅ Đã ghi âm xong.';
                }
            },

            selectOption: function(optionIndex) {
                const test = this.state.test;
                if (test.answers[test.currentIndex] !== null || test.isReviewMode) return;

                const question = test.questions[test.currentIndex];
                const isCorrect = (optionIndex === question.correctAnswer);
                test.answers[test.currentIndex] = { selected: optionIndex, isCorrect: isCorrect };

                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach((btn, idx) => {
                    btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50', 'dark:hover:border-indigo-500', 'dark:hover:bg-indigo-900/20', 'cursor-pointer');
                    btn.classList.add('cursor-default');
                    btn.onclick = null;
                    const iconBox = btn.querySelector('.icon-container');
                    
                    if (idx === question.correctAnswer) {
                        btn.classList.add('correct');
                        iconBox.innerHTML = '<i class="fas fa-check"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else if (idx === optionIndex && !isCorrect) {
                        btn.classList.add('incorrect');
                        iconBox.innerHTML = '<i class="fas fa-times"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });
            },

            selectVocabMatching: function(pairIndex, value) {
                const test = this.state.test;
                if (test.isReviewMode) return;
                if (!test.answers[test.currentIndex]) test.answers[test.currentIndex] = { selected: [], isCorrect: false };
                test.answers[test.currentIndex].selected[pairIndex] = value;
            },

            saveWritingInput: function(val) {
                const test = this.state.test;
                test.writingAnswers[test.currentIndex] = val;
                const wordCount = val.trim() ? val.trim().split(/\s+/).length : 0;
                const counterEl = document.getElementById('word-counter');
                if (counterEl) counterEl.innerText = `${wordCount} từ`;
                test.answers[test.currentIndex] = { selected: true, isCorrect: true };
            },

            renderCurrentQuestion: function() {
                const test = this.state.test;
                const question = test.questions[test.currentIndex];
                if (!question) return this.finishTest();

                document.getElementById('app-content').innerHTML = this.views.testInterface(
                    question, test.currentIndex, test.questions.length, CATEGORIES[this.state.activeCategory], test.answers[test.currentIndex]
                );
            },

            nextQuestion: function() {
                if (this.state.isRecording) this.stopAudioRecording();
                const test = this.state.test;
                const currentQ = test.questions[test.currentIndex];

                if (currentQ.isVocabMatching) {
                    const ans = test.answers[test.currentIndex];
                    if (!ans || !ans.selected || ans.selected.filter(x => x).length < currentQ.pairs.length) {
                        return this.showNotification(`Vui lòng ghép đủ từ`, "warning");
                    }
                } else if (!['writing', 'speaking'].includes(this.state.activeCategory) && test.answers[test.currentIndex] === null) {
                    return this.showNotification("Vui lòng chọn đáp án", "warning");
                }

                test.currentIndex++;
                if (test.currentIndex >= test.questions.length) this.finishTest();
                else this.renderCurrentQuestion();
            },

            prevQuestion: function() {
                if (this.state.isRecording) this.stopAudioRecording();
                const test = this.state.test;
                if (test.currentIndex > 0) {
                    test.currentIndex--;
                    this.renderCurrentQuestion();
                }
            },

            finishTest: async function() {
                this.stopTimer();
                if (this.state.isRecording) this.stopAudioRecording();
                this.state.isTesting = false; // Mark test as finished
                this.renderLoading("Đang lưu bài thi...");
                
                const test = this.state.test;
                let correctCount = 0, total = 0;

                test.questions.forEach((q, i) => {
                    const ans = test.answers[i];
                    if (q.isVocabMatching) {
                        total += q.pairs.length;
                        if (ans && ans.selected) {
                            ans.selected.forEach((sel, idx) => { if (sel === q.pairs[idx].target) correctCount++; });
                        }
                    } else {
                        total += 1;
                        if (ans && ans.isCorrect) correctCount++;
                    }
                });

                const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 100;
                const timeTakenSec = Math.round((new Date() - test.startTime) / 1000);

                const record = {
                    categoryId: this.state.activeCategory, categoryName: CATEGORIES[this.state.activeCategory].name,
                    correctCount, totalQuestions: total, score: percentage, timeTakenSec,
                    date: new Date().toISOString(), questions: test.questions, answers: test.answers,
                    writingAnswers: test.writingAnswers, speakingAudioBlobs: test.speakingAudioBlobs
                };

                try {
                    await addDoc(this.getPrivateRef('test_history'), record);
                } catch (e) { console.error("Lỗi lưu:", e); }

                this.renderResultScreen(correctCount, total, percentage, timeTakenSec);
            },

                document.getElementById('app-content').innerHTML = `

                            ${['writing', 'speaking'].includes(cat.id) ? `

                                <div class="bg-gray-50 dark:bg-dark-bg p-6 rounded-2xl mb-6 border border-gray-100 dark:border-dark-border">
                                    <div class="text-5xl font-black ${percentage >= 70 ? 'text-emerald-500' : 'text-indigo-600'} mb-2">${percentage}%</div>
                                    <p class="text-sm font-semibold text-gray-600 dark:text-gray-400">Đúng ${correct} / ${total} câu</p>
                                    <p class="text-xs text-gray-400 mt-1">Thời gian: ${timeStr}</p>
                                </div>
                            `}

                            <div class="flex flex-col sm:flex-row justify-center gap-3">
                                <button onclick="app.navigate('home', {}, true)" class="px-6 py-3 bg-gray-100 dark:bg-dark-bg text-gray-700 dark:text-gray-300 rounded-xl font-bold hover:bg-gray-200">
                                    Trang chủ
                                </button>
                                <button onclick="app.startTestSession('${cat.id}')" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-lg">
                                    Thi lại ngay
                                </button>

                    </div>
                `;
            },

            loadAdminQuestions: async function(categoryId) {
                this.renderLoading(`Đang nạp ngân hàng câu hỏi...`);
                try {
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    let list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));

                    list.sort((a, b) => {
                        const partA = a.part || 1; const partB = b.part || 1;
                        if (partA !== partB) return partA - partB;
                        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                    });

                    this.state.adminQuestions = list;
                    document.getElementById('app-content').innerHTML = this.views.adminManage(categoryId, list);
                } catch (error) {
                    this.showNotification("Lỗi tải câu hỏi", "error");
                    this.navigate('admin_dashboard', {}, true);
                }
            },

            filterAdminQuestions: function(term, categoryId) {
                term = term.toLowerCase().trim();
                const filtered = this.state.adminQuestions.filter(q => {
                    const t = [q.text, q.passage, q.passageTitle, q.word, q.target].map(x => (x || '').toLowerCase()).join(' ');
                    return t.includes(term);
                });
                
                const container = document.getElementById('admin-questions-container');
                const badge = document.getElementById('question-total-badge');
                if (container) container.innerHTML = this.views.adminQuestionList(filtered, categoryId);
                if (badge) badge.innerText = `Tìm thấy: ${filtered.length} câu`;
            },

            saveAdminQuestion: async function(e, categoryId) {
                e.preventDefault();
                const fd = new FormData(e.target);
                const qId = fd.get('qId');
                let data = { updatedAt: new Date().toISOString() };
                if (!qId) data.createdAt = new Date().toISOString();

                if (categoryId === 'grammar') {
                    data.subType = fd.get('subType');
                    if (data.subType === 'grammar') {
                        data.text = fd.get('text');
                        data.options = [fd.get('opt0'), fd.get('opt1'), fd.get('opt2')];
                        data.correctAnswer = parseInt(fd.get('correctAnswer'));
                    } else {
                        data.word = fd.get('word'); data.target = fd.get('target');
                    }
                } else if (categoryId === 'reading') {
                    data.passageTitle = fd.get('passageTitle'); data.passage = fd.get('passage');
                    let subQs = [];
                    document.querySelectorAll('.reading-sub-question').forEach((node, i) => {
                        const cid = node.querySelector('input[type="radio"]').name.split('_')[2];
                        subQs.push({
                            text: fd.getAll('sub_q_text[]')[i],
                            options: [fd.getAll('sub_opt_0[]')[i], fd.getAll('sub_opt_1[]')[i], fd.getAll('sub_opt_2[]')[i]],
                            correctAnswer: parseInt(fd.get(`sub_correct_${cid}`) || '0'),
                            explanation: fd.getAll('sub_explain[]')[i] || ''
                        });
                    });
                    data.subQuestions = subQs;
                } else if (categoryId === 'listening') {
                     data.audioUrl = fd.get('audioUrl'); data.text = fd.get('text');
                     data.options = [fd.get('opt0'), fd.get('opt1'), fd.get('opt2')];
                     data.correctAnswer = parseInt(fd.get('correctAnswer'));
                     data.part = parseInt(fd.get('part') || 1);
                } else if (categoryId === 'writing' || categoryId === 'speaking') {
                     data.part = parseInt(fd.get('part') || 1); data.text = fd.get('text');
                     if (categoryId === 'speaking') data.imageUrl = fd.get('imageUrl') || '';
                }

                try {
                    this.renderLoading('Đang lưu...');
                    if (qId) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `questions_${categoryId}`, qId), data);
                    else await addDoc(this.getPublicRef(`questions_${categoryId}`), data);
                    this.showNotification("Lưu thành công", "success");
                    this.closeModal();
                    this.loadAdminQuestions(categoryId);
                } catch (err) { this.showNotification("Lỗi: " + err.message, "error"); }
            },

            loadHistory: async function() {
                this.renderLoading("Đang tải lịch sử...");
                try {
                    const snap = await getDocs(query(this.getPrivateRef('test_history')));
                    let records = [];
                    snap.forEach(doc => records.push({ id: doc.id, ...doc.data() }));
                    records.sort((a, b) => new Date(b.date) - new Date(a.date));
                    document.getElementById('app-content').innerHTML = this.views.history(records);

            reviewTest: function(record, onlyWrong = false) {
                this.state.activeCategory = record.categoryId;
                let questionsToReview = record.questions;
                let answersToReview = record.answers || [];
                let writingToReview = record.writingAnswers || [];
                let speakingToReview = record.speakingAudioBlobs || [];

                if (onlyWrong) {
                    questionsToReview = [];
                    let newAnswers = [];
                    let newWriting = [];
                    let newSpeaking = [];

                    record.questions.forEach((q, i) => {
                        const ans = record.answers ? record.answers[i] : null;
                        let isCorrect = false;

                        if (q.isVocabMatching) {
                            isCorrect = true;
                            if (!ans || !ans.selected) {
                                isCorrect = false;
                            } else {
                                q.pairs.forEach((p, idx) => {
                                    if (ans.selected[idx] !== p.target) isCorrect = false;
                                });
                            }
                        } else if (['writing', 'speaking'].includes(record.categoryId)) {
                            isCorrect = true; // For subjective parts, they don't count as "wrong" automatically here
                        } else {
                            isCorrect = ans && ans.isCorrect;
                        }

                        if (!isCorrect) {
                            questionsToReview.push(q);
                            newAnswers.push(ans);
                            if (record.writingAnswers) newWriting.push(record.writingAnswers[i]);
                            if (record.speakingAudioBlobs) newSpeaking.push(record.speakingAudioBlobs[i]);
                        }
                    });

                    if (questionsToReview.length === 0) {
                        this.showNotification("Tuyệt vời! Không có câu nào sai để lọc.", "success");
                        return;
                    }
                    
                    answersToReview = newAnswers;
                    writingToReview = newWriting;
                    speakingToReview = newSpeaking;
                }

                this.state.test = {
                    questions: questionsToReview, 
                    answers: answersToReview,
                    writingAnswers: writingToReview, 
                    speakingAudioBlobs: speakingToReview,
                    listeningPlayCounts: [], 
                    currentIndex: 0, 
                    isReviewMode: true,
                    onlyWrong: onlyWrong
                };
                this.navigate('test_run_review');
            },

                testInterface: function(q, index, total, cat, answer) {
                    let html = `
                        <div class="max-w-4xl mx-auto fade-in">

                                            Câu ${index + 1} / ${total} ${q.part ? `<span class="bg-gray-100 dark:bg-slate-700 px-1.5 py-0.5 rounded ml-1 text-[10px]">Part ${q.part}</span>` : ''}

                                </div>
                                ${cat.timeLimit && !app.state.test.isReviewMode ? `

                                        <i class="fas fa-hourglass-half mr-2 text-indigo-500"></i><span id="test-timer-display">--:--</span>

                                <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: ${((index) / total) * 100}%"></div>
                            </div>
                    `;

                    if (q.isReadingGroup) {
                        html += `
                            <div class="flex flex-col lg:flex-row gap-6 mb-8">
                                <div class="lg:w-1/2 bg-white dark:bg-dark-panel border border-gray-200 dark:border-dark-border p-6 rounded-2xl shadow-sm h-[500px] flex flex-col">
                                    <h4 class="font-bold text-lg text-indigo-700 dark:text-indigo-400 mb-4 border-b border-gray-100 dark:border-dark-border pb-2">${q.passageTitle}</h4>

                                </div>
                                <div class="lg:w-1/2">
                                    <div class="bg-indigo-50 dark:bg-slate-800 p-5 rounded-2xl mb-6"><p class="font-semibold text-gray-800 dark:text-white"><span class="text-indigo-600 mr-2">[Câu ${q.subQuestionIndex + 1}/${q.totalSubQuestions}]</span> ${q.text}</p></div>
                                    <div class="space-y-3">
                                        ${q.options.map((opt, i) => `
                                            <button onclick="app.selectOption(${i})" class="option-btn w-full text-left p-4 rounded-2xl border-2 ${answer && answer.selected === i ? (answer.isCorrect ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : 'border-rose-500 bg-rose-50 dark:bg-rose-900/20') : 'border-gray-200 dark:border-dark-border bg-white dark:bg-dark-panel'} flex items-center transition-colors shadow-sm">

                                                <span class="font-medium">${opt}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        `;
                    } else if (q.isVocabMatching) {
                        html += `
                            <div class="bg-white dark:bg-dark-panel p-6 sm:p-8 rounded-3xl shadow-sm mb-8 border border-gray-200 dark:border-dark-border">

                                                    <option value="">-- Chọn đáp án --</option>
                                                    ${q.options.map(opt => `<option value="${opt}" ${answer && answer.selected && answer.selected[pIdx] === opt ? 'selected' : ''}>${opt}</option>`).join('')}

                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else if (cat.id === 'listening') {
                         html += `
                            <div class="bg-white dark:bg-dark-panel p-6 sm:p-8 rounded-3xl shadow-sm mb-8 text-center border border-gray-200 dark:border-dark-border">

                                            <div class="icon-container w-8 h-8 rounded-full border-2 ${answer && answer.selected === i ? 'border-transparent' : 'border-gray-300'} text-gray-500 font-bold flex items-center justify-center mr-4 shrink-0 transition-colors">${String.fromCharCode(65+i)}</div>
                                            <span class="font-medium">${opt}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else if (cat.id === 'writing') {
                         html += `
                            <div class="bg-white dark:bg-dark-panel p-6 sm:p-8 rounded-3xl shadow-sm mb-8 border border-gray-200 dark:border-dark-border">
                                <div class="bg-orange-50 dark:bg-slate-800 p-5 rounded-2xl mb-6"><p class="font-serif text-lg whitespace-pre-wrap text-gray-800 dark:text-gray-200">${q.text}</p></div>
                                <div class="relative">
                                    <textarea id="writing-input" oninput="app.saveWritingInput(this.value)" ${app.state.test.isReviewMode ? 'disabled' : ''} class="w-full h-64 p-5 rounded-2xl border border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-700/50 font-serif resize-none focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow disabled:opacity-70 disabled:cursor-not-allowed" placeholder="Nhập câu trả lời...">${app.state.test.writingAnswers[index] || ''}</textarea>
                                    <div class="absolute bottom-4 right-4 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold shadow border border-gray-100 dark:border-slate-600"><span id="word-counter">${app.state.test.writingAnswers[index] ? app.state.test.writingAnswers[index].trim().split(/\s+/).length : 0} từ</span></div>
                                </div>
                            </div>
                         `;
                    } else if (cat.id === 'speaking') {
                        html += `
                            <div class="bg-white dark:bg-dark-panel p-6 sm:p-8 rounded-3xl shadow-sm mb-8 flex flex-col items-center border border-gray-200 dark:border-dark-border">
                                ${q.imageUrl ? `<img src="${q.imageUrl}" class="max-h-72 rounded-2xl shadow-md mb-6 object-cover border border-gray-200 dark:border-slate-700">` : ''}
                                <div class="w-full bg-rose-50 dark:bg-slate-800 p-5 rounded-2xl mb-8 text-center"><p class="font-serif text-xl font-medium text-gray-800 dark:text-gray-200">${q.text}</p></div>
                                <div class="flex flex-col items-center p-8 bg-gray-50 dark:bg-slate-800/50 w-full rounded-2xl border border-gray-200 dark:border-slate-700">
                                    ${!app.state.test.isReviewMode ? `
                                        <button id="record-mic-btn" onclick="app.toggleAudioRecording()" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg mb-4 flex items-center text-lg transition-transform transform active:scale-95"><i class="fas fa-microphone mr-3"></i> Bắt đầu Ghi Âm</button>
                                        <p id="recording-status-text" class="text-sm font-bold text-gray-500 mb-4">Nhấn nút để bắt đầu ghi âm.</p>

                                    ${app.state.test.isReviewMode && !app.state.test.speakingAudioBlobs[index] ? '<p class="text-gray-400 italic">Không có bản ghi âm.</p>' : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="bg-white dark:bg-dark-panel p-6 sm:p-8 rounded-3xl shadow-sm mb-8 border border-gray-200 dark:border-dark-border">
                                <div class="bg-blue-50 dark:bg-slate-800 p-6 rounded-2xl mb-8 shadow-inner"><p class="font-semibold text-xl text-gray-800 dark:text-white">${q.text}</p></div>
                                <div class="space-y-4">
                                    ${q.options.map((opt, i) => `
                                        <button onclick="app.selectOption(${i})" class="option-btn w-full text-left p-5 rounded-2xl border-2 ${answer && answer.selected === i ? (answer.isCorrect ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : 'border-rose-500 bg-rose-50 dark:bg-rose-900/20') : 'border-gray-200 dark:border-dark-border bg-white dark:bg-dark-panel'} flex items-center transition-colors shadow-sm">
                                            <div class="icon-container w-10 h-10 rounded-full border-2 ${answer && answer.selected === i ? 'border-transparent' : 'border-gray-300'} text-gray-500 font-bold flex items-center justify-center mr-5 shrink-0 text-base transition-colors">${String.fromCharCode(65+i)}</div>
                                            <span class="text-lg font-medium">${opt}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                    
                    if (app.state.test.isReviewMode && q.explanation) {
                         html += `

                            </div>
                         `;
                    }

                    html += `
                            <div class="flex justify-between bg-gray-50 dark:bg-slate-800 p-4 rounded-2xl border border-gray-200 dark:border-slate-700 shadow-sm items-center">
                                <button onclick="app.prevQuestion()" class="px-6 py-2.5 rounded-xl font-bold bg-white dark:bg-slate-700 text-gray-700 dark:text-gray-200 shadow-sm border border-gray-300 dark:border-slate-600 hover:bg-gray-100 dark:hover:bg-slate-600 transition-colors ${index === 0 ? 'opacity-50 cursor-not-allowed' : ''}"><i class="fas fa-arrow-left mr-2"></i> Câu trước</button>
                                ${app.state.test.isReviewMode ? `
                                    <button onclick="app.navigate('history', {}, true)" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-colors">Đóng lại <i class="fas fa-times ml-2"></i></button>
                                ` : `
                                    <button onclick="app.nextQuestion()" class="px-8 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-colors">${index === total - 1 ? 'Nộp Bài <i class="fas fa-paper-plane ml-2"></i>' : 'Tiếp theo <i class="fas fa-arrow-right ml-2"></i>'}</button>
                                `}
                            </div>
                        </div>
                    `;
                    return html;
                },

                history: function(records) {

                                    <i class="fas fa-home mr-2 text-gray-500"></i> Trang chủ
                                </button>
                            </div>

                    if (records.length === 0) {
                        html += `

                            </div>
                        `;
                    } else {
                        html += `<div class="grid gap-5">`;
                        records.forEach(r => {
                            const date = new Date(r.date);
                            const dateStr = `${date.getDate().toString().padStart(2,'0')}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getFullYear()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                            const correct = r.correctCount || 0;
                            const total = r.totalQuestions || 0;
                            const incorrect = total - correct;
                            const score = r.score || 0;
                            const isPassed = score >= 50;
                            const isSubjective = ['writing', 'speaking'].includes(r.categoryId);

                            const cat = CATEGORIES[r.categoryId] || { icon: 'fa-file', color: 'bg-gray-500', name: r.categoryName || 'Bài thi' };

                            html += `
                                <div class="bg-white dark:bg-dark-panel p-5 rounded-2xl border border-gray-200 dark:border-dark-border shadow-sm flex flex-col lg:flex-row items-center justify-between gap-5 hover:border-indigo-300 dark:hover:border-indigo-600 hover:shadow-md transition-all group">
                                    <div class="flex items-center gap-4 w-full lg:w-auto">
                                        <div class="w-14 h-14 rounded-2xl ${cat.color} text-white flex items-center justify-center text-2xl shrink-0 shadow group-hover:scale-105 transition-transform">
                                            <i class="fas ${cat.icon}"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-lg text-gray-900 dark:text-white mb-0.5">${cat.name}</h4>
                                            <div class="flex items-center gap-4 text-xs font-medium text-gray-500 dark:text-gray-400">
                                                <span><i class="far fa-calendar-alt mr-1"></i> ${dateStr}</span>
                                                <span><i class="fas fa-stopwatch mr-1"></i> ${Math.floor(r.timeTakenSec/60)}p ${r.timeTakenSec%60}s</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="flex flex-wrap sm:flex-nowrap items-center gap-4 w-full lg:w-auto justify-between lg:justify-end">
                                        <div class="flex items-center bg-gray-50 dark:bg-slate-800/50 rounded-xl border border-gray-100 dark:border-slate-700 shadow-inner overflow-hidden">
                                            ${isSubjective ? `
                                                <div class="px-5 py-2.5 text-center bg-emerald-50 dark:bg-emerald-900/20 w-full sm:w-auto">
                                                    <div class="text-[10px] text-emerald-600 dark:text-emerald-400 uppercase font-bold tracking-wider mb-1">Trạng thái</div>
                                                    <div class="font-bold text-emerald-700 dark:text-emerald-300"><i class="fas fa-check-circle mr-1"></i> Đã lưu bài</div>
                                                </div>
                                            ` : `
                                                <div class="px-4 py-2 text-center bg-white dark:bg-slate-800 border-r border-gray-100 dark:border-slate-700 min-w-[70px]">
                                                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-wider mb-1">Điểm</div>
                                                    <div class="font-black text-lg ${isPassed ? 'text-emerald-500' : 'text-rose-500'} leading-none">${score}%</div>
                                                </div>
                                                <div class="px-4 py-2 text-center bg-emerald-50/50 dark:bg-emerald-900/10 border-r border-gray-100 dark:border-slate-700 min-w-[70px]">
                                                    <div class="text-[10px] text-emerald-600 dark:text-emerald-500 uppercase font-bold tracking-wider mb-1">Đúng</div>
                                                    <div class="font-bold text-emerald-600 dark:text-emerald-400 leading-none">${correct}</div>
                                                </div>
                                                <div class="px-4 py-2 text-center bg-rose-50/50 dark:bg-rose-900/10 min-w-[70px]">
                                                    <div class="text-[10px] text-rose-600 dark:text-rose-500 uppercase font-bold tracking-wider mb-1">Sai</div>
                                                    <div class="font-bold text-rose-600 dark:text-rose-400 leading-none">${incorrect}</div>
                                                </div>
                                            `}
                                        </div>
                                        
                                        <div class="flex gap-2 w-full sm:w-auto shrink-0">
                                            <button onclick='app.reviewTest(${JSON.stringify(r).replace(/'/g, "&#39;")}, false)' class="flex-1 sm:flex-none px-4 py-2.5 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-xl font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors shadow-sm text-sm">
                                                Xem lại
                                            </button>
                                            ${!isSubjective ? `
                                            <button onclick='app.reviewTest(${JSON.stringify(r).replace(/'/g, "&#39;")}, true)' class="flex-1 sm:flex-none px-4 py-2.5 bg-rose-50 dark:bg-rose-900/30 text-rose-700 dark:text-rose-300 rounded-xl font-bold hover:bg-rose-100 dark:hover:bg-rose-900/50 transition-colors shadow-sm text-sm flex items-center justify-center whitespace-nowrap" title="Lọc và chỉ hiển thị những câu làm sai">
                                                <i class="fas fa-filter mr-1.5 opacity-70"></i> Câu sai
                                            </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                    return html;
                }
            }
        };

        // Make app accessible globally for onclick handlers
        window.app = app;
    </script>
</body>
</html>
