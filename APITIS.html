<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Thi Tiếng Anh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#121212',
                            panel: '#1E1E1E',
                            border: '#333333',
                            text: '#E0E0E0',
                            textMuted: '#A0A0A0'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .dark .glass-panel {
            background: #1E1E1E;
            border-color: #333333;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .option-btn { transition: all 0.2s ease; }
        .option-btn.correct {
            border-color: #10b981 !important;
            background-color: #ecfdf5 !important;
            color: #065f46 !important;
        }
        .dark .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2) !important;
            color: #34d399 !important;
        }
        .option-btn.incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #991b1b !important;
        }
        .dark .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #818cf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-recording {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-dark-text min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Navigation Bar -->
    <nav class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-lg sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer group" onclick="app.navigate('home')">
                    <div class="bg-white/20 p-2 rounded-xl mr-3 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-graduation-cap text-xl"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-xl tracking-tight block leading-none">HỆ THỐNG LUYỆN THI</span>
                        <span class="text-[10px] opacity-80 uppercase tracking-widest font-semibold">Hiện đại & Tối ưu</span>
                    </div>
                </div>
                
                <!-- Main Nav Links -->
                <div class="flex items-center space-x-1 sm:space-x-3">
                    <button onclick="app.navigate('vocab_book')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center">
                        <i class="fas fa-book-bookmark mr-1.5 text-yellow-300"></i> <span class="hidden sm:inline">Sổ tay</span>
                    </button>
                    <button onclick="app.navigate('history')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center">
                        <i class="fas fa-clock-rotate-left mr-1.5 text-cyan-300"></i> <span class="hidden sm:inline">Lịch sử</span>
                    </button>
                    <button onclick="app.navigate('admin_dashboard')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center text-amber-300 hover:text-amber-100">
                        <i class="fas fa-sliders mr-1.5"></i> <span class="hidden sm:inline">Quản trị</span>
                    </button>
                    
                    <div class="w-px h-6 bg-indigo-400 dark:bg-indigo-600 mx-1"></div>
                    
                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle" onclick="app.toggleTheme()" class="hover:bg-white/10 p-2 rounded-full transition-colors w-10 h-10 flex items-center justify-center">
                        <i class="fas fa-moon text-lg" id="theme-icon"></i>
                    </button>
                    
                    <!-- User Status -->
                    <div id="user-status" class="hidden sm:flex text-xs bg-black/20 px-3 py-1.5 rounded-full items-center font-mono">
                        <i class="fas fa-circle-notch fa-spin mr-2"></i> Kết nối...
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic views will render here -->
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB8AVoyDEpY2U5migHCQ_r7DEOC5QYkqMI",
            authDomain: "luyentap-2f2ab.firebaseapp.com",
            databaseURL: "https://luyentap-2f2ab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luyentap-2f2ab",
            storageBucket: "luyentap-2f2ab.firebasestorage.app",
            messagingSenderId: "646969953114",
            appId: "1:646969953114:web:71dd282afdb53d02924163"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'engtest-pro';
        const sysFirebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;

        const firebaseApp = initializeApp(sysFirebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // System Skill Categories Configuration
        const CATEGORIES = {
            grammar: { 
                id: 'grammar', 
                name: 'Grammar & Vocabulary', 
                icon: 'fa-spell-check', 
                color: 'bg-blue-600', 
                textClass: 'text-blue-600',
                timeLimit: 1500, // 25 min timer
                desc: 'Gồm 2 Part (Part 1: 25 câu Grammar. Part 2: 25 câu Vocabulary). <br>Thời gian: 25 phút.'
            },
            reading: { 
                id: 'reading', 
                name: 'Reading', 
                icon: 'fa-book-open', 
                color: 'bg-emerald-600', 
                textClass: 'text-emerald-600',
                timeLimit: 2400, // 40 min timer
                desc: 'Thời gian: 40 phút.'
            },
            listening: { 
                id: 'listening', 
                name: 'Listening', 
                icon: 'fa-headphones', 
                color: 'bg-purple-600', 
                textClass: 'text-purple-600',
                timeLimit: null, // No time limit
                desc: 'Chỉ được nghe tối đa 2 lần cho mỗi bài nghe.'
            },
            writing: { 
                id: 'writing', 
                name: 'Writing', 
                icon: 'fa-pen-nib', 
                color: 'bg-orange-600', 
                textClass: 'text-orange-600',
                timeLimit: null, // No time limit
                desc: 'Part 1: 3 câu hỏi ngắn (1-5 từ hoặc 20-30 từ). Part 2: Viết thư/email (120-150 từ).'
            },
            speaking: { 
                id: 'speaking', 
                name: 'Speaking', 
                icon: 'fa-microphone', 
                color: 'bg-rose-600', 
                textClass: 'text-rose-600',
                timeLimit: null, // No time limit
                desc: 'Part 1: 3 câu hỏi đơn. Part 2: 1 ảnh & câu phụ. Part 3: 2 ảnh so sánh & câu phụ. Tích hợp ghi âm.'
            }
        };
        
        // Main App Engine & State
        window.app = {
            state: {
                currentView: 'home',
                activeCategory: 'grammar',
                user: null,
                darkMode: false,
                timerInterval: null,
                remainingSeconds: 0,
                historyRecords: [], 
                adminQuestions: [], // Lưu cache câu hỏi để search và edit
                
                // Audio Recorder State for Speaking
                mediaRecorder: null,
                audioChunks: [],
                isRecording: false,

                // Test Session State
                test: {
                    questions: [],
                    currentIndex: 0,
                    answers: [], 
                    writingAnswers: [], 
                    speakingAudioBlobs: [], 
                    listeningPlayCounts: [], 
                    startTime: null,
                    isReviewMode: false
                }
            },

            init: async function() {
                this.initTheme();
                this.renderLoading("Đang khởi tạo hệ thống thi...");
                
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        this.state.user = user;
                        const statusEl = document.getElementById('user-status');
                        
                        if (user) {
                            statusEl.innerHTML = `<i class="fas fa-user-check text-emerald-400 mr-1.5"></i> ${user.uid.substring(0, 6)}`;
                            if (this.state.currentView === 'home') this.navigate('home');
                        } else {
                            statusEl.innerHTML = `<i class="fas fa-exclamation-circle text-rose-400 mr-1.5"></i> Lỗi Auth`;
                        }
                    });
                } catch (error) {
                    console.error("Auth init error:", error);
                    this.showNotification("Lỗi kết nối tài khoản", "error");
                }
            },

            initTheme: function() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.state.darkMode = true;
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fas fa-sun text-amber-300';
                } else {
                    this.state.darkMode = false;
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fas fa-moon text-white';
                }
            },

            toggleTheme: function() {
                this.state.darkMode = !this.state.darkMode;
                const icon = document.getElementById('theme-icon');
                if (this.state.darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                    icon.className = 'fas fa-sun text-amber-300';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                    icon.className = 'fas fa-moon text-white';
                }
            },

            getPublicRef: function(colName) {
                return collection(db, 'artifacts', appId, 'public', 'data', colName);
            },

            getPrivateRef: function(colName) {
                if (!this.state.user) throw new Error("Chưa xác thực người dùng");
                return collection(db, 'artifacts', appId, 'users', this.state.user.uid, colName);
            },

            shuffleArray: function(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            shuffleQuestionOptions: function(q) {
                if (!q.options || q.options.length === 0) return q;
                
                const originalCorrectText = q.options[q.correctAnswer];
                let shuffledOptions = [...q.options];
                shuffledOptions = this.shuffleArray(shuffledOptions);
                const newCorrectIndex = shuffledOptions.indexOf(originalCorrectText);

                return {
                    ...q,
                    options: shuffledOptions,
                    correctAnswer: newCorrectIndex
                };
            },

            stopTimer: function() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            },

            startTimer: function(durationSeconds) {
                this.stopTimer();
                this.state.remainingSeconds = durationSeconds;
                
                this.state.timerInterval = setInterval(() => {
                    this.state.remainingSeconds--;
                    const timerEl = document.getElementById('test-timer-display');
                    
                    if (timerEl) {
                        const m = Math.floor(this.state.remainingSeconds / 60);
                        const s = this.state.remainingSeconds % 60;
                        timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        
                        if (this.state.remainingSeconds <= 300) {
                            timerEl.classList.add('text-rose-600', 'animate-pulse');
                        }
                    }

                    if (this.state.remainingSeconds <= 0) {
                        this.stopTimer();
                        this.showNotification("Đã hết thời gian làm bài! Tự động nộp bài...", "warning");
                        setTimeout(() => this.finishTest(), 1500);
                    }
                }, 1000);
            },

            navigate: function(view, params = {}) {
                this.stopTimer();
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }

                if (params.category) {
                    this.state.activeCategory = params.category;
                }

                this.state.currentView = view;
                const contentArea = document.getElementById('app-content');

                switch(view) {
                    case 'home':
                        contentArea.innerHTML = this.views.home();
                        break;
                    case 'admin_dashboard':
                        contentArea.innerHTML = this.views.adminDashboard();
                        break;
                    case 'admin_manage':
                        this.loadAdminQuestions(this.state.activeCategory);
                        break;
                    case 'test_start':
                        contentArea.innerHTML = this.views.testStart(this.state.activeCategory);
                        break;
                    case 'test_run':
                        this.startTestSession(this.state.activeCategory);
                        break;
                    case 'history':
                        this.loadHistory();
                        break;
                    case 'vocab_book':
                        this.loadVocabBook();
                        break;
                }
            },

            startTestSession: async function(categoryId) {
                this.renderLoading("Đang nạp bộ đề thi...");
                
                try {
                    let rawQuestions = [];
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    
                    snapshot.forEach(doc => rawQuestions.push({ id: doc.id, ...doc.data() }));

                    if (rawQuestions.length === 0) {
                        this.showNotification("Chưa có câu hỏi cho phần thi này", "warning");
                        this.navigate('test_start', { category: categoryId });
                        return;
                    }

                    let preparedQuestions = [];

                    if (categoryId === 'grammar') {
                        let grammarPart = rawQuestions.filter(q => q.subType === 'grammar');
                        let vocabPart = rawQuestions.filter(q => q.subType === 'vocab' || !q.subType);

                        if (grammarPart.length === 0) grammarPart = rawQuestions;
                        if (vocabPart.length === 0) vocabPart = rawQuestions;

                        grammarPart = this.shuffleArray(grammarPart).map(q => this.shuffleQuestionOptions(q));
                        vocabPart = this.shuffleArray(vocabPart).map(q => this.shuffleQuestionOptions(q));

                        preparedQuestions = [
                            ...grammarPart.map(q => ({ ...q, subType: 'grammar' })),
                            ...vocabPart.map(q => ({ ...q, subType: 'vocab' }))
                        ];
                    } else if (categoryId === 'reading') {
                        preparedQuestions = rawQuestions.sort((a, b) => (a.passageId || '').localeCompare(b.passageId || ''));
                        preparedQuestions = preparedQuestions.map(q => this.shuffleQuestionOptions(q));
                    } else if (categoryId === 'speaking' || categoryId === 'writing') {
                        preparedQuestions = rawQuestions.sort((a, b) => (a.part || 1) - (b.part || 1));
                    } else {
                        preparedQuestions = this.shuffleArray(rawQuestions).map(q => this.shuffleQuestionOptions(q));
                    }

                    this.state.test = {
                        questions: preparedQuestions,
                        currentIndex: 0,
                        answers: new Array(preparedQuestions.length).fill(null),
                        writingAnswers: new Array(preparedQuestions.length).fill(''),
                        speakingAudioBlobs: new Array(preparedQuestions.length).fill(null),
                        listeningPlayCounts: new Array(preparedQuestions.length).fill(0),
                        startTime: new Date(),
                        isReviewMode: false
                    };

                    const categoryConfig = CATEGORIES[categoryId];
                    if (categoryConfig.timeLimit) {
                        this.startTimer(categoryConfig.timeLimit);
                    }

                    this.renderCurrentQuestion();

                } catch (error) {
                    console.error("Test start error:", error);
                    this.showNotification("Không thể khởi tạo bài thi", "error");
                    this.navigate('home');
                }
            },

            handleAudioEnded: function(qIndex) {
                const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                if (btnText) {
                    const played = this.state.test.listeningPlayCounts[qIndex] || 0;
                    btnText.innerText = played >= 2 ? 'Đã Hết Lượt Nghe' : 'Phát Lại Audio';
                }
                const btn = document.getElementById(`play-btn-${qIndex}`);
                if (btn && this.state.test.listeningPlayCounts[qIndex] >= 2) {
                    btn.disabled = true;
                    btn.className = 'px-6 py-3 bg-gray-400 text-white font-bold rounded-2xl cursor-not-allowed opacity-60 flex items-center';
                }
            },

            handleAudioError: function(qIndex) {
                this.showNotification("Lỗi tải file audio. Vui lòng kiểm tra lại đường dẫn file mp3.", "error");
            },

            playListeningAudio: function(qIndex) {
                const test = this.state.test;
                const played = test.listeningPlayCounts[qIndex] || 0;

                if (played >= 2) {
                    this.showNotification("Bạn đã hết 2 lượt nghe cho câu hỏi này!", "warning");
                    return;
                }

                const audioEl = document.getElementById(`audio-player-${qIndex}`);
                if (audioEl) {
                    if (!audioEl.paused) {
                        return;
                    }

                    audioEl.currentTime = 0;
                    audioEl.play().then(() => {
                        test.listeningPlayCounts[qIndex] = played + 1;
                        const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                        const counterText = document.getElementById(`play-counter-${qIndex}`);
                        
                        if (counterText) {
                            counterText.innerText = `Đã nghe ${test.listeningPlayCounts[qIndex]}/2 lần`;
                        }

                        if (btnText) {
                            btnText.innerText = 'Đang phát...';
                        }
                    }).catch(e => {
                        console.error("Audio error:", e);
                        this.showNotification("Không thể phát audio. Kiểm tra lại URL.", "error");
                    });
                }
            },

            renderCurrentQuestion: function() {
                const test = this.state.test;
                const question = test.questions[test.currentIndex];
                const cat = CATEGORIES[this.state.activeCategory];

                if (!question) {
                    this.finishTest();
                    return;
                }

                document.getElementById('app-content').innerHTML = this.views.testInterface(
                    question,
                    test.currentIndex,
                    test.questions.length,
                    cat,
                    test.answers[test.currentIndex]
                );
            },

            toggleAudioRecording: async function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                } else {
                    await this.startAudioRecording();
                }
            },

            startAudioRecording: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.state.audioChunks = [];
                    this.state.mediaRecorder = new MediaRecorder(stream);

                    this.state.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            this.state.audioChunks.push(event.data);
                        }
                    };

                    this.state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(this.state.audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            const currentIndex = this.state.test.currentIndex;
                            this.state.test.speakingAudioBlobs[currentIndex] = base64Audio;
                            this.state.test.answers[currentIndex] = { selected: true, isCorrect: true };
                            
                            const audioPreview = document.getElementById('audio-recording-preview');
                            if (audioPreview) {
                                audioPreview.src = base64Audio;
                                audioPreview.classList.remove('hidden');
                            }
                            this.showNotification("Đã ghi âm bài nói thành công!", "success");
                        };
                    };

                    this.state.mediaRecorder.start();
                    this.state.isRecording = true;

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-stop text-white mr-2"></i> Dừng Ghi Âm';
                        recBtn.className = 'px-6 py-3 bg-rose-600 text-white font-bold rounded-2xl pulse-recording flex items-center shadow-lg';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '🔴 Đang ghi âm bài nói của bạn... Hãy phát âm rõ ràng.';

                } catch (err) {
                    console.error("Mic Error:", err);
                    this.showNotification("Không thể kết nối Micro. Vui lòng cấp quyền truy cập Mic.", "error");
                }
            },

            stopAudioRecording: function() {
                if (this.state.mediaRecorder && this.state.isRecording) {
                    this.state.mediaRecorder.stop();
                    this.state.isRecording = false;
                    this.state.mediaRecorder.stream.getTracks().forEach(track => track.stop());

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-microphone text-white mr-2"></i> Ghi Âm Lại';
                        recBtn.className = 'px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl flex items-center shadow-md hover:bg-indigo-700';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '✅ Đã hoàn thành ghi âm.';
                }
            },

            selectOption: function(optionIndex) {
                const test = this.state.test;
                if (test.answers[test.currentIndex] !== null || test.isReviewMode) return;

                const question = test.questions[test.currentIndex];
                const isCorrect = (optionIndex === question.correctAnswer);

                test.answers[test.currentIndex] = {
                    selected: optionIndex,
                    isCorrect: isCorrect
                };

                this.applyFeedbackStyles(question, optionIndex, isCorrect);
            },

            saveWritingInput: function(val) {
                const test = this.state.test;
                test.writingAnswers[test.currentIndex] = val;
                
                const wordCount = val.trim() ? val.trim().split(/\s+/).length : 0;
                const counterEl = document.getElementById('word-counter');
                if (counterEl) counterEl.innerText = `${wordCount} từ`;
                
                test.answers[test.currentIndex] = { selected: true, isCorrect: true };
            },

            applyFeedbackStyles: function(question, selectedIndex, isCorrect) {
                const buttons = document.querySelectorAll('.option-btn');
                
                buttons.forEach((btn, idx) => {
                    btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50', 'dark:hover:border-indigo-500', 'dark:hover:bg-indigo-900/20', 'cursor-pointer');
                    btn.classList.add('cursor-default');
                    btn.onclick = null;
                    
                    const iconBox = btn.querySelector('.icon-container');
                    
                    if (idx === question.correctAnswer) {
                        btn.classList.add('correct');
                        iconBox.innerHTML = '<i class="fas fa-check"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.classList.add('incorrect');
                        iconBox.innerHTML = '<i class="fas fa-times"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });

                const feedbackArea = document.getElementById('feedback-area');
                if (feedbackArea) feedbackArea.classList.remove('hidden');
            },

            nextQuestion: function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }

                const test = this.state.test;
                const catId = this.state.activeCategory;

                if (!['writing', 'speaking'].includes(catId) && test.answers[test.currentIndex] === null) {
                    this.showNotification("Vui lòng chọn đáp án trước khi chuyển câu", "warning");
                    return;
                }

                test.currentIndex++;

                if (test.currentIndex >= test.questions.length) {
                    this.finishTest();
                } else {
                    this.renderCurrentQuestion();
                }
            },

            prevQuestion: function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }
                const test = this.state.test;
                if (test.currentIndex > 0) {
                    test.currentIndex--;
                    this.renderCurrentQuestion();
                }
            },

            finishTest: async function() {
                this.stopTimer();
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }

                this.renderLoading("Đang tổng hợp điểm và lưu bài thi...");
                
                const test = this.state.test;
                let correctCount = 0;
                let total = test.questions.length;

                test.answers.forEach(ans => {
                    if (ans && ans.isCorrect) correctCount++;
                });

                const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 100;
                const timeTakenSec = Math.round((new Date() - test.startTime) / 1000);

                const record = {
                    categoryId: this.state.activeCategory,
                    categoryName: CATEGORIES[this.state.activeCategory].name,
                    correctCount: correctCount,
                    totalQuestions: total,
                    score: percentage,
                    timeTakenSec: timeTakenSec,
                    date: new Date().toISOString(),
                    questions: test.questions,
                    answers: test.answers,
                    writingAnswers: test.writingAnswers,
                    speakingAudioBlobs: test.speakingAudioBlobs
                };

                try {
                    await addDoc(this.getPrivateRef('test_history'), record);
                } catch (e) {
                    console.error("Lỗi lưu lịch sử thi:", e);
                }

                this.renderResultScreen(correctCount, total, percentage, timeTakenSec);
            },

                            ${['writing', 'speaking'].includes(cat.id) ? `

                                    <i class="fas fa-circle-check mr-2 text-emerald-600"></i> Bài thi tự luận/ghi âm bài nói của bạn đã được lưu trữ thành công.

                                    <p class="text-sm font-semibold text-gray-600 dark:text-gray-400">Trả lời đúng ${correct} / ${total} câu hỏi</p>

                `;

            loadAdminQuestions: async function(categoryId) {
                this.renderLoading(`Đang nạp ngân hàng câu hỏi...`);
                try {
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    let list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));

                    // Sắp xếp ưu tiên Part, sau đó là thời gian tạo
                    list.sort((a, b) => {
                        const partA = a.part || 1;
                        const partB = b.part || 1;
                        if (partA !== partB) return partA - partB; // Sắp xếp theo Part tăng dần
                        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); // Mới tạo xếp trước
                    });

                    this.state.adminQuestions = list;
                    document.getElementById('app-content').innerHTML = this.views.adminManage(categoryId, list);
                } catch (error) {
                    console.error("Admin load error:", error);
                    this.showNotification("Lỗi tải danh sách câu hỏi", "error");
                    this.navigate('admin_dashboard');
                }
            },

            filterAdminQuestions: function(term, categoryId) {
                term = term.toLowerCase().trim();
                const filtered = this.state.adminQuestions.filter(q => {
                    const text = (q.text || '').toLowerCase();
                    const passage = (q.passage || '').toLowerCase();
                    const passageTitle = (q.passageTitle || '').toLowerCase();
                    return text.includes(term) || passage.includes(term) || passageTitle.includes(term);
                });
                
                const container = document.getElementById('admin-questions-container');
                const badge = document.getElementById('question-total-badge');
                if (container) {
                    container.innerHTML = this.views.adminQuestionList(filtered, categoryId);
                }
                if (badge) {
                    badge.innerText = `Tìm thấy: ${filtered.length} câu`;
                }
            },

            saveAdminQuestion: async function(event, categoryId, isEdit = false, docId = null) {
                event.preventDefault();
                const form = event.target;
                const submitBtn = form.querySelector('button[type="submit"]');

                // Chặn bấm nhiều lần (Anti double-submit)
                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang lưu...';
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

                let qObj = {
                    text: form.q_text.value.trim(),
                    part: parseInt(form.q_part ? form.q_part.value : 1)
                };

                // Chỉ ghi đè createdAt nếu là tạo mới
                if (!isEdit) {
                    qObj.createdAt = new Date().toISOString();
                }

                if (categoryId === 'grammar') {
                    qObj.subType = form.sub_type.value;
                }

                if (categoryId === 'listening' && form.audio_url) {
                    qObj.audioUrl = form.audio_url.value.trim();
                }

                if (categoryId === 'reading') {
                    qObj.passageId = form.q_passage_id ? form.q_passage_id.value.trim() : 'passage_01';
                    qObj.passageTitle = form.q_passage_title ? form.q_passage_title.value.trim() : 'Bài đọc';
                    qObj.passage = form.q_passage.value.trim();
                }

                if (categoryId === 'speaking') {
                    qObj.subQuestion = form.q_sub_question ? form.q_sub_question.value.trim() : '';
                    let imgArr = [];
                    if (form.q_image1 && form.q_image1.value.trim()) imgArr.push(form.q_image1.value.trim());
                    if (form.q_image2 && form.q_image2.value.trim()) imgArr.push(form.q_image2.value.trim());
                    qObj.images = imgArr;
                }

                if (['grammar', 'reading', 'listening'].includes(categoryId)) {
                    qObj.options = [form.opt_0.value, form.opt_1.value, form.opt_2.value];
                    qObj.correctAnswer = parseInt(form.correct_opt.value);
                    qObj.explanation = form.q_explanation ? form.q_explanation.value.trim() : '';
                }

                try {
                    if (isEdit && docId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `questions_${categoryId}`, docId), qObj);
                        this.showNotification("Cập nhật câu hỏi thành công!", "success");
                    } else {
                        await addDoc(this.getPublicRef(`questions_${categoryId}`), qObj);
                        this.showNotification("Thêm câu hỏi mới thành công!", "success");
                    }
                    this.closeModal();
                    this.loadAdminQuestions(categoryId);
                } catch (e) {
                    console.error("Save error:", e);
                    this.showNotification("Lỗi khi lưu câu hỏi", "error");
                    
                    // Nếu lỗi, mở khóa lại nút
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                }
            },

            deleteAdminQuestion: async function(categoryId, docId) {
                if (!await this.showConfirm("Xóa câu hỏi", "Bạn có chắc chắn muốn xóa câu hỏi này khỏi kho đề?")) return;

                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', this.state.user.uid, 'test_history', recordId));

            reviewHistoryRecord: function(recordId) {
                const record = this.state.historyRecords.find(r => r.id === recordId);

                    this.showNotification("Bài thi này không chứa dữ liệu câu hỏi để xem lại", "warning");
                    return;
                }

                this.state.activeCategory = record.categoryId;
                this.state.test = {
                    questions: record.questions,
                    currentIndex: 0,
                    answers: record.answers || new Array(record.questions.length).fill(null),
                    writingAnswers: record.writingAnswers || new Array(record.questions.length).fill(''),
                    speakingAudioBlobs: record.speakingAudioBlobs || new Array(record.questions.length).fill(null),
                    listeningPlayCounts: new Array(record.questions.length).fill(2),
                    startTime: new Date(),
                    isReviewMode: true
                };

                this.renderCurrentQuestion();
                
                setTimeout(() => {
                    const feedbackArea = document.getElementById('feedback-area');
                    if (feedbackArea) feedbackArea.classList.remove('hidden');
                    
                    const currentAns = record.answers ? record.answers[0] : null;
                    const question = record.questions[0];

                testInterface: function(question, currentIndex, total, cat, currentAnswer) {

                                                ${question.audioUrl ? `

                                                        <i class="fas fa-play mr-2"></i> <span id="play-btn-text-${currentIndex}">${playedCount >= 2 ? 'Đã Hết Lượt Nghe' : 'Phát Audio MP3'}</span>

                                        <!-- Interactive Areas -->

                                                <textarea id="writing-input" rows="8" class="w-full bg-gray-50 dark:bg-dark-panel border border-gray-200 dark:border-dark-border rounded-2xl p-4 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none transition-all" placeholder="Nhập câu trả lời của bạn vào đây..." oninput="app.saveWritingInput(this.value)" ${app.state.test.isReviewMode ? 'readonly' : ''}>${app.state.test.writingAnswers[currentIndex] || ''}</textarea>
                                                <div class="absolute bottom-3 right-4 text-xs font-bold text-gray-400" id="word-counter">
                                                    ${(app.state.test.writingAnswers[currentIndex] || '').trim().split(/\s+/).filter(w=>w.length>0).length} từ
                                                </div>
                                            </div>
                                        ` : isSpeaking ? `
                                            <div class="bg-rose-50 dark:bg-rose-950/20 rounded-2xl p-6 border border-rose-100 dark:border-rose-900/50 flex flex-col items-center justify-center text-center gap-4">
                                                ${!app.state.test.isReviewMode ? `

                                                        ${recordedAudio ? '✅ Đã có bản ghi âm.' : 'Bấm để ghi âm câu trả lời của bạn.'}
                                                    </p>
                                                ` : '<div class="text-indigo-500 font-bold text-sm"><i class="fas fa-info-circle mr-1"></i> Chế độ xem lại bài thi</div>'}

                                                        </div>
                                                        <span class="text-gray-700 dark:text-gray-200 font-medium">${opt}</span>
                                                    </div>

                                                    <i class="fas fa-lightbulb mr-2"></i> Giải thích đáp án:
                                                </h5>
                                                <p class="text-sm text-blue-900 dark:text-blue-200">

                                                </p>
                                            </div>
                                        `}
                                    </div>
                                    
                                    <div class="mt-8 flex justify-between items-center pt-4 border-t border-gray-100 dark:border-dark-border">
                                        <button onclick="app.prevQuestion()" class="${currentIndex === 0 ? 'invisible' : ''} px-5 py-2.5 bg-gray-100 dark:bg-dark-bg text-gray-700 dark:text-gray-300 font-bold rounded-xl hover:bg-gray-200 transition-colors">
                                            <i class="fas fa-chevron-left mr-1"></i> Câu trước
                                        </button>
                                        <button onclick="app.nextQuestion()" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 shadow-md transition-colors">

                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    return html;
                },

                                <i class="fas fa-chevron-right text-gray-300"></i>

                        `;

                    if (questions.length === 0) {
                        return `

                                <div>
                                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Giải thích (Tùy chọn)</label>
                                    <textarea name="q_explanation" rows="2" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white resize-none">${q.explanation || ''}</textarea>
                                </div>
                            ` : ''}

                            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-dark-border">
                                <button type="button" onclick="app.closeModal()" class="px-5 py-2.5 text-gray-600 dark:text-gray-400 font-bold hover:bg-gray-100 dark:hover:bg-dark-bg rounded-xl">Hủy</button>
                                <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all">${isEdit ? 'Cập nhật' : 'Lưu Câu Hỏi'}</button>
                            </div>
                        </form>
                    `;
                    return formHtml;
                },

                historyList: function(records) {
                    let html = `
                        <div class="max-w-4xl mx-auto fade-in">
                            <div class="flex items-center justify-between mb-8">
                                <div>
                                    <h2 class="text-2xl font-black text-gray-900 dark:text-white">Lịch Sử Luyện Thi</h2>
                                    <p class="text-gray-500 dark:text-dark-textMuted text-sm mt-1">Xem lại kết quả các bài kiểm tra đã thực hiện.</p>
                                </div>
                                <button onclick="app.navigate('home')" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors">
                                    <i class="fas fa-house"></i>
                                </button>
                            </div>

                            ${records.length === 0 ? `
                                <div class="text-center py-16 glass-panel rounded-3xl border border-dashed border-gray-300 dark:border-gray-700">
                                    <div class="text-4xl text-gray-300 mb-4"><i class="fas fa-clock"></i></div>
                                    <p class="text-gray-500 font-medium">Bạn chưa có bài thi nào được lưu.</p>
                                    <button onclick="app.navigate('home')" class="mt-4 px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700">Luyện tập ngay</button>
                                </div>
                            ` : `
                                <div class="space-y-4">
                                    ${records.map(r => {
                                        const d = new Date(r.date);
                                        const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                                        const isTextBased = ['writing', 'speaking'].includes(r.categoryId);
                                        
                                        return `
                                        <div class="glass-panel p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-gray-200 dark:border-dark-border">
                                            <div class="flex items-center gap-4">
                                                <div class="${CATEGORIES[r.categoryId].color} w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl shadow-sm">
                                                    <i class="fas ${CATEGORIES[r.categoryId].icon}"></i>
                                                </div>
                                                <div>
                                                    <h3 class="font-bold text-gray-900 dark:text-white text-lg">${r.categoryName}</h3>
                                                    <p class="text-xs text-gray-500 mb-1"><i class="far fa-calendar-alt mr-1"></i> ${dateStr}</p>
                                                    <div class="flex gap-3 text-xs font-semibold">
                                                        ${!isTextBased ? `
                                                            <span class="${r.score >= 70 ? 'text-emerald-600' : 'text-rose-600'}">Đúng: ${r.correctCount}/${r.totalQuestions} (${r.score}%)</span>
                                                        ` : `
                                                            <span class="text-indigo-600">Đã hoàn thành</span>
                                                        `}
                                                        <span class="text-gray-500"><i class="far fa-clock mr-1"></i> ${Math.floor(r.timeTakenSec/60)}p ${r.timeTakenSec%60}s</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="app.reviewHistoryRecord('${r.id}')" class="px-4 py-2 bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300 rounded-lg text-sm font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors">
                                                    <i class="fas fa-eye mr-1"></i> Xem lại
                                                </button>
                                                <button onclick="app.deleteHistoryRecord('${r.id}')" class="px-3 py-2 bg-rose-50 text-rose-600 dark:bg-rose-900/30 dark:text-rose-400 rounded-lg text-sm font-bold hover:bg-rose-100 dark:hover:bg-rose-900/50 transition-colors" title="Xóa">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        `
                                    }).join('')}
                                </div>
                            `}
                        </div>
                    `;
                    return html;
                },

                vocabBook: function(words) {
                    let html = `
                        <div class="max-w-5xl mx-auto fade-in">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
                                <div>
                                    <h2 class="text-2xl font-black text-gray-900 dark:text-white">Sổ Tay Từ Vựng</h2>
                                    <p class="text-gray-500 dark:text-dark-textMuted text-sm mt-1">Lưu trữ và ôn tập từ vựng cá nhân của bạn.</p>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="app.navigate('home')" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors">
                                        <i class="fas fa-house"></i>
                                    </button>
                                    <button onclick="app.showModal('Thêm Từ Mới', app.views.vocabForm())" class="px-5 py-2.5 bg-yellow-500 text-white rounded-xl font-bold hover:bg-yellow-600 shadow-md">
                                        <i class="fas fa-plus mr-1.5"></i> Thêm từ
                                    </button>
                                </div>
                            </div>

                            ${words.length === 0 ? `
                                <div class="text-center py-16 glass-panel rounded-3xl border border-dashed border-gray-300 dark:border-gray-700">
                                    <div class="text-4xl text-yellow-300 mb-4"><i class="fas fa-book-open"></i></div>
                                    <p class="text-gray-500 font-medium">Sổ tay của bạn đang trống.</p>
                                </div>
                            ` : `
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    ${words.map(w => `
                                        <div class="glass-panel p-5 rounded-2xl border border-gray-200 dark:border-dark-border relative group">
                                            <button onclick="app.deleteVocabWord('${w.id}')" class="absolute top-3 right-3 text-gray-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-times"></i></button>
                                            
                                            <div class="flex items-baseline gap-2 mb-2">
                                                <h3 class="text-lg font-bold text-indigo-600 dark:text-indigo-400">${w.word}</h3>
                                                <span class="text-[10px] font-mono px-1.5 py-0.5 bg-gray-100 dark:bg-dark-bg text-gray-500 rounded">${w.type}</span>
                                            </div>
                                            <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3">${w.meaning}</p>
                                            ${w.example ? `<p class="text-xs text-gray-500 dark:text-dark-textMuted italic bg-gray-50 dark:bg-dark-bg p-2 rounded-lg border-l-2 border-yellow-400">" ${w.example} "</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    `;
                    return html;
                },

                vocabForm: function() {
                    return `
                        <form onsubmit="app.saveVocabWord(event)" class="space-y-4">
                            <div class="grid grid-cols-3 gap-3">
                                <div class="col-span-2">
                                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Từ vựng (Word)</label>
                                    <input type="text" name="word" required class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Loại từ</label>
                                    <select name="type" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white">
                                        <option value="(n)">(n) Noun</option>
                                        <option value="(v)">(v) Verb</option>
                                        <option value="(adj)">(adj) Adjective</option>
                                        <option value="(adv)">(adv) Adverb</option>
                                        <option value="(prep)">(prep) Preposition</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ý nghĩa (Meaning)</label>
                                <input type="text" name="meaning" required class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ví dụ (Example - Tùy chọn)</label>
                                <textarea name="example" rows="2" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white resize-none"></textarea>
                            </div>
                            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-dark-border">
                                <button type="button" onclick="app.closeModal()" class="px-5 py-2 text-gray-600 dark:text-gray-400 font-bold hover:bg-gray-100 dark:hover:bg-dark-bg rounded-xl">Hủy</button>
                                <button type="submit" class="px-6 py-2 bg-yellow-500 text-white font-bold rounded-xl shadow-md hover:bg-yellow-600">Lưu Từ</button>
                            </div>
                        </form>
                    `;
                }
            },

            // UI Helpers
            showModal: function(title, contentHtml) {
                const modal = document.getElementById('modal-container');
                modal.innerHTML = `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                        <div class="bg-white dark:bg-dark-panel w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-gray-200 dark:border-dark-border flex flex-col max-h-[90vh]">
                            <div class="px-6 py-4 border-b border-gray-100 dark:border-dark-border flex justify-between items-center bg-gray-50 dark:bg-dark-bg shrink-0">
                                <h3 class="font-black text-gray-900 dark:text-white text-lg">${title}</h3>
                                <button onclick="app.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
                                    <i class="fas fa-times text-xl"></i>
                                </button>
                            </div>
                            <div class="p-6 overflow-y-auto custom-scrollbar">
                                ${contentHtml}
                            </div>
                        </div>
                    </div>
                `;
            },
            closeModal: function() {
                document.getElementById('modal-container').innerHTML = '';
            },

            showConfirm: function(title, message) {
                return new Promise((resolve) => {
                    this.showModal(title, `
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 rounded-full bg-rose-50 text-rose-500 mx-auto flex items-center justify-center text-2xl mb-4">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <p class="text-gray-700 dark:text-gray-300 font-medium">${message}</p>
                        </div>
                        <div class="flex justify-center gap-3">
                            <button id="confirm-no" class="px-6 py-2.5 bg-gray-100 dark:bg-dark-bg text-gray-700 dark:text-gray-300 font-bold rounded-xl hover:bg-gray-200 w-1/2">Không</button>
                            <button id="confirm-yes" class="px-6 py-2.5 bg-rose-600 text-white font-bold rounded-xl shadow-md hover:bg-rose-700 w-1/2">Đồng ý</button>
                        </div>
                    `);
                    document.getElementById('confirm-yes').onclick = () => { this.closeModal(); resolve(true); };
                    document.getElementById('confirm-no').onclick = () => { this.closeModal(); resolve(false); };
                });
            },

            showNotification: function(message, type = 'info') {
                const colors = {
                    success: 'bg-emerald-500', error: 'bg-rose-500', 
                    warning: 'bg-amber-500', info: 'bg-blue-500'
                };
                const icons = {
                    success: 'fa-check-circle', error: 'fa-exclamation-circle', 
                    warning: 'fa-exclamation-triangle', info: 'fa-info-circle'
                };

                const el = document.createElement('div');
                el.className = `fixed bottom-6 right-6 ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg z-[200] flex items-center gap-3 transform transition-all duration-300 translate-y-20 opacity-0`;
                el.innerHTML = `<i class="fas ${icons[type]} text-lg"></i> <span class="font-medium text-sm">${message}</span>`;
                
                document.body.appendChild(el);
                
                setTimeout(() => { el.classList.remove('translate-y-20', 'opacity-0'); }, 10);
                setTimeout(() => {
                    el.classList.add('translate-y-20', 'opacity-0');
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            },

            renderLoading: function(text = "Đang xử lý...") {
                document.getElementById('app-content').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[50vh] fade-in">
                        <div class="loader mb-6"></div>
                        <p class="text-gray-500 dark:text-dark-textMuted font-medium">${text}</p>
                    </div>
                `;
            }
        };

        // Bootstrap App
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
