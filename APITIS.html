                                <div class="flex items-center gap-4">
                                    <div class="${cat.color} w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl">
                                        <i class="fas ${cat.icon}"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-gray-900 dark:text-white">${cat.name}</h3>
                                        <p class="text-xs text-gray-500">Quản lý câu hỏi</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-gray-300"></i>
                            </div>
                        `;
                    }
                    html += `</div></div>`;
                    return html;
                },

                adminManage: function(categoryId, questions) {
                    const cat = CATEGORIES[categoryId];
                    let html = `
                        <div class="max-w-6xl mx-auto fade-in">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                                <div class="flex items-center gap-3">
                                    <button onclick="app.navigate('admin_dashboard')" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors">
                                        <i class="fas fa-arrow-left"></i>
                                    </button>
                                    <div>
                                        <h2 class="text-xl font-black text-gray-900 dark:text-white flex items-center">
                                            <i class="fas ${cat.icon} ${cat.textClass} mr-2"></i> ${cat.name}
                                        </h2>
                                        <span id="question-total-badge" class="text-xs font-bold text-gray-500">Tổng: ${questions.length} mục</span>
                                    </div>
                                </div>
                                <button onclick="app.showModal('Thêm mới dữ liệu', app.views.questionForm('${categoryId}'))" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-md">
                                    <i class="fas fa-plus mr-1.5"></i> Thêm mới
                                </button>
                            </div>

                            <div class="mb-6 relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fas fa-search text-gray-400"></i>
                                </div>
                                <input type="text" id="admin-search-input" oninput="app.filterAdminQuestions(this.value, '${categoryId}')" placeholder="Tìm kiếm câu hỏi, từ vựng, bài đọc..." class="block w-full pl-11 pr-4 py-3.5 border-2 border-transparent bg-white dark:bg-dark-panel rounded-2xl shadow-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-0 focus:border-indigo-500 sm:text-sm transition-all duration-300">
                            </div>

                            <div id="admin-questions-container">
                                ${app.views.adminQuestionList(questions, categoryId)}
                            </div>
                        </div>
                    `;
                    return html;
                },

                adminQuestionList: function(questions, categoryId) {
                    if (questions.length === 0) {
                        return `
                            <div class="text-center py-16 glass-panel rounded-3xl border border-dashed border-gray-300 dark:border-gray-700">
                                <div class="text-4xl text-gray-300 mb-4"><i class="fas fa-box-open"></i></div>
                                <p class="text-gray-500 font-medium">Không tìm thấy dữ liệu.</p>
                            </div>
                        `;
                    }
                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${questions.map((q, i) => `
                                <div id="q-card-${q.id}" class="bg-white dark:bg-dark-panel p-5 rounded-2xl border border-gray-200 dark:border-dark-border shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow group">
                                    <div>
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex gap-2 items-center">
                                                <span class="text-[11px] font-extrabold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg uppercase tracking-wider">
                                                    Part ${q.part || (q.subType === 'vocab_matching_p1' ? '1 (Vocab)' : q.subType === 'vocab_matching_p2' ? '2 (Vocab)' : 1)}
                                                </span>
                                            </div>
                                            <div class="flex gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                                <button onclick="app.editAdminQuestion('${categoryId}', '${q.id}')" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-100" title="Chỉnh sửa"><i class="fas fa-edit"></i></button>
                                                <button onclick="app.deleteAdminQuestion('${categoryId}', '${q.id}')" class="w-8 h-8 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center hover:bg-rose-100" title="Xóa"><i class="fas fa-trash"></i></button>
                                            </div>
                                        </div>
                                        
                                        ${categoryId === 'reading' ? `
                                            <p class="font-bold text-emerald-700 dark:text-emerald-400 text-sm mb-1"><i class="fas fa-book-open mr-1"></i> ${q.passageTitle || 'Bài đọc'}</p>
                                            <p class="text-xs text-gray-500 line-clamp-2 mb-3">${q.passage || ''}</p>
                                            <div class="text-[11px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded inline-block">
                                                Bao gồm ${q.subQuestions ? q.subQuestions.length : (q.text ? 1 : 0)} câu hỏi phụ
                                            </div>
                                        ` : (q.subType === 'vocab_matching_p1' || q.subType === 'vocab_matching_p2') ? `
                                            <div class="bg-teal-50 dark:bg-teal-900/20 p-3 rounded-xl border border-teal-100 dark:border-teal-800 mb-3">
                                                <p class="font-bold text-teal-800 dark:text-teal-300 text-sm mb-1"><i class="fas fa-puzzle-piece mr-1.5"></i> Từ chính: ${q.word}</p>
                                                <p class="text-xs text-teal-600 dark:text-teal-400"><i class="fas fa-arrow-right mr-1.5"></i> Mục tiêu: ${q.target}</p>
                                            </div>
                                        ` : `
                                            <p class="font-medium text-sm text-gray-800 dark:text-gray-200 line-clamp-3 mb-3">${q.text || '<em>(Không có nội dung text)</em>'}</p>
                                            ${q.options ? `
                                                <div class="text-xs text-gray-500 space-y-1.5 p-3 bg-gray-50 dark:bg-dark-bg rounded-xl">
                                                    ${q.options.map((opt, idx) => `
                                                        <div class="${idx === q.correctAnswer ? 'text-emerald-600 font-bold' : ''}">
                                                            ${String.fromCharCode(65+idx)}. ${opt}
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : ''}
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                },

                questionForm: function(categoryId, qData = null, isEdit = false, docId = null) {
                    const isReading = categoryId === 'reading';
                    const isListening = categoryId === 'listening';
                    const isSpeaking = categoryId === 'speaking';
                    const isGrammar = categoryId === 'grammar';
                    const q = qData || {};

                    if (isGrammar) {
                        setTimeout(() => app.toggleGrammarFormFields(q.subType || 'grammar'), 50);
                    }

                    if (isReading) {
                        setTimeout(() => { if (!isEdit) app.addReadingSubQuestion('reading-sub-qs-container'); }, 50);
                        return `
                            <form onsubmit="app.saveAdminQuestion(event, '${categoryId}', ${isEdit}, '${docId || ''}')" class="space-y-5">
                                <input type="hidden" name="q_part" value="${q.part || 1}">
                                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 shadow-sm">
                                    <h4 class="font-black text-emerald-800 mb-4 border-b border-emerald-200 pb-2"><i class="fas fa-file-lines mr-2"></i>NỘI DUNG ĐOẠN VĂN</h4>
                                    <div class="space-y-3">
                                        <div>
                                            <label class="block text-xs font-bold text-emerald-800 mb-1">Tiêu Đề Bài Đọc</label>
                                            <input type="text" name="q_passage_title" value="${q.passageTitle || ''}" class="w-full bg-white border border-emerald-200 rounded-xl p-2 text-sm focus:ring-emerald-500">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-emerald-800 mb-1">Nội dung đoạn văn</label>
                                            <textarea name="q_passage" rows="6" required class="w-full bg-white border border-emerald-200 rounded-xl p-3 text-sm focus:ring-emerald-500 resize-y">${q.passage || ''}</textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="pt-2">
                                    <div class="flex justify-between items-center mb-3">
                                        <h4 class="font-black text-gray-800 text-sm"><i class="fas fa-list-check mr-2"></i>CÁC CÂU HỎI TRẮC NGHIỆM</h4>
                                        <button type="button" onclick="app.addReadingSubQuestion('reading-sub-qs-container')" class="px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold">
                                            <i class="fas fa-plus mr-1"></i> Thêm câu hỏi
                                        </button>
                                    </div>
                                    <div id="reading-sub-qs-container" class="space-y-4"></div>
                                </div>
                                <div class="flex justify-end gap-3 pt-4 border-t mt-6">
                                    <button type="button" onclick="app.closeModal()" class="px-5 py-2.5 text-gray-600 font-bold hover:bg-gray-100 rounded-xl">Hủy</button>
                                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow-md">Lưu Đề Đọc</button>
                                </div>
                            </form>
                        `;
                    }

                    return `
                        <form onsubmit="app.saveAdminQuestion(event, '${categoryId}', ${isEdit}, '${docId || ''}')" class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Part</label>
                                    <input type="number" name="q_part" min="1" max="4" value="${q.part || 1}" required class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white">
                                </div>
                                ${isGrammar ? `
                                    <div>
                                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Loại Hình Câu Hỏi</label>
                                        <select name="sub_type" onchange="app.toggleGrammarFormFields(this.value)" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white">
                                            <option value="grammar" ${q.subType === 'grammar' ? 'selected' : ''}>Grammar (Trắc nghiệm Part 1)</option>
                                            <option value="vocab" ${q.subType === 'vocab' ? 'selected' : ''}>Vocabulary (Trắc nghiệm Cũ)</option>
                                            <option value="vocab_matching_p1" ${q.subType === 'vocab_matching_p1' ? 'selected' : ''}>Vocabulary Part 1: Ghép từ đồng nghĩa</option>
                                            <option value="vocab_matching_p2" ${q.subType === 'vocab_matching_p2' ? 'selected' : ''}>Vocabulary Part 2: Hoàn thành định nghĩa</option>
                                        </select>
                                    </div>
                                ` : ''}
                            </div>

                            ${isListening ? `
                                <div>
                                    <label class="block text-xs font-bold text-purple-700 mb-1"><i class="fas fa-link mr-1"></i> Link file Audio MP3</label>
                                    <input type="url" name="audio_url" value="${q.audioUrl || ''}" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2.5 text-sm">
                                </div>
                            ` : ''}

                            <!-- MCQ TEXT FIELDS -->
                            <div id="mcq_fields" style="display:block;">
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Nội dung câu hỏi</label>
                                    <textarea id="q_text_input" name="q_text" rows="2" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-3 text-sm dark:text-white resize-none">${q.text || ''}</textarea>
                                </div>
                                
                                ${['grammar', 'listening'].includes(categoryId) ? `
                                    <div class="bg-gray-100 dark:bg-dark-bg p-4 rounded-xl border border-gray-200 dark:border-dark-border space-y-3">
                                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-2 border-b border-gray-200 dark:border-gray-700 pb-2">Đáp án (3 Lựa chọn)</label>
                                        ${[0,1,2].map(i => `
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs font-bold text-gray-500 w-6">${String.fromCharCode(65+i)}</span>
                                                <input type="text" name="opt_${i}" value="${q.options ? q.options[i] : ''}" class="flex-1 bg-white dark:bg-dark-panel border border-gray-300 dark:border-dark-border rounded-lg p-2 text-sm dark:text-white">
                                                <input type="radio" name="correct_opt" value="${i}" ${q.correctAnswer === i || (i===0 && !q.options) ? 'checked' : ''} class="w-4 h-4 text-indigo-600">
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="mt-4">
                                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Giải thích (Tùy chọn)</label>
                                        <textarea name="q_explanation" rows="2" class="w-full bg-gray-50 dark:bg-dark-bg border border-gray-300 dark:border-dark-border rounded-xl p-2.5 text-sm dark:text-white resize-none">${q.explanation || ''}</textarea>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- VOCABULARY FIELDS -->
                            ${isGrammar ? `
                                <div id="vocab_fields" style="display:none;" class="bg-teal-50 dark:bg-teal-900/20 p-5 rounded-2xl border border-teal-200 dark:border-teal-800 shadow-sm space-y-4">
                                    <div class="text-xs font-bold text-teal-600 bg-teal-100 dark:bg-teal-900/50 inline-block px-3 py-1 rounded-full mb-2">
                                        <i class="fas fa-puzzle-piece mr-1"></i> Tính năng Tạo đề thông minh
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-teal-900 dark:text-teal-400 mb-1">Từ chính (Main Word)</label>
                                        <input type="text" id="v_word_input" name="v_word" value="${q.word || ''}" class="w-full bg-white dark:bg-dark-panel border border-teal-300 dark:border-teal-700 rounded-xl p-3 text-sm dark:text-white focus:ring-2 focus:ring-teal-500">
                                    </div>
                                    <div>
                                        <label id="vocab_target_label" class="block text-xs font-bold text-teal-900 dark:text-teal-400 mb-1">Từ đồng nghĩa (Target)</label>
                                        <input type="text" id="v_target_input" name="v_target" value="${q.target || ''}" class="w-full bg-white dark:bg-dark-panel border border-teal-300 dark:border-teal-700 rounded-xl p-3 text-sm dark:text-white focus:ring-2 focus:ring-teal-500">
                                    </div>
                                    <p class="text-[11px] text-teal-700 dark:text-teal-500 mt-2 italic"><i class="fas fa-info-circle mr-1"></i> Hệ thống sẽ tự động trộn các từ này và tạo ra danh sách 10 lựa chọn khi thi.</p>
                                </div>
                            ` : ''}

                            <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-dark-border">
                                <button type="button" onclick="app.closeModal()" class="px-5 py-2.5 text-gray-600 dark:text-gray-400 font-bold hover:bg-gray-100 dark:hover:bg-dark-bg rounded-xl">Hủy</button>
                                <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all">Lưu Câu Hỏi</button>
                            </div>
                        </form>
                    `;
                },

                historyList: function(records) {
                    let html = `
                        <div class="max-w-4xl mx-auto fade-in">
                            <div class="flex items-center justify-between mb-8">
                                <div>
                                    <h2 class="text-2xl font-black text-gray-900 dark:text-white">Lịch Sử Luyện Thi</h2>
                                </div>
                                <button onclick="app.navigate('home')" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 flex items-center justify-center text-gray-600">
                                    <i class="fas fa-house"></i>
                                </button>
                            </div>

                            ${records.length === 0 ? `
                                <div class="text-center py-16 glass-panel rounded-3xl border border-dashed border-gray-300">
                                    <div class="text-4xl text-gray-300 mb-4"><i class="fas fa-clock"></i></div>
                                    <p class="text-gray-500 font-medium">Bạn chưa có bài thi nào được lưu.</p>
                                </div>
                            ` : `
                                <div class="space-y-4">
                                    ${records.map(r => {
                                        const d = new Date(r.date);
                                        const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                                        const isTextBased = ['writing', 'speaking'].includes(r.categoryId);
                                        
                                        return `
                                        <div class="glass-panel p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-gray-200">
                                            <div class="flex items-center gap-4">
                                                <div class="${CATEGORIES[r.categoryId].color} w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl">
                                                    <i class="fas ${CATEGORIES[r.categoryId].icon}"></i>
                                                </div>
                                                <div>
                                                    <h3 class="font-bold text-gray-900 dark:text-white text-lg">${r.categoryName}</h3>
                                                    <p class="text-xs text-gray-500 mb-1">${dateStr}</p>
                                                    <div class="flex gap-3 text-xs font-semibold">
                                                        ${!isTextBased ? `
                                                            <span class="${r.score >= 70 ? 'text-emerald-600' : 'text-rose-600'}">Đúng: ${r.correctCount}/${r.totalQuestions} (${r.score}%)</span>
                                                        ` : `<span class="text-indigo-600">Đã hoàn thành</span>`}
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="app.reviewHistoryRecord('${r.id}')" class="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-xl font-bold hover:bg-indigo-100 text-sm">Xem lại</button>
                                                <button onclick="app.deleteHistoryRecord('${r.id}')" class="w-10 h-10 bg-rose-50 text-rose-600 rounded-xl flex justify-center items-center hover:bg-rose-100"><i class="fas fa-trash"></i></button>
                                            </div>
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            `}
                        </div>
                    `;
                    return html;
                },

                vocabBook: function(words) {
                    let html = `
                        <div class="max-w-4xl mx-auto fade-in">
                            <div class="flex items-center justify-between mb-8">
                                <div>
                                    <h2 class="text-2xl font-black text-gray-900 dark:text-white">Sổ Tay Từ Vựng</h2>
                                </div>
                                <button onclick="app.navigate('home')" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 flex items-center justify-center text-gray-600">
                                    <i class="fas fa-house"></i>
                                </button>
                            </div>
                            
                            <div class="glass-panel p-6 rounded-3xl mb-8 border border-gray-200">
                                <form onsubmit="app.saveVocabWord(event)" class="flex flex-col sm:flex-row gap-3">
                                    <input type="text" name="word" placeholder="Từ vựng mới" required class="flex-1 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:ring-indigo-500">
                                    <select name="type" class="w-full sm:w-32 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:ring-indigo-500">
                                        <option value="noun">(n)</option>
                                        <option value="verb">(v)</option>
                                        <option value="adj">(adj)</option>
                                        <option value="adv">(adv)</option>
                                    </select>
                                    <input type="text" name="meaning" placeholder="Nghĩa..." required class="flex-1 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:ring-indigo-500">
                                    <input type="text" name="example" placeholder="Ví dụ (Tùy chọn)" class="flex-1 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm focus:ring-indigo-500">
                                    <button type="submit" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-md whitespace-nowrap"><i class="fas fa-plus mr-1"></i> Lưu</button>
                                </form>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${words.map(w => `
                                    <div class="bg-white dark:bg-dark-panel p-5 rounded-2xl border border-gray-200 dark:border-dark-border shadow-sm relative group">
                                        <button onclick="app.deleteVocabWord('${w.id}')" class="absolute top-3 right-3 text-gray-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-trash"></i></button>
                                        <div class="font-black text-lg text-indigo-700 dark:text-indigo-400 mb-1">${w.word} <span class="text-xs font-normal text-gray-500">${w.type}</span></div>
                                        <div class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-2">${w.meaning}</div>
                                        ${w.example ? `<div class="text-xs text-gray-500 italic border-l-2 border-indigo-200 pl-2 py-1 bg-gray-50 dark:bg-dark-bg/50 rounded-r-lg">${w.example}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    return html;
                }
            }
        };
    </script>
</body>
</html>
