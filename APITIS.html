<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Thi Tiếng Anh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#121212',
                            panel: '#1E1E1E',
                            border: '#333333',
                            text: '#E0E0E0',
                            textMuted: '#A0A0A0'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass-panel {
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .dark .glass-panel {
            background: #1E1E1E;
            border-color: #333333;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .option-btn { transition: all 0.2s ease; }
        .option-btn.correct {
            border-color: #10b981 !important;
            background-color: #ecfdf5 !important;
            color: #065f46 !important;
        }
        .dark .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2) !important;
            color: #34d399 !important;
        }
        .option-btn.incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            color: #991b1b !important;
        }
        .dark .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #818cf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-recording {
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-dark-text min-h-screen flex flex-col font-sans transition-colors duration-300" onload="app.init()">

    <nav class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-lg sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center cursor-pointer group" onclick="app.navigate('home')">
                    <div class="bg-white/20 p-2 rounded-xl mr-3 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-graduation-cap text-xl"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-xl tracking-tight block leading-none">HỆ THỐNG LUYỆN THI</span>
                        <span class="text-[10px] opacity-80 uppercase tracking-widest font-semibold">Hiện đại & Tối ưu</span>
                    </div>
                </div>
                
                <!-- Main Nav Links -->
                <div class="flex items-center space-x-1 sm:space-x-3">
                    <button onclick="app.navigate('vocab_book')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center">
                        <i class="fas fa-book-bookmark mr-1.5 text-yellow-300"></i> <span class="hidden sm:inline">Sổ tay</span>
                    </button>
                    <button onclick="app.navigate('history')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center">
                        <i class="fas fa-clock-rotate-left mr-1.5 text-cyan-300"></i> <span class="hidden sm:inline">Lịch sử</span>
                    </button>
                    <button onclick="app.navigate('admin_dashboard')" class="hover:bg-white/10 px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center text-amber-300 hover:text-amber-100">
                        <i class="fas fa-sliders mr-1.5"></i> <span class="hidden sm:inline">Quản trị</span>
                    </button>
                    
                    <div class="w-px h-6 bg-indigo-400 dark:bg-indigo-600 mx-1"></div>
                    
                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle" onclick="app.toggleTheme()" class="hover:bg-white/10 p-2 rounded-full transition-colors w-10 h-10 flex items-center justify-center">
                        <i class="fas fa-moon text-lg" id="theme-icon"></i>
                    </button>
                    
                    <!-- User Status -->
                    <div id="user-status" class="hidden sm:flex text-xs bg-black/20 px-3 py-1.5 rounded-full items-center font-mono">
                        <i class="fas fa-circle-notch fa-spin mr-2"></i> Kết nối...
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic views will render here -->
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB8AVoyDEpY2U5migHCQ_r7DEOC5QYkqMI",
            authDomain: "luyentap-2f2ab.firebaseapp.com",
            databaseURL: "https://luyentap-2f2ab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "luyentap-2f2ab",
            storageBucket: "luyentap-2f2ab.firebasestorage.app",
            messagingSenderId: "646969953114",
            appId: "1:646969953114:web:71dd282afdb53d02924163"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'engtest-pro';
        const sysFirebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;

        const firebaseApp = initializeApp(sysFirebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // System Skill Categories Configuration
        const CATEGORIES = {
            grammar: { 
                id: 'grammar', 
                name: 'Grammar & Vocabulary', 
                icon: 'fa-spell-check', 
                color: 'bg-blue-600', 
                textClass: 'text-blue-600',
                timeLimit: 1500, // 25 min timer
                desc: 'Phần Trắc nghiệm Ngữ pháp và Ghép từ/Định nghĩa Từ vựng.<br>Thời gian: 25 phút.'
            },
            reading: { 
                id: 'reading', 
                name: 'Reading', 
                icon: 'fa-book-open', 
                color: 'bg-emerald-600', 
                textClass: 'text-emerald-600',
                timeLimit: 2400, // 40 min timer
                desc: 'Đọc hiểu đoạn văn. Một đoạn văn chứa nhiều câu hỏi (mỗi câu 3 đáp án).<br>Thời gian: 40 phút.'
            },
            listening: { 
                id: 'listening', 
                name: 'Listening', 
                icon: 'fa-headphones', 
                color: 'bg-purple-600', 
                textClass: 'text-purple-600',
                timeLimit: null, // No time limit
                desc: 'Chỉ được nghe tối đa 2 lần cho mỗi bài nghe.'
            },
            writing: { 
                id: 'writing', 
                name: 'Writing', 
                icon: 'fa-pen-nib', 
                color: 'bg-orange-600', 
                textClass: 'text-orange-600',
                timeLimit: null, // No time limit
                desc: 'Part 1: 3 câu hỏi ngắn (1-5 từ hoặc 20-30 từ). Part 2: Viết thư/email (120-150 từ).'
            },
            speaking: { 
                id: 'speaking', 
                name: 'Speaking', 
                icon: 'fa-microphone', 
                color: 'bg-rose-600', 
                textClass: 'text-rose-600',
                timeLimit: null, // No time limit
                desc: 'Part 1: 3 câu hỏi đơn. Part 2: 1 ảnh & câu phụ. Part 3: 2 ảnh so sánh. Có ghi âm.'
            }
        };
        
        window.app = {
            state: {
                currentView: 'home',
                activeCategory: 'grammar',
                user: null,
                darkMode: false,
                timerInterval: null,
                remainingSeconds: 0,
                historyRecords: [], 
                adminQuestions: [], 
                
                mediaRecorder: null,
                audioChunks: [],
                isRecording: false,

                test: {
                    questions: [],
                    currentIndex: 0,
                    answers: [], 
                    writingAnswers: [], 
                    speakingAudioBlobs: [], 
                    listeningPlayCounts: [], 
                    startTime: null,
                    isReviewMode: false
                }
            },
            
            readingQCounter: 0,

            init: async function() {
                this.initTheme();
                this.renderLoading("Đang khởi tạo hệ thống thi...");
                
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        this.state.user = user;
                        const statusEl = document.getElementById('user-status');
                        
                        if (user) {
                            statusEl.innerHTML = `<i class="fas fa-user-check text-emerald-400 mr-1.5"></i> ${user.uid.substring(0, 6)}`;
                            if (this.state.currentView === 'home') this.navigate('home');
                        } else {
                            statusEl.innerHTML = `<i class="fas fa-exclamation-circle text-rose-400 mr-1.5"></i> Lỗi Auth`;
                        }
                    });
                } catch (error) {
                    console.error("Auth init error:", error);
                    this.showNotification("Lỗi kết nối tài khoản", "error");
                }
            },

            // Utility Functions
            showModal: function(title, content) {
                const modal = document.getElementById('modal-container');
                modal.innerHTML = `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                        <div class="bg-white dark:bg-dark-bg w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col border border-gray-200 dark:border-dark-border">
                            <div class="px-6 py-4 border-b border-gray-100 dark:border-dark-border flex justify-between items-center bg-gray-50/50 dark:bg-dark-panel/50">
                                <h3 class="font-extrabold text-lg text-gray-900 dark:text-white">${title}</h3>
                                <button onclick="app.closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 transition-colors">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="p-6 overflow-y-auto custom-scrollbar">
                                ${content}
                            </div>
                        </div>
                    </div>
                `;
            },
            closeModal: function() {
                document.getElementById('modal-container').innerHTML = '';
            },
            showNotification: function(msg, type = 'info') {
                const colors = {
                    success: 'bg-emerald-500',
                    error: 'bg-rose-500',
                    warning: 'bg-amber-500',
                    info: 'bg-indigo-500'
                };
                const icon = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                
                const notif = document.createElement('div');
                notif.className = `fixed bottom-6 right-6 ${colors[type]} text-white px-5 py-3.5 rounded-xl shadow-xl font-medium flex items-center gap-3 z-[200] transform transition-all duration-300 translate-y-10 opacity-0 border border-white/20`;
                notif.innerHTML = `<i class="fas ${icon[type]} text-lg"></i> ${msg}`;
                document.body.appendChild(notif);
                
                requestAnimationFrame(() => {
                    notif.classList.remove('translate-y-10', 'opacity-0');
                });
                
                setTimeout(() => {
                    notif.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => notif.remove(), 300);
                }, 3000);
            },
            showConfirm: function(title, msg) {
                return new Promise((resolve) => {
                    this.showModal(title, `
                        <div class="text-center py-4">
                            <div class="w-16 h-16 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-500 flex items-center justify-center mx-auto mb-4 text-2xl">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <p class="text-gray-700 dark:text-gray-300 mb-6">${msg}</p>
                            <div class="flex justify-center gap-3">
                                <button id="btn-cancel-confirm" class="px-5 py-2.5 bg-gray-100 dark:bg-dark-bg hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-xl font-bold transition-colors">Hủy</button>
                                <button id="btn-ok-confirm" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold shadow-md transition-colors">Đồng ý</button>
                            </div>
                        </div>
                    `);
                    
                    document.getElementById('btn-cancel-confirm').onclick = () => {
                        this.closeModal();
                        resolve(false);
                    };
                    document.getElementById('btn-ok-confirm').onclick = () => {
                        this.closeModal();
                        resolve(true);
                    };
                });
            },
            renderLoading: function(msg) {
                document.getElementById('app-content').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-[50vh] fade-in">
                        <div class="loader mb-4"></div>
                        <p class="text-gray-500 dark:text-gray-400 font-medium">${msg}</p>
                    </div>
                `;
            },

            initTheme: function() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.state.darkMode = true;
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-icon').className = 'fas fa-sun text-amber-300';
                } else {
                    this.state.darkMode = false;
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-icon').className = 'fas fa-moon text-white';
                }
            },

            toggleTheme: function() {
                this.state.darkMode = !this.state.darkMode;
                const icon = document.getElementById('theme-icon');
                if (this.state.darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                    icon.className = 'fas fa-sun text-amber-300';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                    icon.className = 'fas fa-moon text-white';
                }
            },

            getPublicRef: function(colName) {
                return collection(db, 'artifacts', appId, 'public', 'data', colName);
            },

            getPrivateRef: function(colName) {
                if (!this.state.user) throw new Error("Chưa xác thực người dùng");
                return collection(db, 'artifacts', appId, 'users', this.state.user.uid, colName);
            },

            shuffleArray: function(array) {
                let shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            shuffleQuestionOptions: function(q) {
                if (!q.options || q.options.length === 0) return q;
                const originalCorrectText = q.options[q.correctAnswer];
                let shuffledOptions = [...q.options];
                shuffledOptions = this.shuffleArray(shuffledOptions);
                const newCorrectIndex = shuffledOptions.indexOf(originalCorrectText);
                return { ...q, options: shuffledOptions, correctAnswer: newCorrectIndex };
            },

            stopTimer: function() {
                if (this.state.timerInterval) {
                    clearInterval(this.state.timerInterval);
                    this.state.timerInterval = null;
                }
            },

            startTimer: function(durationSeconds) {
                this.stopTimer();
                this.state.remainingSeconds = durationSeconds;
                
                this.state.timerInterval = setInterval(() => {
                    this.state.remainingSeconds--;
                    const timerEl = document.getElementById('test-timer-display');
                    
                    if (timerEl) {
                        const m = Math.floor(this.state.remainingSeconds / 60);
                        const s = this.state.remainingSeconds % 60;
                        timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        
                        if (this.state.remainingSeconds <= 300) {
                            timerEl.classList.add('text-rose-600', 'animate-pulse');
                        }
                    }

                    if (this.state.remainingSeconds <= 0) {
                        this.stopTimer();
                        this.showNotification("Đã hết thời gian làm bài! Tự động nộp bài...", "warning");
                        setTimeout(() => this.finishTest(), 1500);
                    }
                }, 1000);
            },

            navigate: function(view, params = {}) {
                this.stopTimer();
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }

                if (params.category) {
                    this.state.activeCategory = params.category;
                }

                this.state.currentView = view;
                const contentArea = document.getElementById('app-content');

                switch(view) {
                    case 'home':
                        contentArea.innerHTML = this.views.home();
                        break;
                    case 'admin_dashboard':
                        contentArea.innerHTML = this.views.adminDashboard();
                        break;
                    case 'admin_manage':
                        this.loadAdminQuestions(this.state.activeCategory);
                        break;
                    case 'test_start':
                        contentArea.innerHTML = this.views.testStart(this.state.activeCategory);
                        break;
                    case 'test_run':
                        this.startTestSession(this.state.activeCategory);
                        break;
                    case 'history':
                        this.loadHistory();
                        break;
                    case 'vocab_book':
                        this.loadVocabBook();
                        break;
                }
            },

            startTestSession: async function(categoryId) {
                this.renderLoading("Đang nạp bộ đề thi...");
                
                try {
                    let rawQuestions = [];
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    
                    snapshot.forEach(doc => rawQuestions.push({ id: doc.id, ...doc.data() }));

                    if (rawQuestions.length === 0) {
                        this.showNotification("Chưa có câu hỏi cho phần thi này", "warning");
                        this.navigate('test_start', { category: categoryId });
                        return;
                    }

                    let preparedQuestions = [];

                    if (categoryId === 'grammar') {
                        let grammarPart = rawQuestions.filter(q => q.subType === 'grammar' || !q.subType);
                        let vocabMatch1 = rawQuestions.filter(q => q.subType === 'vocab_matching_p1');
                        let vocabMatch2 = rawQuestions.filter(q => q.subType === 'vocab_matching_p2');

                        grammarPart = this.shuffleArray(grammarPart).map(q => this.shuffleQuestionOptions(q));
                        grammarPart = grammarPart.map(q => ({ ...q, part: 'Grammar' }));

                        // Logic gộp 5 từ vựng thành 1 câu hỏi Matching và sinh 10 đáp án
                        const createVocabGroups = (pool, pNum) => {
                            pool = this.shuffleArray(pool);
                            let groups = [];
                            while (pool.length > 0) {
                                let count = Math.min(5, pool.length);
                                let selected = pool.splice(0, count);
                                
                                // Tìm các từ khác trong DB để làm đáp án nhiễu (Dummies)
                                let targetSubType = pNum === 1 ? 'vocab_matching_p1' : 'vocab_matching_p2';
                                let otherPool = rawQuestions.filter(q => q.subType === targetSubType && !selected.find(s => s.id === q.id));
                                otherPool = this.shuffleArray(otherPool);
                                
                                // Cố gắng lấy thêm đủ dummy để tổng có 10 options
                                let dummies = otherPool.slice(0, 10 - count);
                                
                                let allOptions = [...selected.map(s => s.target), ...dummies.map(d => d.target)];
                                allOptions = this.shuffleArray(allOptions);
                                
                                groups.push({
                                    isVocabMatching: true,
                                    subType: targetSubType,
                                    part: pNum === 1 ? 'Vocab Part 1' : 'Vocab Part 2',
                                    pairs: selected.map(s => ({ word: s.word, target: s.target })),
                                    options: allOptions
                                });
                            }
                            return groups;
                        };

                        let vGroups1 = createVocabGroups(vocabMatch1, 1);
                        let vGroups2 = createVocabGroups(vocabMatch2, 2);

                        preparedQuestions = [...grammarPart, ...vGroups1, ...vGroups2];
                    } else if (categoryId === 'reading') {
                        rawQuestions.sort((a, b) => (new Date(a.createdAt) - new Date(b.createdAt))); 
                        
                        rawQuestions.forEach(doc => {
                            let subQs = doc.subQuestions || [];
                            if (subQs.length === 0 && doc.text) {
                                subQs = [{ text: doc.text, options: doc.options, correctAnswer: doc.correctAnswer, explanation: doc.explanation }];
                            }
                            
                            subQs.forEach((subQ, idx) => {
                                let flatQ = {
                                    id: `${doc.id}_${idx}`,
                                    passageId: doc.id,
                                    passageTitle: doc.passageTitle,
                                    passage: doc.passage,
                                    isReadingGroup: true,
                                    subQuestionIndex: idx,
                                    totalSubQuestions: subQs.length,
                                    text: subQ.text,
                                    options: subQ.options,
                                    correctAnswer: subQ.correctAnswer,
                                    explanation: subQ.explanation
                                };
                                preparedQuestions.push(this.shuffleQuestionOptions(flatQ));
                            });
                        });
                    } else if (categoryId === 'speaking' || categoryId === 'writing') {
                        preparedQuestions = rawQuestions.sort((a, b) => (a.part || 1) - (b.part || 1));
                    } else {
                        preparedQuestions = this.shuffleArray(rawQuestions).map(q => this.shuffleQuestionOptions(q));
                    }

                    this.state.test = {
                        questions: preparedQuestions,
                        currentIndex: 0,
                        answers: new Array(preparedQuestions.length).fill(null),
                        writingAnswers: new Array(preparedQuestions.length).fill(''),
                        speakingAudioBlobs: new Array(preparedQuestions.length).fill(null),
                        listeningPlayCounts: new Array(preparedQuestions.length).fill(0),
                        startTime: new Date(),
                        isReviewMode: false
                    };

                    const categoryConfig = CATEGORIES[categoryId];
                    if (categoryConfig.timeLimit) {
                        this.startTimer(categoryConfig.timeLimit);
                    }

                    this.renderCurrentQuestion();

                } catch (error) {
                    console.error("Test start error:", error);
                    this.showNotification("Không thể khởi tạo bài thi", "error");
                    this.navigate('home');
                }
            },

            handleAudioEnded: function(qIndex) {
                const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                if (btnText) {
                    const played = this.state.test.listeningPlayCounts[qIndex] || 0;
                    btnText.innerText = played >= 2 ? 'Đã Hết Lượt Nghe' : 'Phát Lại Audio';
                }
                const btn = document.getElementById(`play-btn-${qIndex}`);
                if (btn && this.state.test.listeningPlayCounts[qIndex] >= 2) {
                    btn.disabled = true;
                    btn.className = 'px-6 py-3 bg-gray-400 text-white font-bold rounded-2xl cursor-not-allowed opacity-60 flex items-center';
                }
            },

            handleAudioError: function(qIndex) {
                this.showNotification("Lỗi tải file audio. Vui lòng kiểm tra lại đường dẫn file mp3.", "error");
            },

            playListeningAudio: function(qIndex) {
                const test = this.state.test;
                const played = test.listeningPlayCounts[qIndex] || 0;

                if (played >= 2) {
                    this.showNotification("Bạn đã hết 2 lượt nghe cho câu hỏi này!", "warning");
                    return;
                }

                const audioEl = document.getElementById(`audio-player-${qIndex}`);
                if (audioEl) {
                    if (!audioEl.paused) return;

                    audioEl.currentTime = 0;
                    audioEl.play().then(() => {
                        test.listeningPlayCounts[qIndex] = played + 1;
                        const btnText = document.getElementById(`play-btn-text-${qIndex}`);
                        const counterText = document.getElementById(`play-counter-${qIndex}`);
                        
                        if (counterText) counterText.innerText = `Đã nghe ${test.listeningPlayCounts[qIndex]}/2 lần`;
                        if (btnText) btnText.innerText = 'Đang phát...';
                    }).catch(e => {
                        this.showNotification("Không thể phát audio. Kiểm tra lại URL.", "error");
                    });
                }
            },

            toggleAudioRecording: async function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                } else {
                    await this.startAudioRecording();
                }
            },

            startAudioRecording: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.state.audioChunks = [];
                    this.state.mediaRecorder = new MediaRecorder(stream);

                    this.state.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) this.state.audioChunks.push(event.data);
                    };

                    this.state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(this.state.audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            const currentIndex = this.state.test.currentIndex;
                            this.state.test.speakingAudioBlobs[currentIndex] = base64Audio;
                            this.state.test.answers[currentIndex] = { selected: true, isCorrect: true };
                            
                            const audioPreview = document.getElementById('audio-recording-preview');
                            if (audioPreview) {
                                audioPreview.src = base64Audio;
                                audioPreview.classList.remove('hidden');
                            }
                            this.showNotification("Đã ghi âm bài nói thành công!", "success");
                        };
                    };

                    this.state.mediaRecorder.start();
                    this.state.isRecording = true;

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-stop text-white mr-2"></i> Dừng Ghi Âm';
                        recBtn.className = 'px-6 py-3 bg-rose-600 text-white font-bold rounded-2xl pulse-recording flex items-center shadow-lg';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '🔴 Đang ghi âm bài nói của bạn... Hãy phát âm rõ ràng.';

                } catch (err) {
                    this.showNotification("Không thể kết nối Micro. Vui lòng cấp quyền truy cập Mic.", "error");
                }
            },

            stopAudioRecording: function() {
                if (this.state.mediaRecorder && this.state.isRecording) {
                    this.state.mediaRecorder.stop();
                    this.state.isRecording = false;
                    this.state.mediaRecorder.stream.getTracks().forEach(track => track.stop());

                    const recBtn = document.getElementById('record-mic-btn');
                    if (recBtn) {
                        recBtn.innerHTML = '<i class="fas fa-microphone text-white mr-2"></i> Ghi Âm Lại';
                        recBtn.className = 'px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl flex items-center shadow-md hover:bg-indigo-700';
                    }
                    const statusText = document.getElementById('recording-status-text');
                    if (statusText) statusText.innerText = '✅ Đã hoàn thành ghi âm.';
                }
            },

            selectOption: function(optionIndex) {
                const test = this.state.test;
                if (test.answers[test.currentIndex] !== null || test.isReviewMode) return;

                const question = test.questions[test.currentIndex];
                const isCorrect = (optionIndex === question.correctAnswer);

                test.answers[test.currentIndex] = {
                    selected: optionIndex,
                    isCorrect: isCorrect
                };

                this.applyFeedbackStyles(question, optionIndex, isCorrect);
            },

            selectVocabMatching: function(pairIndex, value) {
                const test = this.state.test;
                if (test.isReviewMode) return;
                
                if (!test.answers[test.currentIndex]) {
                    test.answers[test.currentIndex] = { selected: [], isCorrect: false };
                }
                
                test.answers[test.currentIndex].selected[pairIndex] = value;
            },

            saveWritingInput: function(val) {
                const test = this.state.test;
                test.writingAnswers[test.currentIndex] = val;
                
                const wordCount = val.trim() ? val.trim().split(/\s+/).length : 0;
                const counterEl = document.getElementById('word-counter');
                if (counterEl) counterEl.innerText = `${wordCount} từ`;
                
                test.answers[test.currentIndex] = { selected: true, isCorrect: true };
            },

            applyFeedbackStyles: function(question, selectedIndex, isCorrect) {
                const buttons = document.querySelectorAll('.option-btn');
                
                buttons.forEach((btn, idx) => {
                    btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50', 'dark:hover:border-indigo-500', 'dark:hover:bg-indigo-900/20', 'cursor-pointer');
                    btn.classList.add('cursor-default');
                    btn.onclick = null;
                    
                    const iconBox = btn.querySelector('.icon-container');
                    
                    if (idx === question.correctAnswer) {
                        btn.classList.add('correct');
                        iconBox.innerHTML = '<i class="fas fa-check"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.classList.add('incorrect');
                        iconBox.innerHTML = '<i class="fas fa-times"></i>';
                        iconBox.className = 'icon-container w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center mr-4 shrink-0 text-sm';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });

                const feedbackArea = document.getElementById('feedback-area');
                if (feedbackArea) feedbackArea.classList.remove('hidden');
            },

            renderCurrentQuestion: function() {
                const test = this.state.test;
                const question = test.questions[test.currentIndex];
                const cat = CATEGORIES[this.state.activeCategory];

                if (!question) {
                    this.finishTest();
                    return;
                }

                document.getElementById('app-content').innerHTML = this.views.testInterface(
                    question,
                    test.currentIndex,
                    test.questions.length,
                    cat,
                    test.answers[test.currentIndex]
                );
            },

            nextQuestion: function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }

                const test = this.state.test;
                const catId = this.state.activeCategory;
                const currentQ = test.questions[test.currentIndex];

                if (currentQ.isVocabMatching) {
                    const ans = test.answers[test.currentIndex];
                    const selectedCount = (ans && ans.selected) ? ans.selected.filter(x => x && x !== '').length : 0;
                    if (selectedCount < currentQ.pairs.length) {
                        this.showNotification(`Vui lòng ghép đủ ${currentQ.pairs.length} từ trước khi chuyển câu`, "warning");
                        return;
                    }
                } else if (!['writing', 'speaking'].includes(catId) && test.answers[test.currentIndex] === null) {
                    this.showNotification("Vui lòng chọn đáp án trước khi chuyển câu", "warning");
                    return;
                }

                test.currentIndex++;

                if (test.currentIndex >= test.questions.length) {
                    this.finishTest();
                } else {
                    this.renderCurrentQuestion();
                }
            },

            prevQuestion: function() {
                if (this.state.isRecording) {
                    this.stopAudioRecording();
                }
                const test = this.state.test;
                if (test.currentIndex > 0) {
                    test.currentIndex--;
                    this.renderCurrentQuestion();
                }
            },

            finishTest: async function() {
                this.stopTimer();
                if (this.state.isRecording) this.stopAudioRecording();

                this.renderLoading("Đang tổng hợp điểm và lưu bài thi...");
                
                const test = this.state.test;
                let correctCount = 0;
                let total = 0;

                test.questions.forEach((q, i) => {
                    const ans = test.answers[i];
                    if (q.isVocabMatching) {
                        total += q.pairs.length; // Mỗi cặp từ ghép đúng tính 1 điểm
                        if (ans && ans.selected) {
                            ans.selected.forEach((sel, idx) => {
                                if (sel === q.pairs[idx].target) {
                                    correctCount++;
                                }
                            });
                        }
                    } else {
                        total += 1;
                        if (ans && ans.isCorrect) correctCount++;
                    }
                });

                const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 100;
                const timeTakenSec = Math.round((new Date() - test.startTime) / 1000);

                const record = {
                    categoryId: this.state.activeCategory,
                    categoryName: CATEGORIES[this.state.activeCategory].name,
                    correctCount: correctCount,
                    totalQuestions: total,
                    score: percentage,
                    timeTakenSec: timeTakenSec,
                    date: new Date().toISOString(),
                    questions: test.questions,
                    answers: test.answers,
                    writingAnswers: test.writingAnswers,
                    speakingAudioBlobs: test.speakingAudioBlobs
                };

                try {
                    await addDoc(this.getPrivateRef('test_history'), record);
                } catch (e) {
                    console.error("Lỗi lưu lịch sử thi:", e);
                }

                this.renderResultScreen(correctCount, total, percentage, timeTakenSec);
            },

                document.getElementById('app-content').innerHTML = `

                        <div class="glass-panel rounded-3xl p-8 text-center relative overflow-hidden shadow-xl">
                            <div class="w-20 h-20 mx-auto rounded-full bg-indigo-50 dark:bg-indigo-950/50 flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-3xl mb-4 border border-indigo-100 dark:border-indigo-800">
                                <i class="fas fa-trophy"></i>
                            </div>
                            <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-1">Hoàn Thành Bài Thi!</h2>
                            <p class="text-gray-500 dark:text-dark-textMuted mb-6">${cat.name}</p>

                            ${['writing', 'speaking'].includes(cat.id) ? `
                                <div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 p-4 rounded-2xl mb-6 text-sm text-left leading-relaxed">
                                    <i class="fas fa-circle-check mr-2 text-emerald-600"></i> Bài thi tự luận/ghi âm bài nói của bạn đã được lưu trữ thành công.
                                </div>
                            ` : `
                                <div class="bg-gray-50 dark:bg-dark-bg p-6 rounded-2xl mb-6 border border-gray-100 dark:border-dark-border">
                                    <div class="text-5xl font-black ${percentage >= 70 ? 'text-emerald-500' : 'text-indigo-600'} mb-2">${percentage}%</div>
                                    <p class="text-sm font-semibold text-gray-600 dark:text-gray-400">Trả lời đúng ${correct} / ${total} câu hỏi</p>
                                    <p class="text-xs text-gray-400 mt-1">Thời gian làm bài: ${timeStr}</p>
                                </div>
                            `}

                            <div class="flex flex-col sm:flex-row justify-center gap-3">
                                <button onclick="app.navigate('home')" class="px-6 py-3 bg-gray-100 dark:bg-dark-bg text-gray-700 dark:text-gray-300 rounded-xl font-bold hover:bg-gray-200 transition-colors">
                                    <i class="fas fa-house mr-2"></i> Trang chủ
                                </button>
                                <button onclick="app.startTestSession('${cat.id}')" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 dark:shadow-none transition-colors">
                                    <i class="fas fa-rotate-right mr-2"></i> Thi lại ngay
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            loadAdminQuestions: async function(categoryId) {
                this.renderLoading(`Đang nạp ngân hàng câu hỏi...`);
                try {
                    const snapshot = await getDocs(query(this.getPublicRef(`questions_${categoryId}`)));
                    let list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));

                    list.sort((a, b) => {
                        const partA = a.part || 1;
                        const partB = b.part || 1;
                        if (partA !== partB) return partA - partB;
                        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                    });

                    this.state.adminQuestions = list;
                    document.getElementById('app-content').innerHTML = this.views.adminManage(categoryId, list);
                } catch (error) {
                    console.error("Admin load error:", error);
                    this.showNotification("Lỗi tải danh sách câu hỏi", "error");
                    this.navigate('admin_dashboard');
                }
            },

            filterAdminQuestions: function(term, categoryId) {
                term = term.toLowerCase().trim();
                const filtered = this.state.adminQuestions.filter(q => {
                    const text = (q.text || '').toLowerCase();
                    const passage = (q.passage || '').toLowerCase();
                    const passageTitle = (q.passageTitle || '').toLowerCase();
                    const word = (q.word || '').toLowerCase();
                    const target = (q.target || '').toLowerCase();
                    return text.includes(term) || passage.includes(term) || passageTitle.includes(term) || word.includes(term) || target.includes(term);
                });
                
                const container = document.getElementById('admin-questions-container');
                const badge = document.getElementById('question-total-badge');
                if (container) {
                    container.innerHTML = this.views.adminQuestionList(filtered, categoryId);
                }
                if (badge) {
                    badge.innerText = `Tìm thấy: ${filtered.length} câu`;
                }
            },

            toggleGrammarFormFields: function(val) {
                const isMCQ = (val === 'grammar' || val === 'vocab');
                const mcqEl = document.getElementById('mcq_fields');
                const vocabEl = document.getElementById('vocab_fields');
                const qText = document.getElementById('q_text_input');
                
                if (mcqEl) mcqEl.style.display = isMCQ ? 'block' : 'none';
                if (vocabEl) vocabEl.style.display = !isMCQ ? 'block' : 'none';

                if (vocabLabel) {
                    vocabLabel.innerHTML = val === 'vocab_matching_p2' ? 'Định nghĩa (Tương ứng với từ chính)' : 'Từ đồng nghĩa (Tương ứng với từ chính)';
                }
                
                if (isMCQ) {
                    if (qText) qText.setAttribute('required', 'true');

                    document.getElementById('v_word_input')?.setAttribute('required', 'true');
                    document.getElementById('v_target_input')?.setAttribute('required', 'true');
                }
            },

                if (!container) return;
                
                this.readingQCounter++;
                const cid = this.readingQCounter;
                const d = data || { text: '', options: ['','',''], correctAnswer: 0, explanation: '' };

                    <div class="space-y-2 mb-3">

                                <input type="radio" name="sub_correct_${cid}" value="${i}" ${d.correctAnswer === i || (i===0 && !d.options) ? 'checked' : ''} required class="w-4 h-4 text-indigo-600">

                `;
                container.appendChild(div);
            },

            saveAdminQuestion: async function(event, categoryId, isEdit = false, docId = null) {
                event.preventDefault();
                const form = event.target;
                const submitBtn = form.querySelector('button[type="submit"]');

                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang lưu...';
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

                let qObj = {
                    part: form.q_part ? parseInt(form.q_part.value) : 1
                };

                if (!isEdit) {
                    qObj.createdAt = new Date().toISOString();
                }

                if (categoryId === 'grammar') {
                    qObj.subType = form.sub_type.value;
                    if (qObj.subType === 'vocab_matching_p1' || qObj.subType === 'vocab_matching_p2') {
                        qObj.word = form.v_word.value.trim();
                        qObj.target = form.v_target.value.trim();
                        // Xóa các key không cần thiết nếu sửa từ câu trắc nghiệm sang
                        delete qObj.text; delete qObj.options; delete qObj.correctAnswer;
                    } else {
                        qObj.text = form.q_text.value.trim();
                        qObj.options = [form.opt_0.value, form.opt_1.value, form.opt_2.value];
                        qObj.correctAnswer = parseInt(form.correct_opt.value);
                        qObj.explanation = form.q_explanation ? form.q_explanation.value.trim() : '';
                        delete qObj.word; delete qObj.target;
                    }
                }

                if (categoryId === 'listening') {
                    qObj.text = form.q_text.value.trim();
                    if (form.audio_url) qObj.audioUrl = form.audio_url.value.trim();
                    qObj.options = [form.opt_0.value, form.opt_1.value, form.opt_2.value];
                    qObj.correctAnswer = parseInt(form.correct_opt.value);
                    qObj.explanation = form.q_explanation ? form.q_explanation.value.trim() : '';
                }

                if (categoryId === 'speaking') {
                    qObj.text = form.q_text.value.trim();
                    qObj.subQuestion = form.q_sub_question ? form.q_sub_question.value.trim() : '';
                    let imgArr = [];
                    if (form.q_image1 && form.q_image1.value.trim()) imgArr.push(form.q_image1.value.trim());
                    if (form.q_image2 && form.q_image2.value.trim()) imgArr.push(form.q_image2.value.trim());
                    qObj.images = imgArr;
                }
                
                if (categoryId === 'writing') {
                     qObj.text = form.q_text.value.trim();
                }

                if (categoryId === 'reading') {
                    qObj.passageTitle = form.q_passage_title ? form.q_passage_title.value.trim() : 'Bài đọc';
                    qObj.passage = form.q_passage.value.trim();
                    
                    const blocks = form.querySelectorAll('.reading-sub-question');
                    if (blocks.length === 0) {
                        this.showNotification("Vui lòng thêm ít nhất 1 câu hỏi cho đoạn văn này!", "warning");
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                        return;
                    }
                    
                    qObj.subQuestions = Array.from(blocks).map(block => {
                        const radioChecked = block.querySelector(`input[type="radio"]:checked`);
                        return {
                            text: block.querySelector('[name="sub_q_text[]"]').value.trim(),
                            options: [
                                block.querySelector('[name="sub_opt_0[]"]').value.trim(),
                                block.querySelector('[name="sub_opt_1[]"]').value.trim(),
                                block.querySelector('[name="sub_opt_2[]"]').value.trim()
                            ],
                            correctAnswer: radioChecked ? parseInt(radioChecked.value) : 0,
                            explanation: block.querySelector('[name="sub_explanation[]"]').value.trim()
                        };
                    });
                }

                try {
                    if (isEdit && docId) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', `questions_${categoryId}`, docId), qObj);
                        this.showNotification("Cập nhật câu hỏi thành công!", "success");
                    } else {
                        await addDoc(this.getPublicRef(`questions_${categoryId}`), qObj);
                        this.showNotification("Thêm câu hỏi mới thành công!", "success");
                    }
                    this.closeModal();
                    this.loadAdminQuestions(categoryId);
                } catch (e) {
                    console.error("Save error:", e);
                    this.showNotification("Lỗi khi lưu câu hỏi", "error");
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                }
            },

            deleteAdminQuestion: async function(categoryId, docId) {
                if (!await this.showConfirm("Xóa câu hỏi", "Bạn có chắc chắn muốn xóa dữ liệu này khỏi kho đề?")) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `questions_${categoryId}`, docId));
                    this.showNotification("Đã xóa thành công", "success");
                    
                    const cardEl = document.getElementById(`q-card-${docId}`);
                    if (cardEl) {
                        cardEl.style.transition = 'all 0.3s ease';
                        cardEl.style.opacity = '0';
                        cardEl.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            cardEl.remove();
                            const countBadge = document.getElementById('question-total-badge');
                            if (countBadge) {
                                const currentCount = parseInt(countBadge.innerText.replace(/\D/g, '') || '0');
                                if (currentCount > 0) countBadge.innerText = `Tổng: ${currentCount - 1} mục`;
                            }
                        }, 300);
                    }
                } catch (e) {
                    this.showNotification("Không thể xóa", "error");
                }
            },

            editAdminQuestion: function(categoryId, docId) {
                const qData = this.state.adminQuestions.find(q => q.id === docId);
                if (!qData) {
                    this.showNotification("Không tìm thấy dữ liệu câu hỏi!", "error");
                    return;
                }
                this.showModal(`Chỉnh sửa (${CATEGORIES[categoryId].name})`, this.views.questionForm(categoryId, qData, true, docId));
                
                if (categoryId === 'reading') {
                    let subQs = qData.subQuestions || [];
                    if (subQs.length === 0 && qData.text) {
                        subQs = [{ text: qData.text, options: qData.options, correctAnswer: qData.correctAnswer, explanation: qData.explanation }];
                    }
                    setTimeout(() => {
                        const container = document.getElementById('reading-sub-qs-container');
                        if (container) {
                            subQs.forEach(sub => this.addReadingSubQuestion('reading-sub-qs-container', sub));
                        }
                    }, 50);
                }
            },

            loadHistory: async function() {
                this.renderLoading("Đang tải lịch sử thi...");
                try {
                    const snapshot = await getDocs(query(this.getPrivateRef('test_history')));
                    let records = [];
                    snapshot.forEach(doc => records.push({ id: doc.id, ...doc.data() }));
                    records.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    this.state.historyRecords = records;
                    document.getElementById('app-content').innerHTML = this.views.historyList(records);
                } catch (e) {
                    this.showNotification("Lỗi nạp lịch sử thi", "error");
                    this.navigate('home');
                }
            },

            deleteHistoryRecord: async function(recordId) {
                if (!await this.showConfirm("Xóa lịch sử", "Bạn có chắc chắn muốn xóa kết quả bài thi này?")) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', this.state.user.uid, 'test_history', recordId));
                    this.showNotification("Đã xóa lịch sử thi", "success");
                    this.loadHistory();
                } catch (e) {
                    this.showNotification("Không thể xóa lịch sử", "error");
                }
            },

            reviewHistoryRecord: function(recordId) {
                const record = this.state.historyRecords.find(r => r.id === recordId);
                if (!record || !record.questions || record.questions.length === 0) {
                    this.showNotification("Bài thi này không chứa dữ liệu câu hỏi để xem lại", "warning");
                    return;
                }

                this.state.activeCategory = record.categoryId;
                this.state.test = {
                    questions: record.questions,
                    currentIndex: 0,
                    answers: record.answers || new Array(record.questions.length).fill(null),
                    writingAnswers: record.writingAnswers || new Array(record.questions.length).fill(''),
                    speakingAudioBlobs: record.speakingAudioBlobs || new Array(record.questions.length).fill(null),
                    listeningPlayCounts: new Array(record.questions.length).fill(2),
                    startTime: new Date(),
                    isReviewMode: true
                };

                this.renderCurrentQuestion();
                
                setTimeout(() => {
                    const currentAns = record.answers ? record.answers[0] : null;
                    const question = record.questions[0];
                    if (currentAns !== null && currentAns !== undefined && typeof currentAns === 'object' && !question.isVocabMatching && question.options) {
                        this.applyFeedbackStyles(question, currentAns.selected, currentAns.isCorrect);
                    }
                }, 100);
            },

            loadVocabBook: async function() {
                this.renderLoading("Đang tải sổ tay từ vựng...");
                try {
                    const snapshot = await getDocs(query(this.getPrivateRef('vocab_book')));
                    let words = [];
                    snapshot.forEach(doc => words.push({ id: doc.id, ...doc.data() }));
                    words.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                    document.getElementById('app-content').innerHTML = this.views.vocabBook(words);
                } catch (e) {
                    this.showNotification("Lỗi nạp sổ tay từ vựng", "error");
                    this.navigate('home');
                }
            },

            saveVocabWord: async function(event) {
                event.preventDefault();
                const form = event.target;
                const data = {
                    word: form.word.value.trim(),
                    type: form.type.value,
                    meaning: form.meaning.value.trim(),
                    example: form.example.value.trim(),
                    createdAt: new Date().toISOString()
                };

                try {
                    await addDoc(this.getPrivateRef('vocab_book'), data);
                    this.showNotification("Đã thêm từ mới vào sổ tay", "success");
                    this.loadVocabBook();
                    this.closeModal();
                } catch (e) {
                    this.showNotification("Không thể lưu từ vựng", "error");
                }
            },

            deleteVocabWord: async function(id) {
                if (!await this.showConfirm("Xóa từ vựng", "Xóa từ này khỏi sổ tay của bạn?")) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', this.state.user.uid, 'vocab_book', id));
                    this.showNotification("Đã xóa từ vựng", "success");
                    this.loadVocabBook();
                } catch (e) {
                    this.showNotification("Lỗi khi xóa", "error");
                }
            },
