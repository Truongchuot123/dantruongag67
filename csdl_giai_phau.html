<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nội Dung Giải Phẫu Cơ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        borderbg: '#334155',
                        accenten: '#38bdf8', // Màu xanh lam nổi bật cho tên tiếng Anh
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .rich-editor-content p {
            margin-bottom: 0.25rem;
        }
        .editor-btn {
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #334155;
            color: #e2e8f0;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .editor-btn:hover {
            background-color: #475569;
            color: #ffffff;
        }
        /* Style cho vùng soạn thảo rich text */
        .editable-area {
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            background-color: #0f172a;
            color: #f8fafc;
            outline: none;
        }
        .editable-area:focus {
            border-color: #6366f1;
            ring: 2px solid #6366f1;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen pt-[20px] px-4 md:px-8 pb-10">

    <div class="max-w-[1700px] mx-auto space-y-6">

        <!-- Top Controls / Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-cardbg p-4 rounded-xl border border-borderbg shadow-lg">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-indigo-600/20 rounded-lg text-indigo-400">
                    <i class="fa-solid fa-bone text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">QUẢN LÝ NỘI DUNG GIẢI PHẪU CƠ</h1>
                    <p class="text-xs text-slate-400">Hệ thống lưu trữ & tra cứu thuật ngữ giải phẫu học</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Search Box -->
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên cơ, vùng, thần kinh..." 
                        class="w-full pl-9 pr-4 py-2 bg-darkbg border border-borderbg rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                
                <!-- Filter by Region -->
                <select id="filterRegion" class="bg-darkbg border border-borderbg rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">-- Tất cả vùng --</option>
                    <option value="Đầu - Mặt - Cổ">Đầu - Mặt - Cổ</option>
                    <option value="Ngực - Lưng">Ngực - Lưng</option>
                    <option value="Bụng - Chậu">Bụng - Chậu</option>
                    <option value="Chi trên">Chi trên</option>
                    <option value="Chi dưới">Chi dưới</option>
                </select>

                <!-- Add Button -->
                <button id="btnOpenModal" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-lg shadow-indigo-600/30 transition-all duration-200 active:scale-95">
                    <i class="fa-solid fa-plus"></i> Thêm Cơ Mới
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-cardbg border border-borderbg rounded-xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[1200px]">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-300 text-xs font-semibold uppercase tracking-wider border-b border-borderbg">
                            <th class="p-3.5 w-28">Vùng</th>
                            <th class="p-3.5 w-44">Tên cơ (VN)</th>
                            <th class="p-3.5 w-48 text-accenten">Tên cơ (EN)</th>
                            <th class="p-3.5 w-24 text-center">Hình ảnh</th>
                            <th class="p-3.5 w-48">Nguyên ủy</th>
                            <th class="p-3.5 w-48">Bám tận</th>
                            <th class="p-3.5 w-48">Chức năng</th>
                            <th class="p-3.5 w-40">Thần kinh</th>
                            <th class="p-3.5 w-48">Bệnh lý liên quan</th>
                            <th class="p-3.5 w-40">Ghi chú</th>
                            <th class="p-3.5 w-24 text-center sticky right-0 bg-slate-800 shadow-lg">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="anatomyTableBody" class="divide-y divide-borderbg/60 text-sm">
                        <!-- Table content dynamically generated -->
                        <tr>
                            <td colspan="11" class="text-center py-12 text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-400"></i>
                                <p>Đang tải dữ liệu từ hệ thống...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Form (Create / Edit) -->
    <div id="anatomyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-cardbg border border-borderbg w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden my-8 transform transition-all">
            <!-- Modal Header -->
            <div class="flex justify-between items-center px-6 py-4 border-b border-borderbg bg-slate-800/50">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-400"></i> Thêm Dữ Liệu Cơ Mới
                </h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Form -->
            <form id="anatomyForm" class="p-6 space-y-5">
                <input type="hidden" id="docId" value="">

                <!-- Row 1: Vùng, Tên VN, Tên EN -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Vùng cơ <span class="text-red-400">*</span></label>
                        <select id="inputVung" required class="w-full bg-darkbg border border-borderbg rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Đầu - Mặt - Cổ">Đầu - Mặt - Cổ</option>
                            <option value="Ngực - Lưng">Ngực - Lưng</option>
                            <option value="Bụng - Chậu">Bụng - Chậu</option>
                            <option value="Chi trên">Chi trên</option>
                            <option value="Chi dưới">Chi dưới</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Tên cơ (Tiếng Việt) <span class="text-red-400">*</span></label>
                        <input type="text" id="inputTenVN" required placeholder="Ví dụ: Cơ nhị đầu cánh tay" class="w-full bg-darkbg border border-borderbg rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1 text-accenten">Tên cơ (Tiếng Anh) <span class="text-red-400">*</span></label>
                        <input type="text" id="inputTenEN" required placeholder="Ví dụ: Biceps brachii" class="w-full bg-darkbg border border-borderbg rounded-lg px-3 py-2 text-accenten font-medium focus:outline-none focus:border-sky-400">
                    </div>
                </div>

                <!-- Row 2: Link Ảnh -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Đường dẫn / Link Hình ảnh</label>
                    <input type="text" id="inputHinhAnh" placeholder="Ví dụ: /hinhanh/co-nhi-dau.jpg hoặc https://link-anh.com/co.png" class="w-full bg-darkbg border border-borderbg rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Shared Rich Text Toolbar -->
                <div class="bg-slate-800/80 p-2 rounded-lg border border-borderbg flex flex-wrap gap-2 items-center text-xs">
                    <span class="text-slate-400 font-semibold mr-2">Công cụ định dạng:</span>
                    <button type="button" onclick="formatDoc('bold')" class="editor-btn" title="In đậm (Ctrl+B)"><i class="fa-solid fa-bold"></i> Đậm</button>
                    <button type="button" onclick="formatDoc('italic')" class="editor-btn" title="In nghiêng (Ctrl+I)"><i class="fa-solid fa-italic"></i> Nghiêng</button>
                    <button type="button" onclick="formatDoc('underline')" class="editor-btn" title="Gạch chân"><i class="fa-solid fa-underline"></i> Gạch chân</button>
                    
                    <div class="h-4 w-[1px] bg-slate-600 mx-1"></div>
                    
                    <span class="text-slate-400">Màu chữ:</span>
                    <button type="button" onclick="formatDoc('foreColor', '#f87171')" class="w-5 h-5 rounded bg-red-400 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('foreColor', '#fbbf24')" class="w-5 h-5 rounded bg-amber-400 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('foreColor', '#34d399')" class="w-5 h-5 rounded bg-emerald-400 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('foreColor', '#38bdf8')" class="w-5 h-5 rounded bg-sky-400 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('foreColor', '#c084fc')" class="w-5 h-5 rounded bg-purple-400 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('foreColor', '#ffffff')" class="w-5 h-5 rounded bg-white border border-slate-500 hover:scale-110 transition"></button>
                    <button type="button" onclick="formatDoc('removeFormat')" class="editor-btn ml-auto"><i class="fa-solid fa-eraser"></i> Xóa định dạng</button>
                </div>

                <!-- Rich Text Editable Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nguyên ủy</label>
                        <div id="editorNguyenUy" contenteditable="true" class="editable-area"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Bám tận</label>
                        <div id="editorBamTan" contenteditable="true" class="editable-area"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Chức năng</label>
                        <div id="editorChucNang" contenteditable="true" class="editable-area"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Thần kinh chi phối</label>
                        <div id="editorThanKinh" contenteditable="true" class="editable-area"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Các bệnh lý liên quan</label>
                        <div id="editorBenhLy" contenteditable="true" class="editable-area"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Ghi chú</label>
                        <div id="editorGhiChu" contenteditable="true" class="editable-area"></div>
                    </div>
                </div>

                <!-- Modal Actions -->
                <div class="flex justify-end gap-3 pt-4 border-t border-borderbg">
                    <button type="button" id="btnCancel" class="px-4 py-2 rounded-lg border border-borderbg text-slate-300 hover:bg-slate-800 transition">Hủy bỏ</button>
                    <button type="submit" id="btnSave" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imgPreviewModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeImgPreview()">
        <div class="relative max-w-3xl max-h-[85vh] bg-cardbg p-2 rounded-xl border border-borderbg overflow-hidden shadow-2xl">
            <button class="absolute top-3 right-3 text-white bg-black/60 rounded-full w-8 h-8 flex items-center justify-center hover:bg-black/90">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="previewImgSrc" src="" alt="Hình phóng to" class="max-w-full max-h-[80vh] object-contain rounded-lg">
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl z-50 hidden flex items-center gap-3 border border-indigo-400/30 transition-all duration-300">
        <i class="fa-solid fa-circle-check text-xl"></i>
        <span id="toastMsg">Thao tác thành công!</span>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            addDoc, 
            deleteDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Cấu hình Firebase do người dùng cung cấp
        const firebaseConfig = {
            apiKey: "AIzaSyDyXmxsZAg6JxgcsujSIwMfbZTHscfJSCg",
            authDomain: "dulieuweb-6541e.firebaseapp.com",
            projectId: "dulieuweb-6541e",
            storageBucket: "dulieuweb-6541e.firebasestorage.app",
            messagingSenderId: "215480268517",
            appId: "1:215480268517:web:16600eafd6839fee5dc60c"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến toàn cục dữ liệu
        let allMuscles = [];
        let currentUser = null;

        // Định dạng đường dẫn Firestore công khai theo quy tắc
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'giai-phau-app';
        const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'co_giai_phau');

        // Hàm Rich Text Editor
        window.formatDoc = function(cmd, value = null) {
            document.execCommand(cmd, false, value);
        };

        // Đăng nhập Firebase
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Lỗi xác thực Firebase:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadMusclesData();
            }
        });

        // Tải dữ liệu Thời gian thực từ Firestore
        function loadMusclesData() {
            if (!currentUser) return;

            onSnapshot(collectionPath, (snapshot) => {
                allMuscles = [];
                snapshot.forEach((docSnap) => {
                    allMuscles.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });
                renderTable();
            }, (error) => {
                console.error("Lỗi lấy dữ liệu:", error);
                showToast("Lỗi khi tải dữ liệu từ server!", "error");
            });
        }

        // Render bảng dữ liệu
        function renderTable() {
            const tbody = document.getElementById('anatomyTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterRegion = document.getElementById('filterRegion').value;

            // Lọc dữ liệu
            const filtered = allMuscles.filter(item => {
                const matchRegion = !filterRegion || item.vung === filterRegion;
                const matchSearch = !searchVal || 
                    (item.tenVN && item.tenVN.toLowerCase().includes(searchVal)) ||
                    (item.tenEN && item.tenEN.toLowerCase().includes(searchVal)) ||
                    (item.vung && item.vung.toLowerCase().includes(searchVal)) ||
                    (item.thanKinh && item.thanKinh.toLowerCase().includes(searchVal));
                return matchRegion && matchSearch;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="11" class="text-center py-10 text-slate-400">
                            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                            <p>Không tìm thấy dữ liệu phù hợp.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-800/50 transition-colors group">
                    <td class="p-3.5 align-top font-medium text-indigo-300">
                        <span class="inline-block px-2.5 py-1 rounded-md bg-indigo-950/60 border border-indigo-800/50 text-xs">
                            ${escapeHTML(item.vung || '')}
                        </span>
                    </td>
                    <td class="p-3.5 align-top font-bold text-white">${escapeHTML(item.tenVN || '')}</td>
                    <td class="p-3.5 align-top font-bold text-accenten">${escapeHTML(item.tenEN || '')}</td>
                    <td class="p-3.5 align-top text-center">
                        ${item.hinhAnh ? `
                            <img src="${escapeHTML(item.hinhAnh)}" 
                                 alt="${escapeHTML(item.tenVN)}" 
                                 onclick="openImgPreview('${escapeHTML(item.hinhAnh)}')"
                                 onerror="this.onerror=null; this.src='https://placehold.co/100x100/1e293b/38bdf8?text=Anh+Loi';"
                                 class="w-14 h-14 object-cover rounded-lg border border-borderbg hover:scale-105 transition cursor-pointer mx-auto shadow-sm">
                        ` : '<span class="text-slate-600 italic text-xs">Không có</span>'}
                    </td>
                    <td class="p-3.5 align-top text-slate-300 rich-editor-content">${item.nguyenUy || '-'}</td>
                    <td class="p-3.5 align-top text-slate-300 rich-editor-content">${item.bamTan || '-'}</td>
                    <td class="p-3.5 align-top text-slate-300 rich-editor-content">${item.chucNang || '-'}</td>
                    <td class="p-3.5 align-top text-slate-300 rich-editor-content">${item.thanKinh || '-'}</td>
                    <td class="p-3.5 align-top text-slate-300 rich-editor-content">${item.benhLy || '-'}</td>
                    <td class="p-3.5 align-top text-slate-400 rich-editor-content text-xs">${item.ghiChu || '-'}</td>
                    <td class="p-3.5 align-top text-center sticky right-0 bg-cardbg group-hover:bg-slate-800/90 transition-colors shadow-l">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="editMuscle('${item.id}')" class="p-1.5 bg-slate-700 hover:bg-indigo-600 text-slate-200 hover:text-white rounded-lg transition" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteMuscle('${item.id}')" class="p-1.5 bg-slate-700 hover:bg-red-600 text-slate-200 hover:text-white rounded-lg transition" title="Xóa">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // An toàn chuỗi HTML
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Mở Modal Thêm mới
        document.getElementById('btnOpenModal').addEventListener('click', () => {
            document.getElementById('anatomyForm').reset();
            document.getElementById('docId').value = '';
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-plus text-indigo-400"></i> Thêm Dữ Liệu Cơ Mới';
            
            // Clear contenteditable fields
            document.getElementById('editorNguyenUy').innerHTML = '';
            document.getElementById('editorBamTan').innerHTML = '';
            document.getElementById('editorChucNang').innerHTML = '';
            document.getElementById('editorThanKinh').innerHTML = '';
            document.getElementById('editorBenhLy').innerHTML = '';
            document.getElementById('editorGhiChu').innerHTML = '';

            document.getElementById('anatomyModal').classList.remove('hidden');
        });

        // Đóng Modal
        const closeModal = () => document.getElementById('anatomyModal').classList.add('hidden');
        document.getElementById('btnCloseModal').addEventListener('click', closeModal);
        document.getElementById('btnCancel').addEventListener('click', closeModal);

        // Lưu / Chỉnh sửa dữ liệu vào Firestore
        document.getElementById('anatomyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const docId = document.getElementById('docId').value;
            const data = {
                vung: document.getElementById('inputVung').value,
                tenVN: document.getElementById('inputTenVN').value.trim(),
                tenEN: document.getElementById('inputTenEN').value.trim(),
                hinhAnh: document.getElementById('inputHinhAnh').value.trim(),
                nguyenUy: document.getElementById('editorNguyenUy').innerHTML,
                bamTan: document.getElementById('editorBamTan').innerHTML,
                chucNang: document.getElementById('editorChucNang').innerHTML,
                thanKinh: document.getElementById('editorThanKinh').innerHTML,
                benhLy: document.getElementById('editorBenhLy').innerHTML,
                ghiChu: document.getElementById('editorGhiChu').innerHTML,
                updatedAt: new Date().toISOString()
            };

            try {
                if (docId) {
                    // Update
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'co_giai_phau', docId);
                    await setDoc(docRef, data, { merge: true });
                    showToast("Cập nhật thông tin cơ thành công!");
                } else {
                    // Create
                    await addDoc(collectionPath, data);
                    showToast("Thêm mới dữ liệu cơ thành công!");
                }
                closeModal();
            } catch (error) {
                console.error("Lỗi khi lưu:", error);
                showToast("Lỗi khi lưu dữ liệu!", "error");
            }
        });

        // Đưa dữ liệu lên Modal để Sửa
        window.editMuscle = function(id) {
            const item = allMuscles.find(m => m.id === id);
            if (!item) return;

            document.getElementById('docId').value = item.id;
            document.getElementById('inputVung').value = item.vung || 'Chi trên';
            document.getElementById('inputTenVN').value = item.tenVN || '';
            document.getElementById('inputTenEN').value = item.tenEN || '';
            document.getElementById('inputHinhAnh').value = item.hinhAnh || '';

            document.getElementById('editorNguyenUy').innerHTML = item.nguyenUy || '';
            document.getElementById('editorBamTan').innerHTML = item.bamTan || '';
            document.getElementById('editorChucNang').innerHTML = item.chucNang || '';
            document.getElementById('editorThanKinh').innerHTML = item.thanKinh || '';
            document.getElementById('editorBenhLy').innerHTML = item.benhLy || '';
            document.getElementById('editorGhiChu').innerHTML = item.ghiChu || '';

            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-indigo-400"></i> Chỉnh Sửa Thông Tin Cơ';
            document.getElementById('anatomyModal').classList.remove('hidden');
        };

        // Xóa cơ
        window.deleteMuscle = async function(id) {
            if (confirm("Bạn có chắc chắn muốn xóa dữ liệu cơ này không?")) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'co_giai_phau', id);
                    await deleteDoc(docRef);
                    showToast("Đã xóa dữ liệu thành công!");
                } catch (err) {
                    console.error("Lỗi xóa:", err);
                    showToast("Không thể xóa dữ liệu!", "error");
                }
            }
        };

        // Xem ảnh phóng to
        window.openImgPreview = function(url) {
            document.getElementById('previewImgSrc').src = url;
            document.getElementById('imgPreviewModal').classList.remove('hidden');
        };
        window.closeImgPreview = function() {
            document.getElementById('imgPreviewModal').classList.add('hidden');
        };

        // Tìm kiếm và Lọc
        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('filterRegion').addEventListener('change', renderTable);

        // Toast thông báo
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            
            if (type === "error") {
                toast.classList.remove('bg-indigo-600');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.remove('bg-red-600');
                toast.classList.add('bg-indigo-600');
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Chạy khởi tạo Auth
        initAuth();
    </script>
</body>
</html>
