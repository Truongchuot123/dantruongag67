<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Luyện thi Aptis Writing - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        darkcard: '#131c2e',
                        darkborder: '#1e293b',
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .loader { border: 3px solid rgba(59, 130, 246, 0.2); border-top: 3px solid #3b82f6; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-900 dark:text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white transition-colors duration-300">

    <nav class="glass-nav border-b border-slate-200/80 dark:border-darkborder sticky top-0 z-50 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="navigate('dashboard')">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform">
                        <i class="fas fa-pen-nib text-lg"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">Aptis<span class="text-blue-600 dark:text-blue-500">Writing</span></span>
                        <span class="block text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Mastery System</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button onclick="navigate('dashboard')" class="text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 px-3.5 py-2 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100 dark:hover:bg-slate-800/60">
                        <i class="fas fa-home mr-1.5 opacity-70"></i> Trang chủ
                    </button>
                    <button onclick="navigate('history')" class="text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 px-3.5 py-2 rounded-xl text-sm font-semibold transition-all hover:bg-slate-100 dark:hover:bg-slate-800/60">
                        <i class="fas fa-history mr-1.5 opacity-70"></i> <span class="hidden sm:inline">Lịch sử</span>
                    </button>
                    <button onclick="navigate('admin')" class="bg-blue-50 dark:bg-slate-800/80 text-blue-700 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-slate-800 px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-blue-200/60 dark:border-slate-700 shadow-sm flex items-center">
                        <i class="fas fa-cog mr-1.5 animate-spin-slow"></i> <span class="hidden sm:inline">Quản trị</span>
                    </button>
                    <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 flex items-center justify-center transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        <i id="theme-icon" class="fas fa-moon text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-container" class="flex-grow flex flex-col w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
        <div class="flex flex-col items-center justify-center h-80 space-y-4">
            <div class="loader"></div>
            <span class="text-slate-500 dark:text-slate-400 font-medium tracking-wide">Đang khởi tạo hệ thống chuẩn Aptis...</span>
        </div>
    </main>

    <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all duration-300">
        <div class="bg-white dark:bg-darkcard rounded-3xl p-6 sm:p-8 max-w-md w-full mx-auto shadow-2xl border border-slate-200 dark:border-darkborder transform transition-all animate-slide-up">
            <div class="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl mb-4">
                <i class="fas fa-bell"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-extrabold text-slate-900 dark:text-white mb-2">Thông báo</h3>
            <p id="modal-message" class="text-slate-600 dark:text-slate-300 mb-6 leading-relaxed"></p>
            <div class="flex justify-end space-x-3" id="modal-actions">
                <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg shadow-blue-500/25 transition-all">Đóng</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, addDoc, updateDoc, deleteDoc, serverTimestamp, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const userFirebaseConfig = {
            apiKey: "AIzaSyDyXmxsZAg6JxgcsujSIwMfbZTHscfJSCg",
            authDomain: "dulieuweb-6541e.firebaseapp.com",
            projectId: "dulieuweb-6541e",
            storageBucket: "dulieuweb-6541e.firebasestorage.app",
            messagingSenderId: "215480268517",
            appId: "1:215480268517:web:16600eafd6839fee5dc60c"
        };
        
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'aptis-practice-default';
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const state = {
            view: 'dashboard', 
            topics: [],
            history: [],
            currentTopic: null,
            searchQuery: '',
            practiceState: {
                tab: 'part2', 
                selectedVersions: { part2: 0, part3: 0, part4: 0 },
                answers: {},
                notes: {},
                showNotes: {} 
            },
            adminState: {
                editingTopicId: null,
                formData: {}
            },
            isDarkMode: true
        };

        window.toggleDarkMode = () => {
            state.isDarkMode = !state.isDarkMode;
            applyTheme();
        };

        const applyTheme = () => {
            const htmlClass = document.documentElement.classList;
            const icon = document.getElementById('theme-icon');
            if (state.isDarkMode) {
                htmlClass.add('dark');
                if(icon) {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            } else {
                htmlClass.remove('dark');
                if(icon) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                }
            }
        };

        const showModal = (title, message, actionsHtml = null) => {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            const actionsContainer = document.getElementById('modal-actions');
            if (actionsHtml) {
                actionsContainer.innerHTML = actionsHtml;
            } else {
                actionsContainer.innerHTML = `<button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg shadow-blue-500/25 transition-all">Đóng</button>`;
            }
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };
        
        window.closeModal = () => {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        const countWords = (text) => {
            if (!text) return 0;
            return text.trim().split(/\s+/).filter(word => word.length > 0).length;
        };

        const escapeHtml = (str) => {
            if(typeof str !== 'string') return '';
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        };

        // Hàm làm nổi bật số lượng từ với badge hiện đại chữ lớn
        const highlightWordCount = (text) => {
            if (!text) return '';
            const regex = /\b(\d+(?:\s*-\s*\d+)?\s*words)\b/gi;
            return text.replace(regex, '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-sm font-extrabold bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20 mx-1">$1</span>');
        };

        const saveDraftLocally = () => {
            if(state.currentTopic) {
                const draftKey = `aptis_draft_${state.currentTopic.id}`;
                localStorage.setItem(draftKey, JSON.stringify(state.practiceState));
            }
        };

        const loadDraftLocally = (topicId) => {
            const draftStr = localStorage.getItem(`aptis_draft_${topicId}`);
            if (draftStr) {
                try {
                    const draft = JSON.parse(draftStr);
                    state.practiceState = {
                        tab: draft.tab || 'part2',
                        selectedVersions: draft.selectedVersions || { part2: 0, part3: 0, part4: 0 },
                        answers: draft.answers || {},
                        notes: draft.notes || {},
                        showNotes: draft.showNotes || {}
                    };
                } catch(e) { console.error("Error parsing local draft"); }
            } else {
                state.practiceState = {
                    tab: 'part2', 
                    selectedVersions: { part2: 0, part3: 0, part4: 0 },
                    answers: {}, notes: {}, showNotes: {} 
                };
            }
        };

        window.navigate = (view, payload = null) => {
            state.view = view;
            if (view === 'practice' && payload) {
                state.currentTopic = state.topics.find(t => t.id === payload);
                loadDraftLocally(payload); 
            }
            if (view === 'admin-form') {
                if (payload) {
                    const topic = state.topics.find(t => t.id === payload);
                    state.adminState.editingTopicId = payload;
                    const formData = JSON.parse(JSON.stringify(topic));
                    if (!Array.isArray(formData.part2)) formData.part2 = [formData.part2];
                    if (!Array.isArray(formData.part3)) formData.part3 = [formData.part3];
                    if (!Array.isArray(formData.part4)) formData.part4 = [formData.part4];
                    state.adminState.formData = formData;
                } else {
                    state.adminState.editingTopicId = null;
                    state.adminState.formData = getEmptyTopicTemplate();
                }
            }
            if (view === 'history') fetchHistory();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const getEmptyTopicTemplate = () => ({
            title: '',
            part2: [{ question: '' }],
            part3: [{ intro: '', q1: '', q2: '', q3: '' }],
            part4: [{ intro: '', informalPrompt: '', formalPrompt: '' }]
        });

        async function initialize() {
            applyTheme(); 
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                const topicsRef = collection(db, 'artifacts', appId, 'public', 'data', 'aptis_topics');
                onSnapshot(topicsRef, (snapshot) => {
                    const topics = [];
                    snapshot.forEach(doc => topics.push({ id: doc.id, ...doc.data() }));
                    state.topics = topics.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    if (state.view !== 'history') render();
                }, (error) => {
                    showModal("Lỗi", "Không thể tải danh sách đề từ server. Vui lòng kiểm tra kết nối.");
                    render(); 
                });
            } catch (error) {
                showModal("Lỗi khởi tạo", "Không thể kết nối đến máy chủ.");
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = ''; 
            switch (state.view) {
                case 'dashboard': container.appendChild(renderDashboard()); break;
                case 'practice': container.appendChild(renderPracticeArea()); break;
                case 'admin': container.appendChild(renderAdminList()); break;
                case 'admin-form': container.appendChild(renderAdminForm()); break;
                case 'history': container.appendChild(renderHistory()); break;
                default: container.innerHTML = '<div class="text-center py-20 text-slate-500">404 Không tìm thấy trang</div>';
            }
        }

        function renderDashboard() {
            const div = document.createElement('div');
            div.className = 'w-full animate-fade-in flex flex-col items-center';
            
            let filteredTopics = state.topics;
            if (state.searchQuery) {
                const lowerQ = state.searchQuery.toLowerCase();
                filteredTopics = state.topics.filter(t => t.title.toLowerCase().includes(lowerQ));
            }

            let html = `
                <div class="w-full max-w-4xl mb-12 text-center px-4">
                    <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 text-xs font-bold mb-4 uppercase tracking-wider border border-blue-500/20">
                        <i class="fas fa-graduation-cap"></i> <span>Aptis Writing Exam Prep</span>
                    </div>
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4 leading-tight">Luyện tập kỹ năng viết Aptis</h1>
                    <p class="text-slate-600 dark:text-slate-400 text-base sm:text-lg mb-8 max-w-2xl mx-auto leading-relaxed">Chọn chủ đề bên dưới để bắt đầu bài luyện tập tiêu chuẩn với đầy đủ Part 2, Part 3 và Part 4.</p>
                    
                    <div class="relative max-w-2xl mx-auto mb-6">
                        <input type="text" id="searchInput" value="${state.searchQuery}" placeholder="Tìm kiếm chủ đề luyện thi..." class="w-full pl-14 pr-6 py-4 rounded-2xl border border-slate-200 dark:border-darkborder bg-white dark:bg-darkcard text-slate-900 dark:text-white text-base focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 shadow-xl shadow-slate-200/50 dark:shadow-none transition-all">
                        <i class="fas fa-search absolute left-5 top-4.5 text-slate-400 text-lg"></i>
                    </div>
                </div>

                <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 px-4">
            `;

            if (filteredTopics.length === 0) {
                html += `<div class="col-span-full text-center py-16 text-slate-400 bg-white dark:bg-darkcard rounded-3xl shadow-sm border border-slate-200/60 dark:border-darkborder"><i class="fas fa-folder-open text-4xl mb-3 opacity-60"></i><p class="text-base font-medium">Không tìm thấy chủ đề nào phù hợp.</p></div>`;
            } else {
                filteredTopics.forEach(topic => {
                    const hasDraft = !!localStorage.getItem(`aptis_draft_${topic.id}`);
                    html += `
                        <div class="bg-white dark:bg-darkcard rounded-3xl p-6 sm:p-7 flex flex-col justify-between group hover:-translate-y-1 transition-all duration-300 shadow-xl shadow-slate-200/40 dark:shadow-none border border-slate-200/80 dark:border-darkborder hover:border-blue-500/50 dark:hover:border-blue-500/50 relative overflow-hidden">
                            ${hasDraft ? `<div class="absolute top-0 right-0 bg-gradient-to-l from-amber-500 to-orange-500 text-white text-[10px] font-extrabold px-3 py-1 rounded-bl-xl shadow-sm tracking-wider uppercase"><i class="fas fa-clock mr-1"></i>Đang làm dở</div>` : ''}
                            <div>
                                <div class="w-14 h-14 rounded-2xl bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl mb-5 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shadow-inner">
                                    <i class="fas fa-pen-fancy"></i>
                                </div>
                                <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2 leading-snug group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${topic.title}</h3>
                                <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">Bộ đề thi thử chuẩn format Aptis Writing (Part 2, 3, 4).</p>
                            </div>
                            <button onclick="navigate('practice', '${topic.id}')" class="w-full py-3.5 px-4 bg-slate-100 dark:bg-slate-800/80 hover:bg-blue-600 dark:hover:bg-blue-600 hover:text-white text-slate-700 dark:text-slate-200 font-bold rounded-2xl transition-all duration-200 flex items-center justify-center space-x-2 shadow-sm">
                                <span>${hasDraft ? 'Tiếp tục làm bài' : 'Bắt đầu luyện tập'}</span>
                                <i class="fas fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            div.innerHTML = html;

            setTimeout(() => {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        state.searchQuery = e.target.value;
                        render();
                        setTimeout(() => {
                            const newSearchInput = document.getElementById('searchInput');
                            if (newSearchInput) {
                                newSearchInput.focus();
                                newSearchInput.setSelectionRange(newSearchInput.value.length, newSearchInput.value.length);
                            }
                        }, 0);
                    });
                }
            }, 0);

            return div;
        }

        window.isPartComplete = (partId) => {
            const vIdx = state.practiceState.selectedVersions[partId] || 0;
            const ans = state.practiceState.answers;
            if (partId === 'part2') return countWords(ans[`p2_v${vIdx}`]) > 0;
            if (partId === 'part3') return countWords(ans[`p3q1_v${vIdx}`]) > 0 && countWords(ans[`p3q2_v${vIdx}`]) > 0 && countWords(ans[`p3q3_v${vIdx}`]) > 0;
            if (partId === 'part4') return countWords(ans[`p4inf_v${vIdx}`]) > 0 && countWords(ans[`p4form_v${vIdx}`]) > 0;
            return false;
        };

        window.togglePastAnswers = (key) => {
            const container = document.getElementById(`past-answers-${key}`);
            if (!container) return;

            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                return;
            }

            const historyStr = localStorage.getItem('aptis_submissions_history') || '[]';
            const historyArr = JSON.parse(historyStr);
            const topicId = state.currentTopic.id;
            
            const pastAnswers = historyArr
                .filter(h => h.topicId === topicId && h.answers && h.answers[key] && h.answers[key].trim().length > 0)
                .map(h => ({
                    date: h.submittedAt ? new Date(h.submittedAt).toLocaleString('vi-VN') : 'Không rõ thời gian',
                    text: h.answers[key]
                }))
                .sort((a,b) => b.date.localeCompare(a.date));

            if (pastAnswers.length === 0) {
                container.innerHTML = '<div class="text-slate-400 italic text-xs text-center py-3">Chưa có lịch sử làm bài cho câu hỏi này.</div>';
            } else {
                container.innerHTML = pastAnswers.map((pa, idx) => `
                    <div class="mb-3 last:mb-0 pb-3 last:pb-0 border-b border-slate-200 dark:border-slate-800 last:border-0">
                        <div class="flex items-center justify-between text-xs text-blue-600 dark:text-blue-400 font-semibold mb-1">
                            <span><i class="fas fa-clock mr-1"></i> Nộp lúc: ${pa.date}</span>
                            <span class="text-slate-400">${countWords(pa.text)} từ</span>
                        </div>
                        <p class="text-slate-700 dark:text-slate-300 whitespace-pre-wrap text-sm bg-white dark:bg-[#111827] p-3 rounded-xl border border-slate-100 dark:border-slate-800 shadow-sm">${escapeHtml(pa.text)}</p>
                    </div>
                `).join('');
            }
            container.classList.remove('hidden');
        };

        function renderPracticeArea() {
            const div = document.createElement('div');
            div.className = 'w-full max-w-5xl mx-auto bg-white dark:bg-darkcard rounded-3xl shadow-2xl border border-slate-200/80 dark:border-darkborder overflow-hidden animate-fade-in transition-colors';
            
            const t = state.currentTopic;
            if (!t) return div;

            const tabs = [
                { id: 'part2', label: 'Part 2 (Form)', icon: 'fa-align-left' },
                { id: 'part3', label: 'Part 3 (Chat)', icon: 'fa-comments' },
                { id: 'part4', label: 'Part 4 (Email)', icon: 'fa-envelope-open-text' }
            ];

            let html = `
                <div class="bg-slate-50/80 dark:bg-[#111827]/80 backdrop-blur-md border-b border-slate-200 dark:border-darkborder px-6 py-5 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                    <div>
                        <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400 block mb-1">Đang luyện tập chủ đề</span>
                        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">${t.title}</h2>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end space-x-4">
                        <span id="auto-save-status" class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold bg-emerald-500/10 px-3 py-1.5 rounded-full hidden items-center"><i class="fas fa-check-circle mr-1.5"></i>Đã lưu nháp</span>
                        <button onclick="navigate('dashboard')" class="w-10 h-10 rounded-xl bg-slate-200/60 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-red-500 flex items-center justify-center transition-colors"><i class="fas fa-times text-base"></i></button>
                    </div>
                </div>

                <div class="flex border-b border-slate-200 dark:border-darkborder overflow-x-auto hide-scrollbar bg-slate-100/50 dark:bg-slate-900/40">
                    ${tabs.map(tab => {
                        const isComplete = window.isPartComplete(tab.id);
                        return `
                            <button id="tab-btn-${tab.id}" onclick="changePracticeTab('${tab.id}')" 
                                    class="flex-1 min-w-[150px] py-4 px-6 text-center font-bold text-sm flex items-center justify-center space-x-2.5 ${state.practiceState.tab === tab.id ? 'bg-white dark:bg-darkcard text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'} transition-all whitespace-nowrap">
                                <i class="fas ${tab.icon} opacity-80"></i>
                                <span>${tab.label}</span>
                                <span id="tab-check-container-${tab.id}">
                                    ${isComplete ? `<i class="fas fa-check-circle text-emerald-500 text-base"></i>` : ''}
                                </span>
                            </button>
                        `;
                    }).join('')}
                </div>

                <div class="p-6 sm:p-8 md:p-10 min-h-[500px]">
            `;

            const partId = state.practiceState.tab;
            let partData = t[partId];
            if (!Array.isArray(partData)) partData = [partData];

            const vIdx = state.practiceState.selectedVersions[partId] || 0;
            const currentV = partData[vIdx];

            if (partData.length > 1) {
                html += `<div class="mb-8 flex flex-wrap items-center gap-2.5 pb-6 border-b border-slate-100 dark:border-slate-800/80">
                    <span class="text-sm font-bold text-slate-500 dark:text-slate-400 mr-2"><i class="fas fa-layer-group mr-1.5"></i> Phiên bản:</span>`;
                partData.forEach((_, idx) => {
                    const active = idx === vIdx;
                    html += `
                        <button onclick="changeVersion('${partId}', ${idx})" 
                                class="px-4 py-2 text-sm font-bold rounded-xl transition-all duration-200 border ${active ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-500/25 scale-105' : 'bg-slate-50 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                            Phiên bản ${idx + 1}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            const renderInputSection = (title, instruction, baseKey, minWords, maxWords, placeholder) => {
                const key = `${baseKey}_v${vIdx}`;
                const isNotesVisible = state.practiceState.showNotes[key] || false;
                const noteDisplayClass = isNotesVisible ? 'block' : 'hidden';
                const answerColSpan = isNotesVisible ? 'lg:col-span-7' : 'lg:col-span-12';
                const iconClass = isNotesVisible ? 'fa-chevron-up' : 'fa-chevron-down';
                const toggleText = isNotesVisible ? 'Ẩn ghi chú' : 'Viết nháp / Ghi chú';
                
                const ansValue = state.practiceState.answers[key] || '';
                const noteValue = state.practiceState.notes[key] || '';

                return `
                    <div class="mb-8 bg-slate-50/80 dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-darkborder p-6 sm:p-7 shadow-sm transition-all">
                        <div class="mb-5 border-b border-slate-200 dark:border-slate-800 pb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                            <div>
                                <h4 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center">
                                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600 mr-2.5"></span> ${title}
                                </h4>

                                <i class="fas fa-lightbulb mr-2 text-amber-500"></i> <span id="toggle-text-${key}">${toggleText}</span> <i id="toggle-icon-${key}" class="fas ${iconClass} ml-2 text-xs"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <div id="note-container-${key}" class="lg:col-span-5 flex-col ${noteDisplayClass} transition-all">
                                <label class="block text-xs font-bold text-amber-600 dark:text-amber-400 mb-2 uppercase tracking-wider"><i class="fas fa-sticky-note mr-1.5"></i> Ghi chú & Ý chính</label>
                                <textarea oninput="handleNoteInput(this, '${key}')" class="w-full h-full min-h-[160px] bg-amber-50/50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900/50 rounded-2xl p-4 text-sm text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 resize-y shadow-inner transition-all" placeholder="Ghi chú các từ vựng hoặc ý chính cần viết...">${noteValue}</textarea>
                            </div>
                            <div id="answer-container-${key}" class="${answerColSpan} transition-all duration-300 flex flex-col">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider"><i class="fas fa-edit mr-1.5"></i> Bài làm của bạn</label>
                                    <button onclick="togglePastAnswers('${key}')" title="Xem lịch sử câu trả lời" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:bg-blue-500/10 px-3 py-1.5 rounded-xl transition-all flex items-center border border-blue-500/20 shadow-sm"><i class="fas fa-history mr-1.5"></i> Lịch sử câu này</button>
                                </div>
                                ${createTextArea(key, ansValue, minWords, maxWords, placeholder, 'min-h-[160px]')}
                                <div id="past-answers-${key}" class="hidden mt-4 p-4 bg-slate-100 dark:bg-slate-900/80 rounded-2xl border border-slate-200 dark:border-slate-800 text-sm max-h-64 overflow-y-auto shadow-inner transition-all"></div>
                            </div>
                        </div>
                    </div>
                `;
            };

            if (partId === 'part2') {
                html += `
                    <div class="mb-8 bg-blue-500/10 border-l-4 border-blue-600 p-5 rounded-2xl backdrop-blur-sm">
                        <p class="font-bold text-blue-900 dark:text-blue-300 mb-1 text-base"><i class="fas fa-info-circle mr-2"></i> Hướng dẫn Part 2:</p>
                        <p class="text-base text-blue-800 dark:text-blue-200 leading-relaxed">You are a new member of the <strong>${t.title}</strong>. Fill in the form. Write in sentences. Use <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-sm font-extrabold bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20 mx-1">20-30 words</span>.</p>
                    </div>
                    ${renderInputSection('Form Question:', highlightWordCount(currentV.question) || 'Chưa có câu hỏi.', 'p2', 20, 30, 'Nhập câu trả lời của bạn ở đây...')}
                    <div class="mt-8 flex justify-end">
                        <button onclick="changePracticeTab('part3')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/25 transition-all flex items-center space-x-2">
                            <span>Tiếp theo (Part 3)</span> <i class="fas fa-arrow-right text-sm"></i>
                        </button>
                    </div>
                `;
            }
            else if (partId === 'part3') {
                html += `
                    <div class="mb-8 bg-blue-500/10 border-l-4 border-blue-600 p-5 rounded-2xl backdrop-blur-sm">
                        <p class="font-bold text-blue-900 dark:text-blue-300 mb-1 text-base"><i class="fas fa-info-circle mr-2"></i> Tình huống Part 3 (Chat Room):</p>
                        <p class="text-base sm:text-lg text-blue-800 dark:text-blue-200 leading-relaxed font-semibold">${highlightWordCount(currentV.intro) || ''}</p>
                    </div>
                    <div class="space-y-6">
                        ${renderInputSection('Question 1:', highlightWordCount(currentV.q1), 'p3q1', 30, 40, 'Trả lời câu hỏi 1...')}
                        ${renderInputSection('Question 2:', highlightWordCount(currentV.q2), 'p3q2', 30, 40, 'Trả lời câu hỏi 2...')}
                        ${renderInputSection('Question 3:', highlightWordCount(currentV.q3), 'p3q3', 30, 40, 'Trả lời câu hỏi 3...')}
                    </div>
                    <div class="mt-8 flex flex-col sm:flex-row justify-between gap-4">
                        <button onclick="changePracticeTab('part2')" class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-6 py-3.5 font-bold bg-slate-100 dark:bg-slate-800 rounded-2xl transition-all flex items-center justify-center sm:justify-start">
                            <i class="fas fa-arrow-left mr-2"></i> Quay lại Part 2
                        </button>
                        <button onclick="changePracticeTab('part4')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/25 transition-all flex items-center justify-center space-x-2">
                            <span>Tiếp theo (Part 4)</span> <i class="fas fa-arrow-right text-sm"></i>
                        </button>
                    </div>
                `;
            }
            else if (partId === 'part4') {
                html += `
                    <div class="mb-8 bg-blue-500/10 border-l-4 border-blue-600 p-5 rounded-2xl backdrop-blur-sm">
                        <p class="font-bold text-blue-900 dark:text-blue-300 mb-1 text-base"><i class="fas fa-info-circle mr-2"></i> Tình huống Part 4 (Emails):</p>
                        <p class="text-base sm:text-lg text-blue-800 dark:text-blue-200 whitespace-pre-line leading-relaxed font-semibold">${highlightWordCount(currentV.intro) || ''}</p>
                    </div>
                    <div class="space-y-8">
                        ${renderInputSection('Email 1 (Informal)', `<span class="italic text-slate-700 dark:text-slate-300">${highlightWordCount(currentV.informalPrompt) || ''}</span>`, 'p4inf', 40, 60, 'Hi [Name],...')}
                        ${renderInputSection('Email 2 (Formal)', `<span class="italic text-slate-700 dark:text-slate-300">${highlightWordCount(currentV.formalPrompt) || ''}</span>`, 'p4form', 120, 150, 'Dear Sir/Madam,...')}
                    </div>
                    <div class="mt-10 flex flex-col sm:flex-row justify-between items-center border-t border-slate-200 dark:border-slate-800 pt-8 gap-4">
                         <button onclick="changePracticeTab('part3')" class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-6 py-3.5 font-bold w-full sm:w-auto text-center flex items-center justify-center">
                            <i class="fas fa-arrow-left mr-2"></i> Quay lại Part 3
                        </button>
                         <button onclick="submitPractice()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-10 py-4 rounded-2xl font-extrabold shadow-xl shadow-emerald-500/25 transition-all transform hover:scale-105 flex items-center w-full sm:w-auto justify-center space-x-2">
                            <i class="fas fa-paper-plane mr-2"></i> <span>Nộp bài & Lưu lịch sử</span>
                        </button>
                    </div>
                `;
            }

            html += `</div>`;
            div.innerHTML = html;
            return div;
        }

        window.changePracticeTab = (tabId) => {
            state.practiceState.tab = tabId;
            saveDraftLocally();
            render();
        };

        window.changeVersion = (partId, vIdx) => {
            state.practiceState.selectedVersions[partId] = vIdx;
            saveDraftLocally();
            render();
        };

        window.toggleNotesDOM = (key) => {
            state.practiceState.showNotes[key] = !state.practiceState.showNotes[key];
            saveDraftLocally();

            const isVisible = state.practiceState.showNotes[key];
            const noteContainer = document.getElementById(`note-container-${key}`);
            const answerContainer = document.getElementById(`answer-container-${key}`);
            const toggleText = document.getElementById(`toggle-text-${key}`);
            const toggleIcon = document.getElementById(`toggle-icon-${key}`);
            
            if (isVisible) {
                noteContainer.classList.remove('hidden'); noteContainer.classList.add('flex');
                answerContainer.classList.remove('lg:col-span-12'); answerContainer.classList.add('lg:col-span-7');
                toggleText.innerText = 'Ẩn ghi chú';
                toggleIcon.classList.remove('fa-chevron-down'); toggleIcon.classList.add('fa-chevron-up');
            } else {
                noteContainer.classList.add('hidden'); noteContainer.classList.remove('flex');
                answerContainer.classList.add('lg:col-span-12'); answerContainer.classList.remove('lg:col-span-7');
                toggleText.innerText = 'Viết nháp / Ghi chú';
                toggleIcon.classList.remove('fa-chevron-up'); toggleIcon.classList.add('fa-chevron-down');
            }
        };

        let saveTimeout;
        const triggerAutoSaveUI = () => {
            saveDraftLocally();
            const el = document.getElementById('auto-save-status');
            if(el) {
                el.classList.remove('hidden');
                el.classList.add('flex');
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    el.classList.remove('flex');
                    el.classList.add('hidden');
                }, 2500);
            }
        };

        window.handleInput = (element, key, min, max) => {
            const val = element.value;
            state.practiceState.answers[key] = val;
            triggerAutoSaveUI();
            
            const count = countWords(val);
            const counterDiv = document.getElementById(`counter-${key}`);
            let colorClass = 'text-slate-400';
            let badgeBg = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';

            if (count > max) {
                colorClass = 'text-rose-600 dark:text-rose-400 font-extrabold';
                badgeBg = 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
            } else if (count >= min && count <= max) {
                colorClass = 'text-emerald-600 dark:text-emerald-400 font-extrabold';
                badgeBg = 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
            } else if (count > 0 && count < min) {
                colorClass = 'text-amber-600 dark:text-amber-400 font-bold';
                badgeBg = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20';
            }

            if(counterDiv) {
                counterDiv.className = `inline-flex items-center px-3 py-1 rounded-full text-xs font-bold transition-all ${badgeBg}`;
                counterDiv.innerHTML = `<i class="fas fa-file-word mr-1.5 opacity-70"></i> ${count} từ <span class="opacity-60 ml-1 font-normal">(${min}-${max} từ)</span>`;
            }

            const partId = state.practiceState.tab;
            const checkContainer = document.getElementById(`tab-check-container-${partId}`);
            if (checkContainer) {
                if (window.isPartComplete(partId)) {
                    checkContainer.innerHTML = `<i class="fas fa-check-circle text-emerald-500 text-base"></i>`;
                } else {
                    checkContainer.innerHTML = '';
                }
            }
        };

        window.handleNoteInput = (element, key) => { 
            state.practiceState.notes[key] = element.value; 
            triggerAutoSaveUI();
        };

        const createTextArea = (key, value, min, max, placeholder, customClasses = '') => {
            const count = countWords(value);
            let badgeBg = 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
            if (count > max) badgeBg = 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
            else if (count >= min && count <= max) badgeBg = 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
            else if (count > 0 && count < min) badgeBg = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20';

            return `
                <textarea oninput="handleInput(this, '${key}', ${min}, ${max})" class="w-full border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-[#182234] rounded-2xl p-4 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 resize-y shadow-sm transition-all text-slate-900 dark:text-white text-base leading-relaxed ${customClasses}" placeholder="${placeholder}">${value}</textarea>
                <div class="flex justify-end mt-2">
                    <div id="counter-${key}" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold transition-all ${badgeBg}">
                        <i class="fas fa-file-word mr-1.5 opacity-70"></i> ${count} từ <span class="opacity-60 ml-1 font-normal">(${min}-${max} từ)</span>
                    </div>
                </div>
            `;
        };

        window.submitPractice = async () => {
            const confirmHtml = `
                <div class="flex justify-end space-x-3 mt-6">
                    <button id="btn-cancel-submit" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-800 dark:text-white font-bold py-2.5 px-5 rounded-xl transition-all">Xem lại</button>
                    <button id="btn-confirm-submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-emerald-500/25 transition-all">Nộp & Lưu</button>
                </div>
            `;
            showModal("Xác nhận nộp bài", "Bài làm của bạn sẽ được lưu vào lịch sử làm bài trên trình duyệt này.", confirmHtml);

            document.getElementById('btn-cancel-submit').onclick = () => closeModal();
            document.getElementById('btn-confirm-submit').onclick = () => {
                closeModal();
                try {
                    const historyStr = localStorage.getItem('aptis_submissions_history') || '[]';
                    const historyArr = JSON.parse(historyStr);
                    
                    const newSubmission = {
                        id: 'sub_' + Date.now().toString(),
                        topicId: state.currentTopic.id,
                        topicTitle: state.currentTopic.title,
                        answers: state.practiceState.answers,
                        notes: state.practiceState.notes,
                        selectedVersions: state.practiceState.selectedVersions,
                        submittedAt: Date.now()
                    };

                    historyArr.push(newSubmission);
                    localStorage.setItem('aptis_submissions_history', JSON.stringify(historyArr));
                    localStorage.removeItem(`aptis_draft_${state.currentTopic.id}`);

                    const successActions = `<button onclick="navigate('history'); closeModal();" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-blue-500/25 transition-all">Xem Lịch Sử</button>`;
                    showModal("Thành công", "Bài làm đã được lưu thành công vào lịch sử!", successActions);
                } catch (error) {
                    showModal("Lỗi nộp bài", "Không thể lưu bài làm. Vui lòng thử lại.");
                }
            };
        };

        function fetchHistory() {
            try {
                const historyStr = localStorage.getItem('aptis_submissions_history') || '[]';
                let historyArr = JSON.parse(historyStr);
                state.history = historyArr.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
                if(state.view === 'history') render();
            } catch (error) {
                showModal("Lỗi", "Không thể tải lịch sử làm bài.");
            }
        }

        function renderHistory() {
            const div = document.createElement('div');
            div.className = 'w-full max-w-5xl mx-auto animate-fade-in';
            
            let html = `
                <div class="flex items-center justify-between mb-8 border-b border-slate-200 dark:border-darkborder pb-6">
                    <div class="flex items-center space-x-4">
                        <button onclick="navigate('dashboard')" class="w-11 h-11 rounded-2xl bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder text-slate-600 dark:text-slate-300 hover:text-blue-600 flex items-center justify-center transition-all shadow-sm"><i class="fas fa-arrow-left"></i></button>
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Lịch sử làm bài</h1>
                            <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">Các bài viết đã lưu trên trình duyệt của bạn</p>
                        </div>
                    </div>
                </div>
            `;

            if (state.history.length === 0) {
                html += `
                    <div class="bg-white dark:bg-darkcard rounded-3xl shadow-xl border border-slate-200/80 dark:border-darkborder p-12 text-center">
                        <div class="w-16 h-16 rounded-2xl bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 flex items-center justify-center text-2xl mx-auto mb-4 shadow-inner"><i class="fas fa-box-open"></i></div>
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Chưa có lịch sử làm bài</h3>
                        <p class="text-slate-500 dark:text-slate-400 mb-6 max-w-sm mx-auto">Bạn chưa nộp bài thi nào. Hãy chọn một chủ đề và bắt đầu luyện tập ngay nhé!</p>
                        <button onclick="navigate('dashboard')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-blue-500/25 transition-all">Đến trang Luyện tập</button>
                    </div>
                `;
            } else {
                html += `<div class="space-y-6">`;
                state.history.forEach((item, index) => {
                    const date = item.submittedAt ? new Date(item.submittedAt).toLocaleString('vi-VN') : 'Không rõ';
                    const v2 = item.selectedVersions?.part2 || 0;
                    const v3 = item.selectedVersions?.part3 || 0;
                    const v4 = item.selectedVersions?.part4 || 0;

                    const getAns = (k, v) => item.answers?.[`${k}_v${v}`] || item.answers?.[k] || '';

                    const p2Ans = getAns('p2', v2);
                    const p3q1Ans = getAns('p3q1', v3); const p3q2Ans = getAns('p3q2', v3); const p3q3Ans = getAns('p3q3', v3);
                    const p4infAns = getAns('p4inf', v4); const p4formAns = getAns('p4form', v4);

                    const w_p2 = countWords(p2Ans);
                    const w_p3 = countWords(p3q1Ans) + countWords(p3q2Ans) + countWords(p3q3Ans);
                    const w_p4 = countWords(p4infAns) + countWords(p4formAns);
                    
                    html += `
                        <div class="bg-white dark:bg-darkcard rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-slate-200/80 dark:border-darkborder overflow-hidden relative transition-all">
                            <div class="absolute top-4 right-14 text-slate-400 hover:text-rose-500 cursor-pointer w-9 h-9 rounded-xl hover:bg-rose-500/10 flex items-center justify-center transition-colors z-10" onclick="deleteLocalHistory(${index})" title="Xóa lịch sử">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </div>
                            <div class="bg-slate-50/80 dark:bg-[#111827] px-6 py-5 cursor-pointer flex justify-between items-center border-b border-slate-200 dark:border-darkborder" onclick="toggleHistoryDetail('hist-${item.id}')">
                                <div>
                                    <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">${item.topicTitle}</h3>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1"><i class="far fa-clock mr-1"></i> ${date}</p>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <div class="hidden md:flex space-x-2 text-xs font-bold">
                                        <span class="bg-blue-500/10 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full border border-blue-500/20">P2: ${w_p2} từ</span>
                                        <span class="bg-purple-500/10 text-purple-600 dark:text-purple-400 px-3 py-1 rounded-full border border-purple-500/20">P3: ${w_p3} từ</span>
                                        <span class="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">P4: ${w_p4} từ</span>
                                    </div>
                                    <i id="icon-hist-${item.id}" class="fas fa-chevron-down text-slate-400 transition-transform duration-300"></i>
                                </div>
                            </div>
                            <div id="hist-${item.id}" class="hidden p-6 sm:p-8 space-y-6 bg-white dark:bg-darkcard">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="bg-slate-50 dark:bg-[#111827] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                                        <h4 class="font-bold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3 mb-3 flex items-center justify-between text-sm">
                                            <span>Part 2</span> <span class="text-xs font-normal text-blue-600 dark:text-blue-400">Phiên bản ${v2 + 1}</span>
                                        </h4>
                                        <div class="text-sm text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">
                                            ${p2Ans || '<span class="text-slate-400 italic">Trống</span>'}
                                        </div>
                                    </div>
                                    <div class="bg-slate-50 dark:bg-[#111827] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                                        <h4 class="font-bold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3 mb-3 flex items-center justify-between text-sm">
                                            <span>Part 3</span> <span class="text-xs font-normal text-purple-600 dark:text-purple-400">Phiên bản ${v3 + 1}</span>
                                        </h4>
                                        <div class="space-y-3 text-sm">
                                            <div class="p-3 bg-white dark:bg-darkcard rounded-xl border border-slate-200 dark:border-slate-800"><span class="text-xs font-bold text-purple-600 dark:text-purple-400 block mb-1">Q1 (${countWords(p3q1Ans)} từ):</span> ${p3q1Ans || '<span class="text-slate-400 italic">Trống</span>'}</div>
                                            <div class="p-3 bg-white dark:bg-darkcard rounded-xl border border-slate-200 dark:border-slate-800"><span class="text-xs font-bold text-purple-600 dark:text-purple-400 block mb-1">Q2 (${countWords(p3q2Ans)} từ):</span> ${p3q2Ans || '<span class="text-slate-400 italic">Trống</span>'}</div>
                                            <div class="p-3 bg-white dark:bg-darkcard rounded-xl border border-slate-200 dark:border-slate-800"><span class="text-xs font-bold text-purple-600 dark:text-purple-400 block mb-1">Q3 (${countWords(p3q3Ans)} từ):</span> ${p3q3Ans || '<span class="text-slate-400 italic">Trống</span>'}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-slate-50 dark:bg-[#111827] p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
                                    <h4 class="font-bold text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3 mb-4 flex items-center justify-between text-sm">
                                        <span>Part 4 (Emails)</span> <span class="text-xs font-normal text-emerald-600 dark:text-emerald-400">Phiên bản ${v4 + 1}</span>
                                    </h4>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div class="p-4 bg-white dark:bg-darkcard rounded-2xl border border-slate-200 dark:border-slate-800">
                                            <span class="font-bold text-xs text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-2 block">Informal Email (${countWords(p4infAns)} từ):</span>
                                            <div class="whitespace-pre-wrap text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${p4infAns || '<span class="text-slate-400 italic">Trống</span>'}</div>
                                        </div>
                                        <div class="p-4 bg-white dark:bg-darkcard rounded-2xl border border-slate-200 dark:border-slate-800">
                                            <span class="font-bold text-xs text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-2 block">Formal Email (${countWords(p4formAns)} từ):</span>
                                            <div class="whitespace-pre-wrap text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${p4formAns || '<span class="text-slate-400 italic">Trống</span>'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            div.innerHTML = html;
            return div;
        }

        window.deleteLocalHistory = (index) => {
            const confirmHtml = `
                <div class="flex justify-end space-x-3 mt-6">
                    <button id="btn-cancel-del" class="bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white font-bold py-2.5 px-5 rounded-xl">Hủy</button>
                    <button id="btn-confirm-del" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-rose-500/25">Xóa bỏ</button>
                </div>
            `;
            showModal("Xóa lịch sử", "Bạn có chắc muốn xóa bài làm này khỏi lịch sử?", confirmHtml);
            document.getElementById('btn-cancel-del').onclick = () => closeModal();
            document.getElementById('btn-confirm-del').onclick = () => {
                state.history.splice(index, 1);
                localStorage.setItem('aptis_submissions_history', JSON.stringify(state.history));
                closeModal();
                render();
            };
        };

        window.toggleHistoryDetail = (id) => {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            el.classList.toggle('hidden');
            if(icon) {
                icon.style.transform = el.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            }
        };

        window.updateAdminData = (part, index, field, value) => {
            if (state.adminState.formData[part] && state.adminState.formData[part][index]) {
                state.adminState.formData[part][index][field] = value;
            }
        };

        window.addAdminVersion = (part) => {
            const template = part === 'part2' ? { question: '' } : part === 'part3' ? { intro: '', q1: '', q2: '', q3: '' } : { intro: '', informalPrompt: '', formalPrompt: '' };
            state.adminState.formData[part].push(template);
            render();
        };

        window.removeAdminVersion = (part, index) => {
            state.adminState.formData[part].splice(index, 1);
            render();
        };

        function renderAdminPart(partKey, title, badgeClass, badgeText) {
            const versions = state.adminState.formData[partKey] || [];
            const inputClass = "w-full px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-white dark:bg-[#182234] text-slate-900 dark:text-slate-100 transition-all text-sm";
            const labelClass = "block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wider";

            let html = `
                <div class="border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-7 bg-slate-50/50 dark:bg-[#111827]/50 shadow-sm">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 border-b border-slate-200 dark:border-slate-800 pb-4 gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="${badgeClass} text-xs font-extrabold px-3 py-1 rounded-full border">${badgeText}</span>
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white">${title}</h3>
                        </div>
                        <button type="button" onclick="addAdminVersion('${partKey}')" class="text-blue-600 dark:text-blue-400 text-sm hover:underline font-bold flex items-center"><i class="fas fa-plus mr-1.5"></i> Thêm phiên bản</button>
                    </div>
                    <div class="space-y-6">
            `;

            versions.forEach((v, i) => {
                html += `<div class="bg-white dark:bg-darkcard p-6 rounded-2xl border border-slate-200 dark:border-slate-800 relative shadow-sm">`;
                if (versions.length > 1) {
                    html += `<button type="button" onclick="removeAdminVersion('${partKey}', ${i})" class="absolute top-5 right-5 text-rose-500 hover:text-rose-700 text-xs font-bold flex items-center bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20 transition-all"><i class="fas fa-trash-alt mr-1"></i> Xóa</button>`;
                }
                html += `<h4 class="text-sm font-extrabold text-slate-800 dark:text-slate-200 mb-4 flex items-center"><span class="w-2 h-2 rounded-full bg-blue-600 mr-2"></span> Phiên bản ${i + 1}</h4>`;
                
                if (partKey === 'part2') {
                    html += `<div><label class="${labelClass}">Nội dung câu hỏi Form</label><textarea rows="3" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'question', this.value)">${escapeHtml(v.question)}</textarea></div>`;
                } else if (partKey === 'part3') {
                    html += `
                        <div class="mb-4"><label class="${labelClass}">Câu giới thiệu tình huống (Intro)</label><input type="text" value="${escapeHtml(v.intro)}" class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'intro', this.value)"></div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div><label class="${labelClass}">Câu hỏi 1</label><textarea rows="3" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'q1', this.value)">${escapeHtml(v.q1)}</textarea></div>
                            <div><label class="${labelClass}">Câu hỏi 2</label><textarea rows="3" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'q2', this.value)">${escapeHtml(v.q2)}</textarea></div>
                            <div><label class="${labelClass}">Câu hỏi 3</label><textarea rows="3" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'q3', this.value)">${escapeHtml(v.q3)}</textarea></div>
                        </div>
                    `;
                } else if (partKey === 'part4') {
                    html += `
                        <div class="mb-4"><label class="${labelClass}">Tình huống chung Email</label><textarea rows="3" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'intro', this.value)">${escapeHtml(v.intro)}</textarea></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="${labelClass}">Yêu cầu Email 1 (Informal)</label><textarea rows="4" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'informalPrompt', this.value)">${escapeHtml(v.informalPrompt)}</textarea></div>
                            <div><label class="${labelClass}">Yêu cầu Email 2 (Formal)</label><textarea rows="4" required class="${inputClass}" oninput="updateAdminData('${partKey}', ${i}, 'formalPrompt', this.value)">${escapeHtml(v.formalPrompt)}</textarea></div>
                        </div>
                    `;
                }
                html += `</div>`;
            });

            html += `</div></div>`;
            return html;
        }

        function renderAdminForm() {
            const div = document.createElement('div');
            div.className = 'w-full max-w-4xl mx-auto bg-white dark:bg-darkcard rounded-3xl shadow-2xl border border-slate-200/80 dark:border-darkborder p-6 sm:p-10 animate-fade-in';
            const isEdit = !!state.adminState.editingTopicId;
            const data = state.adminState.formData;
            const inputClass = "w-full px-4 py-3.5 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 bg-slate-50 dark:bg-[#182234] text-slate-900 dark:text-white text-base transition-all";
            const labelClass = "block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wider";

            const html = `
                <div class="flex items-center space-x-4 mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                    <button onclick="navigate('admin')" class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-blue-600 flex items-center justify-center transition-all shadow-sm"><i class="fas fa-arrow-left"></i></button>
                    <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">${isEdit ? 'Chỉnh sửa đề thi' : 'Tạo đề thi mới'}</h2>
                </div>
                <form id="adminForm" class="space-y-8" onsubmit="handleAdminSubmit(event)">
                    <div class="bg-slate-50/50 dark:bg-[#111827]/50 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">
                        <label class="${labelClass}">Tên chủ đề chung (VD: Travel Club)</label>
                        <input type="text" id="frm_title" value="${escapeHtml(data.title)}" required class="${inputClass}" placeholder="Nhập tên chủ đề...">
                    </div>
                    ${renderAdminPart('part2', 'Câu hỏi Form (20-30 words)', 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20', 'Part 2')}
                    ${renderAdminPart('part3', 'Phòng Chat (3 câu hỏi)', 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20', 'Part 3')}
                    ${renderAdminPart('part4', 'Viết Email (Informal & Formal)', 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20', 'Part 4')}
                    <div class="flex flex-col-reverse sm:flex-row justify-end pt-4 gap-4">
                        <button type="button" onclick="navigate('admin')" class="w-full sm:w-auto px-7 py-3.5 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 font-bold transition-all">Hủy</button>
                        <button type="submit" class="w-full sm:w-auto px-9 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-xl shadow-blue-500/25 font-extrabold transition-all">
                            <i class="fas fa-save mr-2"></i> ${isEdit ? 'Lưu Thay Đổi' : 'Tạo Đề Mới'}
                        </button>
                    </div>
                </form>
            `;
            div.innerHTML = html;
            return div;
        }

        window.handleAdminSubmit = async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Đang lưu...';
            submitBtn.disabled = true;

            const titleInput = document.getElementById('frm_title').value.trim();

            const newData = {
                title: titleInput,
                part2: state.adminState.formData.part2,
                part3: state.adminState.formData.part3,
                part4: state.adminState.formData.part4
            };

            try {
                const topicsCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'aptis_topics');
                if (state.adminState.editingTopicId) {
                    newData.updatedAt = serverTimestamp();
                    await updateDoc(doc(topicsCollectionRef, state.adminState.editingTopicId), newData);
                    showModal("Thành công", "Đã cập nhật đề thi thành công.");
                } else {
                    newData.createdAt = serverTimestamp();
                    await addDoc(topicsCollectionRef, newData);
                    showModal("Thành công", "Đã tạo đề thi mới thành công.");
                }
                navigate('admin');
            } catch (error) {
                showModal("Lỗi lưu dữ liệu", "Lỗi: " + error.message);
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        };

        function renderAdminList() {
            const div = document.createElement('div');
            div.className = 'w-full max-w-5xl mx-auto animate-fade-in px-4 sm:px-0';
            
            let html = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-slate-200 dark:border-darkborder pb-6 gap-4">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Quản lý Đề thi</h1>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Thêm, chỉnh sửa hoặc xóa các bộ đề luyện thi Aptis</p>
                    </div>
                    <button onclick="navigate('admin-form')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/25 flex items-center transition-all">
                        <i class="fas fa-plus mr-2"></i> Tạo đề mới
                    </button>
                </div>
                <div class="bg-white dark:bg-darkcard rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-slate-200/80 dark:border-darkborder overflow-hidden">
                    <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-800">
                        <thead class="bg-slate-50 dark:bg-slate-900/60">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-extrabold text-slate-500 uppercase tracking-wider">Tên chủ đề</th>
                                <th class="px-6 py-4 text-right text-xs font-extrabold text-slate-500 uppercase tracking-wider">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
            `;

            if (state.topics.length === 0) {
                html += `<tr><td colspan="2" class="px-6 py-12 text-center text-slate-400">Chưa có đề thi nào trong hệ thống.</td></tr>`;
            } else {
                state.topics.forEach(t => {
                    html += `
                        <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap"><div class="text-base font-bold text-slate-900 dark:text-white truncate max-w-md">${t.title}</div></td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-bold space-x-3">
                                <button onclick="navigate('admin-form', '${t.id}')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-900 px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 transition-all inline-flex items-center"><i class="fas fa-edit mr-1"></i> Sửa</button>
                                <button onclick="deleteTopic('${t.id}')" class="text-rose-600 dark:text-rose-400 hover:text-rose-900 px-3 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 transition-all inline-flex items-center"><i class="fas fa-trash-alt mr-1"></i> Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div>`;
            div.innerHTML = html;
            return div;
        }

        window.deleteTopic = async (id) => {
            const confirmHtml = `
                <div class="flex justify-end space-x-3 mt-6">
                    <button id="btn-cancel-del" class="bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white font-bold py-2.5 px-5 rounded-xl">Hủy</button>
                    <button id="btn-confirm-del" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-rose-500/25">Xóa</button>
                </div>
            `;
            showModal("Xác nhận xóa", "Bạn có chắc chắn muốn xóa đề thi này không?", confirmHtml);
            document.getElementById('btn-cancel-del').onclick = () => closeModal();
            document.getElementById('btn-confirm-del').onclick = async () => {
                closeModal();
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'aptis_topics', id));
                } catch (error) {
                    showModal("Lỗi", "Không thể xóa đề: " + error.message);
                }
            };
        };

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
