<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Luyện Tập Câu Hỏi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .input-focus {
            transition: all 0.2s;
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .hidden-section {
            display: none;
        }

        .answer-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            transform: scale(1.02);
        }

        .answer-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        /* Animations */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-quiz {
            animation: fadeInScale 0.4s ease-out forwards;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">HỆ THỐNG LUYỆN TẬP</h1>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex justify-center space-x-4 mb-8">
            <button onclick="switchTab('create')" id="btn-tab-create" class="px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all">
                <i class="fas fa-plus-circle mr-2"></i>Thiết Kế
            </button>
            <button onclick="switchTab('practice')" id="btn-tab-practice" class="px-6 py-2 rounded-full font-medium bg-white text-gray-600 hover:bg-gray-50 transition-all border">
                <i class="fas fa-play-circle mr-2"></i>Luyện Tập
            </button>
        </div>

        <!-- Section: Create Question -->
        <section id="section-create" class="glass-card rounded-2xl p-6 mb-8">
            <h2 class="text-xl font-semibold mb-6 flex items-center">
                <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                Tạo Câu Hỏi Mới
            </h2>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-xs uppercase tracking-wider">Loại hình</label>
                    <select id="q-type" onchange="toggleQuestionTypeUI()" class="w-full p-3 border rounded-xl input-focus bg-gray-50">
                        <option value="mcq">Trắc nghiệm</option>
                        <option value="short">Trả lời ngắn</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-xs uppercase tracking-wider">Nội dung câu hỏi</label>
                    <textarea id="q-text" rows="3" class="w-full p-3 border rounded-xl input-focus" placeholder="Nhập câu hỏi..."></textarea>
                </div>

                <!-- MCQ Options -->
                <div id="mcq-options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">A</span>
                        <input type="text" id="opt-a" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn A">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">B</span>
                        <input type="text" id="opt-b" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn B">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">C</span>
                        <input type="text" id="opt-c" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn C">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">D</span>
                        <input type="text" id="opt-d" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn D">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-green-700 mb-2 text-xs uppercase tracking-wider">Đáp án đúng</label>
                        <select id="mcq-correct" class="w-full p-3 border rounded-xl input-focus border-green-200">
                            <option value="A">Phương án A</option>
                            <option value="B">Phương án B</option>
                            <option value="C">Phương án C</option>
                            <option value="D">Phương án D</option>
                        </select>
                    </div>
                </div>

                <!-- Short Answer -->
                <div id="short-answer-container" class="hidden">
                    <label class="block text-sm font-medium text-green-700 mb-2 text-xs uppercase tracking-wider">Đáp án đúng</label>
                    <input type="text" id="short-correct" class="w-full p-3 border rounded-xl input-focus border-green-200" placeholder="Nhập đáp án chính xác...">
                </div>

                <button onclick="addQuestion()" class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all">
                    Lưu
                </button>
            </div>

            <div class="mt-12 border-t pt-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-gray-700 text-lg">Ngân hàng câu hỏi (<span id="q-count">0</span>)</h3>
                    <button onclick="clearAllQuestions()" class="text-sm text-red-500 hover:text-red-700 flex items-center">
                        <i class="fas fa-trash-alt mr-1"></i> Xóa tất cả
                    </button>
                </div>
                <div id="questions-list" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </section>

        <!-- Section: Practice -->
        <section id="section-practice" class="hidden-section">
            <!-- Start Screen -->
            <div id="practice-start-screen" class="glass-card rounded-3xl p-12 text-center animate-quiz">
                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                    <i class="fas fa-rocket"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Sẵn sàng luyện tập?</h2>
                
                <div class="bg-gray-50 rounded-2xl p-6 mb-8 inline-block min-w-[200px]">
                    <span class="block text-sm text-gray-500 uppercase font-bold mb-1">Tổng số câu hỏi</span>
                    <span id="start-q-count" class="text-4xl font-black text-blue-600">0</span>
                </div>

                <div>
                    <button onclick="initPracticeSession()" class="btn-gradient text-white px-12 py-4 rounded-2xl font-bold text-lg shadow-xl hover:scale-105 transition-all">
                        Bắt đầu làm bài
                    </button>
                </div>
            </div>

            <!-- Quiz Screen (Hidden by default) -->
            <div id="practice-quiz-screen" class="hidden">
                <div class="glass-card rounded-2xl p-6">
                    <div id="practice-header" class="flex justify-between items-center mb-8 border-b pb-4">
                        <div class="flex flex-col">
                            <h2 class="text-xl font-bold text-gray-800">Luyện Tập</h2>
                            <div class="flex items-center mt-1">
                                <div class="w-32 h-2 bg-gray-200 rounded-full mr-3 overflow-hidden">
                                    <div id="progress-bar-fill" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
                                </div>
                                <span id="practice-progress" class="text-xs text-gray-500 font-bold uppercase tracking-tighter">0/0</span>
                            </div>
                        </div>
                        <button onclick="exitPractice()" class="text-gray-400 hover:text-red-500 text-sm">
                            <i class="fas fa-times-circle text-xl"></i>
                        </button>
                    </div>

                    <div id="practice-container" class="min-h-[250px]"></div>

                    <div id="practice-action-bar" class="mt-8 flex flex-col md:flex-row justify-between items-center hidden border-t pt-6 gap-4">
                        <div id="feedback-message" class="font-bold text-lg"></div>
                        <button id="btn-next-question" onclick="nextQuestion()" class="w-full md:w-auto bg-gray-800 text-white px-10 py-4 rounded-xl font-bold hover:bg-black transition-all flex items-center justify-center">
                            Tiếp theo <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Overlay -->
        <div id="modal-result" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-10 max-w-md w-full text-center shadow-2xl animate-quiz">
                <div id="result-icon" class="text-7xl mb-6">🏆</div>
                <h2 class="text-2xl font-bold mb-2">Kết quả bài làm</h2>
                <div class="inline-block bg-blue-50 px-6 py-2 rounded-full mb-6">
                    <p id="result-score" class="text-4xl font-black text-blue-600">0/0</p>
                </div>
                <p id="result-text" class="text-gray-600 mb-8 text-lg"></p>
                <button onclick="closeResult()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold shadow-lg">Hoàn thành</button>
            </div>
        </div>
    </div>

    <script>
        let questions = JSON.parse(localStorage.getItem('quiz_app_data')) || [];
        let currentPracticeQuestions = [];
        let currentIdx = 0;
        let score = 0;
        let isAnswered = false;

        window.onload = () => {
            renderQuestionList();
            toggleQuestionTypeUI();
        };

        function switchTab(tab) {
            const btnCreate = document.getElementById('btn-tab-create');
            const btnPractice = document.getElementById('btn-tab-practice');
            const secCreate = document.getElementById('section-create');
            const secPractice = document.getElementById('section-practice');

            if (tab === 'create') {
                btnCreate.className = "px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all";
                btnPractice.className = "px-6 py-2 rounded-full font-medium bg-white text-gray-600 hover:bg-gray-50 transition-all border";
                secCreate.classList.remove('hidden-section');
                secPractice.classList.add('hidden-section');
            } else {
                btnPractice.className = "px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all";
                btnCreate.className = "px-6 py-2 rounded-full font-medium bg-white text-gray-600 hover:bg-gray-50 transition-all border";
                secPractice.classList.remove('hidden-section');
                secCreate.classList.add('hidden-section');
                showStartScreen();
            }
        }

        function showStartScreen() {
            document.getElementById('practice-start-screen').classList.remove('hidden');
            document.getElementById('practice-quiz-screen').classList.add('hidden');
            document.getElementById('start-q-count').innerText = questions.length;
        }

        function initPracticeSession() {
            if (questions.length === 0) {
                showToast("Vui lòng thêm câu hỏi trước khi luyện tập", "error");
                return;
            }
            
            // Shuffle
            currentPracticeQuestions = [...questions].sort(() => Math.random() - 0.5);
            currentIdx = 0;
            score = 0;
            
            document.getElementById('practice-start-screen').classList.add('hidden');
            document.getElementById('practice-quiz-screen').classList.remove('hidden');
            
            renderCurrentQuestion();
        }

        function exitPractice() {
            if (confirm("Bạn có muốn dừng phiên luyện tập này không?")) {
                showStartScreen();
            }
        }

        function toggleQuestionTypeUI() {
            const type = document.getElementById('q-type').value;
            const mcq = document.getElementById('mcq-options-container');
            const short = document.getElementById('short-answer-container');
            mcq.classList.toggle('hidden', type !== 'mcq');
            short.classList.toggle('hidden', type !== 'short');
        }

        function addQuestion() {
            const type = document.getElementById('q-type').value;
            const text = document.getElementById('q-text').value.trim();
            if (!text) return showToast("Nội dung câu hỏi không được để trống");

            let q = { id: Date.now(), type, text };
            if (type === 'mcq') {
                const optA = document.getElementById('opt-a').value.trim();
                const optB = document.getElementById('opt-b').value.trim();
                const optC = document.getElementById('opt-c').value.trim();
                const optD = document.getElementById('opt-d').value.trim();
                if (!optA || !optB || !optC || !optD) return showToast("Vui lòng nhập đủ 4 phương án");
                q.options = { A: optA, B: optB, C: optC, D: optD };
                q.correct = document.getElementById('mcq-correct').value;
            } else {
                const correct = document.getElementById('short-correct').value.trim();
                if (!correct) return showToast("Vui lòng nhập đáp án đúng");
                q.correct = correct;
            }

            questions.push(q);
            saveData();
            renderQuestionList();
            resetForm();
            showToast("Đã lưu vào ngân hàng!", "success");
        }

        function renderQuestionList() {
            const list = document.getElementById('questions-list');
            document.getElementById('q-count').innerText = questions.length;
            list.innerHTML = '';
            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = "flex items-start justify-between p-4 bg-white rounded-xl border border-gray-100 shadow-sm";
                div.innerHTML = `
                    <div class="pr-4">
                        <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${q.type === 'mcq' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}">${q.type === 'mcq' ? 'Trắc nghiệm' : 'Trả lời ngắn'}</span>
                        <p class="font-medium text-gray-800 mt-1 line-clamp-2">${i+1}. ${q.text}</p>
                    </div>
                    <button onclick="deleteQuestion(${q.id})" class="text-gray-300 hover:text-red-500 p-1"><i class="fas fa-trash-alt"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function renderCurrentQuestion() {
            isAnswered = false;
            const q = currentPracticeQuestions[currentIdx];
            const container = document.getElementById('practice-container');
            const actionBar = document.getElementById('practice-action-bar');
            const feedback = document.getElementById('feedback-message');
            const progress = document.getElementById('practice-progress');
            const progressBar = document.getElementById('progress-bar-fill');

            progress.innerText = `${currentIdx + 1} / ${currentPracticeQuestions.length}`;
            progressBar.style.width = `${((currentIdx + 1) / currentPracticeQuestions.length) * 100}%`;
            
            actionBar.classList.add('hidden');
            feedback.innerHTML = '';
            
            let html = `<div class="animate-quiz">
                <div class="mb-8">
                    <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest mb-3 inline-block">Câu hỏi ${currentIdx + 1}</span>
                    <h3 class="text-2xl font-bold text-gray-800 leading-tight">${q.text}</h3>
                </div>`;

            if (q.type === 'mcq') {
                const keys = ['A', 'B', 'C', 'D'].sort(() => Math.random() - 0.5);
                html += `<div class="grid grid-cols-1 gap-4">`;
                keys.forEach(key => {
                    html += `
                        <button onclick="checkMCQ('${key}')" id="btn-opt-${key}" class="mcq-option flex items-center p-5 border-2 border-gray-100 rounded-2xl hover:border-blue-300 hover:bg-blue-50 transition-all text-left bg-white group">
                            <span class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center mr-4 font-bold text-gray-500 group-hover:bg-blue-600 group-hover:text-white transition-all">${key}</span>
                            <span class="text-lg font-medium text-gray-700">${q.options[key]}</span>
                        </button>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="flex flex-col space-y-4">
                        <input type="text" id="short-answer-input" class="w-full p-5 border-2 border-gray-100 rounded-2xl input-focus text-lg" placeholder="Nhập đáp án..." onkeypress="if(event.key === 'Enter') checkShortAnswer()">
                        <button onclick="checkShortAnswer()" id="btn-submit-short" class="bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">Kiểm tra kết quả</button>
                    </div>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function checkMCQ(choice) {
            if (isAnswered) return;
            isAnswered = true;
            const q = currentPracticeQuestions[currentIdx];
            const feedback = document.getElementById('feedback-message');
            const actionBar = document.getElementById('practice-action-bar');
            const btnChoice = document.getElementById(`btn-opt-${choice}`);
            const btnCorrect = document.getElementById(`btn-opt-${q.correct}`);

            if (choice === q.correct) {
                score++;
                btnChoice.classList.add('answer-correct');
                feedback.innerHTML = `<span class="text-green-600 flex items-center"><i class="fas fa-check-circle mr-2 text-2xl"></i> Rất tốt!</span>`;
            } else {
                btnChoice.classList.add('answer-wrong');
                if (btnCorrect) btnCorrect.classList.add('answer-correct');
                feedback.innerHTML = `<span class="text-red-600 flex items-center"><i class="fas fa-times-circle mr-2 text-2xl"></i> Chưa chính xác</span>`;
            }

            document.querySelectorAll('.mcq-option').forEach(btn => btn.style.cursor = 'default');
            actionBar.classList.remove('hidden');
        }

        function checkShortAnswer() {
            if (isAnswered) return;
            const input = document.getElementById('short-answer-input');
            const val = input.value.trim();
            if (!val) return;

            isAnswered = true;
            const q = currentPracticeQuestions[currentIdx];
            const feedback = document.getElementById('feedback-message');
            const actionBar = document.getElementById('practice-action-bar');
            const isCorrect = val.toLowerCase() === q.correct.toLowerCase();

            input.disabled = true;
            document.getElementById('btn-submit-short').classList.add('hidden');

            if (isCorrect) {
                score++;
                input.classList.add('answer-correct');
                feedback.innerHTML = `<span class="text-green-600 font-bold"><i class="fas fa-check-circle mr-2"></i> Chính xác!</span>`;
            } else {
                input.classList.add('answer-wrong');
                feedback.innerHTML = `<div class="text-red-600">
                    <span class="font-bold"><i class="fas fa-times-circle mr-2"></i> Sai rồi!</span>
                    <p class="text-xs text-gray-500 mt-1 italic font-normal text-right">Đáp án đúng: ${q.correct}</p>
                </div>`;
            }
            actionBar.classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < currentPracticeQuestions.length - 1) {
                currentIdx++;
                renderCurrentQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const modal = document.getElementById('modal-result');
            document.getElementById('result-score').innerText = `${score}/${currentPracticeQuestions.length}`;
            const percent = (score / currentPracticeQuestions.length) * 100;
            const textEl = document.getElementById('result-text');
            const iconEl = document.getElementById('result-icon');
            
            if (percent === 100) { iconEl.innerText = "👑"; textEl.innerText = "Đỉnh cao! Không sai câu nào."; }
            else if (percent >= 70) { iconEl.innerText = "🌟"; textEl.innerText = "Làm tốt lắm! Kiến thức rất vững."; }
            else { iconEl.innerText = "💪"; textEl.innerText = "Hãy luyện tập thêm để cải thiện nhé!"; }
            
            modal.classList.remove('hidden');
        }

        function closeResult() {
            document.getElementById('modal-result').classList.add('hidden');
            switchTab('create');
        }

        function deleteQuestion(id) {
            questions = questions.filter(q => q.id !== id);
            saveData();
            renderQuestionList();
        }

        function clearAllQuestions() {
            if (confirm("Xác nhận xóa toàn bộ câu hỏi?")) {
                questions = [];
                saveData();
                renderQuestionList();
            }
        }

        function saveData() { localStorage.setItem('quiz_app_data', JSON.stringify(questions)); }
        function resetForm() { 
            document.getElementById('q-text').value = '';
            document.querySelectorAll('#mcq-options-container input').forEach(i => i.value = '');
            document.getElementById('short-correct').value = '';
        }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-8 py-4 rounded-2xl text-white font-bold shadow-2xl z-[100] animate-quiz ${type==='success'?'bg-green-600':'bg-red-600'}`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
    </script>
</body>
</html>
