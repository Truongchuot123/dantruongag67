<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Luyện Tập Câu Hỏi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .input-focus {
            transition: all 0.2s;
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .hidden-section {
            display: none;
        }

        .answer-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            transform: scale(1.02);
        }

        .answer-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        /* Animations */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-quiz {
            animation: fadeInScale 0.4s ease-out forwards;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">HỆ THỐNG LUYỆN TẬP</h1>
            <div id="connection-status" class="inline-flex items-center px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-xs font-medium">
                <i class="fas fa-circle-notch fa-spin mr-2"></i> Đang kết nối server...
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex justify-center space-x-4 mb-8">
            <button onclick="switchTab('create')" id="btn-tab-create" class="px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all">
                <i class="fas fa-plus-circle mr-2"></i>Thiết Kế
            </button>
            <button onclick="switchTab('practice')" id="btn-tab-practice" class="px-6 py-2 rounded-full font-medium bg-white text-gray-600 hover:bg-gray-50 transition-all border">
                <i class="fas fa-play-circle mr-2"></i>Luyện Tập
            </button>
        </div>

        <!-- Section: Create Question -->
        <section id="section-create" class="glass-card rounded-2xl p-6 mb-8">
            <h2 class="text-xl font-semibold mb-6 flex items-center">
                <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                Tạo Câu Hỏi Mới
            </h2>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-xs uppercase tracking-wider">Loại hình</label>
                    <select id="q-type" onchange="toggleQuestionTypeUI()" class="w-full p-3 border rounded-xl input-focus bg-gray-50">
                        <option value="mcq">Trắc nghiệm</option>
                        <option value="short">Trả lời ngắn</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-xs uppercase tracking-wider">Nội dung câu hỏi</label>
                    <textarea id="q-text" rows="3" class="w-full p-3 border rounded-xl input-focus" placeholder="Nhập câu hỏi..."></textarea>
                </div>

                <!-- MCQ Options -->
                <div id="mcq-options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">A</span>
                        <input type="text" id="opt-a" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn A">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">B</span>
                        <input type="text" id="opt-b" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn B">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">C</span>
                        <input type="text" id="opt-c" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn C">
                    </div>
                    <div class="relative">
                        <span class="absolute left-3 top-3 font-bold text-blue-400">D</span>
                        <input type="text" id="opt-d" class="w-full pl-10 pr-3 py-3 border rounded-xl input-focus" placeholder="Lựa chọn D">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-green-700 mb-2 text-xs uppercase tracking-wider">Đáp án đúng</label>
                        <select id="mcq-correct" class="w-full p-3 border rounded-xl input-focus border-green-200">
                            <option value="A">Phương án A</option>
                            <option value="B">Phương án B</option>
                            <option value="C">Phương án C</option>
                            <option value="D">Phương án D</option>
                        </select>
                    </div>
                </div>

                <!-- Short Answer -->
                <div id="short-answer-container" class="hidden">
                    <label class="block text-sm font-medium text-green-700 mb-2 text-xs uppercase tracking-wider">Đáp án đúng</label>
                    <input type="text" id="short-correct" class="w-full p-3 border rounded-xl input-focus border-green-200" placeholder="Nhập đáp án chính xác...">
                </div>

                <button id="btn-save" onclick="addQuestion()" class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition-all">
                    LƯU CÂU HỎI
                </button>
            </div>

            <div class="mt-12 border-t pt-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-gray-700 text-lg">Ngân hàng câu hỏi (<span id="q-count">0</span>)</h3>
                    <button onclick="clearAllQuestions()" class="text-sm text-red-500 hover:text-red-700 flex items-center">
                        <i class="fas fa-trash-alt mr-1"></i> Xóa tất cả
                    </button>
                </div>
                <div id="questions-list" class="space-y-4 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </section>

        <!-- Section: Practice -->
        <section id="section-practice" class="hidden-section">
            <!-- Start Screen -->
            <div id="practice-start-screen" class="glass-card rounded-3xl p-12 text-center animate-quiz">
                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                    <i class="fas fa-rocket"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Sẵn sàng luyện tập?</h2>
                
                <div class="bg-gray-50 rounded-2xl p-6 mb-8 inline-block min-w-[200px]">
                    <span class="block text-sm text-gray-500 uppercase font-bold mb-1">Tổng số câu hỏi</span>
                    <span id="start-q-count" class="text-4xl font-black text-blue-600">0</span>
                </div>

                <div>
                    <button onclick="startQuiz()" class="btn-gradient text-white px-12 py-4 rounded-2xl font-bold text-lg shadow-xl hover:scale-105 transition-all">
                        Bắt đầu làm bài
                    </button>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div id="practice-quiz-screen" class="hidden">
                <div class="glass-card rounded-2xl p-6">
                    <div id="practice-header" class="flex justify-between items-center mb-8 border-b pb-4">
                        <div class="flex flex-col">
                            <h2 class="text-xl font-bold text-gray-800">Luyện Tập</h2>
                            <div class="flex items-center mt-1">
                                <div class="w-32 h-2 bg-gray-200 rounded-full mr-3 overflow-hidden">
                                    <div id="progress-bar-fill" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
                                </div>
                                <span id="practice-progress" class="text-xs text-gray-500 font-bold uppercase tracking-tighter">0/0</span>
                            </div>
                        </div>
                        <button onclick="switchTab('create')" class="text-gray-400 hover:text-red-500 text-sm">
                            <i class="fas fa-times-circle text-xl"></i>
                        </button>
                    </div>

                    <div id="question-display" class="min-h-[250px]"></div>

                    <div id="quiz-footer" class="mt-8 flex flex-col md:flex-row justify-between items-center hidden border-t pt-6 gap-4">
                        <div id="quiz-feedback" class="font-bold text-lg"></div>
                        <button onclick="handleNext()" class="w-full md:w-auto bg-gray-800 text-white px-10 py-4 rounded-xl font-bold hover:bg-black transition-all flex items-center justify-center">
                            Tiếp theo <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Modal -->
        <div id="modal-result" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-10 max-w-md w-full text-center shadow-2xl animate-quiz">
                <div id="result-icon" class="text-7xl mb-6">🏆</div>
                <h2 class="text-2xl font-bold mb-2">Kết quả bài làm</h2>
                <div class="inline-block bg-blue-50 px-6 py-2 rounded-full mb-6">
                    <p id="result-score" class="text-4xl font-black text-blue-600">0/0</p>
                </div>
                <p id="result-text" class="text-gray-600 mb-8 text-lg"></p>
                <button onclick="closeResult()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold shadow-lg">Hoàn thành</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8AVoyDEpY2U5migHCQ_r7DEOC5QYkqMI",
            authDomain: "luyentap-2f2ab.firebaseapp.com",
            projectId: "luyentap-2f2ab",
            storageBucket: "luyentap-2f2ab.firebasestorage.app",
            messagingSenderId: "646969953114",
            appId: "1:646969953114:web:71dd282afdb53d02924163"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const collectionPath = 'artifacts/luyentap-2f2ab/public/data/questions';
        const qRef = collection(db, collectionPath);

        let userReady = false;

        async function connect() {
            try {
                await signInAnonymously(auth);
                const statusIcon = document.getElementById('connection-status');
                statusIcon.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Đã kết nối server';
                statusIcon.className = 'inline-flex items-center px-3 py-1 rounded-full bg-green-100 text-green-700 text-xs font-medium';
                userReady = true;
                listenData();
            } catch (err) {
                console.error(err);
                document.getElementById('connection-status').innerText = 'Lỗi kết nối!';
            }
        }

        function listenData() {
            onSnapshot(qRef, (snap) => {
                window.questions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateUI();
            });
        }

        window.saveQuestion = async (data) => {
            if(!userReady) return false;
            try {
                await addDoc(qRef, { ...data, timestamp: Date.now() });
                return true;
            } catch (e) {
                return false;
            }
        };

        window.removeQuestion = async (id) => {
            try {
                await deleteDoc(doc(db, collectionPath, id));
            } catch (e) {}
        };

        window.clearAllQuestions = async () => {
            if(!confirm("Xóa toàn bộ ngân hàng câu hỏi?")) return;
            try {
                const snapshot = await getDocs(qRef);
                const batch = writeBatch(db);
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                showToast("Đã xóa tất cả", "success");
            } catch (e) {
                showToast("Lỗi khi xóa");
            }
        };

        connect();
    </script>

    <script>
        window.questions = [];
        let currentQuiz = [];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function switchTab(tab) {
            const isCreate = tab === 'create';
            document.getElementById('section-create').classList.toggle('hidden-section', !isCreate);
            document.getElementById('section-practice').classList.toggle('hidden-section', isCreate);
            
            // UI Toggle
            document.getElementById('btn-tab-create').className = isCreate ? 
                "px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all" : 
                "px-6 py-2 rounded-full font-medium bg-white text-gray-600 border transition-all";
            document.getElementById('btn-tab-practice').className = !isCreate ? 
                "px-6 py-2 rounded-full font-medium bg-blue-600 text-white shadow-lg transition-all" : 
                "px-6 py-2 rounded-full font-medium bg-white text-gray-600 border transition-all";

            if(!isCreate) {
                document.getElementById('practice-start-screen').classList.remove('hidden');
                document.getElementById('practice-quiz-screen').classList.add('hidden');
                document.getElementById('start-q-count').innerText = window.questions.length;
            }
        }

        function toggleQuestionTypeUI() {
            const type = document.getElementById('q-type').value;
            document.getElementById('mcq-options-container').classList.toggle('hidden', type !== 'mcq');
            document.getElementById('short-answer-container').classList.toggle('hidden', type !== 'short');
        }

        async function addQuestion() {
            const text = document.getElementById('q-text').value.trim();
            const type = document.getElementById('q-type').value;
            if(!text) return showToast("Vui lòng nhập câu hỏi");

            let data = { type, text };
            if(type === 'mcq') {
                data.options = {
                    A: document.getElementById('opt-a').value.trim(),
                    B: document.getElementById('opt-b').value.trim(),
                    C: document.getElementById('opt-c').value.trim(),
                    D: document.getElementById('opt-d').value.trim()
                };
                data.correct = document.getElementById('mcq-correct').value;
                if(!data.options.A || !data.options.B) return showToast("Nhập các phương án A & B");
            } else {
                data.correct = document.getElementById('short-correct').value.trim();
                if(!data.correct) return showToast("Nhập đáp án đúng");
            }

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerText = "ĐANG LƯU...";
            
            const success = await window.saveQuestion(data);
            if(success) {
                showToast("Đã lưu!", "success");
                document.getElementById('q-text').value = '';
                ['opt-a', 'opt-b', 'opt-c', 'opt-d', 'short-correct'].forEach(id => document.getElementById(id).value = '');
            }
            btn.disabled = false;
            btn.innerText = "LƯU CÂU HỎI";
        }

        function updateUI() {
            document.getElementById('q-count').innerText = window.questions.length;
            const list = document.getElementById('questions-list');
            list.innerHTML = window.questions.map(q => `
                <div class="flex items-center justify-between p-4 bg-white border rounded-2xl animate-quiz shadow-sm">
                    <div class="truncate pr-4">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-blue-50 text-blue-600 mr-2 uppercase">${q.type === 'mcq' ? 'TN' : 'Ngắn'}</span>
                        <span class="text-sm font-medium text-gray-700">${q.text}</span>
                    </div>
                    <button onclick="window.removeQuestion('${q.id}')" class="text-gray-300 hover:text-red-500 transition-colors"><i class="fas fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-center text-gray-400 py-8 italic text-sm">Chưa có câu hỏi nào trong ngân hàng</p>';
        }

        function startQuiz() {
            if(window.questions.length === 0) return showToast("Chưa có câu hỏi");
            currentQuiz = [...window.questions].sort(() => Math.random() - 0.5);
            currentIdx = 0; score = 0;
            document.getElementById('practice-start-screen').classList.add('hidden');
            document.getElementById('practice-quiz-screen').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = currentQuiz[currentIdx];
            const progress = ((currentIdx + 1) / currentQuiz.length) * 100;
            
            document.getElementById('practice-progress').innerText = `${currentIdx + 1}/${currentQuiz.length}`;
            document.getElementById('progress-bar-fill').style.width = `${progress}%`;
            document.getElementById('quiz-footer').classList.add('hidden');
            
            let html = `<h3 class="text-2xl font-bold text-gray-800 mb-8 leading-tight animate-quiz">${q.text}</h3>`;
            
            if(q.type === 'mcq') {
                html += `<div class="grid grid-cols-1 gap-4">` + ['A','B','C','D'].map(key => `
                    <button onclick="checkMCQ('${key}')" id="opt-${key}" class="w-full text-left p-5 border-2 border-gray-100 rounded-2xl hover:bg-blue-50 hover:border-blue-100 transition-all flex items-center group">
                        <span class="w-10 h-10 rounded-xl bg-gray-100 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center font-bold mr-4 text-gray-500 transition-all">${key}</span>
                        <span class="text-gray-700 font-medium">${q.options[key] || '---'}</span>
                    </button>
                `).join('') + `</div>`;
            } else {
                html += `
                    <div class="animate-quiz">
                        <input type="text" id="short-input" class="w-full p-5 border-2 border-gray-100 rounded-2xl mb-6 text-lg focus:border-blue-500 outline-none transition-all" placeholder="Nhập câu trả lời của bạn...">
                        <button onclick="checkShort()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold text-lg shadow-lg">GỬI ĐÁP ÁN</button>
                    </div>
                `;
            }
            document.getElementById('question-display').innerHTML = html;
        }

        function checkMCQ(choice) {
            if(answered) return;
            answered = true;
            const q = currentQuiz[currentIdx];
            const isCorrect = choice === q.correct;
            if(isCorrect) score++;
            
            document.getElementById(`opt-${choice}`).classList.add(isCorrect ? 'answer-correct' : 'answer-wrong');
            if(!isCorrect) document.getElementById(`opt-${q.correct}`).classList.add('answer-correct');
            
            showFeedback(isCorrect);
        }

        function checkShort() {
            const val = document.getElementById('short-input').value.trim();
            if(!val) return;
            answered = true;
            const q = currentQuiz[currentIdx];
            const isCorrect = val.toLowerCase() === q.correct.toLowerCase();
            if(isCorrect) score++;
            document.getElementById('short-input').classList.add(isCorrect ? 'answer-correct' : 'answer-wrong');
            showFeedback(isCorrect, q.correct);
        }

        function showFeedback(correct, answer) {
            const f = document.getElementById('quiz-feedback');
            f.innerHTML = correct ? 
                '<div class="flex items-center text-green-600"><i class="fas fa-check-circle mr-2"></i> Rất tốt!</div>' : 
                `<div class="flex items-center text-red-600"><i class="fas fa-times-circle mr-2"></i> Sai rồi (ĐA: ${answer || ''})</div>`;
            document.getElementById('quiz-footer').classList.remove('hidden');
        }

        function handleNext() {
            if(currentIdx < currentQuiz.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const percent = (score / currentQuiz.length) * 100;
            document.getElementById('result-score').innerText = `${score}/${currentQuiz.length}`;
            
            let icon = "🏆", text = "Xuất sắc! Bạn đã làm rất tốt.";
            if(percent < 50) { icon = "😅"; text = "Cần cố gắng thêm nhé!"; }
            else if(percent < 80) { icon = "⭐"; text = "Làm tốt lắm, hãy tiếp tục phát huy."; }

            document.getElementById('result-icon').innerText = icon;
            document.getElementById('result-text').innerText = text;
            document.getElementById('modal-result').classList.remove('hidden');
        }

        function closeResult() {
            document.getElementById('modal-result').classList.add('hidden');
            switchTab('create');
        }

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white font-bold shadow-2xl z-[100] animate-quiz ${type==='success'?'bg-green-500':'bg-red-500'}`;
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
    </script>
</body>
</html>
