<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Giải Phẫu Cơ Học</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        borderbg: '#334155',
                        accenten: '#38bdf8', // Màu xanh lam nổi bật cho tên tiếng Anh
                        tablelabel: '#fef08a', // Màu vàng nhạt nổi bật cho nhãn bảng
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .formatted-content p {
            margin-bottom: 0.25rem;
        }
        /* Style bảng chi tiết giải phẫu chuẩn */
        .anatomy-table {
            border-collapse: collapse;
            width: 100%;
        }
        .anatomy-table th, .anatomy-table td {
            border: 1px solid #475569;
            padding: 10px 14px;
        }
        .anatomy-table .label-cell {
            background-color: #fef08a; /* Vàng nhạt */
            color: #0f172a;
            font-weight: 700;
            width: 140px;
            vertical-align: middle;
            font-size: 0.95rem;
        }
        .anatomy-table .value-cell {
            background-color: #1e293b;
            color: #e2e8f0;
            vertical-align: top;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen pt-[20px] px-4 md:px-8 pb-12">

    <div class="max-w-[1600px] mx-auto space-y-6">

        <!-- Toolbar: Tìm kiếm & Lọc vùng -->
        <div class="bg-cardbg p-5 rounded-2xl border border-borderbg shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="p-3 bg-sky-500/10 border border-sky-500/20 rounded-xl text-sky-400">
                    <i class="fa-solid fa-heart-pulse text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">TRA CỨU GIẢI PHẪU CƠ</h1>
                    <p class="text-xs text-slate-400">Khám phá & tra cứu chi tiết thông tin hệ cơ trên cơ thể</p>
                </div>
            </div>

            <!-- Search & Filter Controls -->
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên tiếng Việt hoặc tiếng Anh..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-darkbg border border-borderbg rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-all">
                </div>

                <select id="filterRegion" class="w-full sm:w-52 bg-darkbg border border-borderbg rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-sky-400 transition-all cursor-pointer">
                    <option value="">-- Tất cả các vùng --</option>
                    <option value="Đầu - Mặt - Cổ">Đầu - Mặt - Cổ</option>
                    <option value="Ngực - Lưng">Ngực - Lưng</option>
                    <option value="Bụng - Chậu">Bụng - Chậu</option>
                    <option value="Chi trên">Chi trên</option>
                    <option value="Chi dưới">Chi dưới</option>
                </select>
            </div>
        </div>

        <!-- Dynamic Grid of Cards -->
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20 bg-cardbg/50 rounded-2xl border border-borderbg">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-sky-400 mb-3"></i>
                <p class="text-slate-400 font-medium">Đang tải danh sách cơ...</p>
            </div>
        </div>

    </div>

    <!-- Modal Chi Tiết Giải Phẫu -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
        <div class="bg-cardbg border border-borderbg w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden my-auto relative max-h-[92vh] flex flex-col transform transition-all duration-300">
            
            <!-- Modal Header Sticky -->
            <div class="px-6 py-4 border-b border-borderbg bg-slate-800/90 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md">
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-sky-950 text-sky-300 border border-sky-800/60" id="modalVung">
                    Vùng
                </span>
                <button id="btnCloseModal" class="w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:text-white hover:bg-slate-700 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Content Scrollable -->
            <div class="p-6 overflow-y-auto space-y-6">
                
                <!-- Tên cơ tiếng Việt & tiếng Anh -->
                <div class="text-center space-y-1 py-2">
                    <h2 id="modalTenVN" class="text-2xl sm:text-3xl font-black text-white tracking-tight">Tên Cơ Tiếng Việt</h2>
                    <p id="modalTenEN" class="text-lg sm:text-xl font-bold text-accenten italic">Muscle English Name</p>
                </div>

                <!-- Carousel trượt danh sách hình ảnh & chú thích -->
                <div id="modalImageCarousel" class="relative max-w-xl mx-auto w-full bg-slate-900 border border-borderbg rounded-2xl overflow-hidden p-3 shadow-xl">
                    <!-- Khung ảnh chính -->
                    <div class="relative w-full h-64 sm:h-80 flex items-center justify-center overflow-hidden rounded-xl bg-darkbg" id="carouselTouchContainer">
                        <img id="modalHinhAnh" src="" alt="Hình ảnh cơ" class="max-w-full max-h-full object-contain rounded-lg transition-all duration-300">
                        
                        <!-- Nút Trượt Trái -->
                        <button id="btnPrevImg" onclick="changeCarouselSlide(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/60 hover:bg-sky-600 text-white flex items-center justify-center transition backdrop-blur-md shadow-lg z-10">
                            <i class="fa-solid fa-chevron-left text-sm"></i>
                        </button>
                        <!-- Nút Trượt Phải -->
                        <button id="btnNextImg" onclick="changeCarouselSlide(1)" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/60 hover:bg-sky-600 text-white flex items-center justify-center transition backdrop-blur-md shadow-lg z-10">
                            <i class="fa-solid fa-chevron-right text-sm"></i>
                        </button>
                        
                        <!-- Số thứ tự ảnh -->
                        <span id="carouselCounter" class="absolute top-2 right-2 bg-black/70 text-slate-200 text-xs px-2.5 py-1 rounded-full border border-slate-700 backdrop-blur-sm">
                            1 / 1
                        </span>
                    </div>

                    <!-- Ghi chú / Chú thích ảnh -->
                    <div id="carouselCaption" class="mt-3 text-center text-sm font-medium text-amber-300 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700/80 min-h-[40px] flex items-center justify-center">
                        <!-- Caption injected here -->
                    </div>

                    <!-- Chấm Dots chuyển ảnh -->
                    <div id="carouselDots" class="flex justify-center items-center gap-1.5 mt-2">
                        <!-- Dots injected here -->
                    </div>
                </div>

                <!-- ĐẠI CƯƠNG -->
                <div class="bg-slate-800/70 border border-indigo-500/30 p-4.5 rounded-2xl space-y-2 shadow-lg">
                    <h4 class="text-sm font-bold text-indigo-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-book-open text-indigo-400"></i> Đại cương
                    </h4>
                    <div id="modalDaiCuong" class="text-sm text-slate-200 leading-relaxed formatted-content pt-1">---</div>
                </div>

                <!-- CONTAINER CHO CÁC BẢNG GIẢI PHẪU (ĐƯỢC TẠO ĐỘNG) -->
                <div class="space-y-6" id="modalTablesContainer">
                    <!-- Dynamic anatomy tables will be inserted here -->
                </div>

                <!-- Bệnh lý thường gặp -->
                <div class="bg-red-950/20 border border-red-900/40 p-4 rounded-xl space-y-1">
                    <h4 class="text-sm font-bold text-red-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-red-400"></i> Các bệnh lý liên quan / thường gặp
                    </h4>
                    <div id="modalBenhLy" class="text-sm text-slate-200 leading-relaxed formatted-content pt-1">---</div>
                </div>

                <!-- Ghi chú tổng quan -->
                <div class="bg-slate-800/50 border border-borderbg p-4 rounded-xl space-y-1">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-note-sticky text-indigo-400"></i> Ghi chú thêm
                    </h4>
                    <div id="modalGhiChu" class="text-sm text-slate-300 leading-relaxed formatted-content pt-1">---</div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-3 border-t border-borderbg bg-slate-800/80 flex justify-end">
                <button id="btnCloseModalBottom" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold rounded-xl transition shadow-md">
                    Đóng cửa sổ
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyXmxsZAg6JxgcsujSIwMfbZTHscfJSCg",
            authDomain: "dulieuweb-6541e.firebaseapp.com",
            projectId: "dulieuweb-6541e",
            storageBucket: "dulieuweb-6541e.firebasestorage.app",
            messagingSenderId: "215480268517",
            appId: "1:215480268517:web:16600eafd6839fee5dc60c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allMuscles = [];
        let currentUser = null;
        let currentCarouselImages = [];
        let currentCarouselIndex = 0;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'giai-phau-app';
        const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'co_giai_phau');

        // Hàm xử lý tải lại ảnh thông minh khi tệp HTML ở vị trí thư mục bất kỳ
        window.handleImageError = function(imgElement, originalSrc) {
            const fallbackSrc = 'https://placehold.co/400x500/1e293b/38bdf8?text=Hinh+Anh+Giai+Phau';
            
            if (!originalSrc) {
                imgElement.onerror = null;
                imgElement.src = fallbackSrc;
                return;
            }

            const cleanSrc = originalSrc.replace(/^\/+/, '');
            const retryCount = parseInt(imgElement.getAttribute('data-retry-count') || '0', 10);
            imgElement.setAttribute('data-retry-count', retryCount + 1);

            // Các đường dẫn thử nghiệm nếu người dùng gõ tên ảnh trực tiếp
            const candidatePaths = [
                cleanSrc,
                'images/' + cleanSrc,
                'img/' + cleanSrc,
                'assets/' + cleanSrc,
                '../' + cleanSrc,
                '../../' + cleanSrc,
                '../../../' + cleanSrc,
                '../images/' + cleanSrc,
                '../img/' + cleanSrc
            ];

            if (retryCount < candidatePaths.length) {
                imgElement.src = candidatePaths[retryCount];
            } else {
                imgElement.onerror = null;
                imgElement.src = fallbackSrc;
            }
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Lỗi xác thực Firebase:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadMusclesData();
            }
        });

        function loadMusclesData() {
            if (!currentUser) return;

            onSnapshot(collectionPath, (snapshot) => {
                allMuscles = [];
                snapshot.forEach((docSnap) => {
                    allMuscles.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });
                renderCards();
            }, (error) => {
                console.error("Lỗi lấy dữ liệu:", error);
                document.getElementById('cardsGrid').innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p>Không thể kết nối hoặc tải dữ liệu từ máy chủ.</p>
                    </div>
                `;
            });
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterRegion = document.getElementById('filterRegion').value;

            const filtered = allMuscles.filter(item => {
                const matchRegion = !filterRegion || item.vung === filterRegion;
                const matchSearch = !searchVal || 
                    (item.tenVN && item.tenVN.toLowerCase().includes(searchVal)) ||
                    (item.tenEN && item.tenEN.toLowerCase().includes(searchVal));
                return matchRegion && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-cardbg/40 rounded-2xl border border-borderbg">
                        <i class="fa-regular fa-compass text-4xl text-slate-500 mb-3"></i>
                        <p class="text-slate-400 font-medium">Không tìm thấy cơ giải phẫu phù hợp.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                // Lấy duy nhất 1 hình đại diện chính cho thẻ card
                let coverImg = '';
                if (Array.isArray(item.danhSachHinhAnh) && item.danhSachHinhAnh.length > 0) {
                    coverImg = item.danhSachHinhAnh[0].url || '';
                } else if (item.hinhAnh) {
                    coverImg = item.hinhAnh;
                }

                return `
                <div class="relative h-[340px] bg-slate-900 border border-borderbg hover:border-sky-500/60 rounded-2xl overflow-hidden shadow-xl group transition-all duration-300 hover:-translate-y-1">
                    <img src="${escapeHTML(coverImg)}" 
                         alt="${escapeHTML(item.tenVN || 'Cơ')}"
                         data-retry-count="0"
                         onerror="handleImageError(this, '${escapeHTML(coverImg)}')"
                         class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-110 transition-transform duration-700 ease-out">

                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-black/30 group-hover:via-slate-950/70 transition-colors duration-300"></div>

                    <span class="absolute top-3 left-3 bg-indigo-950/80 backdrop-blur-md text-indigo-300 text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-indigo-700/50 shadow-md z-10">
                        ${escapeHTML(item.vung || 'Chưa phân vùng')}
                    </span>

                    <div class="absolute inset-x-0 bottom-0 p-4 space-y-3 z-10 flex flex-col justify-end">
                        <div class="space-y-1">
                            <h3 class="font-black text-lg text-white group-hover:text-sky-400 transition-colors line-clamp-1 drop-shadow-md">
                                ${escapeHTML(item.tenVN || 'Chưa có tên')}
                            </h3>
                            <p class="text-sm font-semibold text-accenten italic line-clamp-1 drop-shadow">
                                ${escapeHTML(item.tenEN || '')}
                            </p>
                        </div>

                        <button onclick="openDetailModal('${item.id}')" 
                                class="w-full py-2.5 px-4 bg-slate-900/80 hover:bg-sky-600 text-slate-100 hover:text-white text-sm font-semibold rounded-xl border border-slate-700 hover:border-sky-500 shadow-lg backdrop-blur-sm transition-all duration-200 flex items-center justify-center gap-2">
                            <span>Xem thêm</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Mở Modal xem thông tin chi tiết
        window.openDetailModal = function(id) {
            const item = allMuscles.find(m => m.id === id);
            if (!item) return;

            document.getElementById('modalVung').textContent = item.vung || 'Chưa rõ vùng';
            document.getElementById('modalTenVN').textContent = item.tenVN || '';
            document.getElementById('modalTenEN').textContent = item.tenEN || '';

            // Chuẩn hóa danh sách hình ảnh cho Carousel
            if (Array.isArray(item.danhSachHinhAnh) && item.danhSachHinhAnh.length > 0) {
                currentCarouselImages = item.danhSachHinhAnh;
            } else if (item.hinhAnh) {
                currentCarouselImages = [{ url: item.hinhAnh, caption: '' }];
            } else {
                currentCarouselImages = [];
            }

            currentCarouselIndex = 0;
            renderCarouselSlide(item.tenVN);
            
            // Đại Cương
            document.getElementById('modalDaiCuong').innerHTML = item.daiCuong || '<span class="text-slate-500 italic">Chưa có thông tin đại cương</span>';

            // Xử lý Render danh sách các bảng giải phẫu theo từng nhóm cơ
            const tablesContainer = document.getElementById('modalTablesContainer');
            tablesContainer.innerHTML = '';

            let tablesList = item.bangChiTiet;
            if (!Array.isArray(tablesList) || tablesList.length === 0) {
                tablesList = [{
                    tenCơNhom: item.tenVN || 'Đặc điểm giải phẫu',
                    nguyenUy: item.nguyenUy || '',
                    bamTan: item.bamTan || '',
                    chucNang: item.chucNang || '',
                    thanKinh: item.thanKinh || '',
                    ghiChu: item.ghiChu || ''
                }];
            }

            tablesList.forEach((tb, idx) => {
                const tableSection = document.createElement('div');
                tableSection.className = 'space-y-2 pt-1';
                
                tableSection.innerHTML = `
                    <div class="bg-gradient-to-r from-sky-950/80 to-slate-900 border-l-4 border-sky-400 px-4 py-2.5 rounded-r-xl shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-sky-400"></i>
                        <h3 class="text-base font-bold text-sky-200 tracking-wide">
                            ${escapeHTML(tb.tenCơNhom || `Nhóm Cơ #${idx + 1}`)}
                        </h3>
                    </div>

                    <div class="overflow-x-auto rounded-xl border border-slate-700 shadow-md">
                        <table class="anatomy-table">
                            <tbody>
                                <tr>
                                    <td class="label-cell">Nguyên ủy</td>
                                    <td class="value-cell formatted-content">${tb.nguyenUy || '<span class="text-slate-500">Chưa cập nhật</span>'}</td>
                                </tr>
                                <tr>
                                    <td class="label-cell">Bám tận</td>
                                    <td class="value-cell formatted-content">${tb.bamTan || '<span class="text-slate-500">Chưa cập nhật</span>'}</td>
                                </tr>
                                <tr>
                                    <td class="label-cell">Chức năng</td>
                                    <td class="value-cell formatted-content">${tb.chucNang || '<span class="text-slate-500">Chưa cập nhật</span>'}</td>
                                </tr>
                                <tr>
                                    <td class="label-cell">TK chi phối</td>
                                    <td class="value-cell formatted-content">${tb.thanKinh || '<span class="text-slate-500">Chưa cập nhật</span>'}</td>
                                </tr>
                                ${tb.ghiChu ? `
                                <tr>
                                    <td class="label-cell" style="background-color: #e2e8f0; color: #1e293b;">Ghi chú</td>
                                    <td class="value-cell formatted-content text-slate-300">${tb.ghiChu}</td>
                                </tr>
                                ` : ''}
                            </tbody>
                        </table>
                    </div>
                `;
                tablesContainer.appendChild(tableSection);
            });

            // Bệnh lý & Ghi chú chung
            document.getElementById('modalBenhLy').innerHTML = item.benhLy || '<span class="text-slate-500 italic">Chưa ghi nhận bệnh lý liên quan</span>';
            document.getElementById('modalGhiChu').innerHTML = item.ghiChu || '<span class="text-slate-500 italic">Không có ghi chú thêm</span>';

            document.getElementById('detailModal').classList.remove('hidden');
        };

        // Render slide ảnh hiện tại trong Carousel
        function renderCarouselSlide(fallbackName = '') {
            const imgElem = document.getElementById('modalHinhAnh');
            const counterElem = document.getElementById('carouselCounter');
            const captionElem = document.getElementById('carouselCaption');
            const dotsElem = document.getElementById('carouselDots');
            const btnPrev = document.getElementById('btnPrevImg');
            const btnNext = document.getElementById('btnNextImg');

            // Lấy tên cơ tiếng Việt làm tên dự phòng nếu không có sẵn
            if (!fallbackName) {
                fallbackName = document.getElementById('modalTenVN').textContent || '';
            }

            if (currentCarouselImages.length === 0) {
                imgElem.src = 'https://placehold.co/400x500/1e293b/38bdf8?text=Chua+Co+Hinh+Anh';
                counterElem.textContent = '0 / 0';
                captionElem.textContent = fallbackName;
                dotsElem.innerHTML = '';
                btnPrev.classList.add('hidden');
                btnNext.classList.add('hidden');
                return;
            }

            const current = currentCarouselImages[currentCarouselIndex];
            imgElem.setAttribute('data-retry-count', '0');
            imgElem.onerror = function() {
                handleImageError(this, current.url || '');
            };
            imgElem.src = current.url || '';

            counterElem.textContent = `${currentCarouselIndex + 1} / ${currentCarouselImages.length}`;

            // Hiển thị chú thích ảnh: Nếu có caption thì dùng caption, nếu không thì dùng tên cơ tiếng Việt
            const captionText = current.caption && current.caption.trim() ? current.caption.trim() : fallbackName;
            captionElem.innerHTML = `<i class="fa-solid fa-circle-info mr-1.5 text-sky-400"></i> ${escapeHTML(captionText)}`;
            captionElem.classList.remove('hidden');

            // Nút trượt
            if (currentCarouselImages.length > 1) {
                btnPrev.classList.remove('hidden');
                btnNext.classList.remove('hidden');
            } else {
                btnPrev.classList.add('hidden');
                btnNext.classList.add('hidden');
            }

            // Dots Navigation
            dotsElem.innerHTML = currentCarouselImages.map((_, i) => `
                <button onclick="goToCarouselSlide(${i})" class="w-2.5 h-2.5 rounded-full transition-all ${i === currentCarouselIndex ? 'bg-sky-400 w-6' : 'bg-slate-600 hover:bg-slate-400'}"></button>
            `).join('');
        }

        window.changeCarouselSlide = function(direction) {
            if (currentCarouselImages.length <= 1) return;
            currentCarouselIndex += direction;
            if (currentCarouselIndex < 0) {
                currentCarouselIndex = currentCarouselImages.length - 1;
            } else if (currentCarouselIndex >= currentCarouselImages.length) {
                currentCarouselIndex = 0;
            }
            renderCarouselSlide();
        };

        window.goToCarouselSlide = function(index) {
            if (index >= 0 && index < currentCarouselImages.length) {
                currentCarouselIndex = index;
                renderCarouselSlide();
            }
        };

        // Hỗ trợ vuốt trượt trên màn hình cảm ứng
        let touchStartX = 0;
        let touchEndX = 0;
        const touchContainer = document.getElementById('carouselTouchContainer');
        
        if (touchContainer) {
            touchContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            touchContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 40) {
                    window.changeCarouselSlide(1); // Vuốt sang trái -> xem ảnh tiếp
                } else if (touchEndX - touchStartX > 40) {
                    window.changeCarouselSlide(-1); // Vuốt sang phải -> xem ảnh trước
                }
            }, { passive: true });
        }

        const closeModal = () => document.getElementById('detailModal').classList.add('hidden');
        document.getElementById('btnCloseModal').addEventListener('click', closeModal);
        document.getElementById('btnCloseModalBottom').addEventListener('click', closeModal);

        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('detailModal')) {
                closeModal();
            }
        });

        document.getElementById('searchInput').addEventListener('input', renderCards);
        document.getElementById('filterRegion').addEventListener('change', renderCards);

        initAuth();
    </script>
</body>
</html>
