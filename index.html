<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - NGUYỄN MAI ĐAN TRƯỜNG</title>
    
    <meta name="description" content="Chào bạn! Đây là không gian cá nhân của Đan Trường. Khám phá thôi nào!.">
    <meta property="og:description" content="Chào bạn! Đây là không gian cá nhân của Đan Trường. Khám phá thôi nào!.">
    <meta property="og:image" content="https://placehold.co/600x400/0f172a/3b82f6?text=Dan+Truong">
    <meta property="og:url" content="https://dantruongag.id.vn">
    <link class="js-favicon" rel="icon" href="/hinhanh/logo_web.png" type="">
    <link rel="stylesheet" href="/style.css">
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Thư viện Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-indigo bg-[#0b0f19] text-gray-100 overflow-x-hidden selection:bg-indigo-500 selection:text-white">
    <!-- Nút quay lại đầu trang / Back to top -->
    <button id="back-to-top" class="fixed bottom-6 right-6 p-3 rounded-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white shadow-lg shadow-indigo-500/30 opacity-0 invisible translate-y-3 transition-all duration-300 z-50 hover:scale-110 animate-bounce">
        <i class="fas fa-arrow-up text-lg"></i>
    </button>

    <!-- Nền hạt chuyển động nhẹ nhàng -->
    <canvas id="ambient-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-45"></canvas>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>
    <div id="search-placeholder"></div>

    <!-- Main Content -->
    <main id="main-content" class="pt-0 relative z-10">
        <section id="hero-banner" class="relative min-h-screen flex items-center justify-center overflow-hidden transition-all duration-1000">
            <div id="hero-bg" class="absolute inset-0 transition-all duration-1000 z-0 bg-cover bg-center"></div>
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f2937_1px,transparent_1px),linear-gradient(to_bottom,#1f2937_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-20 z-10"></div>
            <!-- Lớp phủ tối mượt mà -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#0b0f19]/80 to-[#0b0f19] z-10"></div>
            
            <div class="relative z-20 max-w-5xl mx-auto px-4 text-center mt-12">
                <h1 id="hero-title" class="text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-tight text-white leading-tight">
                    <!-- Được cập nhật tự động bằng JS -->
                </h1>
                <div class="w-24 h-1.5 bg-gradient-to-r from-amber-400 to-indigo-500 mx-auto my-8 rounded-full shadow-lg shadow-indigo-500/50"></div>
                <div id="hero-desc" class="text-base md:text-xl text-gray-300 max-w-2xl mx-auto mb-10 font-light leading-relaxed">
                </div>
                <div id="hero-buttons" class="flex flex-col sm:flex-row justify-center items-center gap-4">
                </div>

                <!-- Form chúc mừng sinh nhật -->
                <div id="form_gui_loi_chuc" class="w-full max-w-md mx-auto mt-8 overflow-hidden max-h-0 transition-all duration-500 ease-in-out">
                    <div class="card_form_gui_loi_chuc bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 shadow-2xl">
                        <textarea placeholder="Nhập lời chúc tốt đẹp nhất của bạn dành cho Đan Trường..." class="w-full h-28 p-4 rounded-xl bg-black/40 text-white border border-white/10 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none resize-none text-sm transition"></textarea>
                        <div class="mt-4 flex justify-end">
                            <button id="nut_gui_loi_chuc" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-violet-600 text-white font-bold text-sm hover:scale-105 transition duration-300">
                                Gửi Đi Ngay <i class="fas fa-paper-plane ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div id="protected-content" class="hidden">
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="/script.js"></script>
</body>
</html>
