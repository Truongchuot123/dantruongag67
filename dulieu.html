<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cơ sở dữ liệu - Nguyên Mai Đan Trường</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .btn-gradient {
            background: linear-gradient(to right, #6366f1, #a855f7);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:active { transform: scale(0.98); }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-animate { animation: modalIn 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .tab-active {
            color: #6366f1;
            border-bottom: 2px solid #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Mở rộng cột nội dung linh hoạt */
        .content-cell {
            width: 100%;
            word-wrap: break-word;
            white-space: normal;
        }
        
        /* Cột môn học và chủ đề thu gọn hơn để nhường chỗ */
        .meta-col {
            min-width: 100px;
            width: 15%;
        }

        @media (max-width: 640px) {
            .meta-col {
                min-width: 80px;
            }
        }
    </style>
</head>
<body class="p-3 sm:p-6 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 text-center sm:text-left">
                    <i class="fas fa-database mr-2"></i>HỆ THỐNG DỮ LIỆU
                </h1>
                <div id="stats-summary" class="flex flex-wrap gap-2 mt-2 justify-center sm:justify-start">
                    <span class="stat-badge text-slate-400"><i class="fas fa-layer-group mr-1 text-indigo-400"></i>Tổng: <span id="total-count">0</span></span>
                    <span class="stat-badge text-slate-400"><i class="fas fa-check-circle mr-1 text-emerald-400"></i>Đã soạn: <span id="done-count">0</span></span>
                    <span class="stat-badge text-slate-400"><i class="fas fa-clock mr-1 text-rose-400"></i>Chưa soạn: <span id="pending-count">0</span></span>
                </div>
            </div>
            <div id="auth-status" class="text-xs text-slate-500 font-mono hidden sm:block"></div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex gap-1 sm:gap-2 mb-6 border-b border-slate-700/50">
            <button onclick="switchTab('all')" id="tab-all" class="px-4 sm:px-6 py-3 text-xs sm:text-sm font-bold transition-all flex items-center gap-2 tab-active">
                <i class="fas fa-list-ul"></i> <span>Tài liệu đã soạn</span>
            </button>
            <button onclick="switchTab('draft')" id="tab-draft" class="px-4 sm:px-6 py-3 text-xs sm:text-sm font-bold transition-all flex items-center gap-2 text-slate-400 hover:text-slate-200">
                <i class="fas fa-pen-nib"></i> <span>Chưa soạn</span>
                <span id="draftCountBadge" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
            </button>
        </div>

        <!-- Filters Grid -->
        <div class="glass-card p-4 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">
            <div class="lg:col-span-4 relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-indigo-500 text-sm transition-all">
            </div>
            <div class="lg:col-span-3">
                <select id="filterSubject" class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-indigo-500 text-sm text-slate-300 appearance-none cursor-pointer">
                    <option value="">Tất cả môn học</option>
                </select>
            </div>
            <div class="lg:col-span-3">
                <select id="filterTopic" class="w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded-lg outline-none focus:border-indigo-500 text-sm text-slate-300 appearance-none cursor-pointer">
                    <option value="">Tất cả chủ đề</option>
                </select>
            </div>
            <div class="lg:col-span-2">
                <button onclick="openModal()" class="w-full btn-gradient text-white py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                    <i class="fas fa-plus"></i> <span>Thêm</span>
                </button>
            </div>
        </div>

        <!-- Result Info -->
        <div class="mb-3 px-1 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest">
            <div id="filter-result-text">Hiển thị <span id="current-view-count" class="text-indigo-400">0</span> kết quả</div>
        </div>

        <!-- Content Table -->
        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-sm border-collapse table-auto">
                    <thead>
                        <tr class="bg-slate-800/50 border-b border-slate-700">
                            <th class="px-4 py-4 font-semibold text-slate-400 uppercase tracking-wider text-[11px] meta-col">Môn</th>
                            <th class="px-4 py-4 font-semibold text-slate-400 uppercase tracking-wider text-[11px] meta-col">Chủ đề</th>
                            <!-- Cột Nội dung được mở rộng tối đa -->
                            <th class="px-4 py-4 font-semibold text-slate-400 uppercase tracking-wider text-[11px] content-cell">Nội dung chi tiết tài liệu</th>
                            <th id="th-link" class="px-2 py-4 font-semibold text-slate-400 uppercase tracking-wider text-[11px] text-center w-12">Link</th>
                            <th class="px-4 py-4 font-semibold text-slate-400 uppercase tracking-wider text-[11px] text-right w-20">Xử lý</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
            <div id="mainLoader" class="py-20 text-center flex flex-col items-center gap-3">
                <div class="loader !w-8 !h-8 !border-4"></div>
                <span class="text-slate-500 text-xs animate-pulse">Đang đồng bộ...</span>
            </div>
            <div id="emptyState" class="hidden py-16 text-center text-slate-500">
                <i class="fas fa-folder-open text-3xl mb-3 opacity-20 block"></i>
                <p class="text-sm">Không tìm thấy dữ liệu</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="linkModal" class="fixed inset-0 bg-slate-950/80 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4 backdrop-blur-md">
        <div class="bg-slate-900 w-full max-w-md rounded-t-2xl sm:rounded-2xl border-t sm:border border-slate-700/50 modal-animate overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg text-indigo-400">Thêm dữ liệu</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800 text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <form id="linkForm" class="p-5 space-y-4">
                <input type="hidden" id="editId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-slate-500 font-black mb-1.5 block uppercase">Môn học</label>
                        <input type="text" id="subject" list="subjectList" placeholder="..." required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 font-black mb-1.5 block uppercase">Chủ đề</label>
                        <input type="text" id="topic" list="topicList" placeholder="..." required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-black mb-1.5 block uppercase">Tên tài liệu</label>
                    <input type="text" id="title" placeholder="Nhập tên tài liệu tại đây...." required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-black mb-1.5 block uppercase text-indigo-400">Đường dẫn tài liệu</label>
                    <input type="url" id="url" placeholder="https://..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl outline-none focus:border-indigo-500 text-sm">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-bold text-sm">Hủy</button>
                    <button type="submit" id="submitBtn" class="flex-1 btn-gradient py-3 text-white rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/20">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-5 py-3 rounded-full bg-slate-800 border border-indigo-500/30 text-white text-xs font-bold shadow-2xl opacity-0 translate-y-10 transition-all duration-300 z-[100] pointer-events-none flex items-center gap-2">
        <i class="fas fa-info-circle text-indigo-400"></i>
        <span id="toastMsg">Thông báo</span>
    </div>

    <datalist id="subjectList"></datalist>
    <datalist id="topicList"></datalist>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyXmxsZAg6JxgcsujSIwMfbZTHscfJSCg",
            authDomain: "dulieuweb-6541e.firebaseapp.com",
            projectId: "dulieuweb-6541e",
            storageBucket: "dulieuweb-6541e.firebasestorage.app",
            messagingSenderId: "215480268517",
            appId: "1:215480268517:web:16600eafd6839fee5dc60c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'v2-database-school';

        let allLinks = [];
        let currentTab = 'all'; 

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (u) => {
            if (u) {
                document.getElementById('auth-status').textContent = "UID: " + u.uid.substring(0,8);
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'links');
                onSnapshot(colRef, (snap) => {
                    allLinks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    allLinks.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    updateBadgeAndStats();
                    updateFilterOptions();
                    render();
                    document.getElementById('mainLoader').classList.add('hidden');
                }, () => showToast("Kết nối thất bại"));
            }
        });

        initAuth();

        function updateBadgeAndStats() {
            const pendingCount = allLinks.filter(l => !l.url || l.url.trim() === '').length;
            const doneCount = allLinks.length - pendingCount;
            
            document.getElementById('total-count').textContent = allLinks.length;
            document.getElementById('done-count').textContent = doneCount;
            document.getElementById('pending-count').textContent = pendingCount;

            const badge = document.getElementById('draftCountBadge');
            if (pendingCount > 0) {
                badge.textContent = pendingCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function render() {
            const tbody = document.getElementById('dataTable');
            const empty = document.getElementById('emptyState');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const fSub = document.getElementById('filterSubject').value;
            const fTop = document.getElementById('filterTopic').value;

            let tabData = allLinks.filter(item => {
                const hasUrl = item.url && item.url.trim() !== '';
                return currentTab === 'all' ? hasUrl : !hasUrl;
            });

            const filtered = tabData.filter(i => {
                const matchesSearch = (i.title + (i.subject || "") + (i.topic || "")).toLowerCase().includes(search);
                const matchesSub = !fSub || i.subject === fSub;
                const matchesTop = !fTop || i.topic === fTop;
                return matchesSearch && matchesSub && matchesTop;
            });

            document.getElementById('current-view-count').textContent = filtered.length;
            const linkTh = document.getElementById('th-link');
            if (linkTh) linkTh.style.display = currentTab === 'draft' ? 'none' : 'table-cell';

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-800/30 transition-colors group">
                    <td class="px-4 py-4 align-top meta-col">
                        <span class="inline-block text-[9px] font-black text-indigo-300 uppercase bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20 truncate max-w-full">
                            ${item.subject}
                        </span>
                    </td>
                    <td class="px-4 py-4 align-top meta-col">
                        <span class="inline-block text-[9px] font-black text-purple-300 uppercase bg-purple-500/10 px-1.5 py-0.5 rounded border border-purple-500/20 truncate max-w-full">
                            ${item.topic}
                        </span>
                    </td>
                    <td class="px-4 py-4 align-top content-cell">
                        <div class="font-semibold text-slate-200 text-xs sm:text-sm leading-relaxed group-hover:text-indigo-400 transition-colors">
                            ${item.title}
                        </div>
                        ${item.url ? `<div class="text-[9px] text-slate-500 truncate mt-1 opacity-60">${item.url}</div>` : `<div class="text-[9px] text-rose-500/70 italic mt-1 font-medium"><i class="fas fa-clock mr-1"></i>Đang chờ soạn thảo...</div>`}
                    </td>
                    ${currentTab === 'all' ? `
                    <td class="px-2 py-4 text-center align-top w-12">
                        <a href="${item.url}" target="_blank" class="w-8 h-8 inline-flex items-center justify-center bg-slate-800 hover:bg-indigo-600 rounded-lg transition-all border border-slate-700 active:scale-90">
                            <i class="fas fa-external-link-alt text-[10px]"></i>
                        </a>
                    </td>` : ''}
                    <td class="px-4 py-4 text-right align-top w-20">
                        <div class="flex justify-end gap-1">
                            <button onclick="window.editItem('${item.id}')" class="w-7 h-7 flex items-center justify-center text-blue-400 hover:bg-blue-400/10 rounded-lg transition-colors"><i class="fas fa-edit text-[10px]"></i></button>
                            <button onclick="window.deleteItem('${item.id}')" class="w-7 h-7 flex items-center justify-center text-rose-400 hover:bg-rose-400/10 rounded-lg transition-colors"><i class="fas fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-all').className = `px-4 sm:px-6 py-3 text-xs sm:text-sm font-bold transition-all flex items-center gap-2 ${tab === 'all' ? 'tab-active' : 'text-slate-400 hover:text-slate-200'}`;
            document.getElementById('tab-draft').className = `px-4 sm:px-6 py-3 text-xs sm:text-sm font-bold transition-all flex items-center gap-2 ${tab === 'draft' ? 'tab-active' : 'text-slate-400 hover:text-slate-200'}`;
            render();
        };

        window.editItem = (id) => {
            const item = allLinks.find(l => l.id === id);
            if (!item) return;
            document.getElementById('editId').value = id;
            document.getElementById('subject').value = item.subject;
            document.getElementById('topic').value = item.topic;
            document.getElementById('title').value = item.title;
            document.getElementById('url').value = item.url || '';
            document.getElementById('modalTitle').textContent = "Cập nhật dữ liệu";
            openModal();
        };

        window.deleteItem = async (id) => {
            if (confirm("Bạn có chắc chắn muốn xóa?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'links', id));
                    showToast("Xóa thành công");
                } catch (e) { showToast("Lỗi khi xóa"); }
            }
        };

        function updateFilterOptions() {
            const subjects = [...new Set(allLinks.map(l => l.subject))].sort();
            const topics = [...new Set(allLinks.map(l => l.topic))].sort();

            const populateSelect = (id, data, label) => {
                const el = document.getElementById(id);
                const cur = el.value;
                el.innerHTML = `<option value="">${label}</option>` + 
                    data.map(d => `<option value="${d}" ${d === cur ? 'selected' : ''}>${d}</option>`).join('');
            };

            populateSelect('filterSubject', subjects, "Môn học");
            populateSelect('filterTopic', topics, "Chủ đề");
            
            document.getElementById('subjectList').innerHTML = subjects.map(s => `<option value="${s}">`).join('');
            document.getElementById('topicList').innerHTML = topics.map(t => `<option value="${t}">`).join('');
        }

        document.getElementById('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const btn = document.getElementById('submitBtn');
            const data = {
                subject: document.getElementById('subject').value.trim(),
                topic: document.getElementById('topic').value.trim(),
                title: document.getElementById('title').value.trim(),
                url: document.getElementById('url').value.trim(),
                updatedAt: serverTimestamp()
            };
            
            if (!id) data.createdAt = serverTimestamp();

            btn.disabled = true;
            btn.innerHTML = `<div class="loader mx-auto"></div>`;

            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'links', id), data);
                    showToast("Cập nhật thành công");
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'links'), data);
                    showToast("Đã lưu dữ liệu");
                }
                closeModal();
            } catch (err) {
                showToast("Lỗi hệ thống");
            } finally {
                btn.disabled = false;
                btn.textContent = "Lưu";
            }
        });

        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('filterSubject').addEventListener('change', render);
        document.getElementById('filterTopic').addEventListener('change', render);

    </script>

    <script>
        function openModal() {
            document.getElementById('linkModal').classList.remove('hidden');
            document.getElementById('linkModal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            document.getElementById('linkModal').classList.add('hidden');
            document.getElementById('linkModal').classList.remove('flex');
            document.body.style.overflow = '';
            document.getElementById('linkForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = "Thêm dữ liệu";
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-10'), 2500);
        }
    </script>
</body>
</html>
