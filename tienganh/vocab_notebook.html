<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Tay Từ Vựng Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .swal2-popup { background: #1e293b !important; color: #f1f5f9 !important; border-radius: 1rem !important; }
        .swal2-input, .swal2-textarea, .swal2-select { 
            background: #334155 !important; 
            color: #f1f5f9 !important; 
            border: 1px solid #475569 !important;
            border-radius: 0.5rem !important;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .example-line { position: relative; padding-left: 1.5rem; }
        .example-line::before { 
            content: "•"; position: absolute; left: 0.5rem; color: #8b5cf6; font-weight: bold; 
        }
        .clickable-word:hover { text-decoration: underline; cursor: pointer; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent italic tracking-tight">VOCAB NOTEBOOK</h1>
            <div id="stats" class="text-sm text-slate-400 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
                Đang tải dữ liệu...
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 space-y-4">
                <div class="relative">
                    <input type="text" id="search" placeholder="Tìm kiếm từ vựng, nghĩa hoặc bài học..." 
                           class="w-full p-4 pl-12 rounded-xl bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-purple-500 outline-none transition-all">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
                </div>
                
                <div class="flex flex-wrap gap-2">
                    <button onclick="setFilter('all', this)" class="filter-btn bg-purple-500 text-white px-4 py-2 rounded-lg text-sm transition-all font-medium">Tất cả</button>
                    <button onclick="setFilter('unchecked', this)" class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition-all text-slate-300">Chưa học</button>
                    <button onclick="setFilter('checked', this)" class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition-all text-slate-300">Đã học</button>
                    <button onclick="setFilter('watchlist', this)" class="filter-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition-all text-yellow-400 flex items-center gap-1">
                        <span>⭐</span> Cần tìm hiểu
                    </button>
                </div>
            </div>
            
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <label class="text-[10px] uppercase font-bold text-slate-500 mb-2 block tracking-widest">Lọc theo chủ đề</label>
                <input type="text" id="topic-search" placeholder="Tìm chủ đề..." 
                       class="w-full p-2 mb-3 rounded-lg bg-slate-900 border border-slate-700 text-sm outline-none">
                <div id="topicNav" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2"></div>
            </div>
        </div>

        <div id="loader" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-slate-400">Đang đồng bộ dữ liệu...</p>
        </div>
        
        <div id="vocab-list" class="space-y-10"></div>
    </main>

    <button id="add-word-btn" class="fixed bottom-6 right-6 w-14 h-14 bg-purple-600 hover:bg-purple-500 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl transition-transform hover:scale-110 z-50">
        +
    </button>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykgN9Mf37KxqMZx2XW1mqPJJ3jVunAWVEljUAszFJVwMLxDXJpDHg6cvpdkMHR2v_iKQ/exec';

    const LESSON_OPTIONS = [
        "COMMUNICATION", "FAMILY", "FESTIVALS", "FOOD", "HEALTH", 
        "HOBBY", "HOMETOWN", "HOUSES", "THE INTERNET", "JOB", 
        "LEARNING ENGLISH", "PERSONAL INFORMATION", "TRAMSOPRT", "TRAVEL"
    ];

    let allWords = [];
    let currentFilter = 'all';
    let selectedTopic = 'all';
    // Watchlist bây giờ lưu cả Object thay vì chỉ String
    let watchlist = JSON.parse(localStorage.getItem('vocab_watchlist_data') || '[]');
    
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    async function apiCall(formData, isUpdate = false) {
        Swal.fire({ title: 'Đang xử lý...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error("Lỗi kết nối.");
            
            // Nếu lưu thành công từ watchlist vào DB, xóa nó khỏi watchlist
            const english = formData.get('english');
            removeFromWatchlist(english);

            await loadVocabulary(); 
            Swal.fire({ icon: 'success', title: isUpdate ? 'Đã cập nhật!' : 'Đã thêm mới!', confirmButtonColor: '#8b5cf6' });
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Lỗi!', text: error.message });
        }
    }
        
    async function loadVocabulary() {
        const loader = $('#loader');
        if (allWords.length === 0) loader.style.display = 'block';

        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            allWords = data.map((word) => ({
                id: word.ID,
                english: word.english || '',
                type: word.type || '',
                ipa: word.ipa || '',
                vietnamese: word.vietnamese || '',
                topic: word.topic || 'Chưa phân loại',
                lesson: word.lesson || '', 
                definition: word.definition || '',
                example: word.example || '',
                synonym: word.synonym || '',
                antonym: word.antonym || '',
                checked: localStorage.getItem(`vocab_checked_${word.english}`) === "true"
            }));
            displayVocabulary();
        } catch (error) {
            $('#vocab-list').innerHTML = `<p class="text-center text-red-400">Lỗi tải dữ liệu.</p>`;
        } finally {
            loader.style.display = 'none';
        }
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        $$('.filter-btn').forEach(b => {
            b.className = 'filter-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-lg text-sm transition-all';
            if (b.innerText.includes('Cần tìm hiểu')) b.classList.add('text-yellow-400');
        });
        
        btn.className = 'filter-btn bg-purple-500 text-white px-4 py-2 rounded-lg text-sm transition-all font-medium';
        displayVocabulary();
    }

    function selectTopic(topic) {
        selectedTopic = topic;
        displayVocabulary();
    }

    function jumpToWord(wordText) {
        const cleanWord = wordText.trim().toLowerCase();
        const searchInput = $('#search');
        searchInput.value = cleanWord;
        selectedTopic = 'all'; 
        displayVocabulary();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- LOGIC WATCHLIST MỚI ---

    function saveToWatchlist(wordData) {
        // Kiểm tra xem đã tồn tại chưa
        const exists = watchlist.find(w => w.english.toLowerCase() === wordData.english.toLowerCase());
        if (!exists) {
            watchlist.push(wordData);
            localStorage.setItem('vocab_watchlist_data', JSON.stringify(watchlist));
            updateStats();
            displayVocabulary();
        }
    }

    function removeFromWatchlist(english) {
        watchlist = watchlist.filter(w => w.english.toLowerCase() !== english.toLowerCase());
        localStorage.setItem('vocab_watchlist_data', JSON.stringify(watchlist));
        updateStats();
    }

    function openQuickAddWatchlist(query) {
        Swal.fire({
            title: 'Lưu tạm từ mới',
            html: `
                <div class="text-left space-y-3">
                    <p class="text-xs text-slate-400">Từ này chưa có trong dữ liệu. Bạn muốn lưu tạm để tra cứu sau?</p>
                    <input id="quick-eng" class="swal2-input !m-0 !w-full" value="${query}" placeholder="Từ tiếng Anh...">
                    <input id="quick-viet" class="swal2-input !m-0 !w-full" placeholder="Nghĩa sơ bộ (không bắt buộc)...">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'Lưu vào Watchlist',
            cancelButtonText: 'Hủy',
            preConfirm: () => {
                const eng = $('#quick-eng').value.trim();
                if (!eng) return Swal.showValidationMessage('Cần nhập từ tiếng Anh');
                return {
                    english: eng,
                    vietnamese: $('#quick-viet').value.trim() || 'Chưa rõ nghĩa',
                    topic: 'Cần tìm hiểu',
                    isTemp: true // Đánh dấu là từ tạm thời
                };
            }
        }).then(result => {
            if (result.isConfirmed) {
                saveToWatchlist(result.value);
                Swal.fire({ icon: 'success', title: 'Đã lưu tạm!', timer: 1500, showConfirmButton: false });
            }
        });
    }

    // --- HIỂN THỊ ---

    function displayVocabulary() {
        const container = $('#vocab-list');
        const searchQuery = $('#search').value.toLowerCase().trim();
        
        // 1. Lấy dữ liệu từ DB
        let filteredDB = allWords.filter(word => {
            const matchesTopic = selectedTopic === 'all' || word.topic === selectedTopic;
            const matchesSearch = !searchQuery || 
                word.english.toLowerCase().includes(searchQuery) ||
                word.vietnamese.toLowerCase().includes(searchQuery) ||
                word.lesson.toLowerCase().includes(searchQuery);
            
            let matchesStatus = true;
            if (currentFilter === 'checked') matchesStatus = word.checked;
            else if (currentFilter === 'unchecked') matchesStatus = !word.checked;
            else if (currentFilter === 'watchlist') return false; // Sẽ xử lý riêng ở dưới

            return matchesTopic && matchesSearch && matchesStatus;
        });

        // 2. Lấy dữ liệu từ Watchlist
        let filteredWatchlist = watchlist.filter(word => {
            const matchesSearch = !searchQuery || 
                word.english.toLowerCase().includes(searchQuery) ||
                word.vietnamese.toLowerCase().includes(searchQuery);
            
            if (currentFilter === 'watchlist') return matchesSearch;
            if (currentFilter === 'all') return matchesSearch;
            return false;
        });

        // Hợp nhất dữ liệu hiển thị (ưu tiên DB lên trước)
        let finalData = [];
        if (currentFilter === 'watchlist') {
            finalData = filteredWatchlist;
        } else {
            finalData = [...filteredDB, ...filteredWatchlist];
        }

        container.innerHTML = '';

        // Hiển thị nút "Thêm nhanh" nếu không tìm thấy gì trong DB mà có searchQuery
        if (searchQuery && filteredDB.length === 0 && currentFilter !== 'watchlist') {
            container.innerHTML = `
                <div class="bg-slate-800/40 border-2 border-dashed border-slate-700 p-8 rounded-2xl text-center space-y-4 animate-fadeIn">
                    <p class="text-slate-400">Không tìm thấy "<strong>${searchQuery}</strong>" trong dữ liệu chính.</p>
                    <button onclick="openQuickAddWatchlist('${searchQuery}')" class="bg-yellow-500 hover:bg-yellow-600 text-slate-900 px-6 py-3 rounded-xl font-bold transition-all shadow-lg">
                        ⭐ Lưu tạm vào Watchlist
                    </button>
                </div>
            `;
            if (finalData.length === 0) {
                updateStats();
                return;
            }
        }

        if (finalData.length === 0) {
            container.innerHTML = `<div class="text-center py-20 text-slate-500">Danh sách trống...</div>`;
            updateStats();
            return;
        }

        const grouped = finalData.reduce((acc, word) => {
            const t = word.isTemp ? '⭐ DANH SÁCH TẠM THỜI' : word.topic;
            (acc[t] = acc[t] || []).push(word);
            return acc;
        }, {});

        Object.keys(grouped).sort().forEach(topic => {
            const section = document.createElement('div');
            section.className = 'animate-fadeIn';
            const isWatchlistGroup = topic.includes('DANH SÁCH TẠM');
            section.innerHTML = `
                <h3 class="text-lg font-bold ${isWatchlistGroup ? 'text-yellow-500' : 'text-slate-400'} mb-4 flex items-center gap-3 px-2">
                    <span class="w-1 h-5 ${isWatchlistGroup ? 'bg-yellow-500' : 'bg-purple-500'} rounded-full"></span> ${topic.toUpperCase()}
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            `;
            const grid = section.querySelector('div');
            grouped[topic].forEach(word => grid.appendChild(createWordCard(word)));
            container.appendChild(section);
        });
        updateStats();
    }
    
    function updateTopicNav(allTopics) {
        const nav = $('#topicNav');
        const topicSearch = $('#topic-search').value.toLowerCase();
        nav.innerHTML = '';
        
        const topicsToShow = ['all', ...allTopics.filter(t => t.toLowerCase().includes(topicSearch)).sort()];
        topicsToShow.forEach(topic => {
            const isActive = selectedTopic === topic;
            const btn = document.createElement('button');
            btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition-all border ${
                isActive ? 'bg-purple-600 border-purple-500 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'
            }`;
            btn.textContent = topic === 'all' ? 'Tất cả' : topic;
            btn.onclick = () => selectTopic(topic);
            nav.appendChild(btn);
        });
    }

    function createWordCard(word) {
        const card = document.createElement('div');
        const isTemp = word.isTemp;
        card.className = `group relative p-6 bg-slate-800/80 rounded-2xl border ${isTemp ? 'border-yellow-500/30 bg-yellow-500/5' : 'border-slate-700'} hover:border-purple-500/50 hover:bg-slate-800 transition-all ${word.checked ? 'border-purple-900/40 bg-purple-900/5' : ''}`;

        const exampleLines = word.example ? word.example.split('\n').filter(l => l.trim()).map(line => 
            `<div class="example-line">${line.trim()}</div>`
        ).join('') : '';

        card.innerHTML = `
            <div class="flex justify-between items-start mb-3">
                <div class="flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                        <h4 class="text-xl font-bold text-white tracking-tight">${word.english}</h4>
                        ${word.type ? `<span class="text-[11px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded font-bold uppercase">${word.type}</span>` : ''}
                        <button onclick="speak('${word.english}')" class="text-slate-500 hover:text-purple-400 transition-colors">🔊</button>
                    </div>
                    <p class="text-xs text-slate-500 font-mono mt-1">${word.ipa ? `[${word.ipa}]` : ''}</p>
                </div>
                <div class="flex items-center gap-2">
                    ${isTemp ? `
                        <button onclick="openForm(${JSON.stringify(word).replace(/"/g, '&quot;')})" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-1 rounded-lg font-bold transition-all">
                            Chính thức hóa
                        </button>
                        <button onclick="removeFromWatchlist('${word.english}'); displayVocabulary();" class="text-slate-500 hover:text-red-400">🗑️</button>
                    ` : `
                        <button onclick="openForm(${JSON.stringify(word).replace(/"/g, '&quot;')})" class="opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-blue-400 transition-all">✏️</button>
                        <input type="checkbox" class="w-5 h-5 rounded-md border-slate-600 text-purple-600 bg-slate-700 focus:ring-0 cursor-pointer" ${word.checked ? 'checked' : ''}>
                    `}
                </div>
            </div>

            <div class="space-y-3">
                <div class="flex items-baseline gap-2">
                    <p class="text-lg text-purple-300 font-bold">${word.vietnamese}</p>
                    ${word.lesson ? `<span class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">${word.lesson}</span>` : ''}
                </div>

                ${word.definition ? `<div class="text-sm text-slate-400 leading-relaxed bg-slate-900/50 p-3 rounded-lg border-l-2 border-purple-500/50">${word.definition}</div>` : ''}
                
                ${exampleLines ? `
                    <div class="mt-4 pt-3 border-t border-slate-700/50">
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Examples</p>
                        <div class="text-sm text-slate-400 italic space-y-2 leading-relaxed">${exampleLines}</div>
                    </div>` : ''
                }
            </div>
        `;

        if (!isTemp) {
            const checkbox = card.querySelector('input[type="checkbox"]');
            checkbox.onchange = (e) => {
                word.checked = e.target.checked;
                localStorage.setItem(`vocab_checked_${word.english}`, e.target.checked);
                card.classList.toggle('border-purple-900/40', e.target.checked);
                card.classList.toggle('bg-purple-900/5', e.target.checked);
                updateStats();
            };
        }

        return card;
    }

    function updateStats() {
        const statsEl = $('#stats');
        const total = allWords.length;
        const watchCount = watchlist.length;
        statsEl.innerHTML = total > 0 ? `Tổng: ${total} | ⭐ Tạm: ${watchCount}` : `⭐ Tạm: ${watchCount}`;
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.9;
        speechSynthesis.speak(u);
    }

    function openForm(wordToEdit = null) {
        // Nếu wordToEdit.isTemp = true, nghĩa là ta đang "Chuyển từ tạm thành từ thật"
        const isUpdate = !!wordToEdit && !wordToEdit.isTemp;
        const isFromWatchlist = !!wordToEdit && wordToEdit.isTemp;
        
        const topics = [...new Set(allWords.map(w => w.topic))].filter(t => t !== 'Chưa phân loại').sort();

        Swal.fire({
            title: isUpdate ? 'Chỉnh sửa thẻ' : 'Thêm từ mới',
            width: '650px',
            html: `
                <div class="space-y-4 text-left p-1">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Tiếng Anh *</label>
                            <input id="swal-eng" class="swal2-input !m-0 !w-full" value="${wordToEdit ? wordToEdit.english : ''}" ${isUpdate ? 'readonly' : ''} placeholder="Nhập từ tiếng Anh...">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Phiên âm</label>
                            <input id="swal-ipa" class="swal2-input !m-0 !w-full" value="${wordToEdit?.ipa || ''}" placeholder="Nhập phiên âm...">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Loại từ</label>
                            <input id="swal-type" class="swal2-input !m-0 !w-full" value="${wordToEdit?.type || ''}" placeholder="Nhập loại từ...">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Chủ đề</label>
                            <select id="swal-topic-select" class="swal2-select !m-0 !w-full">
                                <option value="Chưa phân loại">-- Chọn chủ đề --</option>
                                ${topics.map(t => `<option value="${t}" ${wordToEdit?.topic === t ? 'selected' : ''}>${t}</option>`).join('')}
                                <option value="--new--">+ Thêm chủ đề mới...</option>
                            </select>
                            <input id="swal-topic-new" class="swal2-input !mt-2 !m-0 !w-full hidden" placeholder="Nhập tên chủ đề mới...">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Tiếng Việt *</label>
                            <input id="swal-viet" class="swal2-input !m-0 !w-full" value="${wordToEdit ? wordToEdit.vietnamese : ''}" placeholder="Nhập từ tiếng Việt...">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Bài học</label>
                            <select id="swal-lesson" class="swal2-select !m-0 !w-full">
                                <option value="">-- Chọn bài học --</option>
                                ${LESSON_OPTIONS.map(opt => `<option value="${opt}" ${wordToEdit?.lesson === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Đồng nghĩa</label>
                            <input id="swal-syn" class="swal2-input !m-0 !w-full" value="${isUpdate ? wordToEdit.synonym : ''}" placeholder="Nhập từ đồng nghĩa....">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Trái nghĩa</label>
                            <input id="swal-ant" class="swal2-input !m-0 !w-full" value="${isUpdate ? wordToEdit.antonym : ''}" placeholder="Nhập từ trái nghĩa....">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Định nghĩa</label>
                        <textarea id="swal-def" class="swal2-textarea !m-0 !w-full h-16" placeholder="Nhập định nghĩa từ tiếng Anh....">${wordToEdit?.definition || ''}</textarea>
                        <label class="text-[10px] text-slate-500 font-bold ml-1 uppercase">Ví dụ</label>
                        <textarea id="swal-ex" class="swal2-textarea !mt-2 !m-0 !w-full h-24" placeholder="Nhập câu ví dụ...">${wordToEdit?.example || ''}</textarea>
                    </div>
                </div>
            `,
            didOpen: () => {
                const sel = $('#swal-topic-select');
                const inp = $('#swal-topic-new');
                sel.onchange = () => inp.classList.toggle('hidden', sel.value !== '--new--');
            },
            preConfirm: () => {
                const eng = $('#swal-eng').value.trim();
                const viet = $('#swal-viet').value.trim();
                if (!eng || !viet) return Swal.showValidationMessage('Vui lòng nhập Anh và Việt');
                
                let topic = $('#swal-topic-select').value;
                if (topic === '--new--') topic = $('#swal-topic-new').value.trim() || 'Chưa phân loại';

                const fd = new FormData();
                fd.append('action', isUpdate ? 'update' : 'add');
                if (isUpdate) fd.append('id', wordToEdit.id);
                fd.append('english', eng);
                fd.append('vietnamese', viet);
                fd.append('ipa', $('#swal-ipa').value.trim());
                fd.append('type', $('#swal-type').value.trim());
                fd.append('topic', topic);
                fd.append('lesson', $('#swal-lesson').value); 
                fd.append('definition', $('#swal-def').value.trim());
                fd.append('example', $('#swal-ex').value.trim());
                fd.append('synonym', $('#swal-syn').value.trim());
                fd.append('antonym', $('#swal-ant').value.trim());
                return fd;
            }
        }).then(res => {
            if (res.isConfirmed) {
                apiCall(res.value, isUpdate);
            }
        });
    }

    window.onload = () => {
        loadVocabulary();
        $('#search').oninput = displayVocabulary;
        $('#topic-search').oninput = displayVocabulary;
        $('#add-word-btn').onclick = () => openForm();
    };
</script>
</body>
</html>
