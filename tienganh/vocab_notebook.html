<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngMaster & Sổ Tay Từ Vựng</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root { color-scheme: dark; }
        body { font-family: 'Inter', sans-serif; background-color: #020617; } /* slate-950 */
        
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .hidden-view { display: none !important; }
        
        /* Custom Scrollbar Dark */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .flashcard-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .flashcard-scroll::-webkit-scrollbar-thumb { background: #8b5cf6; } /* purple-500 */
        .flashcard-scroll::-webkit-scrollbar-thumb:hover { background: #a78bfa; }

        .card-shadow { box-shadow: 0 0 20px rgba(139, 92, 246, 0.1); } /* purple tint */
        
        /* Sổ Tay Specific Styles */
        .swal2-popup { background: #1e293b !important; color: #f1f5f9 !important; border-radius: 1.5rem !important; }
        .swal2-input, .swal2-textarea, .swal2-select { 
            background: #0f172a !important; 
            color: #f1f5f9 !important; 
            border: 1px solid #334155 !important;
            border-radius: 0.75rem !important;
        }
        .swal2-input:focus, .swal2-textarea:focus, .swal2-select:focus {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2) !important;
        }
        .example-line { position: relative; padding-left: 1.25rem; }
        .example-line::before { 
            content: "•"; position: absolute; left: 0; color: #8b5cf6; font-weight: bold; 
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-200 pb-20">

    <!-- Navigation Bar -->
    <nav class="bg-slate-900/80 backdrop-blur-md text-white border-b border-slate-800 fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto px-2 sm:px-4 h-16 sm:h-16 flex justify-between items-center gap-2">
            <div class="flex items-center space-x-2 shrink-0 hidden sm:flex">
                <div class="bg-gradient-to-br from-purple-600 to-indigo-600 p-1.5 rounded-lg shadow-lg">
                    <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">EngMaster</span>
            </div>
            
            <!-- Thích nghi màn hình: flex-1 trên mobile để dàn đều, co lại trên desktop -->
            <div class="flex flex-1 sm:flex-none space-x-1 sm:space-x-2 overflow-x-auto no-scrollbar w-full justify-between sm:justify-end" id="nav-container">
                <!-- Navigation buttons populated by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 pt-24 pb-12">
        
        <!-- Error & Alert Messages -->
        <div id="status-message" class="hidden-view mb-6 p-4 rounded-2xl flex items-center border shadow-lg"></div>

        <!-- VIEW: LIBRARY (SỔ TAY MỞ RỘNG) -->
        <section id="view-library" class="hidden-view animate-fadeIn">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-black text-white mb-2">Thư viện Từ vựng</h1>
                <p class="text-slate-400">Khám phá và quản lý kho dữ liệu thông minh</p>
            </div>

            <!-- Search & Filters -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 space-y-4">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="search" class="h-5 w-5 text-slate-500 group-focus-within:text-purple-400 transition-colors"></i>
                        </div>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Tìm kiếm từ vựng, nghĩa, bài học..."
                            class="block w-full pl-12 pr-4 py-4 bg-slate-900 border-2 border-slate-800 rounded-2xl focus:ring-4 focus:ring-purple-900/30 focus:border-purple-500 transition-all outline-none text-lg text-white shadow-inner"
                            autocomplete="off"
                        >
                        <div id="search-loading" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center">
                            <div class="animate-spin h-5 w-5 border-2 border-purple-500 border-t-transparent rounded-full"></div>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-2">
                        <button onclick="window.app.setLibraryFilter('all', this)" class="filter-btn bg-purple-600 text-white px-4 py-2 rounded-xl text-sm transition-all font-bold shadow-lg shadow-purple-900/20">Tất cả</button>
                        <button onclick="window.app.setLibraryFilter('unsaved', this)" class="filter-btn bg-slate-900 border border-slate-800 hover:border-slate-600 px-4 py-2 rounded-xl text-sm transition-all text-slate-400 font-medium">Chưa lưu</button>
                        <button onclick="window.app.setLibraryFilter('saved', this)" class="filter-btn bg-slate-900 border border-slate-800 hover:border-slate-600 px-4 py-2 rounded-xl text-sm transition-all text-slate-400 font-medium">Đã lưu</button>
                        <button onclick="window.app.setLibraryFilter('watchlist', this)" class="filter-btn bg-slate-900 border border-yellow-900/50 hover:border-yellow-700/50 px-4 py-2 rounded-xl text-sm transition-all text-yellow-500 font-medium flex items-center gap-1">
                            <i data-lucide="star" class="w-4 h-4"></i> Cần tìm hiểu
                        </button>
                    </div>
                </div>
                
                <!-- Topic Filter -->
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                    <label class="text-[10px] uppercase font-bold text-slate-500 mb-3 block tracking-widest flex items-center gap-1">
                        <i data-lucide="folder-tree" class="w-3 h-3"></i> Lọc theo chủ đề
                    </label>
                    <input type="text" id="topic-search" placeholder="Tìm chủ đề..." 
                           class="w-full p-2.5 mb-3 rounded-xl bg-slate-950 border border-slate-800 text-sm outline-none focus:border-purple-500 transition-colors text-white">
                    <div id="topicNav" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto pr-2 flashcard-scroll"></div>
                </div>
            </div>

            <!-- Loader -->
            <div id="loader" class="text-center py-20 hidden">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                <p class="mt-4 text-slate-400 font-medium">Đang tải dữ liệu từ Google Sheet...</p>
            </div>
            
            <!-- Word List Container -->
            <div id="vocab-list" class="space-y-10"></div>
        </section>

        <!-- VIEW: MY WORDS (ENGMASTER) -->
        <section id="view-mywords" class="hidden-view animate-fadeIn max-w-3xl mx-auto">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-black text-white">Danh sách cá nhân</h2>
                    <p class="text-slate-400 text-sm mt-1">Các từ vựng bạn đã lưu để luyện tập</p>
                </div>
                <span id="mywords-count" class="text-sm font-bold bg-purple-900/40 text-purple-300 px-4 py-1.5 rounded-xl border border-purple-800/50">0 từ</span>
            </div>
            <div id="mywords-list" class="space-y-3"></div>
        </section>

        <!-- VIEW: DASHBOARD -->
        <section id="view-dashboard" class="hidden-view animate-fadeIn max-w-4xl mx-auto">
            <h2 class="text-2xl font-black mb-6 text-white">Thống kê học tập</h2>
            <div id="stats-content"></div>
        </section>

        <!-- VIEW: PRACTICE -->
        <section id="view-practice" class="hidden-view animate-fadeIn">
            <div id="practice-content"></div>
        </section>

    </main>

    <!-- Floating Action Button (Add Word) -->
    <button id="fab-add-word" onclick="window.app.openForm()" class="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 w-14 h-14 bg-purple-600 hover:bg-purple-500 text-white rounded-full shadow-2xl shadow-purple-900/50 flex items-center justify-center transition-transform hover:scale-110 z-40 hidden">
        <i data-lucide="plus" class="w-6 h-6"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykgN9Mf37KxqMZx2XW1mqPJJ3jVunAWVEljUAszFJVwMLxDXJpDHg6cvpdkMHR2v_iKQ/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSU-0sQqaFGHQcMyjJLs_wt0GLVPAXKig",
            authDomain: "vstep-c02b6.firebaseapp.com",
            projectId: "vstep-c02b6",
            storageBucket: "vstep-c02b6.firebasestorage.app",
            messagingSenderId: "5134797464",
            appId: "1:5134797464:web:b4b5b13a58be4922fbdeed"
        };

        const app_fb = initializeApp(firebaseConfig);
        const auth = getAuth(app_fb);
        const db = getFirestore(app_fb);
        const appId = 'english-vocab-app';

        const LESSON_OPTIONS = [
            "COMMUNICATION", "FAMILY", "FESTIVALS", "FOOD", "HEALTH", 
            "HOBBY", "HOMETOWN", "HOUSES", "THE INTERNET", "JOB", 
            "LEARNING ENGLISH", "PERSONAL INFORMATION", "TRANSPORT", "TRAVEL"
        ];

        // STATE
        let state = {
            user: null,
            activeTab: 'library',
            allWords: [], 
            myWords: [],
            watchlist: JSON.parse(localStorage.getItem('vocab_watchlist_data') || '[]'),
            library: {
                filter: 'all', // 'all', 'saved', 'unsaved', 'watchlist'
                topic: 'all',
                search: ''
            },
            practice: {
                gameType: null,
                mode: null,
                index: 0,
                flipped: false,
                pool: [],
                timer: 60,
                interval: null,
                isFinished: false,
                score: 0,
                quizOptions: [],
                quizAnswered: false,
                quizSelectedId: null,
                spellingChecked: false,
                spellingInput: '',
                spellingCorrect: false
            }
        };

        // DOM HELPERS & UTILITIES
        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) => document.querySelectorAll(selector);

        // Hàm xáo trộn mảng (Fisher-Yates) - Đã được thêm mới
        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        const showStatus = (msg, type = "success") => {
            const el = $('#status-message');
            el.className = `mb-6 p-4 rounded-2xl flex items-center animate-fadeIn border shadow-xl ${type === 'error' ? 'bg-red-950/50 text-red-300 border-red-800' : 'bg-emerald-950/50 text-emerald-300 border-emerald-800'}`;
            el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 mr-3"></i><span class="font-medium">${msg}</span>`;
            el.classList.remove('hidden-view');
            lucide.createIcons();
            setTimeout(() => el.classList.add('hidden-view'), 3000);
        };

        // CORE UI UPDATES
        const updateUI = () => {
            renderNav();
            renderViews();
            
            // Toggle FAB visibility
            const fab = $('#fab-add-word');
            if (state.activeTab === 'library') fab.classList.remove('hidden');
            else fab.classList.add('hidden');

            lucide.createIcons();
        };

        const renderNav = () => {
            const navItems = [
                { id: 'library', icon: 'library', text: 'Tra cứu' },
                { id: 'mywords', icon: 'bookmark', text: 'Đã lưu' },
                { id: 'practice', icon: 'gamepad-2', text: 'Luyện tập' },
                { id: 'dashboard', icon: 'bar-chart', text: 'Thống kê' }
            ];
            
            const container = $('#nav-container');
            container.innerHTML = navItems.map(item => `
                <button onclick="window.app.switchTab('${item.id}')" 
                    class="flex-1 sm:flex-none px-2 sm:px-4 py-2 sm:py-2.5 rounded-xl flex flex-col sm:flex-row items-center justify-center sm:space-x-2 text-[10px] sm:text-sm font-medium transition-all ${state.activeTab === item.id ? 'bg-purple-600 text-white shadow-lg shadow-purple-900/30' : 'text-slate-400 hover:bg-slate-800'}">
                    <i data-lucide="${item.icon}" class="w-5 h-5 sm:w-4 sm:h-4 mb-1 sm:mb-0"></i>
                    <span class="whitespace-nowrap">${item.text}</span>
                </button>
            `).join('');
        };

        const renderViews = () => {
            ['library', 'mywords', 'practice', 'dashboard'].forEach(view => {
                const el = $(`#view-${view}`);
                if (state.activeTab === view) {
                    el.classList.remove('hidden-view');
                    if (view === 'library') window.app.displayVocabulary();
                    if (view === 'mywords') renderMyWords();
                    if (view === 'practice') renderPractice();
                    if (view === 'dashboard') renderDashboard();
                } else {
                    el.classList.add('hidden-view');
                }
            });
        };

        // FIREBASE SETUP (Rule 3 compliant)
        const setupAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth init error", error);
            }

            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'my_vocabulary');
                    onSnapshot(colRef, (snap) => {
                        state.myWords = snap.docs.map(d => d.data());
                        $('#mywords-count').innerText = `${state.myWords.length} từ`;
                        if (state.activeTab === 'mywords') renderMyWords();
                        if (state.activeTab === 'library') window.app.displayVocabulary(); // re-render to update bookmark icons
                        if (state.activeTab === 'dashboard') renderDashboard();
                    }, (err) => console.error("Firestore error", err));
                }
            });
        };

        // GOOGLE SCRIPT DATA FETCHING
        const fetchSheetData = async () => {
            $('#loader').classList.remove('hidden');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                state.allWords = data.map((word, index) => ({
                    id: word.ID || `word-${index}`,
                    english: word.english || word["từ vựng"] || word["Word"] || word["word"] || "",
                    vietnamese: word.vietnamese || word["tiếng việt"] || word["Meaning"] || word["meaning"] || "",
                    type: word.type || word["từ loại"] || "",
                    ipa: word.ipa || "",
                    topic: word.topic || "Chưa phân loại",
                    lesson: word.lesson || "",
                    definition: word.definition || "",
                    example: word.example || "",
                    synonym: word.synonym || "",
                    antonym: word.antonym || ""
                })).filter(w => w.english);
                
                if(state.activeTab === 'library') window.app.displayVocabulary();
            } catch (err) {
                showStatus("Lỗi kết nối dữ liệu Google Sheet", "error");
            } finally {
                $('#loader').classList.add('hidden');
            }
        };

        const postToSheet = async (formData, isUpdate = false) => {
            Swal.fire({ title: 'Đang lưu dữ liệu...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Network response was not ok");
                
                // If adding from watchlist, remove it from watchlist
                const english = formData.get('english');
                window.app.removeFromWatchlist(english, false);

                await fetchSheetData(); 
                Swal.fire({ icon: 'success', title: isUpdate ? 'Đã cập nhật!' : 'Đã thêm mới!', confirmButtonColor: '#8b5cf6' });
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Lỗi khi lưu', text: error.message });
            }
        };

        // RENDER FUNCTIONS
        const renderMyWords = () => {
            const listEl = $('#mywords-list');
            if (state.myWords.length === 0) {
                listEl.innerHTML = `<div class="text-center py-20 bg-slate-900 rounded-3xl border border-dashed border-slate-800 text-slate-500">Danh sách trống. Hãy tra cứu và lưu từ mới!</div>`;
                return;
            }
            listEl.innerHTML = state.myWords.map(w => {
                const safeWord = w.english.replace(/'/g, "\\'");
                return `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-sm flex justify-between items-center hover:border-purple-500/50 transition-all group">
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="font-bold text-white text-lg">${w.english}</p>
                            <button onclick="window.app.playAudio('${safeWord}')" class="p-1.5 text-slate-500 hover:bg-slate-800 hover:text-purple-400 rounded-lg transition-all">
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                            </button>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest bg-slate-950 px-2 py-0.5 rounded">${w.type || 'N/A'}</span>
                        </div>
                        <p class="text-slate-400 mt-1">${w.vietnamese}</p>
                    </div>
                    <button onclick="window.app.toggleSaveWord('${w.id}')" class="p-3 text-purple-400 hover:bg-red-950/50 hover:text-red-400 rounded-xl transition-all">
                        <i data-lucide="bookmark-minus" class="w-6 h-6"></i>
                    </button>
                </div>
            `}).join('');
            lucide.createIcons();
        };

        const renderDashboard = () => {
            const content = $('#stats-content');
            const totalDB = state.allWords.length;
            const totalSaved = state.myWords.length;
            const progress = totalDB > 0 ? Math.round((totalSaved / totalDB) * 100) : 0;
            
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center card-shadow relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 opacity-5"><i data-lucide="database" class="w-32 h-32"></i></div>
                        <p class="text-slate-500 text-xs font-bold uppercase mb-2 tracking-widest">Kho từ vựng</p>
                        <p class="text-4xl font-black text-white">${totalDB}</p>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center card-shadow relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 opacity-5"><i data-lucide="bookmark" class="w-32 h-32 text-purple-500"></i></div>
                        <p class="text-slate-500 text-xs font-bold uppercase mb-2 tracking-widest">Đã lưu</p>
                        <p class="text-4xl font-black text-purple-400">${totalSaved}</p>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center card-shadow relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 opacity-5"><i data-lucide="activity" class="w-32 h-32 text-emerald-500"></i></div>
                        <p class="text-slate-500 text-xs font-bold uppercase mb-2 tracking-widest">Tiến độ lưu</p>
                        <p class="text-4xl font-black text-emerald-400">${progress}%</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        // --- PRACTICE RENDERERS ---
        const renderPractice = () => {
            const container = $('#practice-content');
            
            if (!state.practice.gameType) {
                container.innerHTML = `
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-black text-white mb-2">Trung tâm Luyện tập</h2>
                        <p class="text-slate-400">Chọn một trò chơi để ôn tập từ vựng đã lưu</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
                        <!-- Flashcards -->
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 hover:border-indigo-500/50 transition-colors">
                            <div class="w-12 h-12 bg-indigo-950 text-indigo-400 rounded-xl flex items-center justify-center mb-4"><i data-lucide="layers" class="w-6 h-6"></i></div>
                            <h3 class="text-xl font-bold text-white mb-2">Flashcards</h3>
                            <p class="text-slate-500 text-sm mb-6">Lật thẻ truyền thống để ghi nhớ từ và nghĩa.</p>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="window.app.startPractice('flashcard', 'en-vi')" class="py-2.5 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-xl text-sm font-medium transition-all">Anh → Việt</button>
                                <button onclick="window.app.startPractice('flashcard', 'vi-en')" class="py-2.5 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-xl text-sm font-medium transition-all">Việt → Anh</button>
                            </div>
                        </div>
                        <!-- Quiz -->
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 hover:border-emerald-500/50 transition-colors flex flex-col">
                            <div class="w-12 h-12 bg-emerald-950 text-emerald-400 rounded-xl flex items-center justify-center mb-4"><i data-lucide="check-square" class="w-6 h-6"></i></div>
                            <h3 class="text-xl font-bold text-white mb-2">Trắc nghiệm</h3>
                            <p class="text-slate-500 text-sm mb-6 flex-1">Kiểm tra phản xạ chọn đáp án đúng trong 4 phương án.</p>

                            <button onclick="window.app.nextQuestion()" class="px-8 py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-all flex items-center justify-center mx-auto animate-fadeIn">Tiếp tục <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i></button>

                    </div>

            container.innerHTML = `

                        </div>

                    ${gameContent}

            if (state.practice.gameType === 'spelling' && !state.practice.spellingChecked) {
                setTimeout(() => { const el = $('#spelling-input'); if(el) el.focus(); }, 50);
            }
        };


        // APP ACTIONS EXPOSED TO WINDOW
        window.app = {
            switchTab: (tab) => {
                state.activeTab = tab;
                updateUI();
            },
            playAudio: (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US'; 
                    window.speechSynthesis.speak(utterance);
                } else {
                    showStatus("Trình duyệt không hỗ trợ Audio", "error");
                }
            },
            
            // --- SỔ TAY LIBRARY FEATURES ---
            setLibraryFilter: (filter, btnElement) => {
                state.library.filter = filter;
                $$('.filter-btn').forEach(b => {
                    b.className = 'filter-btn bg-slate-900 border border-slate-800 hover:border-slate-600 px-4 py-2 rounded-xl text-sm transition-all text-slate-400 font-medium';
                    if (b.innerText.includes('Cần tìm hiểu')) {
                        b.className = 'filter-btn bg-slate-900 border border-yellow-900/50 hover:border-yellow-700/50 px-4 py-2 rounded-xl text-sm transition-all text-yellow-500 font-medium flex items-center gap-1';
                    }
                });
                if(filter === 'watchlist') {
                    btnElement.className = 'filter-btn bg-yellow-600 text-white px-4 py-2 rounded-xl text-sm transition-all font-bold shadow-lg flex items-center gap-1 shadow-yellow-900/20';

                    btnElement.className = 'filter-btn bg-purple-600 text-white px-4 py-2 rounded-xl text-sm transition-all font-bold shadow-lg shadow-purple-900/20';
                }
                window.app.displayVocabulary();

            selectTopic: (topic) => {
                state.library.topic = topic;
                window.app.displayVocabulary();

            updateTopicNav: (allTopics) => {
                const nav = $('#topicNav');
                const topicSearch = $('#topic-search').value.toLowerCase();
                nav.innerHTML = '';
                
                const topicsToShow = ['all', ...allTopics.filter(t => t.toLowerCase().includes(topicSearch)).sort()];
                topicsToShow.forEach(topic => {
                    const isActive = state.library.topic === topic;
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition-all border whitespace-nowrap ${
                        isActive ? 'bg-purple-600 border-purple-500 text-white shadow-lg shadow-purple-900/30' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-600'
                    }`;
                    btn.textContent = topic === 'all' ? 'Tất cả' : topic;
                    btn.onclick = () => window.app.selectTopic(topic);
                    nav.appendChild(btn);
                });
            },
            displayVocabulary: () => {
                const container = $('#vocab-list');
                const searchQuery = $('#search-input').value.toLowerCase().trim();
                const { filter, topic } = state.library;
                
                // DB Filtering
                let filteredDB = state.allWords.filter(word => {
                    const matchesTopic = topic === 'all' || word.topic === topic;
                    const matchesSearch = !searchQuery || 
                        word.english.toLowerCase().includes(searchQuery) ||
                        word.vietnamese.toLowerCase().includes(searchQuery) ||
                        word.lesson.toLowerCase().includes(searchQuery);
                    
                    const isSaved = state.myWords.some(w => String(w.id) === String(word.id));
                    let matchesStatus = true;
                    if (filter === 'saved') matchesStatus = isSaved;
                    else if (filter === 'unsaved') matchesStatus = !isSaved;
                    else if (filter === 'watchlist') return false; 

                    return matchesTopic && matchesSearch && matchesStatus;
                });

                // Watchlist Filtering
                let filteredWatchlist = state.watchlist.filter(word => {
                    const matchesSearch = !searchQuery || word.english.toLowerCase().includes(searchQuery) || word.vietnamese.toLowerCase().includes(searchQuery);

                    return false;

                    const t = word.isTemp ? '⭐ DANH SÁCH TẠM THỜI' : word.topic;

                    return acc;

                                    <i data-lucide="${isSavedInFirebase ? 'bookmark-check' : 'bookmark'}" class="w-5 h-5"></i>
                                </button>
                            `}
                        </div>
                    </div>

                    <div class="space-y-3 mt-4">
                        <div class="flex items-baseline gap-2">

                            ${word.lesson ? `<span class="text-[9px] text-slate-500 uppercase font-bold tracking-widest px-1.5 py-0.5 bg-slate-800 rounded">${word.lesson}</span>` : ''}
                        </div>

                        ${word.definition ? `<div class="text-sm text-slate-400 leading-relaxed bg-slate-950/50 p-3 rounded-xl border-l-2 border-purple-500/50">${word.definition}</div>` : ''}
                        
                        ${exampleLines ? `
                            <div class="mt-4 pt-4 border-t border-slate-800/80">
                                <p class="text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest flex items-center gap-1"><i data-lucide="quote" class="w-3 h-3"></i> Examples</p>
                                <div class="text-sm text-slate-300 italic space-y-2 leading-relaxed">${exampleLines}</div>
                            </div>` : ''
                        }
                        
                        ${(word.synonym || word.antonym) ? `
                            <div class="flex flex-wrap gap-3 mt-4 pt-4 border-t border-slate-800/80 text-[12px] font-medium">
                                ${word.synonym ? `<div class="bg-emerald-900/20 text-emerald-300 px-3 py-1.5 rounded-lg border border-emerald-800/50 flex gap-2"><span class="text-emerald-500/70 font-bold uppercase tracking-widest">Đồng nghĩa:</span> <span>${word.synonym}</span></div>` : ''}
                                ${word.antonym ? `<div class="bg-rose-900/20 text-rose-300 px-3 py-1.5 rounded-lg border border-rose-800/50 flex gap-2"><span class="text-rose-500/70 font-bold uppercase tracking-widest">Trái nghĩa:</span> <span>${word.antonym}</span></div>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
                return card;
            },

            // --- ADD/EDIT (SWEETALERT) ---
            saveToWatchlist: (wordData) => {
                const exists = state.watchlist.find(w => w.english.toLowerCase() === wordData.english.toLowerCase());
                if (!exists) {
                    state.watchlist.push(wordData);
                    localStorage.setItem('vocab_watchlist_data', JSON.stringify(state.watchlist));
                    window.app.displayVocabulary();
                }
            },
            removeFromWatchlist: (english, updateUI = true) => {
                state.watchlist = state.watchlist.filter(w => w.english.toLowerCase() !== english.toLowerCase());
                localStorage.setItem('vocab_watchlist_data', JSON.stringify(state.watchlist));
                if(updateUI) window.app.displayVocabulary();
            },
            openQuickAddWatchlist: (query) => {
                Swal.fire({
                    title: 'Lưu tạm từ mới',
                    html: `
                        <div class="text-left space-y-3">
                            <p class="text-sm text-slate-400 mb-4">Từ này chưa có trong dữ liệu. Lưu tạm để tra cứu sau?</p>
                            <input id="quick-eng" class="swal2-input !m-0 !w-full" value="${query}" placeholder="Từ tiếng Anh...">
                            <input id="quick-viet" class="swal2-input !m-0 !w-full" placeholder="Nghĩa sơ bộ (không bắt buộc)...">
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Lưu',
                    cancelButtonText: 'Hủy',
                    confirmButtonColor: '#eab308', // yellow-500
                    preConfirm: () => {
                        const eng = $('#quick-eng').value.trim();
                        if (!eng) return Swal.showValidationMessage('Cần nhập từ tiếng Anh');
                        return { english: eng, vietnamese: $('#quick-viet').value.trim() || 'Chưa rõ nghĩa', topic: 'Cần tìm hiểu', isTemp: true, id: 'temp_'+Date.now() };
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        window.app.saveToWatchlist(result.value);
                        Swal.fire({ icon: 'success', title: 'Đã lưu tạm!', timer: 1500, showConfirmButton: false, background: '#1e293b', color: '#fff' });
                    }
                });
            },
            openForm: (wordToEdit = null) => {
                const isUpdate = !!wordToEdit && !wordToEdit.isTemp;
                const topics = [...new Set(state.allWords.map(w => w.topic))].filter(t => t !== 'Chưa phân loại').sort();

                Swal.fire({
                    title: isUpdate ? 'Chỉnh sửa thẻ' : 'Thêm từ mới',
                    width: '700px',
                    html: `
                        <div class="space-y-4 text-left p-1">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Tiếng Anh *</label>
                                <input id="swal-eng" class="swal2-input !m-0 !w-full" value="${wordToEdit ? wordToEdit.english : ''}" ${isUpdate ? 'readonly' : ''} placeholder="English word....."></div>
                                
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Phiên âm</label>
                                <input id="swal-ipa" class="swal2-input !m-0 !w-full" value="${wordToEdit?.ipa || ''}" placeholder="ˈæp.əl"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Loại từ</label>
                                <input id="swal-type" class="swal2-input !m-0 !w-full" value="${wordToEdit?.type || ''}" placeholder="Noun, Verb..."></div>
                                
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Chủ đề</label>
                                <select id="swal-topic-select" class="swal2-select !m-0 !w-full">
                                    <option value="Chưa phân loại">-- Chọn chủ đề --</option>
                                    ${topics.map(t => `<option value="${t}" ${wordToEdit?.topic === t ? 'selected' : ''}>${t}</option>`).join('')}
                                    <option value="--new--">+ Thêm chủ đề mới...</option>
                                </select>
                                <input id="swal-topic-new" class="swal2-input !mt-2 !m-0 !w-full hidden" placeholder="Nhập tên chủ đề mới..."></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Tiếng Việt *</label>
                                <input id="swal-viet" class="swal2-input !m-0 !w-full" value="${wordToEdit ? wordToEdit.vietnamese : ''}" placeholder="Quả táo..."></div>
                                
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Bài học</label>
                                <select id="swal-lesson" class="swal2-select !m-0 !w-full">
                                    <option value="">-- Chọn bài học --</option>
                                    ${LESSON_OPTIONS.map(opt => `<option value="${opt}" ${wordToEdit?.lesson === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                                </select></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Đồng nghĩa</label>
                                <input id="swal-syn" class="swal2-input !m-0 !w-full" value="${wordToEdit?.synonym || ''}" placeholder="..."></div>
                                <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Trái nghĩa</label>
                                <input id="swal-ant" class="swal2-input !m-0 !w-full" value="${wordToEdit?.antonym || ''}" placeholder="..."></div>
                            </div>
                            <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Định nghĩa tiếng Anh</label>
                            <textarea id="swal-def" class="swal2-textarea !m-0 !w-full h-16" placeholder="A round fruit with red or green skin...">${wordToEdit?.definition || ''}</textarea></div>
                            
                            <div><label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Ví dụ</label>
                            <textarea id="swal-ex" class="swal2-textarea !m-0 !w-full h-24" placeholder="I ate an apple yesterday.">${wordToEdit?.example || ''}</textarea></div>
                        </div>
                    `,
                    confirmButtonText: 'Lưu Dữ Liệu',
                    confirmButtonColor: '#9333ea',
                    showCancelButton: true,
                    cancelButtonText: 'Hủy',
                    didOpen: () => {
                        const sel = $('#swal-topic-select');
                        const inp = $('#swal-topic-new');
                        sel.onchange = () => inp.classList.toggle('hidden', sel.value !== '--new--');
                    },
                    preConfirm: () => {
                        const eng = $('#swal-eng').value.trim();
                        const viet = $('#swal-viet').value.trim();
                        if (!eng || !viet) return Swal.showValidationMessage('Vui lòng nhập Tiếng Anh và Tiếng Việt');
                        
                        let topic = $('#swal-topic-select').value;
                        if (topic === '--new--') topic = $('#swal-topic-new').value.trim() || 'Chưa phân loại';

                        const fd = new FormData();
                        fd.append('action', isUpdate ? 'update' : 'add');
                        if (isUpdate) fd.append('id', wordToEdit.id);
                        fd.append('english', eng);
                        fd.append('vietnamese', viet);
                        fd.append('ipa', $('#swal-ipa').value.trim());
                        fd.append('type', $('#swal-type').value.trim());
                        fd.append('topic', topic);
                        fd.append('lesson', $('#swal-lesson').value); 
                        fd.append('definition', $('#swal-def').value.trim());
                        fd.append('example', $('#swal-ex').value.trim());
                        fd.append('synonym', $('#swal-syn').value.trim());
                        fd.append('antonym', $('#swal-ant').value.trim());
                        return fd;
                    }
                }).then(res => {
                    if (res.isConfirmed) postToSheet(res.value, isUpdate);
                });
            },

            // --- FIREBASE SAVING ---
            toggleSaveWord: async (id) => {
                if (!state.user) return showStatus("Vui lòng đợi kết nối", "error");
                
                const wordObj = state.allWords.find(w => String(w.id) === String(id));
                if(!wordObj) return;

                const isSaved = state.myWords.some(w => String(w.id) === String(id));
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', String(id));
                    if (isSaved) {
                        await deleteDoc(docRef);
                        showStatus("Đã gỡ khỏi danh sách Đã lưu");
                    } else {
                        await setDoc(docRef, { ...wordObj, addedAt: new Date().toISOString() });
                        showStatus("Đã thêm vào danh sách Đã lưu");
                    }
                } catch (err) { showStatus("Lỗi hệ thống Firebase", "error"); console.error(err);}
            },
            deleteWord: async (id) => {
                if (!state.user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', String(id)));
                    showStatus("Đã xóa khỏi danh sách luyện tập");
                } catch (e) { showStatus("Lỗi khi xóa", "error"); }
            },

            // --- PRACTICE MODE (ĐÃ SỬA LỖI) ---
            startPractice: (gameType, mode) => {
                if (state.myWords.length === 0) {
                    return showStatus("Bạn cần lưu ít nhất 1 từ vào danh sách để luyện tập!", "error");
                }
                if (gameType === 'quiz' && state.allWords.length < 4) {
                    return showStatus("Hệ thống cần ít nhất 4 từ vựng để tạo bài Trắc nghiệm!", "error");
                }

                // Reset và gán state cho practice
                state.practice = {
                    gameType: gameType,
                    mode: mode,
                    index: 0,
                    flipped: false,
                    pool: shuffle([...state.myWords]), // Lấy từ vựng đã lưu và xáo trộn
                    timer: 60, // Đếm ngược 60 giây
                    interval: null,
                    isFinished: false,
                    score: 0,
                    quizOptions: [],
                    quizAnswered: false,
                    quizSelectedId: null,
                    spellingChecked: false,
                    spellingInput: '',
                    spellingCorrect: false
                };

                if (gameType === 'quiz') window.app.generateQuizOptions();

                // Chạy bộ đếm thời gian
                clearInterval(state.practice.interval);
                state.practice.interval = setInterval(() => {
                    if (state.practice.timer > 0) {
                        state.practice.timer--;
                        const timerEl = document.getElementById('practice-timer');
                        if (timerEl) timerEl.innerText = state.practice.timer + 's';
                    } else {
                        state.practice.isFinished = true;
                        clearInterval(state.practice.interval);
                        renderPractice(); // Render lại khi hết giờ
                    }
                }, 1000);

                renderPractice(); // Hiển thị giao diện game
            },
            
            stopPractice: () => {
                clearInterval(state.practice.interval);
                state.practice.gameType = null;
                renderPractice();
            },
            nextQuestion: () => {
                if (state.practice.index >= state.practice.pool.length - 1) {
                    state.practice.isFinished = true;
                    clearInterval(state.practice.interval);
                } else {
                    state.practice.index++;
                    state.practice.flipped = false; 
                    state.practice.spellingChecked = false; 
                    state.practice.spellingInput = '';
                    if (state.practice.gameType === 'quiz') window.app.generateQuizOptions();
                }
                renderPractice();
            },
            prevQuestion: () => { 
                if (state.practice.index > 0) {
                    state.practice.index--;
                    state.practice.flipped = false;
                    renderPractice();
                }
            },
            flipCard: () => {
                if (state.practice.gameType !== 'flashcard') return;
                state.practice.flipped = !state.practice.flipped;
                renderPractice();
            },
            generateQuizOptions: () => {
                const currentWord = state.practice.pool[state.practice.index];
                let options = [currentWord];
                let wrongPool = state.allWords.filter(w => w.id !== currentWord.id);
                wrongPool = shuffle(wrongPool).slice(0, 3); // Lấy 3 đáp án sai ngẫu nhiên từ tổng kho từ
                options = options.concat(wrongPool);
                state.practice.quizOptions = shuffle(options);
                state.practice.quizAnswered = false;
                state.practice.quizSelectedId = null;
            },
            answerQuiz: (selectedId) => {
                if (state.practice.quizAnswered) return;
                state.practice.quizAnswered = true;
                state.practice.quizSelectedId = selectedId;
                if (selectedId === state.practice.pool[state.practice.index].id) state.practice.score++;
                renderPractice();
            },
            checkSpelling: () => {
                if (state.practice.spellingChecked) return;
                const inputEl = $('#spelling-input');
                if (!inputEl) return;
                const inputVal = inputEl.value.trim().toLowerCase();
                if (!inputVal) return; 
                
                const currentWord = state.practice.pool[state.practice.index].english.toLowerCase();
                state.practice.spellingChecked = true;
                state.practice.spellingInput = inputEl.value;
                state.practice.spellingCorrect = (inputVal === currentWord);
                
                if (state.practice.spellingCorrect) state.practice.score++;
                renderPractice();
            }
        };

        // EVENT LISTENERS
        $('#search-input').addEventListener('input', () => window.app.displayVocabulary());
        $('#topic-search').addEventListener('input', () => window.app.updateTopicNav([...new Set(state.allWords.map(w => w.topic))].filter(t => t !== 'Chưa phân loại')));

        // INIT
        (async () => {
            updateUI();
            await setupAuth();
            await fetchSheetData();
        })();
    </script>
</body>
</html>
