    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { color-scheme: dark; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030712; /* Gray 950 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
        
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .hidden-view { display: none !important; }
        
        /* Custom Scrollbar Dark Premium */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 99px; border: 2px solid #0b0f19; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        
        .flashcard-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .flashcard-scroll::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 99px; }
        .flashcard-scroll::-webkit-scrollbar-thumb:hover { background: #a78bfa; }

        .card-glow { 
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.05); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-glow:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.4);
        }
        
        /* SweetAlert2 Elegant Theme Override */
        .swal2-popup { 
            background: #0f172a !important; 
            color: #f1f5f9 !important; 
            border: 1px solid #1e293b !important;
            border-radius: 2rem !important; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }
        .swal2-title {
            color: #f8fafc !important;
            font-weight: 800 !important;
        }
        .swal2-input, .swal2-textarea, .swal2-select { 
            background: #020617 !important; 
            color: #f1f5f9 !important; 
            border: 1px solid #334155 !important;
            border-radius: 1rem !important;
            padding: 0.75rem 1rem !important;
            font-size: 0.95rem !important;
        }
        .swal2-input:focus, .swal2-textarea:focus, .swal2-select:focus {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25) !important;
        }
        
        .example-line { position: relative; padding-left: 1.5rem; }
        .example-line::before { 
            content: "✦"; position: absolute; left: 0; color: #a78bfa; font-weight: bold; 
        }

        /* Hide Horizontal Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen text-slate-100 pb-24">

    <!-- Header / Navigation Bar -->
    <nav class="bg-slate-950/70 backdrop-blur-xl text-white border-b border-slate-900/80 fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 sm:h-20 flex justify-between items-center gap-4">

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 pt-24 sm:pt-28 pb-12">
        
        <!-- Quick Stats Strip on top of Library -->
        <div id="quick-stats-strip" class="mb-8 grid grid-cols-2 md:grid-cols-4 gap-4 animate-fadeIn">
            <div class="bg-slate-900/50 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 flex items-center space-x-3">
                <div class="p-2 bg-purple-500/10 text-purple-400 rounded-xl"><i data-lucide="book-open" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Tổng kho từ</p>
                    <p id="stat-total-words" class="text-lg font-bold text-white">0</p>
                </div>
            </div>
            <div class="bg-slate-900/50 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 flex items-center space-x-3">
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl"><i data-lucide="bookmark-check" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Đã thuộc</p>
                    <p id="stat-saved-words" class="text-lg font-bold text-white">0</p>
                </div>
            </div>
            <div class="bg-slate-900/50 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 flex items-center space-x-3">
                <div class="p-2 bg-yellow-500/10 text-yellow-400 rounded-xl"><i data-lucide="star" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Cần tìm hiểu</p>
                    <p id="stat-watchlist" class="text-lg font-bold text-white">0</p>
                </div>
            </div>
            <div class="bg-slate-900/50 backdrop-blur-md p-4 rounded-2xl border border-slate-800/80 flex items-center space-x-3">
                <div class="p-2 bg-pink-500/10 text-pink-400 rounded-xl"><i data-lucide="zap" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Chuỗi Học (Streak)</p>
                    <p id="stat-streak" class="text-lg font-bold text-white">1 ngày 🔥</p>
                </div>
            </div>
        </div>

        <!-- Error & Alert Messages -->
        <div id="status-message" class="hidden-view mb-6 p-4 rounded-2xl flex items-center border shadow-lg"></div>

        <!-- VIEW: LIBRARY (SỔ TAY MỞ RỘNG) -->
        <section id="view-library" class="hidden-view animate-fadeIn">
            <!-- Search & Filters -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 space-y-4">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="search" class="h-5 w-5 text-slate-500 group-focus-within:text-purple-400 transition-colors"></i>
                        </div>
                        <input 
                            type="text" 
                            id="search-input"
                            placeholder="Nhập từ vựng, tiếng Việt hoặc tên bài học..."
                            class="block w-full pl-12 pr-4 py-4 bg-slate-900/60 border-2 border-slate-800/80 rounded-2xl focus:ring-4 focus:ring-purple-900/20 focus:border-purple-500 transition-all outline-none text-lg text-white shadow-inner"
                            autocomplete="off"
                        >
                        <div id="search-loading" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center">
                            <div class="animate-spin h-5 w-5 border-2 border-purple-500 border-t-transparent rounded-full"></div>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-2">
                        <button onclick="window.app.setLibraryFilter('all', this)" class="filter-btn bg-purple-600 text-white px-4 py-2.5 rounded-xl text-sm transition-all font-bold shadow-lg shadow-purple-900/20">Tất cả</button>
                        <button onclick="window.app.setLibraryFilter('unsaved', this)" class="filter-btn bg-slate-900 border border-slate-800 hover:border-slate-600 px-4 py-2.5 rounded-xl text-sm transition-all text-slate-400 font-medium">Chưa lưu</button>
                        <button onclick="window.app.setLibraryFilter('saved', this)" class="filter-btn bg-slate-900 border border-slate-800 hover:border-slate-600 px-4 py-2.5 rounded-xl text-sm transition-all text-slate-400 font-medium">Đã thuộc</button>
                        <button onclick="window.app.setLibraryFilter('watchlist', this)" class="filter-btn bg-slate-900 border border-yellow-900/30 hover:border-yellow-700/50 px-4 py-2.5 rounded-xl text-sm transition-all text-yellow-500 font-medium flex items-center gap-1.5">
                            <i data-lucide="star" class="w-4 h-4"></i> Cần tìm hiểu
                        </button>
                    </div>
                </div>
                
                <!-- Topic Filter -->
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800/80 backdrop-blur-md">
                    <label class="text-[10px] uppercase font-extrabold text-slate-400 mb-3 block tracking-wider flex items-center gap-1.5">
                        <i data-lucide="folder-tree" class="w-4 h-4 text-purple-400"></i> Bộ Lọc Chủ Đề
                    </label>
                    <input type="text" id="topic-search" placeholder="Gõ tìm chủ đề..." 
                           class="w-full p-2.5 mb-3 rounded-xl bg-slate-950 border border-slate-800 text-sm outline-none focus:border-purple-500 transition-colors text-white">
                    <div id="topicNav" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto pr-2 flashcard-scroll"></div>
                </div>
            </div>

            <!-- Loader -->
            <div id="loader" class="text-center py-20 hidden">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                <p class="mt-4 text-slate-400 font-medium">Hệ thống đang lấy dữ liệu...</p>
            </div>
            
            <!-- Word List Container -->
            <div id="vocab-list" class="space-y-10"></div>
        </section>

        <!-- VIEW: MY WORDS (ENGMASTER) -->
        <section id="view-mywords" class="hidden-view animate-fadeIn max-w-3xl mx-auto">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-extrabold text-white">Bộ sưu tập cá nhân</h2>
                    <p class="text-slate-400 text-sm mt-1">Nơi lưu giữ các từ vựng bạn đang tập trung học tập</p>
                </div>
                <span id="mywords-count" class="text-sm font-bold bg-purple-900/30 text-purple-300 px-4 py-2 rounded-xl border border-purple-800/40 shadow-sm">0 từ</span>
            </div>
            <div id="mywords-list" class="space-y-4"></div>
        </section>

        <!-- VIEW: DASHBOARD -->
        <section id="view-dashboard" class="hidden-view animate-fadeIn max-w-4xl mx-auto">
            <h2 class="text-2xl font-black mb-6 text-white">Bảng Thống Kê Chi Tiết</h2>
            <div id="stats-content"></div>
        </section>

        <!-- VIEW: PRACTICE -->
        <section id="view-practice" class="hidden-view animate-fadeIn">
            <div id="practice-content"></div>
        </section>

    </main>

    <!-- Floating Action Button (Add Word) -->
    <button id="fab-add-word" onclick="window.app.openForm()" class="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 w-16 h-16 bg-gradient-to-tr from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded-2xl shadow-xl shadow-purple-500/20 flex items-center justify-center transition-all hover:scale-110 hover:rotate-90 z-40 hidden border border-purple-400/20">
        <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykgN9Mf37KxqMZx2XW1mqPJJ3jVunAWVEljUAszFJVwMLxDXJpDHg6cvpdkMHR2v_iKQ/exec";

        const firebaseConfig = {
            apiKey: "AIzaSyDSU-0sQqaFGHQcMyjJLs_wt0GLVPAXKig",
            authDomain: "vstep-c02b6.firebaseapp.com",
            projectId: "vstep-c02b6",
            storageBucket: "vstep-c02b6.firebasestorage.app",
            messagingSenderId: "5134797464",
            appId: "1:5134797464:web:b4b5b13a58be4922fbdeed"
        };

        const app_fb = initializeApp(firebaseConfig);
        const auth = getAuth(app_fb);
        const db = getFirestore(app_fb);
        const appId = 'english-vocab-app';

        const LESSON_OPTIONS = [
            "COMMUNICATION", "FAMILY", "FESTIVALS", "FOOD", "HEALTH", 
            "HOBBY", "HOMETOWN", "HOUSES", "THE INTERNET", "JOB", 
            "LEARNING ENGLISH", "PERSONAL INFORMATION", "TRANSPORT", "TRAVEL"
        ];

        // STATE
        let state = {
            user: null,
            activeTab: 'library',
            allWords: [], 
            myWords: [],
            watchlist: JSON.parse(localStorage.getItem('vocab_watchlist_data') || '[]'),
            streak: parseInt(localStorage.getItem('vocab_streak_days') || '1'),
            lastStudyDate: localStorage.getItem('vocab_last_study_date') || '',
            library: {
                filter: 'all', // 'all', 'saved', 'unsaved', 'watchlist'
                topic: 'all',
                search: ''
            },
            practice: {
                gameType: null,
                mode: null,
                index: 0,
                flipped: false,
                pool: [],
                timer: 60,
                interval: null,
                isFinished: false,
                score: 0,
                quizOptions: [],
                quizAnswered: false,
                quizSelectedId: null,
                spellingChecked: false,
                spellingInput: '',
                spellingCorrect: false
            }
        };

        // AUDIO FX SAMPLES USING WEB AUDIO API (For satisfying touch sound experience)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSuccessSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function playFailSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.setValueAtTime(147, audioCtx.currentTime + 0.15); // D3
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.45);
            } catch(e) {}
        }

        // DOM HELPERS & UTILITIES
        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) => document.querySelectorAll(selector);

        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        const showStatus = (msg, type = "success") => {
            const el = $('#status-message');
            el.className = `mb-6 p-4 rounded-2xl flex items-center animate-fadeIn border shadow-xl ${
                type === 'error' 
                ? 'bg-red-950/40 text-red-300 border-red-800/60 backdrop-blur-md' 
                : 'bg-emerald-950/40 text-emerald-300 border-emerald-800/60 backdrop-blur-md'
            }`;
            el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 mr-3"></i><span class="font-semibold">${msg}</span>`;
            el.classList.remove('hidden-view');
            lucide.createIcons();
            setTimeout(() => el.classList.add('hidden-view'), 3500);
        };

        // TRACK STREAK
        const updateStreak = () => {
            const todayStr = new Date().toDateString();
            if (state.lastStudyDate !== todayStr) {
                if (state.lastStudyDate) {
                    const lastDate = new Date(state.lastStudyDate);
                    const diffTime = Math.abs(new Date(todayStr) - lastDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays === 1) {
                        state.streak += 1;
                    } else if (diffDays > 1) {
                        state.streak = 1;
                    }
                } else {
                    state.streak = 1;
                }
                state.lastStudyDate = todayStr;
                localStorage.setItem('vocab_streak_days', state.streak);
                localStorage.setItem('vocab_last_study_date', todayStr);
            }
            const streakEl = $('#stat-streak');
            if (streakEl) streakEl.innerText = `${state.streak} ngày 🔥`;
        };

        // CORE UI UPDATES
        const updateUI = () => {
            renderNav();
            renderViews();
            updateStreak();
            
            // Toggle FAB visibility
            const fab = $('#fab-add-word');
            if (state.activeTab === 'library') fab.classList.remove('hidden');
            else fab.classList.add('hidden');

            // Update Quick Stats Strip
            $('#stat-total-words').innerText = state.allWords.length;
            $('#stat-saved-words').innerText = state.myWords.length;
            $('#stat-watchlist').innerText = state.watchlist.length;

            lucide.createIcons();
        };

        const renderNav = () => {
            const navItems = [
                { id: 'library', icon: 'library', text: 'Thư viện từ' },
                { id: 'mywords', icon: 'bookmark', text: 'Từ của bạn' },
                { id: 'practice', icon: 'gamepad-2', text: 'Luyện tập' },
                { id: 'dashboard', icon: 'bar-chart-3', text: 'Báo cáo' }
            ];
            
            const container = $('#nav-container');
            container.innerHTML = navItems.map(item => `
                <button onclick="window.app.switchTab('${item.id}')" 
                    class="flex-1 md:flex-none px-3 sm:px-4 py-2.5 rounded-xl flex flex-col sm:flex-row items-center justify-center sm:space-x-2 text-[10px] sm:text-sm font-semibold transition-all ${
                        state.activeTab === item.id 
                        ? 'bg-gradient-to-tr from-purple-600 to-indigo-600 text-white shadow-lg shadow-purple-500/20 scale-105' 
                        : 'text-slate-400 hover:bg-slate-900/50 hover:text-white'
                    }">
                    <i data-lucide="${item.icon}" class="w-5 h-5 sm:w-4 sm:h-4 mb-1 sm:mb-0"></i>
                    <span class="whitespace-nowrap">${item.text}</span>
                </button>
            `).join('');
        };

        const renderViews = () => {
            ['library', 'mywords', 'practice', 'dashboard'].forEach(view => {
                const el = $(`#view-${view}`);
                if (state.activeTab === view) {
                    el.classList.remove('hidden-view');
                    if (view === 'library') window.app.displayVocabulary();
                    if (view === 'mywords') renderMyWords();
                    if (view === 'practice') renderPractice();
                    if (view === 'dashboard') renderDashboard();
                } else {
                    el.classList.add('hidden-view');
                }
            });
        };

        // FIREBASE SETUP (Rule 3 compliant & fixed with robust fallback)
        const setupAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenError) {
                        console.warn("Đăng nhập bằng Custom Token thất bại, chuyển hướng sang Anonymous Auth", tokenError);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth init error", error);
            }

            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'my_vocabulary');
                    onSnapshot(colRef, (snap) => {
                        state.myWords = snap.docs.map(d => d.data());
                        $('#mywords-count').innerText = `${state.myWords.length} từ`;
                        $('#stat-saved-words').innerText = state.myWords.length;
                        if (state.activeTab === 'mywords') renderMyWords();
                        if (state.activeTab === 'library') window.app.displayVocabulary();
                        if (state.activeTab === 'dashboard') renderDashboard();
                    }, (err) => console.error("Firestore error", err));
                }
            });
        };

        // GOOGLE SCRIPT DATA FETCHING

                    topic: word.topic || "Chưa phân loại",
                    lesson: word.lesson || "",
                    definition: word.definition || "",
                    example: word.example || "",
                    synonym: word.synonym || "",
                    antonym: word.antonym || ""

                if(state.activeTab === 'library') window.app.displayVocabulary();

                const english = formData.get('english');
                window.app.removeFromWatchlist(english, false);

                await fetchSheetData();

                    btn.className = `px-3 py-2 rounded-xl text-xs font-semibold transition-all border whitespace-nowrap ${

                const container = $('#vocab-list');

                const { filter, topic } = state.library;
                
                // DB Filtering
                let filteredDB = state.allWords.filter(word => {
                    const matchesTopic = topic === 'all' || word.topic === topic;
                    const matchesSearch = !searchQuery || 
                        word.english.toLowerCase().includes(searchQuery) ||
                        word.vietnamese.toLowerCase().includes(searchQuery) ||
                        word.lesson.toLowerCase().includes(searchQuery);
                    
                    const isSaved = state.myWords.some(w => String(w.id) === String(word.id));
                    let matchesStatus = true;
                    if (filter === 'saved') matchesStatus = isSaved;
                    else if (filter === 'unsaved') matchesStatus = !isSaved;
                    else if (filter === 'watchlist') return false; 

                    return matchesTopic && matchesSearch && matchesStatus;
                });

                // Watchlist Filtering
                let filteredWatchlist = state.watchlist.filter(word => {
                    const matchesSearch = !searchQuery || word.english.toLowerCase().includes(searchQuery) || word.vietnamese.toLowerCase().includes(searchQuery);
                    if (filter === 'watchlist' || filter === 'all') return matchesSearch;
                    return false;

                let finalData = filter === 'watchlist' ? filteredWatchlist : [...filteredDB, ...filteredWatchlist];

                    const t = word.isTemp ? '⭐ DANH SÁCH TẠM THỜI' : word.topic;
                    (acc[t] = acc[t] || []).push(word);
                    return acc;

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

                    grouped[groupTopic].forEach(word => grid.appendChild(window.app.createWordCard(word)));
                    container.appendChild(section);
                });
                
                lucide.createIcons();

                    window.app.displayVocabulary();

                    cancelButtonText: 'Đóng',
                    didOpen: () => {
                        lucide.createIcons();
                        const sel = $('#swal-topic-select');
                        const inp = $('#swal-topic-new');
                        sel.onchange = () => inp.classList.toggle('hidden', sel.value !== '--new--');
                    },
                    preConfirm: () => {
                        const eng = $('#swal-eng').value.trim();
                        const viet = $('#swal-viet').value.trim();
                        if (!eng || !viet) return Swal.showValidationMessage('Vui lòng không bỏ trống thông tin Tiếng Anh & Tiếng Việt');
                        
                        let topic = $('#swal-topic-select').value;
                        if (topic === '--new--') topic = $('#swal-topic-new').value.trim() || 'Chưa phân loại';

                        const fd = new FormData();
                        fd.append('action', isUpdate ? 'update' : 'add');
                        if (isUpdate) fd.append('id', wordToEdit.id);
                        fd.append('english', eng);
                        fd.append('vietnamese', viet);
                        fd.append('ipa', $('#swal-ipa').value.trim());
                        fd.append('type', $('#swal-type').value.trim());
                        fd.append('topic', topic);
                        fd.append('lesson', $('#swal-lesson').value); 
                        fd.append('definition', $('#swal-def').value.trim());
                        fd.append('example', $('#swal-ex').value.trim());
                        fd.append('synonym', $('#swal-syn').value.trim());
                        fd.append('antonym', $('#swal-ant').value.trim());
                        return fd;
                    }
                }).then(res => {
                    if (res.isConfirmed) postToSheet(res.value, isUpdate);
                });
            },

            // --- FIREBASE SAVING ---
            toggleSaveWord: async (id) => {
                if (!state.user) return showStatus("Đang thiết lập cổng kết nối Firebase", "error");
                
                const wordObj = state.allWords.find(w => String(w.id) === String(id));
                if(!wordObj) return;

                const isSaved = state.myWords.some(w => String(w.id) === String(id));
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', String(id));
                    if (isSaved) {
                        await deleteDoc(docRef);
                        showStatus("Đã loại bỏ khỏi Sổ tay luyện tập");
                    } else {
                        await setDoc(docRef, { ...wordObj, addedAt: new Date().toISOString() });
                        showStatus("Đã thêm từ vào Sổ tay luyện tập!");
                    }
                } catch (err) { showStatus("Gặp trục trặc khi lưu dữ liệu Firebase", "error"); console.error(err);}
            },
            deleteWord: async (id) => {
                if (!state.user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', String(id)));
                    showStatus("Đã xóa vĩnh viễn khỏi danh sách luyện tập");
                } catch (e) { showStatus("Không thể xóa lúc này", "error"); }
            },

            // --- PRACTICE MODE (ĐÃ SỬA LỖI & THÊM HIỆU ỨNG ÂM THANH) ---
            startPractice: (gameType, mode) => {
                if (state.myWords.length === 0) {
                    return showStatus("Hãy lưu tối thiểu 1 từ vựng vào kho cá nhân của bạn để luyện tập!", "error");
                }
                if (gameType === 'quiz' && state.allWords.length < 4) {
                    return showStatus("Hệ thống dữ liệu tổng cần ít nhất 4 từ để cấu hình tùy chọn đáp án!", "error");
                }

                state.practice = {
                    gameType: gameType,
                    mode: mode,
                    index: 0,
                    flipped: false,
                    pool: shuffle([...state.myWords]), 
                    timer: 60, 
                    interval: null,
                    isFinished: false,
                    score: 0,
                    quizOptions: [],
                    quizAnswered: false,
                    quizSelectedId: null,
                    spellingChecked: false,
                    spellingInput: '',
                    spellingCorrect: false
                };

                if (gameType === 'quiz') window.app.generateQuizOptions();

                // Chạy bộ đếm thời gian
                clearInterval(state.practice.interval);
                state.practice.interval = setInterval(() => {
                    if (state.practice.timer > 0) {
                        state.practice.timer--;
                        const timerEl = document.getElementById('practice-timer');
                        if (timerEl) timerEl.innerText = state.practice.timer + 's';
                    } else {
                        state.practice.isFinished = true;
                        clearInterval(state.practice.interval);
                        renderPractice(); 
                    }
                }, 1000);

                renderPractice(); 
            },
            
            stopPractice: () => {
                clearInterval(state.practice.interval);
                state.practice.gameType = null;
                renderPractice();
            },
            nextQuestion: () => {
                if (state.practice.index >= state.practice.pool.length - 1) {
                    state.practice.isFinished = true;
                    clearInterval(state.practice.interval);
                } else {
                    state.practice.index++;
                    state.practice.flipped = false; 
                    state.practice.spellingChecked = false; 
                    state.practice.spellingInput = '';
                    if (state.practice.gameType === 'quiz') window.app.generateQuizOptions();
                }
                renderPractice();
            },
            prevQuestion: () => { 
                if (state.practice.index > 0) {
                    state.practice.index--;
                    state.practice.flipped = false;
                    renderPractice();
                }
            },
            flipCard: () => {
                if (state.practice.gameType !== 'flashcard') return;
                state.practice.flipped = !state.practice.flipped;
                renderPractice();
            },
            generateQuizOptions: () => {
                const currentWord = state.practice.pool[state.practice.index];
                let options = [currentWord];
                let wrongPool = state.allWords.filter(w => w.id !== currentWord.id);
                wrongPool = shuffle(wrongPool).slice(0, 3); 
                options = options.concat(wrongPool);
                state.practice.quizOptions = shuffle(options);
                state.practice.quizAnswered = false;
                state.practice.quizSelectedId = null;
            },
            answerQuiz: (selectedId) => {
                if (state.practice.quizAnswered) return;
                state.practice.quizAnswered = true;
                state.practice.quizSelectedId = selectedId;
                const isCorrect = selectedId === state.practice.pool[state.practice.index].id;
                if (isCorrect) {
                    state.practice.score++;
                    playSuccessSound();
                } else {
                    playFailSound();
                }
                renderPractice();
            },
            checkSpelling: () => {
                if (state.practice.spellingChecked) return;
                const inputEl = $('#spelling-input');
                if (!inputEl) return;
                const inputVal = inputEl.value.trim().toLowerCase();
                if (!inputVal) return; 
                
                const currentWord = state.practice.pool[state.practice.index].english.toLowerCase();
                state.practice.spellingChecked = true;
                state.practice.spellingInput = inputEl.value;
                state.practice.spellingCorrect = (inputVal === currentWord);
                
                if (state.practice.spellingCorrect) {
                    state.practice.score++;
                    playSuccessSound();
                } else {
                    playFailSound();
                }
                renderPractice();
            }
        };

        // EVENT LISTENERS
        $('#search-input').addEventListener('input', () => window.app.displayVocabulary());
        $('#topic-search').addEventListener('input', () => window.app.updateTopicNav([...new Set(state.allWords.map(w => w.topic))].filter(t => t !== 'Chưa phân loại')));

        // INIT
        (async () => {
            updateUI();
            await setupAuth();
            await fetchSheetData();
        })();
    </script>
</body>
</html>
