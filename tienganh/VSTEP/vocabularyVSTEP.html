<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngMaster - Dark Mode & Flashcards</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            color-scheme: dark;
        }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .hidden-view { display: none !important; }
        
        /* Custom Scrollbar Dark */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Flashcard inner scrollbar */
        .flashcard-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .flashcard-scroll::-webkit-scrollbar-thumb { background: #818cf8; }
        .flashcard-scroll::-webkit-scrollbar-thumb:hover { background: #a5b4fc; }

        .card-shadow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200">

    <!-- Navigation Bar -->
    <nav class="bg-slate-900/80 backdrop-blur-md text-white border-b border-slate-800 fixed top-0 w-full z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-100">EngMaster</span>
            </div>
            <div class="flex space-x-1" id="nav-container">
                <!-- Navigation buttons populated by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 pt-24 pb-12">
        
        <!-- Error & Alert Messages -->
        <div id="status-message" class="hidden-view mb-6 p-4 rounded-xl flex items-center border shadow-lg"></div>

        <!-- SEARCH & LIBRARY VIEW -->
        <section id="view-library" class="hidden-view animate-fadeIn">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-white mb-2">Tra cứu từ vựng</h1>
                <p class="text-slate-400">Khám phá kho dữ liệu từ vựng thông minh</p>
            </div>

            <div class="relative max-w-xl mx-auto mb-12">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="search" class="h-5 w-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                    </div>
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="Tìm kiếm Anh - Việt..."
                        class="block w-full pl-11 pr-4 py-4 bg-slate-900 border-2 border-slate-800 rounded-2xl focus:ring-4 focus:ring-indigo-900/30 focus:border-indigo-500 transition-all outline-none text-lg text-white shadow-inner"
                        autocomplete="off"
                    >
                    <div id="search-loading" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center">
                        <div class="animate-spin h-5 w-5 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                    </div>
                </div>

                <!-- Suggestions Dropdown -->
                <div id="search-suggestions" class="hidden absolute z-20 w-full mt-2 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-64 overflow-y-auto">
                    <!-- Suggestions rendered here -->
                </div>
            </div>

            <!-- Selected Word Result -->
            <div id="word-detail-container" class="max-w-xl mx-auto">
                <!-- Result card will be rendered here -->
            </div>
        </section>

        <!-- MY WORDS VIEW -->
        <section id="view-mywords" class="hidden-view animate-fadeIn">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-bold text-white">Danh sách của tôi</h2>
                <span id="mywords-count" class="text-sm font-medium bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full border border-indigo-800/50">0 từ</span>
            </div>
            <div id="mywords-list" class="space-y-3"></div>
        </section>

        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="hidden-view animate-fadeIn">
            <h2 class="text-2xl font-bold mb-6 text-white">Thống kê học tập</h2>
            <div id="stats-content"></div>
        </section>

        <!-- PRACTICE VIEW -->
        <section id="view-practice" class="hidden-view animate-fadeIn">
            <div id="practice-content"></div>
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURATION
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykgN9Mf37KxqMZx2XW1mqPJJ3jVunAWVEljUAszFJVwMLxDXJpDHg6cvpdkMHR2v_iKQ/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDSU-0sQqaFGHQcMyjJLs_wt0GLVPAXKig",
            authDomain: "vstep-c02b6.firebaseapp.com",
            projectId: "vstep-c02b6",
            storageBucket: "vstep-c02b6.firebasestorage.app",
            messagingSenderId: "5134797464",
            appId: "1:5134797464:web:b4b5b13a58be4922fbdeed"
        };

        const app_fb = initializeApp(firebaseConfig);
        const auth = getAuth(app_fb);
        const db = getFirestore(app_fb);
        const appId = 'english-vocab-app';

        // STATE
        let state = {
            user: null,
            activeTab: 'library',
            allWords: [], 
            myWords: [],  
            selectedWord: null,
            isLoading: false,
            practice: {
                gameType: null, // 'flashcard', 'quiz', 'spelling'
                mode: null, // 'en-vi' or 'vi-en'
                index: 0,
                flipped: false,
                pool: [],
                timer: 60,
                interval: null,
                isFinished: false,
                score: 0,
                quizOptions: [],
                quizAnswered: false,
                quizSelectedId: null,
                spellingChecked: false,
                spellingInput: '',
                spellingCorrect: false
            }
        };

        // UI HELPERS
        const updateUI = () => {
            renderNav();
            renderViews();
            lucide.createIcons();
        };

        const renderNav = () => {
            const navItems = [
                { id: 'library', icon: 'search', text: 'Tra cứu' },
                { id: 'mywords', icon: 'bookmark', text: 'Đã lưu' },
                { id: 'practice', icon: 'gamepad-2', text: 'Luyện tập' },
                { id: 'dashboard', icon: 'bar-chart', text: 'Thống kê' }
            ];
            
            const container = document.getElementById('nav-container');
            container.innerHTML = navItems.map(item => `
                <button onclick="window.app.switchTab('${item.id}')" 
                    class="px-3 py-2 rounded-xl flex items-center space-x-2 text-sm font-medium transition-all ${state.activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                    <span class="hidden md:inline">${item.text}</span>
                </button>
            `).join('');
        };

        const renderViews = () => {
            ['library', 'mywords', 'practice', 'dashboard'].forEach(view => {
                const el = document.getElementById(`view-${view}`);
                if (state.activeTab === view) {
                    el.classList.remove('hidden-view');
                    if (view === 'mywords') renderMyWords();
                    if (view === 'practice') renderPractice();
                    if (view === 'dashboard') renderDashboard();
                } else {
                    el.classList.add('hidden-view');
                }
            });
        };

        const showStatus = (msg, type = "success") => {
            const el = document.getElementById('status-message');
            el.className = `mb-6 p-4 rounded-xl flex items-center animate-fadeIn border shadow-xl ${type === 'error' ? 'bg-red-950/50 text-red-300 border-red-800' : 'bg-emerald-950/50 text-emerald-300 border-emerald-800'}`;
            el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 mr-3"></i><span class="font-medium">${msg}</span>`;
            el.classList.remove('hidden-view');
            lucide.createIcons();
            setTimeout(() => el.classList.add('hidden-view'), 3000);
        };

        // FIREBASE & DATA
        const fetchSheetData = async () => {
            document.getElementById('search-loading').classList.remove('hidden');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                state.allWords = data.map((item, index) => {
                    return {
                        id: item.ID || `word-${index}`,
                        english: item.english || item["từ vựng"] || item["Word"] || item["word"] || "",
                        vietnamese: item.vietnamese || item["tiếng việt"] || item["Meaning"] || item["meaning"] || "",
                        type: item.type || item["từ loại"] || "",
                        // Đã thay đổi: lấy dữ liệu từ key "example" của backend
                        example: item.example || "",
                    };
                }).filter(w => w.english);
            } catch (err) {
                showStatus("Lỗi kết nối dữ liệu", "error");
            } finally {
                document.getElementById('search-loading').classList.add('hidden');
            }
        };

        const setupAuth = async () => {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'my_vocabulary');
                    onSnapshot(colRef, (snap) => {
                        state.myWords = snap.docs.map(d => d.data());
                        document.getElementById('mywords-count').innerText = `${state.myWords.length} từ`;
                        if (state.activeTab === 'mywords') renderMyWords();
                    }, (err) => console.error(err));
                }
            });
        };

        // PRACTICE LOGIC
        const shuffle = (array) => {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
              randomIndex = Math.floor(Math.random() * currentIndex);
              currentIndex--;
              [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        const startPracticeMode = (gameType, mode = 'en-vi') => {
            clearInterval(state.practice.interval);
            const source = state.myWords.length >= 4 ? state.myWords : state.allWords.slice(0, 20);
            
            state.practice = {
                gameType: gameType,
                mode: mode,
                index: 0,
                flipped: false,
                pool: shuffle([...source]).slice(0, 15),
                timer: 60,
                isFinished: false,
                interval: null,
                score: 0,
                quizOptions: [],
                quizAnswered: false,
                quizSelectedId: null,
                spellingChecked: false,
                spellingInput: '',
                spellingCorrect: false
            };
            
            if (gameType === 'quiz') window.app.generateQuizOptions();
            
            startTimer();
            renderPractice();
        };

        const startTimer = () => {
            clearInterval(state.practice.interval);
            state.practice.timer = 60;
            state.practice.interval = setInterval(() => {
                state.practice.timer--;
                const timerEl = document.getElementById('practice-timer');
                if (timerEl) timerEl.innerText = state.practice.timer + 's';
                
                if (state.practice.timer <= 0) {
                    state.practice.isFinished = true;
                    clearInterval(state.practice.interval);
                    renderPractice();
                }
            }, 1000);
        };

        const renderPractice = () => {
            const container = document.getElementById('practice-content');
            
            // SCREEN 1: Game Selection Menu
            if (!state.practice.gameType) {
                container.innerHTML = `
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-bold text-white mb-2">Trung tâm Luyện tập</h2>
                        <p class="text-slate-400">Chọn một trò chơi để ôn tập từ vựng của bạn</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
                        
                        <!-- Game 1: Flashcards -->
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 hover:border-indigo-500/50 transition-colors">
                            <div class="w-12 h-12 bg-indigo-950 text-indigo-400 rounded-xl flex items-center justify-center mb-4">
                                <i data-lucide="layers" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Flashcards</h3>
                            <p class="text-slate-500 text-sm mb-6">Lật thẻ truyền thống để ghi nhớ từ và nghĩa.</p>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="window.app.startPractice('flashcard', 'en-vi')" class="py-2.5 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-xl text-sm font-medium transition-all">Anh → Việt</button>
                                <button onclick="window.app.startPractice('flashcard', 'vi-en')" class="py-2.5 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-xl text-sm font-medium transition-all">Việt → Anh</button>
                            </div>
                        </div>

                        <!-- Game 2: Quiz -->
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 hover:border-emerald-500/50 transition-colors flex flex-col">
                            <div class="w-12 h-12 bg-emerald-950 text-emerald-400 rounded-xl flex items-center justify-center mb-4">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-xl font-bold text-white mb-2">Trắc nghiệm</h3>
                            <p class="text-slate-500 text-sm mb-6 flex-1">Kiểm tra phản xạ chọn đáp án đúng trong 4 phương án.</p>
                            <button onclick="window.app.startPractice('quiz', 'en-vi')" class="w-full py-3 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-xl font-bold transition-all">Chơi ngay</button>
                        </div>

                        <!-- Game 3: Spelling -->
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 hover:border-amber-500/50 transition-colors md:col-span-2 flex flex-col md:flex-row items-center gap-6">
                            <div class="w-16 h-16 bg-amber-950 text-amber-400 rounded-2xl flex items-center justify-center shrink-0">
                                <i data-lucide="keyboard" class="w-8 h-8"></i>
                            </div>
                            <div class="flex-1 text-center md:text-left">
                                <h3 class="text-xl font-bold text-white mb-2">Luyện viết (Spelling)</h3>
                                <p class="text-slate-500 text-sm">Nhìn nghĩa tiếng Việt và tự gõ lại chính xác từ vựng tiếng Anh. Giúp nhớ lâu và tránh sai lỗi chính tả.</p>
                            </div>
                            <button onclick="window.app.startPractice('spelling', 'vi-en')" class="w-full md:w-auto px-8 py-3 bg-amber-600/20 text-amber-400 hover:bg-amber-600 hover:text-white rounded-xl font-bold transition-all whitespace-nowrap">Bắt đầu gõ</button>
                        </div>

                    </div>
                `;
            } 
            // SCREEN 2: Finished Session
            else if (state.practice.isFinished) {
                const total = state.practice.pool.length;
                const score = state.practice.score;
                const isFlashcard = state.practice.gameType === 'flashcard';
                
                container.innerHTML = `
                    <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-10 text-center animate-fadeIn shadow-2xl">
                        <div class="w-20 h-20 ${isFlashcard ? 'bg-indigo-600/20 text-indigo-400' : 'bg-amber-600/20 text-amber-400'} rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="${isFlashcard ? 'book-open' : 'award'}" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white mb-2">Hoàn thành!</h3>
                        ${!isFlashcard ? `<p class="text-5xl font-black text-white my-6">${score} <span class="text-2xl text-slate-500">/ ${total}</span></p>` : `<p class="text-slate-400 mb-8">Bạn đã xem qua tất cả thẻ từ.</p>`}
                        
                        <div class="space-y-3 mt-8">
                            <button onclick="window.app.startPractice('${state.practice.gameType}', '${state.practice.mode}')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold transition-all">Luyện tập lại</button>
                            <button onclick="window.app.stopPractice()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl font-bold transition-all">Về Menu</button>
                        </div>
                    </div>
                `;
            }
            // SCREEN 3: Active Gameplay
            else {
                const word = state.practice.pool[state.practice.index];
                
                let gameContent = '';

                // --- FLASHCARD UI ---
                if (state.practice.gameType === 'flashcard') {
                    const isEnVi = state.practice.mode === 'en-vi';
                    const frontText = isEnVi ? word.english : word.vietnamese;
                    const backText = isEnVi ? word.vietnamese : word.english;

                    const safeWordFront = frontText.replace(/'/g, "\\'");
                    const safeWordBack = backText.replace(/'/g, "\\'");

                    gameContent = `
                        <div onclick="window.app.flipCard()" class="relative h-96 w-full cursor-pointer perspective-1000 group">
                            <div class="relative w-full h-full duration-500 preserve-3d ${state.practice.flipped ? 'rotate-y-180' : ''}">
                                <!-- Front -->
                                <div class="absolute w-full h-full backface-hidden bg-slate-900 rounded-3xl shadow-2xl flex flex-col items-center justify-center border border-slate-800 card-shadow p-6">
                                    <span class="text-xs text-slate-600 uppercase tracking-widest mb-4">${isEnVi ? 'Từ vựng' : 'Nghĩa tiếng Việt'}</span>
                                    <div class="flex items-center gap-3">
                                        <h3 class="text-4xl font-black text-white text-center">${frontText}</h3>
                                        ${isEnVi ? `<button onclick="event.stopPropagation(); window.app.playAudio('${safeWordFront}')" class="p-2 bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white rounded-full transition-all"><i data-lucide="volume-2" class="w-6 h-6"></i></button>` : ''}
                                    </div>
                                    <p class="mt-8 text-slate-500 text-sm animate-pulse">Chạm để lật thẻ</p>
                                </div>
                                <!-- Back -->
                                <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-indigo-600 text-white rounded-3xl shadow-2xl flex flex-col items-center p-6 text-center overflow-hidden">
                                    <div class="w-full flex flex-col items-center justify-center flex-1">
                                        <span class="text-xs uppercase font-bold bg-indigo-500/50 px-3 py-1 rounded-full mb-3 border border-indigo-400/30">${word.type || 'N/A'}</span>
                                        <div class="flex items-center gap-3 mb-2">
                                            <h3 class="text-3xl font-black">${backText}</h3>
                                            ${!isEnVi ? `<button onclick="event.stopPropagation(); window.app.playAudio('${safeWordBack}')" class="p-2 bg-white/20 text-white hover:bg-white hover:text-indigo-600 rounded-full transition-all"><i data-lucide="volume-2" class="w-5 h-5"></i></button>` : ''}
                                        </div>
                                    </div>
                                    ${word.example ? `
                                        <div class="w-full mt-2 pt-3 border-t border-indigo-400/50 flex-1 max-h-40 flex flex-col">
                                            <p class="text-indigo-200 text-[11px] uppercase mb-2 font-bold tracking-wider">Đáp án / Ví dụ</p>
                                            <div class="overflow-y-auto flashcard-scroll pr-2 text-left">
                                                <p class="text-indigo-50 text-sm italic opacity-95 whitespace-pre-wrap">${word.example}</p>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-between mt-10 space-x-4">
                            <button onclick="window.app.prevQuestion()" class="w-20 p-4 bg-slate-900 text-slate-400 rounded-2xl hover:bg-slate-800 border border-slate-800 transition-colors flex justify-center">
                                <i data-lucide="arrow-left" class="w-6 h-6"></i>
                            </button>
                            <button onclick="window.app.nextQuestion()" class="flex-1 p-4 bg-indigo-600 text-white rounded-2xl hover:bg-indigo-700 shadow-xl shadow-indigo-900/20 font-bold transition-all flex items-center justify-center">
                                <span>Thẻ tiếp theo</span>
                                <i data-lucide="chevron-right" class="w-5 h-5 ml-2"></i>
                            </button>
                        </div>
                    `;
                }
                
                // --- QUIZ UI ---
                else if (state.practice.gameType === 'quiz') {
                    const safeWord = word.english.replace(/'/g, "\\'");
                    gameContent = `
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 card-shadow">
                            <div class="text-center mb-8">
                                <p class="text-slate-500 uppercase tracking-widest text-xs font-bold mb-3">Chọn nghĩa đúng nhất</p>
                                <div class="flex justify-center items-center gap-4 mb-2">
                                    <h2 class="text-4xl md:text-5xl font-black text-white">${word.english}</h2>
                                    <button onclick="window.app.playAudio('${safeWord}')" class="p-3 bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white rounded-full transition-all">
                                        <i data-lucide="volume-2" class="w-8 h-8"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 gap-3">
                                ${state.practice.quizOptions.map(opt => {
                                    let btnClass = "bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700";
                                    let icon = "";
                                    
                                    if (state.practice.quizAnswered) {
                                        if (opt.id === word.id) {
                                            btnClass = "bg-emerald-900/50 border-emerald-500 text-emerald-100"; 
                                            icon = `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>`;
                                        } else if (opt.id === state.practice.quizSelectedId) {
                                            btnClass = "bg-red-900/50 border-red-500 text-red-100"; 
                                            icon = `<i data-lucide="x-circle" class="w-5 h-5 text-red-400"></i>`;
                                        } else {
                                            btnClass = "bg-slate-900/50 border-slate-800 text-slate-600 opacity-50"; 
                                        }
                                    }
                                    
                                    return `
                                    <button 
                                        ${state.practice.quizAnswered ? 'disabled' : ''} 
                                        onclick="window.app.answerQuiz('${opt.id}')" 
                                        class="p-4 rounded-2xl text-left font-medium text-lg transition-all flex justify-between items-center ${btnClass}">
                                        <span>${opt.vietnamese}</span>
                                        ${icon}
                                    </button>
                                    `;
                                }).join('')}
                            </div>
                            
                            ${state.practice.quizAnswered ? `
                                <button onclick="window.app.nextQuestion()" class="w-full mt-6 p-4 bg-indigo-600 text-white rounded-2xl hover:bg-indigo-700 font-bold transition-all flex items-center justify-center animate-fadeIn">
                                    <span>Tiếp tục</span>
                                    <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                                </button>
                            ` : ''}
                        </div>
                    `;
                }

                // --- SPELLING UI ---
                else if (state.practice.gameType === 'spelling') {
                    let inputStatusClass = "bg-slate-950 border-slate-700 focus:border-indigo-500";
                    if (state.practice.spellingChecked) {
                        inputStatusClass = state.practice.spellingCorrect 
                            ? "bg-emerald-950/30 border-emerald-500 text-emerald-400" 
                            : "bg-red-950/30 border-red-500 text-red-400";
                    }

                    const safeWord = word.english.replace(/'/g, "\\'");

                    gameContent = `
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 card-shadow text-center">
                            <p class="text-slate-500 uppercase tracking-widest text-xs font-bold mb-3">Dịch sang tiếng Anh</p>
                            <h2 class="text-3xl md:text-4xl font-black text-white mb-8">${word.vietnamese}</h2>
                            
                            <div class="relative max-w-sm mx-auto mb-6">
                                <input 
                                    type="text" 
                                    id="spelling-input"
                                    value="${state.practice.spellingInput}"
                                    ${state.practice.spellingChecked ? 'disabled' : ''}
                                    class="w-full text-center text-2xl font-bold py-4 rounded-2xl border-2 outline-none transition-colors shadow-inner ${inputStatusClass}"
                                    placeholder="Gõ từ tiếng Anh..."
                                    autocomplete="off"
                                    onkeypress="if(event.key === 'Enter') window.app.checkSpelling()"
                                >
                            </div>

                            ${!state.practice.spellingChecked ? `
                                <button onclick="window.app.checkSpelling()" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all">Kiểm tra</button>
                            ` : `
                                ${!state.practice.spellingCorrect ? `
                                    <div class="mb-6 animate-fadeIn flex flex-col items-center">
                                        <p class="text-slate-400 text-sm mb-2">Đáp án đúng là:</p>
                                        <div class="flex items-center gap-3">
                                            <p class="text-2xl font-bold text-emerald-400 tracking-wide">${word.english}</p>
                                            <button onclick="window.app.playAudio('${safeWord}')" class="p-1.5 bg-emerald-900/50 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-full transition-all">
                                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                                            </button>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="mb-6 animate-fadeIn flex justify-center">
                                        <button onclick="window.app.playAudio('${safeWord}')" class="p-2 bg-emerald-900/30 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-full transition-all flex items-center gap-2 px-4">
                                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                                            <span class="text-sm font-bold">Nghe lại</span>
                                        </button>
                                    </div>
                                `}
                                <button onclick="window.app.nextQuestion()" class="px-8 py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-all flex items-center justify-center mx-auto animate-fadeIn">
                                    Tiếp tục <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                                </button>
                            `}
                        </div>
                    `;
                }

                // WRAPPER WITH HEADER
                container.innerHTML = `
                    <div class="max-w-xl mx-auto">
                        <div class="flex justify-between items-center mb-6 px-2">
                            <button onclick="window.app.stopPractice()" class="text-slate-500 hover:text-white transition-colors flex items-center bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                                <i data-lucide="x" class="w-4 h-4 mr-1"></i> Thoát
                            </button>
                            <div class="flex items-center space-x-3">
                                ${state.practice.gameType !== 'flashcard' ? `
                                    <span class="text-emerald-400 font-bold bg-emerald-950/30 px-3 py-1.5 rounded-lg border border-emerald-900/50 flex items-center">
                                        <i data-lucide="star" class="w-4 h-4 mr-1"></i> ${state.practice.score}
                                    </span>
                                ` : ''}
                                <span id="practice-timer" class="text-amber-500 font-mono font-bold bg-amber-950/30 px-3 py-1.5 rounded-lg border border-amber-900/50">${state.practice.timer}s</span>
                                <span class="text-xs font-bold text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">${state.practice.index + 1} / ${state.practice.pool.length}</span>
                            </div>
                        </div>
                        ${gameContent}
                    </div>
                `;
                
                // Focus input if spelling game
                if (state.practice.gameType === 'spelling' && !state.practice.spellingChecked) {
                    setTimeout(() => {
                        const el = document.getElementById('spelling-input');
                        if(el) el.focus();
                    }, 50);
                }
            }
            lucide.createIcons();
        };

        // APP ACTIONS
        window.app = {
            switchTab: (tab) => {
                state.activeTab = tab;
                updateUI();
            },
            playAudio: (text) => {
                if ('speechSynthesis' in window) {
                    // Cancel any ongoing speech
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US'; 
                    window.speechSynthesis.speak(utterance);
                } else {
                    showStatus("Trình duyệt của bạn không hỗ trợ đọc âm thanh", "error");
                }
            },
            selectWord: (id) => {
                const word = state.allWords.find(w => String(w.id) === String(id));
                state.selectedWord = word;
                document.getElementById('search-suggestions').classList.add('hidden');
                document.getElementById('search-input').value = word.english;
                renderWordDetail(word);
            },
            toggleSaveWord: async () => {
                if (!state.user || !state.selectedWord) return;
                const id = String(state.selectedWord.id);
                const isSaved = state.myWords.some(w => String(w.id) === id);
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', id);
                    if (isSaved) {
                        await deleteDoc(docRef);
                        showStatus("Đã gỡ khỏi danh sách");
                    } else {
                        await setDoc(docRef, { ...state.selectedWord, addedAt: new Date().toISOString() });
                        showStatus("Đã lưu vào danh sách");
                    }
                    renderWordDetail(state.selectedWord);
                } catch (err) { showStatus("Lỗi hệ thống", "error"); }
            },
            deleteWord: async (id) => {
                if (!state.user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'my_vocabulary', String(id)));
                    showStatus("Đã xóa");
                } catch (e) { showStatus("Lỗi khi xóa", "error"); }
            },
            
            // --- Practice Core Actions ---
            startPractice: (gameType, mode) => startPracticeMode(gameType, mode),
            stopPractice: () => {
                clearInterval(state.practice.interval);
                state.practice.gameType = null;
                renderPractice();
            },
            nextQuestion: () => {
                if (state.practice.index >= state.practice.pool.length - 1) {
                    state.practice.isFinished = true;
                    clearInterval(state.practice.interval);
                } else {
                    state.practice.index++;
                    state.practice.flipped = false; // reset flashcard
                    state.practice.spellingChecked = false; // reset spelling
                    state.practice.spellingInput = '';
                    if (state.practice.gameType === 'quiz') window.app.generateQuizOptions();
                }
                renderPractice();
            },
            prevQuestion: () => { 
                if (state.practice.index > 0) {
                    state.practice.index--;
                    state.practice.flipped = false;
                    renderPractice();
                }
            },
            
            // --- Flashcard Specific ---
            flipCard: () => {
                if (state.practice.gameType !== 'flashcard') return;
                state.practice.flipped = !state.practice.flipped;
                renderPractice();
            },
            
            // --- Quiz Specific ---
            generateQuizOptions: () => {
                const currentWord = state.practice.pool[state.practice.index];
                let options = [currentWord];
                let wrongPool = state.allWords.filter(w => w.id !== currentWord.id);
                wrongPool = shuffle(wrongPool).slice(0, 3);
                options = options.concat(wrongPool);
                state.practice.quizOptions = shuffle(options);
                state.practice.quizAnswered = false;
                state.practice.quizSelectedId = null;
            },
            answerQuiz: (selectedId) => {
                if (state.practice.quizAnswered) return;
                state.practice.quizAnswered = true;
                state.practice.quizSelectedId = selectedId;
                const correct = selectedId === state.practice.pool[state.practice.index].id;
                if (correct) state.practice.score++;
                renderPractice();
            },
            
            // --- Spelling Specific ---
            checkSpelling: () => {
                if (state.practice.spellingChecked) return;
                const inputEl = document.getElementById('spelling-input');
                if (!inputEl) return;
                
                const inputVal = inputEl.value.trim().toLowerCase();
                if (!inputVal) return; 
                
                const currentWord = state.practice.pool[state.practice.index].english.toLowerCase();
                
                state.practice.spellingChecked = true;
                state.practice.spellingInput = inputEl.value;
                state.practice.spellingCorrect = (inputVal === currentWord);
                
                if (state.practice.spellingCorrect) state.practice.score++;
                renderPractice();
            }
        };

        // Render Functions
        const renderWordDetail = (word) => {
            const container = document.getElementById('word-detail-container');
            const isSaved = state.myWords.some(w => String(w.id) === String(word.id));
            const safeWord = word.english.replace(/'/g, "\\'");

            container.innerHTML = `
                <div class="bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-8 animate-fadeIn card-shadow">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="text-indigo-400 font-bold text-xs uppercase tracking-widest bg-indigo-950 px-3 py-1 rounded-full border border-indigo-900/50">${word.type || 'N/A'}</span>
                            <div class="flex items-center gap-4 mt-3">
                                <h2 class="text-4xl font-black text-white">${word.english}</h2>
                                <button onclick="window.app.playAudio('${safeWord}')" class="p-2 bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white rounded-full transition-all">
                                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>
                        <button onclick="window.app.toggleSaveWord()" class="p-3 rounded-2xl transition-all ${isSaved ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-500 hover:bg-slate-700'}">
                            <i data-lucide="${isSaved ? 'check' : 'plus'}" class="w-6 h-6"></i>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-slate-950/50 p-5 rounded-2xl border border-slate-800/50">
                            <p class="text-slate-500 text-xs mb-2 uppercase font-bold tracking-tighter">Nghĩa tiếng Việt</p>
                            <p class="text-xl font-medium text-slate-200">${word.vietnamese}</p>
                        </div>
                        ${word.example ? `
                            <div class="bg-indigo-950/30 p-5 rounded-2xl border-l-4 border-indigo-500 mt-4">
                                <p class="text-indigo-400/80 text-xs mb-3 uppercase font-bold tracking-wider">Đáp án & Ví dụ</p>
                                <p class="text-slate-300 italic text-lg leading-relaxed whitespace-pre-wrap">${word.example}</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        const renderMyWords = () => {
            const listEl = document.getElementById('mywords-list');
            if (state.myWords.length === 0) {
                listEl.innerHTML = `<div class="text-center py-20 bg-slate-900 rounded-3xl border border-dashed border-slate-800 text-slate-500">Danh sách trống. Hãy tra cứu và lưu từ mới!</div>`;
                return;
            }
            listEl.innerHTML = state.myWords.map(w => `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-sm flex justify-between items-center hover:border-slate-700 transition-all">
                    <div>
                        <div class="flex items-center">
                            <p class="font-bold text-white text-lg">${w.english}</p>
                            <button onclick="window.app.playAudio('${w.english.replace(/'/g, "\\'")}')" class="ml-2 p-1.5 text-indigo-400 hover:bg-indigo-900 hover:text-indigo-200 rounded-lg transition-all">
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                            </button>
                            <span class="text-xs font-normal text-slate-500 ml-2">(${w.type})</span>
                        </div>
                        <p class="text-slate-400 mt-0.5">${w.vietnamese}</p>
                    </div>
                    <button onclick="window.app.deleteWord('${w.id}')" class="p-2 text-slate-600 hover:text-red-400 hover:bg-red-950/30 rounded-xl transition-all">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const renderDashboard = () => {
            const content = document.getElementById('stats-content');
            const total = state.myWords.length;
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center card-shadow">
                        <p class="text-slate-500 text-xs font-bold uppercase mb-2">Tổng từ đã lưu</p>
                        <p class="text-5xl font-black text-indigo-500">${total}</p>
                    </div>
                    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center">
                        <p class="text-slate-500 text-xs font-bold uppercase mb-2">Trạng thái</p>
                        <p class="text-2xl font-bold text-emerald-500">${total > 10 ? 'Chăm chỉ' : 'Bắt đầu'}</p>
                    </div>
                </div>
            `;
        };

        // SEARCH EVENT
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const suggEl = document.getElementById('search-suggestions');
            if (query.length < 1) { suggEl.classList.add('hidden'); return; }

            const res = state.allWords.filter(w => w.english.toLowerCase().includes(query) || w.vietnamese.toLowerCase().includes(query)).slice(0, 6);
            if (res.length > 0) {
                suggEl.innerHTML = res.map(w => `
                    <div onclick="window.app.selectWord('${w.id}')" class="px-5 py-4 hover:bg-slate-800 cursor-pointer flex justify-between items-center border-b border-slate-800 last:border-0">
                        <div>
                            <span class="font-bold text-white">${w.english}</span>
                            <span class="text-xs text-slate-500 ml-2 italic">${w.type}</span>
                        </div>
                        <span class="text-sm text-slate-400">${w.vietnamese}</span>
                    </div>
                `).join('');
                suggEl.classList.remove('hidden');
            } else {
                suggEl.innerHTML = `<div class="px-5 py-4 text-slate-500 text-sm italic">Không tìm thấy kết quả...</div>`;
                suggEl.classList.remove('hidden');
            }
        });

        // INIT
        (async () => {
            updateUI();
            await setupAuth();
            await fetchSheetData();
        })();
    </script>
</body>
</html>
