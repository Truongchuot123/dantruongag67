<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Thực Hành 08/2025 - 02/2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid transparent;
        }
        .day-cell:hover:not(.day-off) {
            transform: translateY(-2px);
            background-color: #334155;
            border-color: #475569;
        }
        .day-cell.day-off {
            background-color: #1e293b;
            color: #475569;
            cursor: not-allowed;
            opacity: 0.4;
        }
        .day-cell.current-day {
            border: 2px solid #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
        .day-status-label {
            font-size: 0.7rem;
            font-weight: 800;
            margin-top: 2px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .marked-V { background-color: #10b981 !important; color: white; }
        .marked-X { background-color: #ef4444 !important; color: white; }
        
        .month-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .progress-bar {
            height: 10px;
            border-radius: 5px;
            background: #334155;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            transition: width 0.5s ease-out;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>
    <!-- Header Thống kê cố định khi cuộn -->
    <div class="sticky-header border-b border-slate-700 mb-6">
        <div class="max-w-4xl mx-auto p-4 space-y-4">
            <div class="flex justify-between items-center">
                <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">
                    LỊCH THỰC HÀNH 2025-2026
                </h1>
                <div id="user-info" class="text-[10px] font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                    Đang kết nối...
                </div>
            </div>
            
            <div class="grid grid-cols-4 gap-2 md:gap-4">
                <div class="text-center">
                    <p class="text-[10px] text-slate-500 uppercase font-bold">Tổng</p>
                    <p id="stat-total" class="text-lg font-black text-white">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] text-emerald-500 uppercase font-bold">Đã đi (V)</p>
                    <p id="stat-work" class="text-lg font-black text-emerald-400">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] text-red-500 uppercase font-bold">Nghỉ (X)</p>
                    <p id="stat-leave" class="text-lg font-black text-red-400">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] text-blue-500 uppercase font-bold">Còn lại</p>
                    <p id="stat-remain" class="text-lg font-black text-blue-400">0</p>
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-[10px] font-bold uppercase text-slate-400">
                    <span>Tiến độ thực hành</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 md:p-8 pt-0 space-y-6">
        <!-- Countdown & Time Info -->
        <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700">
                <p class="text-xs font-bold text-slate-500 mb-1">GIAI ĐOẠN THEO DÕI</p>
                <p class="text-sm text-slate-200">Từ <b>27/08/2025</b> đến <b>27/02/2026</b></p>
            </div>
            <div class="bg-indigo-900/20 p-4 rounded-xl border border-indigo-500/20">
                <p class="text-xs font-bold text-indigo-400 mb-1">ĐẾM NGƯỢC KẾT THÚC</p>
                <div id="countdown" class="text-lg font-black text-white tabular-nums">--:--:--:--</div>
            </div>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap justify-center gap-6 text-[11px] font-bold text-slate-500 bg-slate-900/50 py-3 rounded-xl">
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 1 Click: Đã đi (V)</div>
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> 2 Clicks: Nghỉ (X)</div>
            <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-slate-600"></span> 3 Clicks: Trống</div>
        </div>

        <!-- Calendar Container -->
        <div id="calendar-container" class="space-y-8 pb-12">
            <!-- Loader -->
            <div class="flex flex-col items-center justify-center p-20 space-y-4">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500"></div>
                <p class="text-slate-500 text-sm animate-pulse">Đang thiết lập lịch trình...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CẤU HÌNH THỜI GIAN MỚI: 08/2025 - 02/2026
        const START_DATE = new Date('2025-08-27T00:00:00'); 
        const END_DATE = new Date('2026-02-27T23:59:59');
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'med-rotation-2526';
        
        let db, auth, userId;
        let calendarData = {};
        let totalWorkingDaysCount = 0;

        const formatDate = (date) => date.toISOString().split('T')[0];

        const calculateGlobalWorkingDays = () => {
            let count = 0;
            let current = new Date(START_DATE);
            while (current <= END_DATE) {
                const dow = current.getDay();
                if (dow >= 1 && dow <= 5) count++; // Thứ 2 - Thứ 6
                current.setDate(current.getDate() + 1);
            }
            totalWorkingDaysCount = count;
            document.getElementById('stat-total').textContent = count;
        };

        const updateStats = () => {
            let work = 0, leave = 0;
            Object.keys(calendarData).forEach(key => {
                const date = new Date(key);
                if (date >= START_DATE && date <= END_DATE && date.getDay() >= 1 && date.getDay() <= 5) {
                    if (calendarData[key] === 'V') work++;
                    if (calendarData[key] === 'X') leave++;
                }
            });

            const remain = Math.max(0, totalWorkingDaysCount - work - leave);
            const percent = totalWorkingDaysCount > 0 ? Math.round((work / totalWorkingDaysCount) * 100) : 0;

            document.getElementById('stat-work').textContent = work;
            document.getElementById('stat-leave').textContent = leave;
            document.getElementById('stat-remain').textContent = remain;
            document.getElementById('progress-text').textContent = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        };

        const updateCountdown = () => {
            const now = new Date();
            const diff = END_DATE - now;
            if (diff <= 0) {
                document.getElementById('countdown').textContent = "HOÀN THÀNH THỰC HÀNH";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('countdown').textContent = 
                `${d}n ${String(h).padStart(2,'0')}g ${String(m).padStart(2,'0')}p ${String(s).padStart(2,'0')}s`;
        };

        const initApp = async () => {
            calculateGlobalWorkingDays();
            setInterval(updateCountdown, 1000);

            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                const config = JSON.parse(configStr);
                
                if (!config.apiKey) throw new Error("Offline");

                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);

                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) await signInWithCustomToken(auth, token);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('user-info').textContent = `ID: ${userId.substring(0,6)}`;
                        bindData();
                    }
                });
            } catch (e) {
                document.getElementById('user-info').textContent = "LƯU TRỮ CỤC BỘ";
                const saved = localStorage.getItem('med_calendar_v2');
                if (saved) calendarData = JSON.parse(saved);
                renderCalendar();
            }
        };

        const bindData = () => {
            const docRef = doc(db, 'artifacts', APP_ID, 'users', userId, 'data', 'calendar_v2');
            onSnapshot(docRef, (s) => {
                calendarData = s.exists() ? (s.data().entries || {}) : {};
                renderCalendar();
            }, (err) => {
                console.error("Firestore error", err);
                renderCalendar();
            });
        };

        const saveData = async () => {
            if (!userId || !db) {
                localStorage.setItem('med_calendar_v2', JSON.stringify(calendarData));
                updateStats();
                return;
            }
            try {
                const docRef = doc(db, 'artifacts', APP_ID, 'users', userId, 'data', 'calendar_v2');
                await setDoc(docRef, { entries: calendarData }, { merge: true });
            } catch (e) {
                console.error("Sync failed", e);
            }
        };

        const renderCalendar = () => {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';
            const todayStr = formatDate(new Date());

            // Tạo các tháng từ 08/2025 đến 02/2026
            let current = new Date(2025, 7, 1); // Tháng 8 năm 2025
            const endLimit = new Date(2026, 1, 1); // Tháng 2 năm 2026

            while (current <= endLimit) {
                const card = document.createElement('div');
                card.className = 'month-card';
                
                const monthDisplay = current.toLocaleString('vi-VN', { month: 'long', year: 'numeric' }).toUpperCase();
                card.innerHTML = `<h3 class="text-sm font-black text-slate-300 mb-4 border-l-4 border-red-500 pl-3">${monthDisplay}</h3>`;
                
                const grid = document.createElement('div');
                grid.className = 'calendar-grid';

                ['T2','T3','T4','T5','T6','T7','CN'].forEach(d => {
                    const h = document.createElement('div');
                    h.className = 'text-center text-[9px] font-bold text-slate-600 py-1';
                    h.textContent = d;
                    grid.appendChild(h);
                });

                const firstDay = new Date(current.getFullYear(), current.getMonth(), 1);
                let offset = (firstDay.getDay() + 6) % 7;

                for (let i = 0; i < offset; i++) {
                    grid.appendChild(document.createElement('div'));
                }

                let dLoop = new Date(firstDay);
                while (dLoop.getMonth() === current.getMonth()) {
                    const dateKey = formatDate(dLoop);
                    const dow = dLoop.getDay();
                    const isWeekend = (dow === 0 || dow === 6);
                    const isOutOfRange = (dLoop < START_DATE || dLoop > END_DATE);
                    
                    const cell = document.createElement('div');
                    cell.className = `day-cell ${isWeekend || isOutOfRange ? 'day-off' : 'bg-slate-800/60'}`;
                    if (dateKey === todayStr) cell.classList.add('current-day');
                    
                    const status = calendarData[dateKey];
                    if (status === 'V') cell.classList.add('marked-V');
                    if (status === 'X') cell.classList.add('marked-X');

                    cell.innerHTML = `
                        <span class="text-xs">${dLoop.getDate()}</span>
                        ${status ? `<span class="day-status-label">${status}</span>` : ''}
                    `;

                    if (!isWeekend && !isOutOfRange) {
                        cell.onclick = () => {
                            const cur = calendarData[dateKey];
                            if (!cur) calendarData[dateKey] = 'V';
                            else if (cur === 'V') calendarData[dateKey] = 'X';
                            else delete calendarData[dateKey];
                            renderCalendar();
                            saveData();
                        };
                    }

                    grid.appendChild(cell);
                    dLoop.setDate(dLoop.getDate() + 1);
                }

                card.appendChild(grid);
                container.appendChild(card);
                current.setMonth(current.getMonth() + 1);
            }
            updateStats();
        };

        window.onload = initApp;
    </script>
</body>
</html>
