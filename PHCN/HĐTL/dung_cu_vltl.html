    <script>
        const tools = [
            {
                id: 1,
                name: "Bộ Cọc và Vòng Xỏ Tay",
                category: "Tập chức năng bàn tay",
                image: "/PHCN/hinhanh/dung_cu_vltl/Bo_coc_va_vong_xo_tay.png",
                exercise: "Bài tập tác vụ cụ thể mô phỏng lại các kỹ năng cầm nắm trong sinh hoạt hàng ngày.",
                features: [
                    "Kết hợp cử động với tay và kỹ năng cầm nắm để di chuyển các vòng gỗ giữa các vị trí khác nhau.",
                    "Tăng sự khéo léo và tính linh hoạt của các khớp ngón tay.",
                    "Tập luyện kỹ năng mở xòe bàn tay để chống co rút.",
                    "Cải thiện sự phối hợp đa giác quan (mắt - tay) và khả năng nhận thức không gian."
                ],
                target: "Người bệnh sau tai biến bị liệt nửa người, mất cảm giác không gian, gặp khó khăn khi cầm nắm đồ vật sinh hoạt hàng ngày, trẻ em bại não hoặc chậm phát triển vận động.",
                instruction: `
                    <ol class="list-decimal ml-4 space-y-2 text-gray-600">
                        Người tập ngồi vững chãi trên ghế có tựa, đặt bộ dụng cụ trên bàn ngang tầm bụng.
                        <li><b>Cầm nắm:</b> người bệnh xòe rộng các ngón tay để nhặt một vòng gỗ đang nằm ở cọc số 1 (nếu tay liệt quá yếu, dùng tay lành cầm tay yếu để hỗ trợ)..</li>
                        <li><b>Di chuyển:</b> Nâng vòng lên và đưa tay di chuyển vòng sang hướng của cọc số 2. Cố gắng giữ khớp vai ổn định, chỉ di chuyển cánh tay thay vì xoay cả thân mình.</li>
                        <li><b>Xỏ vòng:</b> Khéo léo lồng vòng qua đầu cọc số 2, mở rộng tối đa các ngón tay để vòng rơi xuống.</li>
                        <li><b>Luân chuyển:</b> Tiếp tục nhặt các vòng còn lại từ cọc này chuyển hết sang cọc kia và ngược lại để rèn luyện sự linh hoạt đổi chiều.</li>
                    </ol>
                    `,
                warning: "Đặt bộ cọc quá xa tầm với, khiến người bệnh phải rướn thân người, dễ dẫn đến mất thăng bằng và té ngã khỏi ghế. <br> Lỗi kéo giãn cổ tay và ngón tay trước khi tập đối với những người bệnh đang bị co cứng cơ nặng.",
                stopSign: "Khi người bệnh có biểu hiện quá mệt mỏi về mặt thần kinh (mất tập trung, bực bội) hoặc mất kiểm soát tư thế ngồi, hoặc có biểu hiện sưng nề ở bàn tay khi cố rướn tập.",
                recommendation: "3-5 buổi/tuần; 20-30 phút/buổi. Tăng độ khó bằng cách đặt lệch cọc về phía tay liệt.",
                contraindication: "Dụng cụ này cơ bản là an toàn, nhưng cần thận trọng tối đa (không để người bệnh tự tập một mình) đối với những người có rối loạn nhận thức thần kinh nặng, mất kiểm soát hành vi để tránh tai nạn với các chi tiết bằng gỗ."
            },
            {
                id: 2,
                name: "Cây treo vòng tập chi trên",
                category: "Tăng tầm vận động khớp",
                image: "/PHCN/hinhanh/dung_cu_vltl/cay_treo_vong_tap_chi_tren.png",
                exercise: "Bài tập vận động chủ động hoặc có trợ giúp (tùy vào sức cơ của người tập).",
                features: [
                    "Dùng để tập tầm vận động khớp vai và cánh tay thông qua việc lấy và treo các vòng lên các nhánh của cây, giúp duy trì tầm vận động khớp vai, ngăn ngừa tình trạng cứng khớp, thúc đẩy tuần hoàn máu."
                ],
                target: "Người bệnh suy giảm chức năng chi trên do liệt nửa người sau tai biến, người phải nằm lâu ngày.<br>Người cao tuổi muốn duy trì sự linh hoạt của khớp vai và cánh tay.<br> Người cần tập vận động khớp vùng chi trên trong giai đoạn phục hồi sau chấn thương.<br<Người cần tập vận động khớp vai và tập các chức năng sinh hoạt hằng ngày như treo đồ, lấy đồ vật.",
                instruction: `
                    <ol class="list-decimal ml-4 space-y-2 text-gray-600">
                        <li><b>Chuẩn bị:</b> Đứng hoặc ngồi vững chãi đối diện với cây tập. Lưng thẳng, vai thả lỏng.</li>
                        <li><b>Lấy vòng:</b> Dùng tay cần tập (hoặc tay yếu được tay khỏe hỗ trợ) từ từ đưa lên lấy một chiếc vòng từ nhánh thấp nhất.</li>
                        <li><b>Di chuyển:</b> Đưa vòng lên cao và treo vào một nhánh ở vị trí cao hơn hoặc ở hướng khác.</li>
                        <li><b>Lập lại:</b> Tiếp tục thực hiện với các nhánh ở độ cao tăng dần để mở rộng tầm với. Sau đó thực hiện ngược lại (lấy từ trên cao treo xuống thấp).</li>
                    </ol>`,
                warning: "Tránh nhún vai hoặc nghiêng người để cố đưa tay lên cao; thay vào đó hãy giữ thân mình cố định và chỉ cử động khớp vai.",
                stopSign: "Nếu cảm thấy đau nhói dữ dội, chóng mặt hoặc khó thở, cần dừng lại ngay và tham khảo ý kiến của người có chuyên môn.",
                recommendation: "2 - 3 lần/ngày. Tập đến ngưỡng cảm thấy căng nhẹ ở khớp vai, không tập khi thấy đau chói. Mỗi lần tập từ 15 - 20 phút.",
                contraindication: "Không tập khi đang có tình trạng trật khớp vai cấp tính, gãy xương chưa liền hoặc đang có viêm cấp sưng nóng đỏ đau."
            },
            {
                id: 3,
                name: "Dụng cụ tập trợ giúp cử động tay chân",
                category: "Tăng tầm vận động khớp",
                image: "/PHCN/hinhanh/dung_cu_vltl/dung_cu_tap_tro_giup_cu_dong_tay_chan.jpg",
                exercise: "Bài tập vận động thụ động hoặc có trợ giúp (tùy vào sức cơ của người tập).",
                features: [
                    "Hỗ trợ các bài tập cử động thụ động và chủ động cho người bệnh bị suy giảm chức năng tay và chân."

                instruction: `
                    <ol class="list-decimal ml-4 space-y-2 text-gray-600">
                        Người bệnh cố định tay/chân vào bề mặt dụng cụ bằng đai sẵn có. Thực hiện các cử động được hỗ trợ bằng cách trượt dụng cụ trên các mặt phẳng.
                        <li><b>Gập duỗi gối:</b> Người tập ngồi trên ghế, 1 chân đặt trên sàn và 1 chân được cố định vào dụng cụ. Từ từ đưa chân được hỗ trợ ra phía sau làm động tác gập gối và đưa ra trước làm động tác duỗi gối, lặp lại.</li>
                        <li><b>Gập duỗi vai:</b> Người tập ngồi trên ghế, tay cố định vào dụng cụ và đặt trên bàn. Từ từ đưa tay được hỗ trợ trượt về phía trước làm động tác gập vai và đưa ra phía sau làm động tác duỗi vai, lặp lại.</li>
                    </ol>`,
                warning: "Ở bài tập gập duỗi vai, tay được hỗ trợ phải đặt cạnh thân người trong lúc tập.",
                stopSign: "Nếu cảm thấy đau nhói dữ dội, chóng mặt hoặc khó thở, cần dừng lại ngay và tham khảo ý kiến của người có chuyên môn.",
                recommendation: "10-20 phút/lần, 2-3 lần/ngày, cường đồ nhẹ đến trung bình vừa sức người bệnh ",
                contraindication: "Viêm khớp cấp tính, sưng nóng đỏ đau nhiều.<br>Vết thương hở, loét da tại vị trí cố định dây đai.<br>Rối loạn nhận thức nặng, không hiểu lệnh hoặc không phối hợp được.<br>Đau tăng rõ rệt khi cử động."
            },
            {
                id: 4,
                name: "Banh nhựa dẻo",
                category: "Tập chức năng bàn tay",
                image: "/PHCN/hinhanh/dung_cu_vltl//banh_nhua_deo.jpg",
                exercise: "Bài tập kích thích cảm giác và sự khéo léo của các ngón tay.",
                features: ["Giúp duy trì tư thế ngón tay mở, ngăn ngừa tình trạng co rút các ngón tay tạo thành tư thế nắm đấm co cứng. Ngoài ra còn giúp kích thích cảm giác lòng bàn tay và rèn luyện vận động tinh (tập nhóm cơ bàn tay)."],
                target: "Người bệnh tai biến có nguy cơ hoặc đang bị co cứng bàn tay, người lớn tuổi yếu cơ nặng, người cần phục hồi cảm giác và khả năng vận động chức năng bàn tay.",
                instruction: `
                        <li>Đặt trọn quả bóng vào lòng bàn tay.</li>
                        <li>Nắm bóp quả bóng mạnh hết mức có thể.</li>
                        <li>Giữ lực bóp trong 5 giây, sau đó thả lỏng để máu lưu thông trở lại.</li>
                        <li>Ngoài ra có thể tập kẹp bóng giữa 2 ngón tay, hoặc dùng ngón cái lăn bóng.</li>
                    `,
                warning: "Thực hiện các động tác bóp/nhả quá nhanh và giật cục. Đặc biệt, người tập thường mắc lỗi để ngón tay bị căng cơ quá mức khi thực hiện các bài tập duỗi, dễ gây tổn thương gân cơ nhỏ ở bàn tay.",
                stopSign: "Nếu xuất hiện triệu chứng đau nhức tăng lên ở các khớp ngón tay hoặc có cảm giác tê buốt ở các đầu ngón tay thì cần dừng tập ngay và tham khảo ý kiến của người có chuyên môn.",
                recommendation: "<b>Tần suất:</b> Có thể tập luyện hàng ngày (nên nghỉ ngơi nếu xuất hiện tình trạng đau nhức các khớp ngón tay).<br><b>Cường độ:</b> Thực hiện 10 - 15 lần/hiệp. Lặp lại 3 - 4 hiệp cho mỗi bài tập. Nghỉ giữa các hiệp từ 30 - 60 giây.<br><b>Thời gian:</b> Mỗi buổi tập từ 15 - 20 phút. Có thể chia thành nhiều đợt tập ngắn trong ngày để tránh gây quá tải gân cơ.",
                contraindication: "Không có chống chỉ định tuyệt đối, nhưng những người có tiền sử dị ứng nặng với cao su hoặc nhựa tổng hợp cần thận trọng (có thể khắc phục bằng cách bọc một lớp vải mỏng bên ngoài quả bóng)."
            },
            {

 let currentFilter = 'Tất cả';

        function renderFilters() {
            const filterContainer = document.getElementById('filter-container');
            const categories = ['Tất cả', ...new Set(tools.map(tool => tool.category))];
            
            filterContainer.innerHTML = categories.map(category => `
                <button 
                    onclick="filterTools('${category}')" 
                    class="filter-chip ${category === currentFilter ? 'active' : ''} px-6 py-2 rounded-full border border-blue-200 text-blue-800 font-semibold bg-white hover:bg-blue-50"
                >
                    ${category}
                </button>
            `).join('');
        }

        function displayTools(filter = 'Tất cả') {
            const container = document.getElementById('tools-container');
            const filtered = filter === 'Tất cả' ? tools : tools.filter(t => t.category === filter);
            
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 italic">Không tìm thấy dụng cụ phù hợp.</div>`;
                return;
            }

            filtered.forEach((tool, index) => {
                const card = document.createElement('div');
                card.className = "tool-card bg-white rounded-3xl overflow-hidden shadow-sm cursor-pointer group h-full";
                card.onclick = () => showDetails(tool.id);
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', index * 100);
                
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${tool.image}" alt="${tool.name}" onerror="this.src='https://placehold.co/600x400?text=PHCN'">
                        <div class="absolute inset-0 bg-blue-900/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <div class="bg-white/90 p-2 rounded-full shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                             </div>
                        </div>
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-2">${tool.category}</span>
                        <h3 class="text-xl font-bold text-gray-800 group-hover:text-blue-700 transition-colors line-clamp-2 mb-3">${tool.name}</h3>
                        <p class="text-gray-500 text-sm line-clamp-3 mb-6 italic">
                            "${tool.exercise}"
                        </p>
                        <div class="mt-auto flex items-center justify-between">
                            <span class="text-blue-600 font-semibold text-sm">Xem chi tiết</span>
                            <div class="btn-detail h-8 w-8 bg-blue-600 rounded-full flex items-center justify-center text-white">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            AOS.refresh();
        }

        function filterTools(category) {
            currentFilter = category;
            renderFilters();
            displayTools(category);
        }

        function showDetails(id) {
            const tool = tools.find(t => t.id === id);
            
            Swal.fire({
                title: `<span class="text-xl text-blue-800 font-bold">${tool.name}</span>`,
                html: `
                    <div class="text-left space-y-4 py-2 custom-swal-content max-h-[65vh] overflow-y-auto pr-2">
                        <img src="${tool.image}" class="w-full h-48 object-contain bg-gray-50 rounded-xl mb-4" onerror="this.src='https://placehold.co/600x400?text=PHCN'">
                        <div>
                            <h4>🎯 Loại bài tập</h4>
                            <p class="text-blue-800 text-sm font-medium italic bg-blue-50 p-3 rounded-lg">${tool.exercise}</p>
                        </div>
                        <div>
                            <h4>📌 Đặc điểm & Công dụng</h4>
                            <ul class="list-disc ml-5 space-y-1 text-gray-600 text-sm">
                                ${tool.features.map(f => `<li>${f}</li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <h4>📖 Hướng dẫn</h4>
                            <div class="text-gray-600 text-sm leading-relaxed">${tool.instruction}</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="bg-red-50 p-3 rounded-xl border border-red-100">
                                <p class="font-bold text-red-700 text-xs uppercase mb-1">⚠️ Cảnh báo</p>
                                <p class="text-red-600 text-xs">${tool.warning}</p>
                            </div>
                            <div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
                                <p class="font-bold text-orange-700 text-xs uppercase mb-1">🛑 Dừng tập khi</p>
                                <p class="text-orange-600 text-xs">${tool.stopSign}</p>
                            </div>
                        </div>
                        <!-- PHẦN BỔ SUNG: RECOMMENDATION -->
                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                            <p class="font-bold text-blue-900 text-xs uppercase mb-1">📊 Mức độ khuyến nghị</p>
                            <p class="text-blue-800 text-sm leading-relaxed">${tool.recommendation || 'Theo chỉ định của bác sĩ/KTV.'}</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <p class="font-bold text-slate-700 text-xs uppercase mb-1">🚫 Chống chỉ định</p>
                            <p class="text-slate-600 text-xs">${tool.contraindication}</p>
                        </div>
                    </div>
                `,
                confirmButtonText: 'Đóng lại',
                confirmButtonColor: '#1e40af',
                width: '700px'
            });
        }

        window.onload = function() {
            renderFilters();
            displayTools();
            AOS.init({ 
                duration: 800, 
                once: true
            });
        };
    </script>
