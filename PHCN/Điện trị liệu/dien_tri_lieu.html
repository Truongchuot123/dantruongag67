<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điện trị liệu - Nguyễn Mai Đan Trường</title>
     <meta name="description" content="Chào bạn! Đây là không gian cá nhân của Đan Trường. Khám phá thôi nào!.">
    <meta property="og:description" content="Chào bạn! Đây là không gian cá nhân của Đan Trường. Khám phá thôi nào!.">
    <meta property="og:image" content="/hinhanh/logo_web.png">
    <meta property="og:url" content="https://dantruongag.id.vn">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/hinhanh/logo_web.png" type="">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/banner_trang_con.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Truyền Thống & Hiện Đại */
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        .main-content-section {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.page-title {
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        /* Container chính cho các thẻ card */
        #content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        /* Cấu trúc Card */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Div chứa ảnh theo yêu cầu */
        #image-container {
            width: 100%;
            height: 200px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        #image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Tiêu đề h1 theo yêu cầu */
        .card-body h1 {
            font-size: 1.25rem;
            margin: 0 0 15px 0;
            color: var(--text-main);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Nút xem ngay */
        .btn-view {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-view:hover {
            background-color: #1d4ed8;
        }

        /* Hiệu ứng loading */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ef4444;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body class="bg-gray-900">
    <div id="header-placeholder"></div>
    <div id="search-placeholder"></div>

    <header class="main-banner_trang_con">
        <div class="banner_trang_con-overlay"></div>
        <div class="hbanner_trang_con-image-bg"></div>

        <div class="hbanner_trang_con-content">
            <h1 class="main-title">ĐIỆN TRỊ LIỆU</h1>
            <p class="sub-text">Phục hồi chức năng là biện pháp giảm tối đa tác động của giảm chức năng và tàn tật, từ đó, giúp người bệnh hội nhập hoặc tái hội nhập với xã hội. Những chức năng này có thể thuộc về chức năng thể chất hoặc tâm thần (khả năng nhận thức, tư duy,…)</p>
            <div class="hbanner_trang_con-tabs-wrap">
                <div id="category-tabs" class="category-scroll" aria-label="Danh mục bài viết"></div>
            </div>
        </div>
    </header>

    <section class="main-content-section">
    <div id="loader" class="loader"></div>
    <div id="content-grid"></div>
    </section>
    <script>
        const DEFAULT_IMAGE = "/hinhanh/logo_web.png";
        const pageUrls = [
            '/PHCN/Điện trị liệu/Parafin.html',
            '/PHCN/Điện trị liệu/Hongngoai.html',
            '/PHCN/Điện trị liệu/sieu_am.html',
            "/PHCN/Điện trị liệu/kich_thich_lien_xuong.html",
            '/PHCN/Điện trị liệu/Song_ngan.html',
            '/PHCN/Điện trị liệu/laser_cong-suat_thap.html',
            "/PHCN/Điện trị liệu/laser_noi_mach.html",
            "/PHCN/Điện trị liệu/laser_cong_suat_cao.html",
            '/PHCN/Điện trị liệu/dien_xung.html',
            '/PHCN/Điện trị liệu/may_keo_cot_song.html',
            "/PHCN/Điện trị liệu/nen_ep.html",
            "/PHCN/Điện trị liệu/dien_truong_cao_ap.html",
            "/PHCN/Điện trị liệu/xung_kich.html",
            "/PHCN/Điện trị liệu/tu_truong.html",
            "/PHCN/Điện trị liệu/oxy_cao_ap.html"

        ];

    async function fetchData() {
        const grid = document.getElementById('content-grid');
        const loader = document.getElementById('loader');

        try {
            const fetchPromises = pageUrls.map(async (url) => {
                try {
                    const response = await fetch(url);
                    if (!response.ok) return null;
                    
                    const htmlText = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    
                    // Lấy thẻ ảnh bên trong container của file HTML con
                    const imgElement = doc.querySelector('#image-container img');
                    let imageSrc = imgElement ? imgElement.getAttribute('src') : null;

                    // KIỂM TRA: Nếu không có src hoặc src trống, dùng ảnh mặc định
                    if (!imageSrc || imageSrc.trim() === "" || imageSrc.includes('undefined')) {
                        imageSrc = DEFAULT_IMAGE;
                    } else {
                        // Xử lý trường hợp đường dẫn tương đối trong file con
                        // (Ví dụ file con ghi src="anh.jpg", ta cần chuyển thành "/path/to/anh.jpg")
                        if (!imageSrc.startsWith('http') && !imageSrc.startsWith('/')) {
                            const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
                            imageSrc = baseUrl + imageSrc;
                        }
                    }

                    const titleText = doc.querySelector('h1')?.innerText || 'Tiêu đề chưa xác định';
                    
                    return {
                        url: url,
                        image: imageSrc,
                        title: titleText
                    };
                } catch (e) {
                    console.error(`Lỗi khi tải ${url}:`, e);
                    return null;
                }
            });

            const results = await Promise.all(fetchPromises);
            loader.style.display = 'none';

            results.filter(item => item !== null).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div id="image-container">
                        <img src="${item.image}" 
                             alt="${item.title}" 
                             onerror="this.onerror=null; this.src='${DEFAULT_IMAGE}';">
                    </div>
                    <div class="card-body">
                        <h1>${item.title}</h1>
                        <a href="${item.url}" class="btn-view">Xem ngay</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = '<p class="error-msg">Không tìm thấy dữ liệu. Vui lòng kiểm tra lại đường dẫn file.</p>';
            }

        } catch (error) {
            if (loader) loader.style.display = 'none';
            grid.innerHTML = `<p class="error-msg">Lỗi hệ thống: ${error.message}</p>`;
        }
    }

    window.onload = fetchData;
    </script>

    
        <div id="footer-placeholder"></div>

        <script src="/script.js"></script>
        <script src="/search.js"></script>
        <script src="/banner_trang_con.js"></script>
</body>
</html>
