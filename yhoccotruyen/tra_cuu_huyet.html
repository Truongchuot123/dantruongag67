    <!-- Main Container -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 w-full flex-grow mb-16">
        
        <!-- Control Center: Search & Filter Systems -->

                    <!-- Quick Stats Badges -->

                <!-- Symptom Quick Filters -->
                <div class="flex flex-col gap-2">

                    <div class="flex flex-wrap gap-2">

                        <button onclick="searchSymptom('Đau lưng')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 border border-slate-800 text-slate-300 hover:border-brand-500 hover:text-brand-400 transition-all">🧍 Đau lưng, cột sống</button>
                        <button onclick="searchSymptom('Ho')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 border border-slate-800 text-slate-300 hover:border-brand-500 hover:text-brand-400 transition-all">🗣️ Ho, hen suyễn</button>
                        <button onclick="searchSymptom('Tiêu hóa')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 border border-slate-800 text-slate-300 hover:border-brand-500 hover:text-brand-400 transition-all">🍽️ Tiêu hoá, dạ dày</button>

                <!-- Divider -->

                <!-- Meridians (Kinh Mạch) Filter Row -->

                    <div id="filterContainer" class="flex gap-2 overflow-x-auto pb-3 scrollbar-hide snap-x snap-mandatory">

        <!-- Status & Loader Message -->

        <!-- Main Cards Grid View -->

    <!-- Detailed Acupoint Modal View -->

                <!-- Custom Personal Note Area (Persisted to LocalStorage) -->

                        id="modalNote" 
                        placeholder="Nhập ghi chú của bạn tại đây..."

                        class="w-full bg-amber-500/5 hover:bg-amber-500/10 focus:bg-amber-500/10 border border-amber-500/10 focus:border-amber-500/30 text-amber-100 placeholder-slate-500 text-sm rounded-2xl p-4 focus:outline-none transition-all resize-none"
                    ></textarea>

            <!-- Modal Footer Controls -->

                <button id="modalFavBtn" class="flex items-center gap-2 text-rose-400 hover:text-rose-300 text-sm font-semibold px-4 py-2 rounded-xl hover:bg-rose-500/10 transition-all">
                    <i class="fa-regular fa-heart text-base" id="modalFavIcon"></i>
                    <span>Thêm vào ưa thích</span>
                </button>
                <button onclick="closeModal()" class="bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-brand-600/25 transition-all">

    <!-- Logic Scripting -->
    <script>
        // Google Sheet CSV configuration
        const sheetID = '10oHOyDLFBa8CaluW9O5As1R6EVJO8Cwnloa0BU-4m90'; 
        const sheetName = 'HUYET'; 
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

        let allAcupoints = [];
        let favorites = JSON.parse(localStorage.getItem('acupoint_favorites') || '[]');
        let customNotes = JSON.parse(localStorage.getItem('acupoint_notes') || '{}');
        
        let currentFilter = 'All';
        let isOnlyFavorites = false;
        let selectedAcupoint = null; // tracking for notes

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const totalCount = document.getElementById('totalCount');
        const gridView = document.getElementById('gridView');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');

        // Modal Elements
        const acupointModal = document.getElementById('acupointModal');
        const modalKinh = document.getElementById('modalKinh');
        const modalHuyet = document.getElementById('modalHuyet');
        const modalVitri = document.getElementById('modalVitri');
        const modalChidinh = document.getElementById('modalChidinh');
        const modalNote = document.getElementById('modalNote');
        const modalFavBtn = document.getElementById('modalFavBtn');
        const modalFavIcon = document.getElementById('modalFavIcon');

        // Initialization
        window.onload = fetchData;

        async function fetchData() {
            statusMessage.classList.remove('hidden');
            loader.classList.remove('hidden');
            statusText.innerText = "Hệ thống đang lấy dữ liệu...";
            gridView.classList.add('hidden');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Hệ thống không thể kết nối để lấy dữ liệu');
                
                const data = await response.text();
                allAcupoints = parseCSV(data);
                
                if (allAcupoints.length === 0) {
                    statusText.innerText = "Hệ thống không tìm thấy dữ liệu";
                    loader.classList.add('hidden');
                    return;
                }

                renderFilters();
                renderAll(allAcupoints);
                
                statusMessage.classList.add('hidden');
            } catch (error) {
                console.error(error);
                loader.classList.add('hidden');
                statusText.innerHTML = `<span class="text-red-500 font-bold">Lỗi kết nối:</span> ${error.message}`;
            }
        }

        // CSV parsing with standard regex
        function parseCSV(csv) {
            const lines = csv.split('\n');
            if (lines.length < 2) return [];

            return lines.slice(1).map((line, idx) => {
                const columns = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (columns.length < 2) return null;

                return {
                    id: `acupoint-${idx}`,
                    kinh: clean(columns[0]) || 'Khác',
                    huyet: clean(columns[1]),
                    vitri: clean(columns[2]),
                    chidinh: clean(columns[3])
                };
            }).filter(item => item && item.huyet);
        }

        function clean(str) {
            if (!str) return '';
            return str.replace(/^"|"$/g, '').trim();
        }

        // Render Kinh Mach Filters
        function renderFilters() {
            const filterContainer = document.getElementById('filterContainer');
            const kinhList = [...new Set(allAcupoints.map(item => item.kinh))].sort();
            
            // Re-render, preserve "Tất cả"
            filterContainer.innerHTML = `
                <button onclick="filterByKinh('All')" class="filter-btn active bg-gradient-to-r from-brand-600 to-emerald-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md flex-shrink-0 snap-start">
                    Tất cả kinh mạch
                </button>
            `;

            kinhList.forEach(kinh => {
                const btn = document.createElement('button');
                btn.onclick = () => filterByKinh(kinh);
                btn.className = "filter-btn bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all flex-shrink-0 snap-start";
                btn.innerText = kinh;
                filterContainer.appendChild(btn);
            });
        }

        // Filter Action
        function filterByKinh(kinh) {
            currentFilter = kinh;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.innerText === kinh || (kinh === 'All' && btn.innerText.includes('Tất cả'))) {
                    btn.classList.add('bg-gradient-to-r', 'from-brand-600', 'to-emerald-600', 'text-white', 'active');
                    btn.classList.remove('bg-white/5', 'text-slate-300', 'border-white/5');
                } else {
                    btn.classList.remove('bg-gradient-to-r', 'from-brand-600', 'to-emerald-600', 'text-white', 'active');
                    btn.classList.add('bg-white/5', 'text-slate-300', 'border-white/5');
                }
            });
            applySearchAndFilter();
        }

        // Handle Search Terms Inputs
        searchInput.addEventListener('input', () => {
            if (searchInput.value) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            applySearchAndFilter();
        });

        // Clear Search Box Button
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            applySearchAndFilter();
            searchInput.focus();
        });

        // Filter symptoms from Quick Actions
        function searchSymptom(term) {
            searchInput.value = term;
            clearSearchBtn.classList.remove('hidden');
            applySearchAndFilter();
        }

        // Toggle Favorites State
        function toggleFavoriteFilter() {
            isOnlyFavorites = !isOnlyFavorites;
            const favBtn = document.getElementById('favToggleBtn');
            const favHeart = document.getElementById('favHeartIcon');
            
            if (isOnlyFavorites) {
                favBtn.classList.add('bg-rose-500', 'text-white');
                favBtn.classList.remove('bg-rose-500/10', 'text-rose-400');
                favHeart.className = "fa-solid fa-heart animate-pulse";
            } else {
                favBtn.classList.remove('bg-rose-500', 'text-white');
                favBtn.classList.add('bg-rose-500/10', 'text-rose-400');
                favHeart.className = "fa-solid fa-heart";
            }
            applySearchAndFilter();
        }

        // Heart Click Handler (inside Card or Modal)
        function toggleFavorite(id, event) {
            if (event) event.stopPropagation(); // prevent opening details
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('acupoint_favorites', JSON.stringify(favorites));
            
            // Update UI card hearts & modal hearts
            const cardIcons = document.querySelectorAll(`[data-id="${id}"]`);
            cardIcons.forEach(icon => {
                if (favorites.includes(id)) {
                    icon.className = "fa-solid fa-heart text-rose-500 scale-125 transition-transform duration-200";
                } else {
                    icon.className = "fa-regular fa-heart text-slate-500 hover:text-rose-400 transition-colors";
                }
            });

            // Update modal favorite button state if current
            if (selectedAcupoint && selectedAcupoint.id === id) {
                updateModalFavoriteState();
            }

            // Re-filter immediately if we're inside favorite-only view
            if (isOnlyFavorites) {
                applySearchAndFilter();
            }
        }

        // Big Master Filter
        function applySearchAndFilter() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const filtered = allAcupoints.filter(item => {
                const matchesKinh = currentFilter === 'All' || item.kinh === currentFilter;
                const matchesSearch = 
                    item.huyet.toLowerCase().includes(searchTerm) ||
                    item.vitri.toLowerCase().includes(searchTerm) ||
                    item.chidinh.toLowerCase().includes(searchTerm) ||
                    item.kinh.toLowerCase().includes(searchTerm);
                
                const matchesFav = !isOnlyFavorites || favorites.includes(item.id);
                return matchesKinh && matchesSearch && matchesFav;
            });
            renderAll(filtered);
        }

        // Render grid list
        function renderAll(data) {
            gridView.innerHTML = '';
            totalCount.innerText = data.length;

            if (data.length === 0) {
                gridView.innerHTML = `
                    <div class="col-span-full py-20 text-center glass rounded-3xl border border-white/5 shadow-xl">
                        <i class="fa-solid fa-magnifying-glass-minus text-4xl text-slate-600 mb-4 animate-bounce"></i>
                        <h3 class="text-slate-300 font-bold text-lg mb-1">Không tìm thấy huyệt vị nào</h3>
                        <p class="text-slate-500 text-sm">Thử kiểm tra lại từ khóa hoặc chuyển đổi kinh mạch khác nhé.</p>
                    </div>
                `;
                gridView.classList.remove('hidden');
                return;
            }

            data.forEach(item => {
                const isFavorite = favorites.includes(item.id);
                const favoriteIconClass = isFavorite ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart text-slate-500 hover:text-rose-400';
                
                // Crop and style indication text safely
                let choppedChiDinh = item.chidinh || '';
                if (choppedChiDinh.length > 95) {
                    choppedChiDinh = choppedChiDinh.substring(0, 95) + '...';
                }

                const card = document.createElement('div');
                card.className = "glass-light p-6 rounded-2xl border border-white/5 glow-hover flex flex-col h-full cursor-pointer relative group";
                card.onclick = () => openModal(item);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-brand-500/15 text-brand-300 text-[11px] font-bold px-3 py-1.5 rounded-lg border border-brand-500/20 uppercase tracking-widest">
                            ${item.kinh}
                        </span>
                        <button onclick="toggleFavorite('${item.id}', event)" class="p-2 -mr-2 rounded-lg hover:bg-white/5 transition-all">
                            <i data-id="${item.id}" class="${favoriteIconClass}"></i>
                        </button>
                    </div>
                    
                    <h3 class="text-xl font-bold text-slate-100 group-hover:text-brand-400 transition-colors mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-circle-dot text-[10px] text-brand-500 group-hover:scale-125 transition-transform duration-300"></i>
                        ${item.huyet}
                    </h3>
                    
                    <div class="space-y-4 flex-grow">
                        <div>
                            <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-wider block mb-1">Vị trí</span>
                            <p class="text-slate-400 text-xs md:text-sm leading-relaxed line-clamp-3">${item.vitri || 'Chưa cập nhật vị trí giải phẫu'}</p>
                        </div>
                        <div class="border-t border-slate-900/40 pt-3">
                            <span class="text-[10px] font-extrabold text-teal-500 uppercase tracking-wider block mb-1">Chủ trị</span>
                            <p class="text-teal-300/90 text-xs md:text-sm font-semibold leading-relaxed line-clamp-2">${choppedChiDinh || 'Liên hệ thầy thuốc hỗ trợ'}</p>
                        </div>
                    </div>

                    <!-- Inner Card Neon Gradient line on hover -->
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-gradient-to-r from-brand-500 to-teal-400 group-hover:w-4/5 transition-all duration-300 rounded-full"></div>
                `;
                gridView.appendChild(card);
            });
            
            gridView.classList.remove('hidden');
        }

        // Modal Controls
        function openModal(item) {
            selectedAcupoint = item;
            
            modalKinh.innerText = item.kinh;
            modalHuyet.innerText = item.huyet;
            modalVitri.innerText = item.vitri || 'Chưa có dữ liệu vị trí giải phẫu chuẩn.';
            modalChidinh.innerText = item.chidinh || 'Đang chờ cập nhật bổ sung bài thuốc tương ứng.';
            
            // Set Notes from LocalStorage
            modalNote.value = customNotes[item.id] || '';
            
            updateModalFavoriteState();
            
            // Show modal with animation
            acupointModal.classList.remove('hidden');
            acupointModal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Lock scrolling
        }

        function closeModal() {
            // Save personal notes to LocalStorage before exit
            if (selectedAcupoint) {
                const noteVal = modalNote.value.trim();
                if (noteVal) {
                    customNotes[selectedAcupoint.id] = noteVal;
                } else {
                    delete customNotes[selectedAcupoint.id];
                }
                localStorage.setItem('acupoint_notes', JSON.stringify(customNotes));
            }

            acupointModal.classList.add('hidden');
            acupointModal.classList.remove('flex');
            document.body.style.overflow = ''; // Unlock scrolling
            selectedAcupoint = null;
        }

        function updateModalFavoriteState() {
            if (!selectedAcupoint) return;
            const isFav = favorites.includes(selectedAcupoint.id);
            if (isFav) {
                modalFavIcon.className = "fa-solid fa-heart text-rose-500 scale-110";
                modalFavBtn.querySelector('span').innerText = "Đã lưu vào danh sách";
                modalFavBtn.className = "flex items-center gap-2 text-rose-400 bg-rose-500/10 px-4 py-2 rounded-xl border border-rose-500/20 text-sm font-semibold transition-all";
            } else {
                modalFavIcon.className = "fa-regular fa-heart";
                modalFavBtn.querySelector('span').innerText = "Thêm vào danh sách";
                modalFavBtn.className = "flex items-center gap-2 text-slate-400 hover:text-rose-400 bg-white/5 hover:bg-rose-500/5 px-4 py-2 rounded-xl text-sm font-semibold transition-all";
            }
        }

        // Assign modal button favorite triggers
        modalFavBtn.onclick = () => {
            if (selectedAcupoint) {
                toggleFavorite(selectedAcupoint.id);
            }
        };

        // Close Modal if Clicked Outside Content
        acupointModal.addEventListener('click', (e) => {
            if (e.target === acupointModal) {
                closeModal();
            }
        });

        // Key Escape support to close Modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !acupointModal.classList.contains('hidden')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
